name: Daily NHL/NBA Dual Predictions

on:
  schedule:
    # 7:00AM Montreal (12:00 UTC standard, 11:00 UTC daylight saving)
    - cron: '0 11 * * *'
    # 3:00PM Montreal (20:00 UTC standard, 19:00 UTC daylight saving)
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-dual-predictions:
    runs-on: ubuntu-latest
    env:
      SUBSCRIBER_LIST: ${{ vars.SUBSCRIBER_LIST }}
      UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set environment variables file
        run: |
          echo "ODDS_API_KEY=${ODDS_API_KEY}" > .env
          echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}" >> .env
      - name: Determine run time
        id: run_time
        run: |
          # Determine if this is 7am or 3pm run based on current UTC time
          # 6am-1pm Montreal = 10:00-17:00 UTC (accounting for DST variations)
          # Anything outside this range is considered 3pm run
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 17 ]; then
            echo "time=7am" >> $GITHUB_OUTPUT
          else
            echo "time=3pm" >> $GITHUB_OUTPUT
          fi
      - name: Clean up old cache files (7am)
        if: steps.run_time.outputs.time == '7am'
        run: python scripts/cleanup_cache.py
      - name: Run NHL daily predictions bot
        run: python scripts/generate_nhl_predictions.py
      - name: Run NBA daily predictions bot
        run: python scripts/generate_nba_predictions.py
      - name: Compare NBA predictions (3pm)
        if: steps.run_time.outputs.time == '3pm'
        run: python scripts/compare_nba_predictions.py
      - name: Compare NHL predictions (3pm)
        if: steps.run_time.outputs.time == '3pm'
        run: python scripts/compare_nhl_predictions.py
      - name: Run Dual Bet of the Day (3pm)
        if: steps.run_time.outputs.time == '3pm'
        run: python scripts/generate_featured_picks.py --run_time 3pm
      - name: Generate daily picks table (7am)
        if: steps.run_time.outputs.time == '7am'
        run: python3 scripts/generate_daily_picks_table.py --results-only
      - name: Generate daily picks table (3pm)
        if: steps.run_time.outputs.time == '3pm'
        run: python3 scripts/generate_daily_picks_table.py
      - name: Generate NHL games page
        run: python scripts/generate_nhl_games_page.py
      - name: Generate NHL team pages (3pm)
        if: steps.run_time.outputs.time == '3pm'
        run: python3 scripts/generate_team_pages.py
      - name: Generate NBA games page
        run: python scripts/generate_nba_games_page.py
      - name: Update website with preliminary picks (7am)
        if: steps.run_time.outputs.time == '7am'
        run: python scripts/generate_website.py --preliminary
      - name: Update website with final picks (3pm)
        if: steps.run_time.outputs.time == '3pm'
        run: python scripts/generate_website.py
      - name: Commit predictions
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            if [ "${{ steps.run_time.outputs.time }}" = "7am" ]; then
              git commit -m "Update website with results for $(date -u +%Y-%m-%d)"
            else
              git commit -m "Add final predictions for $(date -u +%Y-%m-%d)"
            fi
            git push --set-upstream https://${GH_PAT}@github.com/${{ github.repository }} HEAD:master
          else
            echo "No changes to commit"
          fi
      - name: Generate email body with picks and reasoning (3pm)
        if: steps.run_time.outputs.time == '3pm'
        run: python3 scripts/generate_complete_email.py
      - name: Add yesterday's results banner and finalize email (3pm)
        if: steps.run_time.outputs.time == '3pm'
        id: prepare_email
        run: |
          # Extract yesterday's results for the banner
          # Note: Results for yesterday's games are in today's result files
          TODAY=$(TZ='America/Toronto' date +"%Y-%m-%d")
          YESTERDAY=$(TZ='America/Toronto' date -d 'yesterday' +"%Y-%m-%d" 2>/dev/null || TZ='America/Toronto' date -v-1d +"%Y-%m-%d")
          RESULTS_FILE="data/bot_results/total_results_summary.txt"
          NHL_RESULTS_FILE="data/bot_results/nhl/nhl_daily_results_${TODAY}.txt"
          NBA_RESULTS_FILE="data/bot_results/nba/nba_daily_results_${TODAY}.txt"
          YESTERDAY_BANNER="NEW PREDICTIONS AVAILABLE - DAILY UPDATE"

          if [ -f "$RESULTS_FILE" ]; then
            # Extract NBA yesterday's record
            NBA_YESTERDAY=$(grep "^$YESTERDAY:" "$RESULTS_FILE" | head -1 || echo "")
            # Extract NHL yesterday's record (second occurrence of the date)
            NHL_YESTERDAY=$(grep "^$YESTERDAY:" "$RESULTS_FILE" | tail -1 || echo "")

            if [ -n "$NBA_YESTERDAY" ] || [ -n "$NHL_YESTERDAY" ]; then
              TOTAL_WINS=0
              TOTAL_LOSSES=0
              TOTAL_UNITS=0

              # Calculate NHL units
              if [ -f "$NHL_RESULTS_FILE" ]; then
                CURRENT_UNITS=""
                CURRENT_ODDS=""
                while IFS= read -r line; do
                  # Extract units and odds from bet line
                  if echo "$line" | grep -q "@ [0-9.]* - .*Units: [0-9.]*u"; then
                    CURRENT_ODDS=$(echo "$line" | sed 's/.*@ \([0-9.]*\) -.*/\1/')
                    CURRENT_UNITS=$(echo "$line" | sed 's/.*Units: \([0-9.]*\)u.*/\1/')
                  fi
                  # Check outcome and calculate
                  if echo "$line" | grep -q "Outcome: \*\*WIN\*\*" && [ -n "$CURRENT_UNITS" ] && [ -n "$CURRENT_ODDS" ]; then
                    PROFIT=$(echo "scale=2; $CURRENT_UNITS * ($CURRENT_ODDS - 1)" | bc)
                    TOTAL_UNITS=$(echo "scale=2; $TOTAL_UNITS + $PROFIT" | bc)
                    CURRENT_UNITS=""
                    CURRENT_ODDS=""
                  elif echo "$line" | grep -q "Outcome: \*\*LOSS\*\*" && [ -n "$CURRENT_UNITS" ]; then
                    TOTAL_UNITS=$(echo "scale=2; $TOTAL_UNITS - $CURRENT_UNITS" | bc)
                    CURRENT_UNITS=""
                    CURRENT_ODDS=""
                  elif echo "$line" | grep -q "Outcome: \*\*PUSH\*\*"; then
                    CURRENT_UNITS=""
                    CURRENT_ODDS=""
                  fi
                done < "$NHL_RESULTS_FILE"
              fi

              # Calculate NBA units
              if [ -f "$NBA_RESULTS_FILE" ]; then
                CURRENT_UNITS=""
                CURRENT_ODDS=""
                while IFS= read -r line; do
                  # Extract units and odds from bet line
                  if echo "$line" | grep -q "@ [0-9.]* - .*Units: [0-9.]*u"; then
                    CURRENT_ODDS=$(echo "$line" | sed 's/.*@ \([0-9.]*\) -.*/\1/')
                    CURRENT_UNITS=$(echo "$line" | sed 's/.*Units: \([0-9.]*\)u.*/\1/')
                  fi
                  # Check outcome and calculate
                  if echo "$line" | grep -q "Outcome: \*\*WIN\*\*" && [ -n "$CURRENT_UNITS" ] && [ -n "$CURRENT_ODDS" ]; then
                    PROFIT=$(echo "scale=2; $CURRENT_UNITS * ($CURRENT_ODDS - 1)" | bc)
                    TOTAL_UNITS=$(echo "scale=2; $TOTAL_UNITS + $PROFIT" | bc)
                    CURRENT_UNITS=""
                    CURRENT_ODDS=""
                  elif echo "$line" | grep -q "Outcome: \*\*LOSS\*\*" && [ -n "$CURRENT_UNITS" ]; then
                    TOTAL_UNITS=$(echo "scale=2; $TOTAL_UNITS - $CURRENT_UNITS" | bc)
                    CURRENT_UNITS=""
                    CURRENT_ODDS=""
                  elif echo "$line" | grep -q "Outcome: \*\*PUSH\*\*"; then
                    CURRENT_UNITS=""
                    CURRENT_ODDS=""
                  fi
                done < "$NBA_RESULTS_FILE"
              fi

              if [ -n "$NBA_YESTERDAY" ]; then
                NBA_WINS=$(echo "$NBA_YESTERDAY" | sed 's/.*: \([0-9]*\) win.*/\1/')
                NBA_LOSSES=$(echo "$NBA_YESTERDAY" | sed 's/.* \([0-9]*\) loss.*/\1/')
                TOTAL_WINS=$((TOTAL_WINS + NBA_WINS))
                TOTAL_LOSSES=$((TOTAL_LOSSES + NBA_LOSSES))
              fi

              if [ -n "$NHL_YESTERDAY" ]; then
                NHL_WINS=$(echo "$NHL_YESTERDAY" | sed 's/.*: \([0-9]*\) win.*/\1/')
                NHL_LOSSES=$(echo "$NHL_YESTERDAY" | sed 's/.* \([0-9]*\) loss.*/\1/')
                TOTAL_WINS=$((TOTAL_WINS + NHL_WINS))
                TOTAL_LOSSES=$((TOTAL_LOSSES + NHL_LOSSES))
              fi

              # Format units with + or - sign and 2 decimals
              TOTAL_UNITS=$(printf "%.2f" $TOTAL_UNITS)
              if [ $(echo "$TOTAL_UNITS > 0" | bc) -eq 1 ]; then
                UNITS_TEXT="<span style='color: #10b981;'>+${TOTAL_UNITS}u</span>"
              elif [ $(echo "$TOTAL_UNITS < 0" | bc) -eq 1 ]; then
                UNITS_TEXT="<span style='color: #ef4444;'>${TOTAL_UNITS}u</span>"
              else
                UNITS_TEXT="+${TOTAL_UNITS}u"
              fi

              YESTERDAY_BANNER="YESTERDAY: ${TOTAL_WINS}W - ${TOTAL_LOSSES}L (${UNITS_TEXT})"
            fi
          fi

          # Replace the yesterday banner placeholder
          sed "s|NEW PREDICTIONS AVAILABLE - DAILY UPDATE|$YESTERDAY_BANNER|g" /tmp/email_body.html > /tmp/email_body_final.html

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/email_body_final.html >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Generate email subject
          EMAIL_DATE=$(TZ='America/Toronto' date +"%A, %B %d, %Y")
          echo "subject=$EMAIL_DATE - NHL/NBA Daily Picks" >> $GITHUB_OUTPUT
      - name: Create email sender script
        if: steps.run_time.outputs.time == '3pm'
        run: |
          cat > /tmp/send_email.py << 'SENDSCRIPT'
          import smtplib, os, sys
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          recipient, subject = sys.argv[1], sys.argv[2]
          with open('/tmp/email_personal.html', 'r') as f:
              body = f.read()

          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = 'Parieur Discipliné <' + os.environ['EMAIL_USERNAME'] + '>'
          msg['To'] = recipient
          msg.attach(MIMEText(body, 'html', 'utf-8'))

          with smtplib.SMTP('smtp.gmail.com', 587) as s:
              s.starttls()
              s.login(os.environ['EMAIL_USERNAME'], os.environ['EMAIL_PASSWORD'])
              s.sendmail(os.environ['EMAIL_USERNAME'], [recipient], msg.as_string())
          print(f"Sent to {recipient}")
          SENDSCRIPT
      - name: Send personalized emails to subscribers
        if: steps.run_time.outputs.time == '3pm'
        run: |
          SUBJECT="${{ steps.prepare_email.outputs.subject }}"
          IFS=',' read -ra EMAILS <<< "$SUBSCRIBER_LIST"
          for EMAIL_ADDR in "${EMAILS[@]}"; do
            EMAIL_ADDR=$(echo "$EMAIL_ADDR" | tr -d ' ')
            [ -z "$EMAIL_ADDR" ] && continue

            TOKEN=$(python3 scripts/generate_complete_email.py --generate-token --email "$EMAIL_ADDR")
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$EMAIL_ADDR")
            UNSUB_URL="https://parieurdiscipline.com/api/unsubscribe?email=${ENCODED}&token=${TOKEN}"

            sed "s|\${UNSUBSCRIBE_URL}|${UNSUB_URL}|g" /tmp/email_body_final.html > /tmp/email_personal.html

            python3 /tmp/send_email.py "$EMAIL_ADDR" "$SUBJECT"
          done
