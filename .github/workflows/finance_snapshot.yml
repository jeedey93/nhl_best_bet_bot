name: Daily Finance Snapshot

on:
  schedule:
    # 4:30 PM Montreal (EDT UTC-4) = 20:30 UTC  |  (EST UTC-5) = 21:30 UTC
    - cron: '30 20 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      - name: Determine if this cron should run
        id: check_hour
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq 20 ] || [ "$HOUR" -eq 21 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "Unexpected hour $HOUR — skipping"
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Take portfolio snapshot
        if: steps.check_hour.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        id: snapshot
        run: |
          echo "Taking snapshot at $(date -u)..."
          RESPONSE=$(curl -s -X POST \
            "https://parieurdiscipline.com/api/finance-snapshot" \
            -H "Content-Type: application/json" \
            -d "{}")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "❌ Snapshot failed"
            exit 1
          fi
          echo "snapshot_json=$RESPONSE" >> $GITHUB_OUTPUT
          echo "✅ Snapshot saved"

      - name: Send summary email
        if: (steps.check_hour.outputs.run == 'true' || github.event_name == 'workflow_dispatch') && steps.snapshot.outcome == 'success'
        run: |
          python3 - <<'PYEOF'
          import smtplib, os, json
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          snapshot_json = os.environ.get('SNAPSHOT_JSON', '{}')
          try:
              data = json.loads(snapshot_json)
          except:
              data = {}

          date_str = data.get('date', 'Today')
          results = data.get('results', {})

          def fmt_c(v):
              if v is None: return '—'
              sign = '+' if v >= 0 else '-'
              return f'{sign}${abs(v):,.2f}'

          def clr(v):
              return '#4ade80' if v >= 0 else '#f87171'

          portfolio_blocks = ''
          for portfolio_name, stats in results.items():
              day = stats.get('day_change', 0)
              gain_pct = stats.get('gain_pct', 0)
              holdings = stats.get('holdings', [])

              # Summary row
              portfolio_blocks += f'''
              <div style="background:#0e1e35;border-radius:12px;overflow:hidden;border:1px solid #1e3a5f;margin-bottom:24px">
                <!-- Portfolio header -->
                <div style="background:#07111f;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
                  <div style="font-size:13px;font-weight:700;color:#ffffff;letter-spacing:1px">{portfolio_name}</div>
                  <div style="font-size:11px;color:#a8b2be">{len(holdings)} stocks</div>
                </div>
                <!-- Summary stats -->
                <div style="display:table;width:100%;border-collapse:collapse">
                  <div style="display:table-row">
                    <div style="display:table-cell;padding:14px 16px;border-bottom:1px solid #1e3a5f">
                      <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a8b2be;margin-bottom:4px">Market Value</div>
                      <div style="font-size:20px;font-weight:700;color:#ffffff">${stats.get("total_value", 0):,.2f}</div>
                    </div>
                    <div style="display:table-cell;padding:14px 16px;border-bottom:1px solid #1e3a5f;text-align:right">
                      <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a8b2be;margin-bottom:4px">Day Change</div>
                      <div style="font-size:20px;font-weight:700;color:{clr(day)}">{fmt_c(day)}</div>
                      <div style="font-size:11px;color:{clr(day)}">{'+' if day>=0 else ''}{stats.get('day_change_pct',0):.2f}%</div>
                    </div>
                  </div>
                </div>
                <!-- Holdings breakdown -->
                <table style="width:100%;border-collapse:collapse">
                  <thead>
                    <tr style="background:rgba(255,255,255,0.03)">
                      <th style="padding:8px 16px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#4a5568;text-align:left;font-weight:600">Stock</th>
                      <th style="padding:8px 16px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#4a5568;text-align:right;font-weight:600">Price</th>
                      <th style="padding:8px 16px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#4a5568;text-align:right;font-weight:600">Day $</th>
                      <th style="padding:8px 16px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#4a5568;text-align:right;font-weight:600">Day %</th>
                    </tr>
                  </thead>
                  <tbody>'''

              # Sort holdings: biggest day losers first, then gainers
              sorted_holdings = sorted(holdings, key=lambda h: h.get('day_change', 0), reverse=True)
              for h in sorted_holdings:
                  dc = h.get('day_change', 0)
                  price = h.get('price') or 0
                  prev_close = price - (dc / h.get('shares', 1)) if h.get('shares') else 0
                  dc_pct = (dc / (h.get('market_value', 1) - dc)) * 100 if (h.get('market_value', 0) - dc) != 0 else 0
                  ticker = h.get('ticker', '').replace('TSX:', '')
                  name = h.get('company_name', ticker)
                  name_short = ' '.join(name.split()[:3]) if name else ticker
                  portfolio_blocks += f'''
                    <tr style="border-bottom:1px solid #0d1927">
                      <td style="padding:10px 16px">
                        <div style="font-size:12px;font-weight:700;color:#ffffff">{ticker}</div>
                        <div style="font-size:11px;color:#4a5568;margin-top:1px">{name_short}</div>
                      </td>
                      <td style="padding:10px 16px;font-size:12px;color:#a8b2be;text-align:right">${price:,.2f}</td>
                      <td style="padding:10px 16px;font-size:13px;font-weight:700;color:{clr(dc)};text-align:right">{fmt_c(dc)}</td>
                      <td style="padding:10px 16px;font-size:13px;font-weight:700;color:{clr(dc_pct)};text-align:right">{'+' if dc_pct>=0 else ''}{dc_pct:.2f}%</td>
                    </tr>'''

              portfolio_blocks += '''
                  </tbody>
                </table>
              </div>'''

          html = f'''<!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
          <body style="margin:0;padding:0;background:#07111f;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
            <div style="max-width:640px;margin:0 auto;padding:32px 16px">
              <div style="text-align:center;margin-bottom:32px">
                <div style="font-size:11px;letter-spacing:4px;color:#ffb81c;text-transform:uppercase;margin-bottom:8px">Parieur Discipliné</div>
                <h1 style="margin:0;font-size:26px;font-weight:700;color:#ffffff;letter-spacing:1px">📊 Daily Snapshot</h1>
                <div style="margin-top:6px;font-size:13px;color:#a8b2be">{date_str} · Market Close</div>
              </div>
              {portfolio_blocks}
              <div style="text-align:center;margin-top:8px;font-size:12px;color:#2d3748">
                <a href="https://parieurdiscipline.com/finance" style="color:#ffb81c;text-decoration:none">View Full Dashboard →</a>
              </div>
            </div>
          </body>
          </html>'''

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f'📊 Portfolio Snapshot — {date_str}'
          msg['From'] = f'Parieur Discipliné <{os.environ["EMAIL_USERNAME"]}>'
          msg['To'] = 'justin.do@hotmail.com'
          msg.attach(MIMEText(html, 'html', 'utf-8'))

          with smtplib.SMTP('smtp.gmail.com', 587) as s:
              s.starttls()
              s.login(os.environ['EMAIL_USERNAME'], os.environ['EMAIL_PASSWORD'])
              s.sendmail(os.environ['EMAIL_USERNAME'], ['justin.do@hotmail.com'], msg.as_string())
          print('✅ Email sent')
          PYEOF
        env:
          SNAPSHOT_JSON: ${{ steps.snapshot.outputs.snapshot_json }}
