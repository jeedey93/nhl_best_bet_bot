name: Update Player Hold Points

on:
  schedule:
    # Run daily at 2 AM UTC (10 PM EDT / 9 PM CDT)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-holds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests

      - name: Update hold points for all leagues
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/update_hold_points_daily.py

      - name: Commit updated points (if changed)
        run: |
          git config user.name "Hockey Bot"
          git config user.email "bot@example.com"
          git add -A
          git diff --quiet || git commit -m "Update player hold points — $(date -u +%Y-%m-%d)"
          git push || true

