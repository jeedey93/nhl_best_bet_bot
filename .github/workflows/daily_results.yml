name: Daily NHL/NBA Bot Results

on:
  workflow_dispatch:

jobs:
  run-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set environment variables
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" > .env
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
      - name: Run NHL daily results bot
        run: python scripts/analyze_nhl_results.py
      - name: Run NBA daily results bot
        run: python scripts/analyze_nba_results.py
      - name: Run daily results summary
        run: python scripts/generate_combined_summary.py
      - name: Generate performance dashboard
        run: python scripts/generate_performance_dashboard.py
      - name: Commit results
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bot_results/nhl/nhl_daily_results_*.txt || true
          git add data/bot_results/nba/nba_daily_results_*.txt || true
          git add data/bot_results/total_results_summary.txt || true
          git add docs/performance.html || true
          if ! git diff --cached --quiet; then
            git commit -m "Add daily results for $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push --set-upstream https://$GH_PAT@github.com/${{ github.repository }} HEAD:master; then
                break
              elif [ $i -lt 3 ]; then
                echo "Push failed (attempt $i), rebasing on remote changes..."
                git fetch https://$GH_PAT@github.com/${{ github.repository }} master
                git rebase FETCH_HEAD
              else
                echo "Push failed after 3 attempts"
                exit 1
              fi
            done
          else
            echo "No changes to commit"
          fi
          echo "Results workflow completed"

