<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Admin — Poolers Guide 2026-27</title>
<link rel='icon' type='image/png' href='../parieur_discipline_icon_1024.png'>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

/* ── NAV ── */
nav { background: linear-gradient(135deg, #2c5aa0, #1e3a8a); padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
nav img { width: 28px; height: 28px; border-radius: 50%; }
nav span { color: white; font-weight: 700; }
nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85em; margin-left: auto; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); transition: background 0.2s; }
nav a:hover { background: rgba(255,255,255,0.1); }

/* ── LOCK ── */
#lock { position: fixed; inset: 0; background: #0f172a; z-index: 999; display: flex; align-items: center; justify-content: center; }
.lock-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px 32px; width: 360px; text-align: center; }
.lock-box h2 { font-size: 1.3em; font-weight: 800; margin-bottom: 6px; }
.lock-box p  { color: #64748b; font-size: 0.85em; margin-bottom: 24px; }
.lock-box input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 10px 14px; font-size: 0.95em; outline: none; margin-bottom: 16px; }
.lock-box input:focus { border-color: #60a5fa; }
.lock-box input.error { border-color: #f87171; animation: shake 0.3s; }
.lock-box button { width: 100%; background: linear-gradient(135deg, #2c5aa0, #1e3a8a); color: white; border: none; border-radius: 8px; padding: 11px; font-weight: 700; font-size: 0.95em; cursor: pointer; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

/* ── LAYOUT ── */
.wrap { max-width: 1700px; margin: 0 auto; padding: 28px 16px 80px; }
.page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-header h1 { font-size: 1.5em; font-weight: 800; }
.badge { background: linear-gradient(135deg, #2c5aa0, #1e3a8a); color: white; font-size: 0.7em; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.header-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

/* ── BUTTONS ── */
.btn { padding: 9px 16px; border-radius: 8px; font-size: 0.88em; font-weight: 700; cursor: pointer; border: none; transition: opacity 0.2s; white-space: nowrap; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-green { background: linear-gradient(135deg, #065f46, #047857); color: #a7f3d0; }
.btn-ghost { background: #1e293b; border: 1px solid #334155; color: #94a3b8; }

/* ── TOOLBAR ── */
.toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.search-wrap { position: relative; }
.search-wrap input { background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 8px 12px 8px 32px; font-size: 0.88em; outline: none; width: 220px; }
.search-wrap input:focus { border-color: #60a5fa; }
.search-wrap::before { content: '🔍'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 0.82em; pointer-events: none; }
.status-msg { font-size: 0.82em; color: #64748b; margin-left: auto; }

/* ── TABLE ── */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #1e293b; }
table { width: 100%; border-collapse: collapse; font-size: 0.83em; }
thead th { background: #1e293b; color: #94a3b8; font-weight: 700; font-size: 0.76em; letter-spacing: 0.5px; text-transform: uppercase; padding: 10px 8px; text-align: left; white-space: nowrap; position: sticky; top: 0; z-index: 2; border-bottom: 2px solid #0f172a; }
tbody tr { border-bottom: 1px solid #1e293b; transition: background 0.1s; }
tbody tr:hover { background: rgba(255,255,255,0.02); }
tbody tr.saving { opacity: 0.5; pointer-events: none; }
tbody td { padding: 5px 6px; vertical-align: middle; }

/* Inline inputs */
.ci { background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 0.88em; outline: none; padding: 5px 8px; transition: border-color 0.15s, background 0.15s; }
.ci:focus { border-color: #60a5fa; background: #0f172a; }
.ci.n { text-align: right; width: 58px; }
.ci.w { width: 170px; }
.ci.m { width: 100px; }
.cs { background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; padding: 5px 8px; font-size: 0.85em; outline: none; cursor: pointer; }
.cs:focus { border-color: #60a5fa; }
/* Read-only cells */
.ro { color: #64748b; font-size: 0.75em; padding: 0 4px; white-space: nowrap; }
thead th.ro-col { color: #2d3f55; font-size: 0.7em; padding: 10px 5px; }
tbody td.ro-td  { padding: 5px 4px; }
tbody tr.dirty { background: rgba(96,165,250,0.06); }
tbody tr.dirty td:first-child { border-left: 3px solid #3b82f6; }

/* Section labels */
.sl { font-size: 0.68em; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; display: inline-block; margin-bottom: 2px; }
.sl-last { background: rgba(30,74,122,0.4); color: #93c5fd; }
.sl-proj { background: rgba(22,101,52,0.4); color: #4ade80; }

/* Team logo filter strip */
.team-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.team-filter-label { font-size: 0.75em; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.8px; margin-right: 4px; white-space: nowrap; }
.team-logo-btn { width: 36px; height: 36px; border-radius: 8px; border: 2px solid transparent; background: #1e293b; padding: 4px; cursor: pointer; transition: border-color 0.15s, background 0.15s; opacity: 0.5; display: flex; align-items: center; justify-content: center; }
.team-logo-btn:hover { opacity: 0.85; border-color: #334155; }
.team-logo-btn.active { opacity: 1; border-color: #60a5fa; background: rgba(96,165,250,0.1); }
.team-logo-btn img { width: 100%; height: 100%; object-fit: contain; }
.team-logo-btn.all-btn { font-size: 0.72em; font-weight: 700; color: #94a3b8; width: auto; padding: 4px 10px; }
#toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 20px; font-size: 0.88em; font-weight: 600; color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.3s; pointer-events: none; z-index: 9999; white-space: nowrap; }
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.success { border-color: #166534; color: #4ade80; }
#toast.error   { border-color: #7f1d1d; color: #f87171; }
</style>
</head>
<body>

<nav>
  <img src='../parieur_discipline_icon_1024.png' alt=''>
  <span>Parieur Discipliné</span>
  <a href='index.html'>← Back to Guide</a>
</nav>

<!-- LOCK SCREEN -->
<div id='lock'>
  <div class='lock-box'>
    <div style='font-size:2em;margin-bottom:12px'>🔒</div>
    <h2>Admin — Poolers Guide</h2>
    <p>Enter your admin password to access the editor.</p>
    <input type='password' id='pwInput' placeholder='Admin password…'>
    <button onclick='checkPw()'>Unlock →</button>
  </div>
</div>

<!-- MAIN -->
<div class='wrap'>
  <div class='page-header'>
    <h1>📋 Poolers Guide Editor <span class='badge'>2026-27</span></h1>
    <div class='header-actions'>
      <button class='btn btn-ghost' onclick='addPlayer()'>+ Add Player</button>
      <button class='btn btn-green' id='saveAllBtn' onclick='saveAll()' disabled>💾 Save All</button>
    </div>
  </div>

  <div class='toolbar'>
    <div class='search-wrap'>
      <input type='text' id='searchInput' placeholder='Filter by name…' oninput='renderTable()'>
    </div>
    <span class='status-msg' id='statusMsg'>Loading…</span>
  </div>
  <div class='team-filter' id='teamFilter'>
    <span class='team-filter-label'>Team</span>
    <button class='team-logo-btn all-btn active' onclick='setTeam("", this)'>All</button>
  </div>

  <div class='table-wrap'>
    <table>
      <thead>
        <tr>
          <th class='ro-col'>#</th>
          <th>Name</th>
          <th class='ro-col'>Team</th>
          <th class='ro-col'>Pos</th>
          <th class='ro-col'>Age</th>
          <th class='ro-col'>AAV</th>
          <th class='ro-col'><span class='sl sl-last'>25-26</span> G</th>
          <th class='ro-col'><span class='sl sl-last'>25-26</span> A</th>
          <th class='ro-col'><span class='sl sl-last'>25-26</span> PTS</th>
          <th class='ro-col'><span class='sl sl-last'>25-26</span> PP%</th>
          <th><span class='sl sl-proj'>Proj</span> G</th>
          <th><span class='sl sl-proj'>Proj</span> A</th>
          <th><span class='sl sl-proj'>Proj</span> PTS</th>
          <th>Tier</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id='tbody'></tbody>
    </table>
  </div>
</div>

<div id='toast'></div>

<script>
const ADMIN_PW  = 'parieur2026';
const PW_KEY    = 'poolers_admin_auth';
const SB_URL    = 'https://fifurqlitkywtmhgtzeu.supabase.co';
const SB_KEY    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';
const HEADERS   = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };
const TABLE     = `${SB_URL}/rest/v1/poolers_players`;

let players = [];
let dirty = new Set();
let activeTeam = '';

// ── AUTH ────────────────────────────────────────────────
function checkPw() {
  const pw = document.getElementById('pwInput').value;
  if (pw === ADMIN_PW) {
    sessionStorage.setItem(PW_KEY, ADMIN_PW);
    document.getElementById('lock').style.display = 'none';
    loadPlayers();
  } else {
    const el = document.getElementById('pwInput');
    el.classList.add('error'); el.value = '';
    setTimeout(() => el.classList.remove('error'), 400);
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
if (sessionStorage.getItem(PW_KEY) === ADMIN_PW) {
  document.getElementById('lock').style.display = 'none';
  loadPlayers();
}

// ── LOAD ─────────────────────────────────────────────────
async function loadPlayers() {
  setStatus('Loading…');
  try {
    const res = await fetch(`${TABLE}?order=rank.asc&select=*`, { headers: HEADERS });
    if (!res.ok) throw new Error(await res.text());
    players = await res.json();
    setStatus(`${players.length} players`);
    renderTable();
  } catch (e) {
    setStatus('Load failed');
    toast('Failed to load: ' + e.message, 'error');
  }
}

// ── RENDER ────────────────────────────────────────────────
const ALL_TEAMS = ['ANA','BOS','BUF','CAR','CBJ','CGY','CHI','COL','DAL','DET','EDM','FLA','LAK','MIN','MTL','NJD','NSH','NYI','NYR','OTT','PHI','PIT','SEA','SJS','STL','TBL','TOR','UTA','VAN','VGK','WPG','WSH'];
const TIERS = ['Elite','Top','Mid','Sleeper'];

// Build logo strip immediately (before data loads)
(function buildLogoStrip() {
  const strip = document.getElementById('teamFilter');
  ALL_TEAMS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'team-logo-btn';
    btn.title = t;
    btn.innerHTML = `<img src='https://assets.nhle.com/logos/nhl/svg/${t}_dark.svg' alt='${t}'>`;
    btn.onclick = () => setTeam(t, btn);
    strip.appendChild(btn);
  });
})();

function markDirty(id) {
  dirty.add(id);
  document.getElementById(`row-${id}`)?.classList.add('dirty');
  document.getElementById('saveAllBtn').disabled = false;
}

function setTeam(team, btn) {
  activeTeam = team;
  document.querySelectorAll('.team-logo-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const visible = players.filter(p =>
    (!q          || p.name.toLowerCase().includes(q)) &&
    (!activeTeam || p.team === activeTeam)
  );
  document.getElementById('tbody').innerHTML = visible.map(p => rowHTML(p)).join('');
  setStatus(`${visible.length} of ${players.length} players${dirty.size ? ` · ${dirty.size} unsaved` : ''}`);
}

function rowHTML(p) {
  const id = p.id;
  const ro = v => `<span class='ro'>${v ?? '—'}</span>`;
  return `<tr id='row-${id}'>
    <td class='ro-td'>${ro(p.rank)}</td>
    <td><input class='ci w' id='${id}-name' type='text' value='${esc(p.name)}' oninput='markDirty(${id})'></td>
    <td class='ro-td'>${ro(p.team)}</td>
    <td class='ro-td'>${ro(p.pos)}</td>
    <td class='ro-td'>${ro(p.age)}</td>
    <td class='ro-td'>${ro(p.aav ? '$'+p.aav+'M' : '—')}</td>
    <td class='ro-td'>${ro(p.last_g)}</td>
    <td class='ro-td'>${ro(p.last_a)}</td>
    <td class='ro-td'>${ro(p.last_pts)}</td>
    <td class='ro-td'>${ro(p.pp_pct != null ? p.pp_pct+'%' : '—')}</td>
    <td><input class='ci n' id='${id}-proj_g'   type='number' value='${p.proj_g??''}' oninput='markDirty(${id})'></td>
    <td><input class='ci n' id='${id}-proj_a'   type='number' value='${p.proj_a??''}' oninput='markDirty(${id})'></td>
    <td><input class='ci n' id='${id}-proj_pts' type='number' value='${p.proj_pts??''}' oninput='markDirty(${id})'></td>
    <td><select class='cs' id='${id}-tier' onchange='markDirty(${id})'>${TIERS.map(v=>`<option${p.tier===v?' selected':''}>${v}</option>`).join('')}</select></td>
    <td><input class='ci w' id='${id}-notes' type='text' value='${esc(p.notes||'')}' style='width:240px' oninput='markDirty(${id})'></td>
  </tr>`;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── SAVE ALL ──────────────────────────────────────────────
async function saveAll() {
  if (!dirty.size) return;
  const btn = document.getElementById('saveAllBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Saving…';

  const ids = [...dirty];
  let failed = 0;

  await Promise.all(ids.map(async id => {
    const row = document.getElementById(`row-${id}`);
    const num = (f, isFloat) => {
      const v = document.getElementById(`${id}-${f}`)?.value;
      if (v === '' || v == null) return null;
      return isFloat ? parseFloat(v) : parseInt(v);
    };
    const data = {
      name:     document.getElementById(`${id}-name`)?.value?.trim(),
      proj_g:   num('proj_g'),
      proj_a:   num('proj_a'),
      proj_pts: num('proj_pts'),
      tier:     document.getElementById(`${id}-tier`)?.value,
      notes:    document.getElementById(`${id}-notes`)?.value?.trim(),
    };
    try {
      const res = await fetch(`${TABLE}?id=eq.${id}`, {
        method: 'PATCH',
        headers: { ...HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error();
      row?.classList.remove('dirty');
      dirty.delete(id);
      const i = players.findIndex(p => p.id === id);
      if (i >= 0) players[i] = { ...players[i], ...data };
    } catch { failed++; }
  }));

  btn.textContent = '💾 Save All';
  btn.disabled = dirty.size === 0;
  if (failed) toast(`${failed} row(s) failed to save`, 'error');
  else toast(`${ids.length} player${ids.length > 1 ? 's' : ''} saved ✓`, 'success');
}

// ── ADD PLAYER ────────────────────────────────────────────
async function addPlayer() {
  const maxRank = players.length ? Math.max(...players.map(p => p.rank)) : 0;
  const data = { rank: maxRank + 1, name: 'New Player', team: 'NHL', pos: 'C', age: 25, proj_gp: 82, proj_g: 0, proj_a: 0, proj_pts: 0, tier: 'Mid', notes: '' };
  try {
    const res = await fetch(TABLE, {
      method: 'POST',
      headers: { ...HEADERS, 'Prefer': 'return=representation' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(await res.text());
    const [created] = await res.json();
    players.push(created);
    renderTable();
    const newRow = document.getElementById(`row-${created.id}`);
    if (newRow) { newRow.scrollIntoView({ behavior: 'smooth', block: 'center' }); newRow.querySelector('input').focus(); }
    toast('Player added — edit and hit Save All', 'success');
  } catch (e) {
    toast('Add failed: ' + e.message, 'error');
  }
}

// ── DELETE ROW ────────────────────────────────────────────

// ── HELPERS ──────────────────────────────────────────────
function setStatus(msg) { document.getElementById('statusMsg').textContent = msg; }

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 3000);
}
</script>
</body>
</html>
