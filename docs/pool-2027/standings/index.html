    if (!pos) return 'F';
    const p = pos.toUpperCase();
    if (p.includes('G')) return 'G';
    if (p === 'D' || p.includes('LD') || p.includes('RD')) return 'D';
    return 'F';
  }
  function fmtCap(n) { return n ? `$${(n / 1_000_000).toFixed(2)}M` : '—'; }

  // ── Scoring ────────────────────────────────────────────────────────────────
  function scoreTeam(roster) {
    let fPts = 0, dPts = 0, gPts = 0;
    for (const slug of (roster.F || [])) {
      const p = playerMap[slug];
      if (p) fPts += (p.points ?? 0) * 1;
    }
    for (const slug of (roster.D || [])) {
      const p = playerMap[slug];
      if (p) dPts += (p.goals ?? 0) * 2 + (p.assists ?? 0) * 1;
    }
    for (const slug of (roster.G || [])) {
      const p = playerMap[slug];
      if (p) gPts += (p.wins ?? 0) * 2 + (p.shutouts ?? 0) * 3;
    }
    return { fPts, dPts, gPts, total: fPts + dPts + gPts };
  }

  function playerPoolScore(p) {
    const pos = normalizePos(p.position);
    if (pos === 'G') return (p.wins ?? 0) * 2 + (p.shutouts ?? 0) * 3;
    if (pos === 'D') return (p.goals ?? 0) * 2 + (p.assists ?? 0) * 1;
    return (p.points ?? 0) * 1;
  }

  // ── Nav ────────────────────────────────────────────────────────────────────
  function toggleDrawer() {
    const drawer = document.getElementById('nav-drawer');
    const isOpen = drawer.classList.toggle('open');
    document.getElementById('hamburger').setAttribute('aria-expanded', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  }
  document.addEventListener('click', function(e) {
    const drawer = document.getElementById('nav-drawer'), hamburger = document.getElementById('hamburger');
    if (drawer.classList.contains('open') && !drawer.contains(e.target) && !hamburger.contains(e.target)) {
      drawer.classList.remove('open'); document.body.style.overflow = '';
    }
  });

  // ── Pool filter ────────────────────────────────────────────────────────────
  function setPoolFilter(f) {
    poolFilter = f;
    ['all','paid','free'].forEach(k => document.getElementById(`btn-${k}`).classList.toggle('active', k === f));
    renderAll();
  }

  // ── Filtered + scored list ─────────────────────────────────────────────────
  function getScoredList() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    return allSubmissions
      .filter(s => {
        if (poolFilter === 'paid' && !s.paid) return false;
        if (poolFilter === 'free' && s.paid) return false;
        if (query && !s.name.toLowerCase().includes(query)) return false;
        return true;
      })
      .map(s => ({ ...s, score: scoreTeam(s.roster) }))
      .sort((a, b) => b.score.total - a.score.total);
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderAll() {
    const list = getScoredList();
    const count = allSubmissions.length;
    const paidCount = allSubmissions.filter(s => s.paid).length;
    document.getElementById('participant-count-label').innerHTML =
      `<span class="count">${count}</span> participant${count !== 1 ? 's' : ''} · ${paidCount} paid · ${count - paidCount} free`;

    const content = document.getElementById('content');
    if (!list.length) {
      content.innerHTML = '<div class="msg">No submissions yet. <a href="/pool-2027/draft/" style="color:var(--gold);">Be the first!</a></div>';
      return;
    }

    let html = '';

    // Podium (top 3)
    if (list.length >= 1) {
      const medals = ['🥇','🥈','🥉'];
      const order = list.length >= 3 ? [1, 0, 2] : list.length === 2 ? [0, 1] : [0]; // silver, gold, bronze for visual layout
      const orderedForDisplay = list.length >= 3
        ? [list[1], list[0], list[2]]
        : list.slice(0, list.length);
      const classes = list.length >= 3 ? ['p2','p1','p3'] : ['p1','p2'];

      html += `<div class="podium">`;
      orderedForDisplay.forEach((sub, i) => {
        const cls = classes[i];
        const medal = cls === 'p1' ? '🥇' : cls === 'p2' ? '🥈' : '🥉';
        html += `<div class="podium-spot ${cls}">
          <div class="podium-medal">${medal}</div>
          <div class="podium-pts">${sub.score.total}</div>
          <div class="podium-name">${escapeHtml(sub.name)}</div>
          <div class="podium-cap">${fmtCap(sub.cap_used)}</div>
          <div class="podium-block"></div>
        </div>`;
      });
      html += `</div>`;
    }

    // Leaderboard
    html += `<div class="leaderboard">
      <div class="lb-row header">
        <div></div>
        <div class="lb-col-label left">Name</div>
        <div class="lb-col-label lb-col-hide">Cap</div>
        <div class="lb-col-label lb-col-hide">F</div>
        <div class="lb-col-label lb-col-hide">D</div>
        <div class="lb-col-label lb-col-hide">G</div>
        <div class="lb-col-label lb-col-hide" title="Points per $M cap used">EFF</div>
        <div class="lb-col-label">Pts</div>
      </div>`;

    list.forEach((sub, i) => {
      const rank = i + 1;
      const rankCls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
      const tierCls = rank <= 3 ? ` rank-${rank}` : '';
      const rankInner = rank === 1
        ? `<div class="lb-rank-crown"><span class="lb-rank-crown-icon">👑</span><span class="lb-rank-num">1</span></div>`
        : `<span class="lb-rank-num">${rank}</span>`;
      const isActive = sub.id === activeDetailId;
      const rowId = `lb-row-${sub.id}`;
      const effScore = sub.cap_used ? (sub.score.total / (sub.cap_used / 1_000_000)).toFixed(1) : '—';
      html += `<div class="lb-row${tierCls}${isActive ? ' active' : ''}" id="${rowId}" onclick="toggleDetail('${sub.id}')" style="cursor:pointer;">
        <div class="lb-rank ${rankCls}">${rankInner}</div>
        <div class="lb-name">${escapeHtml(sub.name)}${sub.paid ? '<span class="paid-badge">PAID</span>' : ''}</div>
        <div class="lb-stat lb-col-hide">${fmtCap(sub.cap_used)}</div>
        <div class="lb-stat lb-col-hide">${sub.score.fPts}</div>
        <div class="lb-stat lb-col-hide">${sub.score.dPts}</div>
        <div class="lb-stat lb-col-hide">${sub.score.gPts}</div>
        <div class="lb-stat eff lb-col-hide">${effScore}</div>
        <div class="lb-stat pts">${sub.score.total}</div>
      </div>`;
      if (rank === 3 && list.length > 3) html += `<div class="lb-tier-divider"></div>`;
    });

    html += `</div>`;

    // Detail drawer (if one is open)
    if (activeDetailId) {
      const sub = list.find(s => s.id === activeDetailId);
      if (sub) html += buildDetailDrawer(sub);
    }

    content.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Detail drawer ──────────────────────────────────────────────────────────
  function toggleDetail(id) {
    activeDetailId = activeDetailId === id ? null : id;
    renderAll();
    if (activeDetailId) {
      const el = document.getElementById(`lb-row-${id}`);
      if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    }
  }

  function buildDetailDrawer(sub) {
    const cap = fmtCap(sub.cap_used);
    const effScore = sub.cap_used ? (sub.score.total / (sub.cap_used / 1_000_000)).toFixed(1) : '—';
    let html = `<div class="detail-drawer">
      <div class="detail-drawer-header">
        <div class="detail-drawer-name">${escapeHtml(sub.name)}</div>
        <div class="detail-badges">
          <span class="detail-badge pts">${sub.score.total} PTS</span>
          <span class="detail-badge cap">${cap}</span>
          <span class="detail-badge" style="background:rgba(34,197,94,0.08);color:var(--green);border:1px solid rgba(34,197,94,0.25);" title="Points per $M cap">${effScore} EFF</span>
          ${sub.paid ? '<span class="detail-badge" style="background:rgba(34,197,94,0.1);color:var(--green);border:1px solid rgba(34,197,94,0.3);">PAID</span>' : ''}
        </div>
        <button class="detail-close" onclick="toggleDetail('${sub.id}')">✕</button>
      </div>
      <div class="pos-scores-bar">
        <div class="pos-score-block F"><div class="pos-score-val">${sub.score.fPts}</div><div class="pos-score-label">Forwards</div></div>
        <div class="pos-score-block D"><div class="pos-score-val">${sub.score.dPts}</div><div class="pos-score-label">Defence</div></div>
        <div class="pos-score-block G"><div class="pos-score-val">${sub.score.gPts}</div><div class="pos-score-label">Goalies</div></div>
      </div>
      <table class="roster-table">`;

    const sections = [
      { pos: 'F', label: 'Forwards', slugs: sub.roster.F || [] },
      { pos: 'D', label: 'Defencemen', slugs: sub.roster.D || [] },
      { pos: 'G', label: 'Goalies', slugs: sub.roster.G || [] },
    ];

    for (const { pos, label, slugs } of sections) {
      if (!slugs.length) continue;
      html += `<tr><td colspan="5" class="section-header ${pos}">${label}</td></tr>`;
      const sorted = [...slugs].map(slug => {
        const p = playerMap[slug];
        const pts = p ? playerPoolScore(p) : 0;
        return { slug, p, pts };
      }).sort((a, b) => b.pts - a.pts);

      for (const { slug, p, pts } of sorted) {
        if (!p) continue;
        const abbr = TEAM_ABBR[p.team];
        const logo = abbr ? `<img class="td-team-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
        let statCols = '';
        if (pos === 'G') {
          statCols = `<td class="td-stat">${p.wins ?? '—'}W</td><td class="td-stat">${p.shutouts ?? '—'}SO</td>`;
        } else if (pos === 'D') {
          statCols = `<td class="td-stat">${p.goals ?? '—'}G</td><td class="td-stat">${p.assists ?? '—'}A</td>`;
        } else {
          statCols = `<td class="td-stat">${p.points ?? '—'}PTS</td><td class="td-stat">${p.games_played ?? '—'}GP</td>`;
        }
        html += `<tr class="player-row">
          <td style="width:28px;padding:0.35rem 0.5rem 0.35rem 1rem;">${logo}</td>
          <td class="td-name">${formatName(p.player_name)}</td>
          ${statCols}
          <td class="td-pts">${pts}</td>
        </tr>`;
      }
    }

    html += `</table></div>`;
    return html;
  }

  // ── Load ───────────────────────────────────────────────────────────────────
  async function load() {
    try {
      const [subsRes, playersRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/pool_2027_submissions?select=id,name,paid,roster,cap_used,submitted_at&order=submitted_at.desc`, { headers: sbHeaders() }),
        fetch(`${SUPABASE_URL}/rest/v1/nhl_players?select=puckpedia_slug,player_name,position,cap_hit,team,goals,assists,points,wins,shutouts,games_played&limit=1000`, { headers: sbHeaders() }),
      ]);

      if (!subsRes.ok) throw new Error(`submissions: ${subsRes.status}`);
      if (!playersRes.ok) throw new Error(`players: ${playersRes.status}`);

      allSubmissions = await subsRes.json();
      allPlayers = await playersRes.json();
      playerMap = Object.fromEntries(allPlayers.map(p => [p.puckpedia_slug, p]));

      renderAll();
    } catch(e) {
      document.getElementById('content').innerHTML =
        `<div class="msg">Failed to load standings. <button class="btn-refresh" onclick="load()">Retry</button></div>`;
    }
  }

  load();
</script>
</body>
</html>
