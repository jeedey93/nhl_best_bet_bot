  /* ── Header ── */

  /* loading state */

  /* ── Card ── */

  /* Card header */
  .card-header{background:linear-gradient(135deg,rgba(26,58,110,0.6),rgba(7,17,31,0.9));

  .pick-logo-wrap{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;

  .pick-info{flex:1;min-width:0;}
  .pick-name{font-size:0.95rem;font-weight:700;color:white;letter-spacing:0.5px;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* points pill */
  .pts-pill{font-family:'Bebas Neue',cursive;font-size:1.1rem;color:var(--ice);
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);
    border-radius:4px;min-width:48px;text-align:center;flex-shrink:0;padding:2px 6px;line-height:1.2;}
  .pts-pill small{font-size:0.6rem;opacity:0.6;}

  /* earned points */
  .earned-pts{font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:0.5px;
    min-width:60px;text-align:right;flex-shrink:0;white-space:nowrap;}
  .earned-pts.has-earned{color:var(--green);}
  .earned-pts.no-earned{color:rgba(255,255,255,0.15);}
  .earned-pts.eliminated{color:rgba(200,16,46,0.5);}

  /* Card footer */
  .card-footer{padding:8px 14px 10px;border-top:1px solid rgba(255,255,255,0.05);
    text-align:right;font-size:0.72rem;color:rgba(168,178,190,0.3);letter-spacing:1px;}

  /* Total score banner */
  .score-banner{display:flex;align-items:center;justify-content:center;gap:16px;
    background:rgba(255,184,28,0.06);border-top:1px solid rgba(255,184,28,0.15);
    border-bottom:1px solid rgba(255,184,28,0.15);padding:10px 22px;margin:0;}
  .score-banner-label{font-family:'Bebas Neue',cursive;font-size:1rem;color:rgba(255,255,255,0.45);letter-spacing:3px;}
  .score-banner-value{font-family:'Bebas Neue',cursive;font-size:2rem;color:var(--gold);letter-spacing:2px;line-height:1;}
  .score-banner-rank{font-size:0.85rem;color:var(--silver);letter-spacing:2px;text-transform:uppercase;}

  /* empty state */
  .empty-state{text-align:center;padding:4rem 1rem;color:var(--silver);opacity:0.7;}
  .empty-state .icon{font-size:3rem;margin-bottom:0.5rem;}
  .empty-state p{font-size:1.1rem;letter-spacing:1px;}

  /* legend */
  .pts-legend{max-width:580px;margin:1.25rem auto 0;display:flex;gap:8px;justify-content:center;
    flex-wrap:wrap;}
  .pts-legend-item{font-size:0.72rem;letter-spacing:1px;color:rgba(168,178,190,0.5);
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
    border-radius:4px;padding:3px 8px;white-space:nowrap;}
  .pts-legend-item strong{color:rgba(255,184,28,0.7);}

  /* eliminated styling */
  .pick-row.elim-team .pick-name{color:rgba(255,255,255,0.35);text-decoration:line-through;}
  .pick-row.elim-team .pick-logo-wrap{opacity:0.3;}
  .pick-row.elim-team{background:rgba(200,16,46,0.04)!important;border-left-color:rgba(200,16,46,0.2)!important;}

  /* hot team */

  <div class="pts-legend-item">Rank 16 = <strong>1 pt</strong></div>
  <div class="pts-legend-item">× wins per round</div>

<script>
const TEAMS=[
  {name:"Buffalo Sabres",        abbr:"BUF",conf:"East",c1:"#003E7E",c2:"#FCB514"},
  {name:"Boston Bruins",         abbr:"BOS",conf:"East",c1:"#FFB81C",c2:"#000000"},
  {name:"Montreal Canadiens",    abbr:"MTL",conf:"East",c1:"#AF1E2D",c2:"#192168"},
  {name:"Tampa Bay Lightning",   abbr:"TBL",conf:"East",c1:"#002868",c2:"#FFFFFF"},
  {name:"Carolina Hurricanes",   abbr:"CAR",conf:"East",c1:"#CC0000",c2:"#FFFFFF"},
  {name:"Ottawa Senators",       abbr:"OTT",conf:"East",c1:"#C8102E",c2:"#C69214"},
  {name:"Pittsburgh Penguins",   abbr:"PIT",conf:"East",c1:"#000000",c2:"#FCB514"},
  {name:"Philadelphia Flyers",   abbr:"PHI",conf:"East",c1:"#F74902",c2:"#FFFFFF"},
  {name:"Colorado Avalanche",    abbr:"COL",conf:"West",c1:"#6F263D",c2:"#FFFFFF"},
  {name:"Los Angeles Kings",     abbr:"LAK",conf:"West",c1:"#111111",c2:"#A2AAAD"},
  {name:"Dallas Stars",          abbr:"DAL",conf:"West",c1:"#006847",c2:"#FFFFFF"},
  {name:"Minnesota Wild",        abbr:"MIN",conf:"West",c1:"#154734",c2:"#DDAF57"},
  {name:"Edmonton Oilers",       abbr:"EDM",conf:"West",c1:"#FF4C00",c2:"#041E42"},
  {name:"Utah Hockey Club",      abbr:"UTA",conf:"West",c1:"#6CACE4",c2:"#FFFFFF",display:"Utah Mammoth"},
  {name:"Vegas Golden Knights",  abbr:"VGK",conf:"West",c1:"#B4975A",c2:"#333F42"},
  {name:"Anaheim Ducks",         abbr:"ANA",conf:"West",c1:"#F47A38",c2:"#B9975B"},
];

const ROUND_MULT=[1,2,3,4];
const STORAGE_KEY='nhl_playoff_results_2026';
const API_URL='/api/playoff-results';

let results={};
let participants=[];
let participantFiles={};
let bracketData=null;

TEAMS.forEach(t=>{results[t.name]=[0,0,0,0];});

function logoUrl(abbr){return`https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg`;}
function displayName(team){return team.display||team.name;}
function pts(pos){return 17-pos;}

// ── Results loading ───────────────────────────────────────────────────────────
function applyResults(saved){
  TEAMS.forEach(t=>{if(saved[t.name])results[t.name]=saved[t.name];});
}
function loadResultsLocal(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)applyResults(JSON.parse(s));}catch(e){}
}
async function loadResultsRemote(){
  try{
    const resp=await fetch(API_URL+'?_='+Date.now());
    if(!resp.ok)return;
    const data=await resp.json();
    if(data.success&&data.results&&Object.keys(data.results).length>0){
      TEAMS.forEach(t=>{results[t.name]=[0,0,0,0];});
      applyResults(data.results);
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(Object.fromEntries(TEAMS.map(t=>[t.name,results[t.name]]))));}catch(e){}
    }
  }catch(e){}
}

// ── Bracket loading ───────────────────────────────────────────────────────────
async function loadBracket(){
  try{
    const r=await fetch('playoff/bracket.json?_='+Date.now());
    if(r.ok)bracketData=await r.json();
  }catch(e){}
}

// ── Eliminated set ────────────────────────────────────────────────────────────
function getEliminated(){
  const eliminated=new Set();
  if(!bracketData)return eliminated;
  bracketData.rounds.forEach((rd,ri)=>{
    ['east','west'].forEach(side=>{
      (rd[side]||[]).forEach(([t,b])=>{
        const tw=results[t]?.[ri]||0,bw=results[b]?.[ri]||0;
        if(tw===4)eliminated.add(b);
        else if(bw===4)eliminated.add(t);
      });
    });
    if(rd.final){
      const[f1,f2]=rd.final;
      if(f1&&f2&&f1!=='TBD'&&f2!=='TBD'){
        const tw=results[f1]?.[ri]||0,bw=results[f2]?.[ri]||0;
        if(tw===4)eliminated.add(f2);
        else if(bw===4)eliminated.add(f1);
      }
    }
  });
  return eliminated;
}

// ── Score calculation ─────────────────────────────────────────────────────────
function calcScore(pickMap){
  let total=0;
  TEAMS.forEach(team=>{
    const p=pickMap[team.name]||0;
    ROUND_MULT.forEach((mult,ri)=>{total+=p*mult*(results[team.name]?.[ri]||0);});
  });
  return total;
}

function calcTeamEarned(teamName, pts_assigned){
  let earned=0;
  ROUND_MULT.forEach((mult,ri)=>{earned+=pts_assigned*mult*(results[teamName]?.[ri]||0);});
  return earned;
}

// ── Participants loading ──────────────────────────────────────────────────────
async function loadParticipants(){
  const sel=document.getElementById('participant-select');
  sel.innerHTML='<option value="">— Loading… —</option>';
  try{
    const idx=await fetch('playoff/index.json?_='+Date.now());
    if(!idx.ok){sel.innerHTML='<option value="">— No data —</option>';return;}
    const files=(await idx.json()).filter(f=>f!=='bracket.json');

    // Load all participant data for scoring
    participants=[];
    await Promise.all(files.map(async f=>{
      try{
        const r=await fetch('playoff/'+f+'?_='+Date.now());
        if(!r.ok)return;
        const data=await r.json();
        const name=data.name||f.replace(/\.json$/i,'').split('_')[0];
        const paid=data.paid===true;
        const pickMap={};
        data.picks.forEach(p=>{pickMap[p.team]=p.points;});
        participants.push({name,paid,picks:pickMap,file:f,rawData:data});
        participantFiles[name]={paid,picks:pickMap,file:f,rawData:data};
      }catch(e){}
    }));

    // Sort alphabetically
    participants.sort((a,b)=>a.name.localeCompare(b.name));

    sel.innerHTML='<option value="">— Select a participant —</option>';
    participants.forEach(p=>{
      const opt=document.createElement('option');
      opt.value=p.name;
      opt.textContent=p.name+(p.paid?' ⭐':'');
      sel.appendChild(opt);
    });
  }catch(e){
    sel.innerHTML='<option value="">— Error loading —</option>';
  }
}

// ── Render card ───────────────────────────────────────────────────────────────
function renderCard(participantName){
  const area=document.getElementById('card-area');
  const legend=document.getElementById('pts-legend');
  if(!participantName){
    area.innerHTML=`<div class="empty-state"><div class="icon">🏒</div><p>Select a participant above to view their picks</p></div>`;
    legend.style.display='none';
    return;
  }

  const p=participantFiles[participantName];
  if(!p){
    area.innerHTML=`<div class="empty-state"><div class="icon">❓</div><p>Participant not found</p></div>`;
    legend.style.display='none';
    return;
  }

  const eliminated=getEliminated();
  const totalScore=calcScore(p.picks);

  // Build sorted picks array (rank 1..16 sorted by points descending)
  // picks: {teamName: pointsAssigned}
  const pickEntries=Object.entries(p.picks).sort((a,b)=>b[1]-a[1]);

  // Find rank on leaderboard
  const allScores=participants.map(pp=>calcScore(pp.picks)).sort((a,b)=>b-a);
  const myRank=allScores.findIndex(s=>s===totalScore)+1;

  // Find MVP team (most earned)
  let mvpTeam=null,mvpEarned=0;
  pickEntries.forEach(([teamName,p_assigned])=>{
    const earned=calcTeamEarned(teamName,p_assigned);
    if(earned>mvpEarned){mvpEarned=earned;mvpTeam=teamName;}
  });

  // Build rows
  const rowsHtml=pickEntries.map(([teamName,pts_assigned],i)=>{
    const pos=i+1;
    const team=TEAMS.find(t=>t.name===teamName);
    const isElim=eliminated.has(teamName);
    const earned=calcTeamEarned(teamName,pts_assigned);
    const isHot=teamName===mvpTeam&&earned>0;

    let earnedHtml='';
    if(isElim){
      earnedHtml=`<div class="earned-pts eliminated" title="Eliminated">✗</div>`;
    } else if(earned>0){
      earnedHtml=`<div class="earned-pts has-earned" title="Points earned so far">+${earned} pts</div>`;
    } else {
      earnedHtml=`<div class="earned-pts no-earned">—</div>`;
    }

    const elimClass=isElim?' elim-team':'';
    const hotClass=isHot?' hot-team':'';

    if(!team){
      return `<div class="pick-row${elimClass}" data-pos="${pos}">
        <div class="pick-rank">${pos}</div>
        <div class="pick-info"><div class="pick-name">${teamName}</div></div>
        <div class="pts-pill">${pts_assigned} <small>pts</small></div>
        ${earnedHtml}
      </div>`;
    }

    return `<div class="pick-row${elimClass}${hotClass}" data-pos="${pos}">
      <div class="pick-rank">${pos}</div>
      <div class="pick-logo-wrap">
        <img src="${logoUrl(team.abbr)}" alt="${team.abbr}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="pick-logo-fallback" style="background:${team.c1};color:${team.c2};display:none;">${team.abbr}</div>
      </div>
      <div class="pick-info">
        <div class="pick-name">${displayName(team)}</div>
      </div>
      <div class="pts-pill">${pts_assigned} <small>pts</small></div>
      ${earnedHtml}
    </div>`;
  }).join('');

  const poolBadge=p.paid
    ?`<span class="card-pool-badge paid">⭐ $10 Paid Pool</span>`
    :`<span class="card-pool-badge free">Free Pool</span>`;

  const dateStr=p.rawData?.date?new Date(p.rawData.date).toLocaleDateString('en-CA'):'';
  const rankStr=totalScore>0?`Rank #${myRank} · `:'';

  area.innerHTML=`
    <div class="card-wrap">
      <div class="picks-card">
        <div class="card-header">
          <div class="card-header-top">
            <div>
              <div class="card-title">NHL <span>2026 Playoff</span> Picks</div>
              <div class="card-meta">
                <div class="card-meta-by">Picks by <strong>${participantName}</strong></div>
                <div class="card-meta-sub">${dateStr}</div>
              </div>
              ${poolBadge}
            </div>
            <img src="parieur_discipline_icon_1024.png" alt="" class="card-brand-icon">
          </div>
        </div>

        ${totalScore>0?`<div class="score-banner">
          <div class="score-banner-label">Total Score</div>
          <div class="score-banner-value">${totalScore}</div>
          <div class="score-banner-rank">${rankStr}${participants.length} participants</div>
        </div>`:''}

        <div class="picks-list">${rowsHtml}</div>

        <div class="card-footer">parieurdiscipline.com</div>
      </div>
    </div>`;

  legend.style.display='';
}

// ── Wire up selector ──────────────────────────────────────────────────────────
document.getElementById('participant-select').addEventListener('change',function(){
  renderCard(this.value);
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadResultsLocal();
Promise.all([loadBracket(), loadResultsRemote(), loadParticipants()]);
</script>
