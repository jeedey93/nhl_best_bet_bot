<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool 2026–27 Admin | Parieur Discipliné</title>
  <link rel="icon" type="image/png" href="parieur_discipline_icon_1024.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rink: #07111f;
      --red: #c8102e;
      --gold: #ffb81c;
      --silver: #a8b2be;
      --green: #22c55e;
      --line: rgba(255,255,255,0.08);
      --nav-h: 44px;
    }
    body { background: var(--rink); background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,110,0.6) 0%, transparent 70%); min-height: 100vh; font-family: 'Barlow Condensed', sans-serif; color: white; padding-top: var(--nav-h); }

    /* ── NAV ── */
    .site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(7,17,31,0.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    .site-nav-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: var(--nav-h); padding: 0 1.5rem; }
    .site-nav-brand { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; color: var(--gold); letter-spacing: 4px; text-decoration: none; }
    .site-nav-links { display: flex; align-items: center; gap: 0.5rem; }
    .site-nav-links a { font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 600; color: var(--silver); text-decoration: none; padding: 0.3rem 0.8rem; border-radius: 5px; letter-spacing: 1.5px; transition: color 0.15s, background 0.15s; }
    .site-nav-links a:hover { color: white; background: rgba(255,255,255,0.07); }
    .site-nav-links a.active { color: var(--gold); background: rgba(255,184,28,0.1); }

    /* ── PASSWORD GATE ── */
    #pw-gate { position: fixed; inset: 0; z-index: 9999; background: var(--rink); display: flex; align-items: center; justify-content: center; background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,110,0.6) 0%, transparent 70%); }
    .pw-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 2.5rem 2rem; width: 320px; max-width: 90vw; text-align: center; }
    .pw-box h2 { font-family: 'Bebas Neue', cursive; font-size: 1.8rem; color: var(--gold); letter-spacing: 3px; margin-bottom: 0.3rem; }
    .pw-box p { color: var(--silver); font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 1.5rem; }
    .pw-input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 0.7rem 1rem; color: white; font-size: 1rem; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 2px; outline: none; text-align: center; transition: border-color 0.2s; }
    .pw-input:focus { border-color: rgba(255,184,28,0.5); }
    .pw-input.error { border-color: rgba(200,16,46,0.7); animation: pw-shake 0.3s; }
    @keyframes pw-shake { 0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);} }
    .pw-btn { margin-top: 1rem; width: 100%; background: var(--red); color: white; border: none; border-radius: 8px; padding: 0.75rem; font-family: 'Bebas Neue', cursive; font-size: 1.2rem; letter-spacing: 3px; cursor: pointer; transition: background 0.2s; }
    .pw-btn:hover { background: #e0122e; }
    .pw-error { color: rgba(200,16,46,0.8); font-size: 0.8rem; margin-top: 0.5rem; min-height: 1em; letter-spacing: 1px; }

    /* ── LAYOUT ── */
    .page-wrap { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

    /* ── HEADER ── */
    header { margin-bottom: 1.5rem; }
    header h1 { font-family: 'Bebas Neue', cursive; font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: 5px; line-height: 1; text-shadow: 0 0 30px rgba(200,16,46,0.4); }
    header h1 span { color: var(--gold); }
    .header-sub { font-size: 0.8rem; font-weight: 600; color: var(--silver); letter-spacing: 2px; margin-top: 0.3rem; text-transform: uppercase; }

    /* ── STATS ROW ── */
    .stats-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .stat-card { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 1rem; display: flex; flex-direction: column; gap: 2px; min-width: 100px; }
    .stat-card-val { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; letter-spacing: 2px; color: white; line-height: 1; }
    .stat-card-val.gold { color: var(--gold); }
    .stat-card-val.green { color: var(--green); }
    .stat-card-label { font-size: 0.68rem; font-weight: 700; color: rgba(255,255,255,0.35); letter-spacing: 2px; text-transform: uppercase; }

    /* ── TOOLBAR ── */
    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; align-items: center; }
    .search-input { flex: 1; min-width: 180px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem 0.85rem; color: white; font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.15s; }
    .search-input::placeholder { color: rgba(168,178,190,0.35); }
    .search-input:focus { border-color: rgba(255,255,255,0.22); }
    .filter-btn { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: var(--silver); border-radius: 6px; padding: 5px 14px; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; white-space: nowrap; }
    .filter-btn:hover { background: rgba(255,255,255,0.08); color: white; }
    .filter-btn.active { background: rgba(255,184,28,0.1); border-color: rgba(255,184,28,0.4); color: var(--gold); }
    .btn-refresh { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: var(--silver); border-radius: 6px; padding: 5px 14px; cursor: pointer; transition: background 0.15s; }
    .btn-refresh:hover { background: rgba(255,255,255,0.1); color: white; }

    /* ── TABLE ── */
    .table-wrap { background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-family: 'Barlow Condensed', sans-serif; }
    thead tr { background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { font-family: 'Bebas Neue', cursive; font-size: 0.72rem; letter-spacing: 2px; color: rgba(255,255,255,0.4); padding: 8px 12px; text-align: left; white-space: nowrap; }
    th.right { text-align: right; }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody tr.pending-delete { background: rgba(200,16,46,0.07); }
    td { padding: 0.6rem 12px; font-size: 0.9rem; font-weight: 600; vertical-align: middle; }
    td.right { text-align: right; }
    .td-name { color: white; font-size: 0.95rem; }
    .td-email { color: var(--silver); font-size: 0.82rem; font-weight: 400; }
    .td-date { color: rgba(255,255,255,0.3); font-size: 0.78rem; font-weight: 400; white-space: nowrap; }
    .td-cap { color: rgba(255,255,255,0.5); font-size: 0.82rem; white-space: nowrap; }
    .td-pts { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 1px; color: var(--gold); }

    /* ── PAID TOGGLE ── */
    .paid-toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
    .paid-toggle input[type=checkbox] { display: none; }
    .paid-pill {
      font-family: 'Bebas Neue', cursive; font-size: 0.72rem; letter-spacing: 1.5px;
      border-radius: 4px; padding: 2px 9px; transition: background 0.15s, border-color 0.15s, color 0.15s;
      border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.04);
    }
    .paid-toggle.checked .paid-pill { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.35); color: var(--green); }
    .paid-toggle:hover .paid-pill { border-color: rgba(255,255,255,0.3); }

    /* ── ACTIONS ── */
    .btn-delete {
      font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 1.5px;
      background: none; border: 1px solid rgba(200,16,46,0.2); color: rgba(200,16,46,0.5);
      border-radius: 5px; padding: 3px 10px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-delete:hover { background: rgba(200,16,46,0.12); color: var(--red); border-color: rgba(200,16,46,0.5); }
    .btn-delete.confirm { background: rgba(200,16,46,0.15); color: var(--red); border-color: rgba(200,16,46,0.6); animation: pulse-red 0.8s ease-in-out infinite; }
    @keyframes pulse-red { 0%,100%{box-shadow:none;} 50%{box-shadow:0 0 8px rgba(200,16,46,0.4);} }
    .btn-view { font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 1.5px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: var(--silver); border-radius: 5px; padding: 3px 10px; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
    .btn-view:hover { background: rgba(255,255,255,0.1); color: white; }
    .actions-cell { display: flex; gap: 5px; justify-content: flex-end; align-items: center; }

    /* ── ROSTER DETAIL ROW ── */
    tr.detail-row td { padding: 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .detail-inner { padding: 0.75rem 1rem 1rem; background: rgba(255,255,255,0.02); }
    .detail-pos-section { margin-bottom: 0.6rem; }
    .detail-pos-label { font-family: 'Bebas Neue', cursive; font-size: 0.75rem; letter-spacing: 3px; color: var(--silver); margin-bottom: 4px; }
    .detail-pos-label.F { color: #ff7a8a; }
    .detail-pos-label.D { color: var(--blue, #7db4ff); }
    .detail-pos-label.G { color: var(--gold); }
    .detail-players { display: flex; flex-wrap: wrap; gap: 4px; }
    .detail-player-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 5px; padding: 2px 8px; font-size: 0.8rem; font-weight: 600; color: white;
    }
    .detail-player-chip img { width: 16px; height: 16px; object-fit: contain; opacity: 0.8; }
    .detail-player-pts { font-family: 'Bebas Neue', cursive; font-size: 0.78rem; color: var(--gold); margin-left: 2px; }

    /* ── EMPTY / MSG ── */
    .empty-row td { text-align: center; padding: 3rem; color: var(--silver); font-size: 0.9rem; letter-spacing: 1px; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--gold); color: var(--rink); font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 2px; padding: 0.5rem 1.8rem; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.3s ease; pointer-events: none; z-index: 9999; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--red); color: white; }
  </style>
</head>

<div class="page-wrap">

    <button class="filter-btn"        id="f-paid" onclick="setFilter('paid')">💰 Paid</button>

</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://fifurqlitkywtmhgtzeu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';
  const PW = 'parieur2026';
  const PW_KEY = 'pool2027_admin_auth';

  const TEAM_ABBR = {
    'anaheim-ducks':'ANA','boston-bruins':'BOS','buffalo-sabres':'BUF','calgary-flames':'CGY',
    'carolina-hurricanes':'CAR','chicago-blackhawks':'CHI','colorado-avalanche':'COL',
    'columbus-blue-jackets':'CBJ','dallas-stars':'DAL','detroit-red-wings':'DET',
    'edmonton-oilers':'EDM','florida-panthers':'FLA','los-angeles-kings':'LAK',
    'minnesota-wild':'MIN','montreal-canadiens':'MTL','nashville-predators':'NSH',
    'new-jersey-devils':'NJD','new-york-islanders':'NYI','new-york-rangers':'NYR',
    'ottawa-senators':'OTT','philadelphia-flyers':'PHI','pittsburgh-penguins':'PIT',
    'san-jose-sharks':'SJS','seattle-kraken':'SEA','st-louis-blues':'STL',
    'tampa-bay-lightning':'TBL','toronto-maple-leafs':'TOR','utah-hockey-club':'UTA',
    'vancouver-canucks':'VAN','vegas-golden-knights':'VGK','washington-capitals':'WSH','winnipeg-jets':'WPG',
  };

  // ── State ──────────────────────────────────────────────────────────────────
  let submissions = [];
  let playerMap = {};
  let tableFilter = 'all';
  let expandedId = null;
  let _pendingDelete = null; // id awaiting second click confirmation

  function sbHeaders(extra = {}) {
    return { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', ...extra };
  }

  // ── Password gate ──────────────────────────────────────────────────────────
  (function initGate() {
    if (sessionStorage.getItem(PW_KEY) === PW) document.getElementById('pw-gate').style.display = 'none';
    document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
  })();

  function checkPw() {
    const input = document.getElementById('pw-input'), err = document.getElementById('pw-error');
    if (input.value === PW) {
      sessionStorage.setItem(PW_KEY, PW);
      document.getElementById('pw-gate').style.display = 'none';
      load();
    } else {
      input.classList.add('error'); err.textContent = 'Incorrect password.';
      setTimeout(() => input.classList.remove('error'), 400); input.value = ''; input.focus();
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function formatName(name) {
    if (!name) return '';
    if (name.includes(',')) { const [last, first] = name.split(',').map(s => s.trim()); return `${first} ${last}`; }
    return name;
  }
  function normalizePos(pos) {
    if (!pos) return 'F';
    const p = pos.toUpperCase();
    if (p.includes('G')) return 'G';
    if (p === 'D' || p.includes('LD') || p.includes('RD')) return 'D';
    return 'F';
  }
  function fmtCap(n) { return n ? `$${(n / 1_000_000).toFixed(2)}M` : '—'; }
  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
           d.toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' });
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function scoreTeam(roster) {
    let fPts = 0, dPts = 0, gPts = 0;
    for (const slug of (roster.F || [])) { const p = playerMap[slug]; if (p) fPts += (p.points ?? 0); }
    for (const slug of (roster.D || [])) { const p = playerMap[slug]; if (p) dPts += (p.goals ?? 0) * 2 + (p.assists ?? 0); }
    for (const slug of (roster.G || [])) { const p = playerMap[slug]; if (p) gPts += (p.wins ?? 0) * 2 + (p.shutouts ?? 0) * 3; }
    return { fPts, dPts, gPts, total: fPts + dPts + gPts };
  }

  function playerScore(p) {
    const pos = normalizePos(p.position);
    if (pos === 'G') return (p.wins ?? 0) * 2 + (p.shutouts ?? 0) * 3;
    if (pos === 'D') return (p.goals ?? 0) * 2 + (p.assists ?? 0);
    return p.points ?? 0;
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  let _toastTimer;
  function toast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  // ── Filter ─────────────────────────────────────────────────────────────────
  function setFilter(f) {
    tableFilter = f;
    ['all','paid','free'].forEach(k => document.getElementById(`f-${k}`).classList.toggle('active', k === f));
    renderTable();
  }

  function getFiltered() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    return submissions.filter(s => {
      if (tableFilter === 'paid' && !s.paid) return false;
      if (tableFilter === 'free' && s.paid)  return false;
      if (query && !s.name.toLowerCase().includes(query) && !s.email.toLowerCase().includes(query)) return false;
      return true;
    });
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function updateStats() {
    const total = submissions.length;
    const paid = submissions.filter(s => s.paid).length;
    const scored = submissions.map(s => scoreTeam(s.roster).total);
    const avg = scored.length ? Math.round(scored.reduce((a, b) => a + b, 0) / scored.length) : 0;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-paid').textContent = paid;
    document.getElementById('stat-free').textContent = total - paid;
    document.getElementById('stat-avg-pts').textContent = avg;
  }

  function renderTable() {
    const list = getFiltered();
    const tbody = document.getElementById('tbody');

    if (!list.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="8">No participants found.</td></tr>`;
      return;
    }

    // Sort by submitted_at desc by default
    const sorted = [...list].sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

    let html = '';
    sorted.forEach((s, i) => {
      const score = scoreTeam(s.roster);
      const isPendingDelete = _pendingDelete === s.id;
      const isExpanded = expandedId === s.id;

      html += `<tr class="${isPendingDelete ? 'pending-delete' : ''}">
        <td style="color:rgba(255,255,255,0.3);font-size:0.8rem;">${i + 1}</td>
        <td><div class="td-name">${escapeHtml(s.name)}</div></td>
        <td><div class="td-email">${escapeHtml(s.email)}</div></td>
        <td>
          <label class="paid-toggle ${s.paid ? 'checked' : ''}" onclick="togglePaid('${s.id}', ${s.paid})">
            <span class="paid-pill">${s.paid ? '✓ Paid' : 'Free'}</span>
          </label>
        </td>
        <td class="right"><span class="td-cap">${fmtCap(s.cap_used)}</span></td>
        <td class="right"><span class="td-pts">${score.total}</span></td>
        <td><span class="td-date">${fmtDate(s.submitted_at)}</span></td>
        <td>
          <div class="actions-cell">
            <button class="btn-view" onclick="toggleExpand('${s.id}')">${isExpanded ? '▲ Hide' : '▼ Roster'}</button>
            <button class="btn-delete ${isPendingDelete ? 'confirm' : ''}" onclick="deleteEntry('${s.id}')">${isPendingDelete ? '✕ Confirm' : 'Delete'}</button>
          </div>
        </td>
      </tr>`;

      if (isExpanded) {
        html += `<tr class="detail-row"><td colspan="8">${buildRosterDetail(s, score)}</td></tr>`;
      }
    });

    tbody.innerHTML = html;
  }

  function buildRosterDetail(s, score) {
    const posLabels = { F: 'Forwards', D: 'Defencemen', G: 'Goalies' };
    let html = `<div class="detail-inner">`;
    for (const pos of ['F', 'D', 'G']) {
      const slugs = s.roster[pos] || [];
      if (!slugs.length) continue;
      html += `<div class="detail-pos-section"><div class="detail-pos-label ${pos}">${posLabels[pos]}</div><div class="detail-players">`;
      const sorted = slugs.map(slug => ({ slug, p: playerMap[slug] })).filter(x => x.p).sort((a, b) => playerScore(b.p) - playerScore(a.p));
      for (const { slug, p } of sorted) {
        const abbr = TEAM_ABBR[p.team];
        const logo = abbr ? `<img src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
        html += `<span class="detail-player-chip">${logo}${formatName(p.player_name)}<span class="detail-player-pts">${playerScore(p)}</span></span>`;
      }
      html += `</div></div>`;
    }
    html += `<div style="font-size:0.75rem;color:rgba(255,255,255,0.3);margin-top:0.5rem;letter-spacing:1px;">
      F: ${score.fPts}pts · D: ${score.dPts}pts · G: ${score.gPts}pts · Total: <strong style="color:var(--gold)">${score.total}</strong>
    </div>`;
    html += `</div>`;
    return html;
  }

  // ── Actions ────────────────────────────────────────────────────────────────
  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    _pendingDelete = null;
    renderTable();
  }

  async function togglePaid(id, currentPaid) {
    const newPaid = !currentPaid;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pool_2027_submissions?id=eq.${id}`, {
        method: 'PATCH',
        headers: { ...sbHeaders(), 'Prefer': 'return=minimal' },
        body: JSON.stringify({ paid: newPaid }),
      });
      if (!res.ok) throw new Error(res.status);
      const sub = submissions.find(s => s.id === id);
      if (sub) sub.paid = newPaid;
      updateStats();
      renderTable();
      toast(newPaid ? '✓ Marked as paid' : 'Marked as free');
    } catch(e) {
      toast('Failed to update', true);
    }
  }

  function deleteEntry(id) {
    if (_pendingDelete !== id) {
      // First click — ask for confirmation
      _pendingDelete = id;
      expandedId = null;
      renderTable();
      // Auto-cancel confirmation after 4s
      setTimeout(() => {
        if (_pendingDelete === id) { _pendingDelete = null; renderTable(); }
      }, 4000);
      return;
    }
    // Second click — actually delete
    _pendingDelete = null;
    confirmDelete(id);
  }

  async function confirmDelete(id) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pool_2027_submissions?id=eq.${id}`, {
        method: 'DELETE',
        headers: sbHeaders(),
      });
      if (!res.ok) throw new Error(res.status);
      submissions = submissions.filter(s => s.id !== id);
      if (expandedId === id) expandedId = null;
      updateStats();
      renderTable();
      toast('✓ Entry deleted');
    } catch(e) {
      toast('Delete failed', true);
    }
  }

  // ── Load ───────────────────────────────────────────────────────────────────
  async function load() {
    if (sessionStorage.getItem(PW_KEY) !== PW) return;
    document.getElementById('tbody').innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--silver);">Loading…</td></tr>`;
    try {
      const [subsRes, playersRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/pool_2027_submissions?select=id,name,email,paid,roster,cap_used,submitted_at&order=submitted_at.desc`, { headers: sbHeaders() }),
        fetch(`${SUPABASE_URL}/rest/v1/nhl_players?select=puckpedia_slug,player_name,position,team,goals,assists,points,wins,shutouts&limit=1000`, { headers: sbHeaders() }),
      ]);
      if (!subsRes.ok) throw new Error(subsRes.status);
      if (!playersRes.ok) throw new Error(playersRes.status);
      submissions = await subsRes.json();
      const players = await playersRes.json();
      playerMap = Object.fromEntries(players.map(p => [p.puckpedia_slug, p]));
      updateStats();
      renderTable();
    } catch(e) {
      document.getElementById('tbody').innerHTML = `<tr class="empty-row"><td colspan="8">Failed to load. <button class="btn-refresh" onclick="load()">Retry</button></td></tr>`;
    }
  }

  // Load only if already authenticated
  if (sessionStorage.getItem(PW_KEY) === PW) load();
</script>
</body>
</html>
