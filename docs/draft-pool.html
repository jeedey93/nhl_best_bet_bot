      nameEl.classList.add('error'); nameEl.focus();
      setTimeout(() => nameEl.classList.remove('error'), 600);
      showToast('Enter your name first.', true); return;
    }
    const count = Object.keys(_picks).length;
    if (count === 0) { showToast('Make at least one pick first.', true); return; }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…';

    try {
