    <button class="pw-btn" onclick="checkPw()">ENTER</button>
    <div class="pw-error" id="pw-error"></div>
  </div>
</div>
<script>
  (function(){
    if(sessionStorage.getItem('pool_auth')==='1') document.getElementById('pw-gate').style.display='none';
    document.getElementById('pw-input').addEventListener('keydown',e=>{ if(e.key==='Enter') checkPw(); });
  })();
  function checkPw(){
    const i=document.getElementById('pw-input'),e=document.getElementById('pw-error');
    if(i.value==='parieur2026'){ sessionStorage.setItem('pool_auth','1'); document.getElementById('pw-gate').style.display='none'; }
    else { i.classList.add('error'); e.textContent='Incorrect password.'; setTimeout(()=>i.classList.remove('error'),400); i.value=''; i.focus(); }
  }
</script>

  function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function normalizePos(pos){if(!pos)return'F';const p=pos.toUpperCase();if(p.includes('G'))return'G';if(p==='D'||p.includes('LD')||p.includes('RD'))return'D';return'F';}
  function poolScore(p){const pos=normalizePos(p.position);if(pos==='G')return(p.wins??0)*_scoring.g_wins+(p.shutouts??0)*_scoring.g_shutouts;if(pos==='D')return(p.goals??0)*_scoring.d_goals+(p.assists??0)*_scoring.d_assists;return(p.points??0)*_scoring.f_points;}
  function formatName(n){if(!n)return'';if(n.includes(',')){const[l,f]=n.split(',').map(s=>s.trim());return`${f} ${l}`;}return n;}
  function slugMap(){if(!slugMap._c)slugMap._c=Object.fromEntries(allPlayers.map(p=>[p.puckpedia_slug,p]));return slugMap._c;}
  function sbHeaders(extra={}){return{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',...extra};}
  function formatCap(value){return `$${((value||0)/1e6).toFixed(2)}M`;}
  function slotLabel(group,index){return `${group}${index+1}`;}
  function fallbackPlayer(slug,group='F'){return {puckpedia_slug:slug,player_name:slug?.split('/').pop()?.replace(/-/g,' ')||slug,position:group,cap_hit:0,team:''};}
  function getPlayer(slug,group='F'){return slugMap()[slug]||fallbackPlayer(slug,group);}
  function teamTradeMatch(trade,team){
    const byId=!!trade.team_id&&!!team.id&&trade.team_id===team.id;
    const byName=trade.team_name===team.name;
    const bySnapshot=trade.team_name_snapshot===team.name;
    const result=byId||byName||bySnapshot;
    // console.log(`  [teamTradeMatch] team_id match: ${byId} (${trade.team_id}===${team.id}), name: ${byName} (${trade.team_name}===${team.name}), snapshot: ${bySnapshot} → ${result}`);
    return result;
  }
  function findLatestIncomingTrade(team,slug){return currentTrades.find(t=>teamTradeMatch(t,team)&&t.player_to_slug===slug&&t.player_from_slug!==t.player_to_slug)||null;}
  function getAcquiredDateForActivePlayer(team,slug){
    // First check if we have an acquisition date in roster metadata (draft day)
    const rosterAcqDate=team.acquisitions?.[slug];
    if(rosterAcqDate) return rosterAcqDate;
    // Otherwise check trade history
    return findLatestIncomingTrade(team,slug)?.date_traded||null;
  }
  function collectRelevantSlugs(){const set=new Set();teams.forEach(team=>['F','D','G','B'].forEach(group=>(team.roster[group]||[]).filter(Boolean).forEach(slug=>set.add(slug))));currentTrades.forEach(t=>{if(t.player_from_slug)set.add(t.player_from_slug);if(t.player_to_slug)set.add(t.player_to_slug);});return [...set];}
  function teamMainCap(team){
    const m=slugMap();
    return [...(team.roster.F||[]),...(team.roster.D||[]),...(team.roster.G||[])]
      .filter(Boolean)
      .reduce((sum,slug)=>sum+(m[slug]?.cap_hit||0),0);
  }
  function findPlayerSlot(team,slug){
    for(const group of ['F','D','G','B']){
      const idx=(team.roster[group]||[]).findIndex(s=>s===slug);
      if(idx!==-1) return {group,index:idx};
    }
    return null;
  }
  async function saveRostersToSupabase(){
    const data={teams,activeTeamId};

      method:'POST',

    });
    if(!res.ok) throw new Error(`Failed to persist roster (${res.status})`);
  }

   async function postWithFallback(url,payloads,prefer='return=representation'){
     let lastError='';
     for(const i in payloads){
       const payload=payloads[i];
       const res=await fetch(url,{method:'POST',headers:sbHeaders({'Prefer':prefer}),body:JSON.stringify(payload)});
       if(res.ok){
         const text=await res.text();
         return text?JSON.parse(text):null;
       }
       lastError=await res.text();
       // 409 = unique constraint violation (hold already exists, which is fine)
       if(res.status===409) return {conflict:true};
       // 400 with column errors = schema mismatch, try next payload
       if(res.status===400&&/column|team_id|team_name_snapshot|player_from_name|from_slot_group|to_slot_group/i.test(lastError)){
         continue;
       }
       // For other 400 errors or unknown status, only throw if we're on the last payload
       if(i==payloads.length-1){
         throw new Error(lastError||`Request failed (${res.status})`);
       }
     }
     throw new Error(lastError||'Request failed');
   }

  async function ensurePlayersLoaded(slugs){
    const needed=[...new Set((slugs||[]).filter(Boolean).filter(slug=>!slugMap()[slug]))];
    if(!needed.length) return;
    const fields='puckpedia_slug,player_name,position,cap_hit,team,goals,assists,points,wins,shutouts,games_played';
    for(let i=0;i<needed.length;i+=75){
      const chunk=needed.slice(i,i+75);
      const orClause=`(${chunk.map(slug=>`puckpedia_slug.eq.${slug}`).join(',')})`;
      const res=await fetch(`${SUPABASE_URL}/rest/v1/nhl_players?select=${fields}&or=${encodeURIComponent(orClause)}`,{headers:sbHeaders()});
      if(!res.ok){
        loadWarnings.push(`Some rostered players could not be refreshed from the player database.`);
        continue;
      }
      const rows=await res.json();
      const map=new Map(allPlayers.map(p=>[p.puckpedia_slug,p]));
      rows.forEach(p=>map.set(p.puckpedia_slug,p));
      allPlayers=[...map.values()];
      slugMap._c=null;
    }
    sessionStorage.setItem(PLAYER_CACHE_KEY,JSON.stringify(allPlayers));
  }

  async function loadScoringSettings(){
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/pool_settings?league_code=eq.${_leagueCode}&select=f_points,d_goals,d_assists,g_wins,g_shutouts`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
      if(r.ok){const rows=await r.json();if(rows.length)_scoring={..._scoring,...rows[0]};}
    }catch(e){console.warn('Unable to load scoring settings',e);}
  }

  async function load(preferredTeamId=activeTeamId){
    await loadScoringSettings();
    try{
      loadWarnings=[];
      const cached=sessionStorage.getItem(PLAYER_CACHE_KEY);
      if(cached){
        try{allPlayers=JSON.parse(cached);if(!Array.isArray(allPlayers)||!allPlayers.length)throw new Error('empty');}
        catch(_){sessionStorage.removeItem(PLAYER_CACHE_KEY);allPlayers=[];}
      }
      if(!allPlayers.length){
        const res=await fetch(`${SUPABASE_URL}/rest/v1/nhl_players?select=puckpedia_slug,player_name,position,cap_hit,team,goals,assists,points,wins,shutouts,games_played&order=cap_hit.desc&limit=1000`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
        if(!res.ok)throw new Error(res.status);
        allPlayers=await res.json();
        sessionStorage.setItem(PLAYER_CACHE_KEY,JSON.stringify(allPlayers));
      }
      slugMap._c=null;

      const rRes=await fetch(`${SUPABASE_URL}/rest/v1/pool_rosters?league_code=eq.${_leagueCode}&select=data`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
      if(!rRes.ok)throw new Error(rRes.status);
      const allRosterRows=await rRes.json();
      if(!allRosterRows.length){document.getElementById('content').innerHTML='<div class="msg">No teams saved yet. Go build your pool!</div>';return;}

      const firstRow=allRosterRows[0];
      teams=[];
      if(firstRow.data?.teams){
        firstRow.data.teams.forEach((t,idx)=>{
          teams.push({
            id:t.id||`team-${idx}`,
            name:t.name||`Team ${idx+1}`,
            roster:{
              F:Array.isArray(t.roster?.F)?t.roster.F:Array(12).fill(null),
              D:Array.isArray(t.roster?.D)?t.roster.D:Array(6).fill(null),
              G:Array.isArray(t.roster?.G)?t.roster.G:Array(2).fill(null),
              B:Array.isArray(t.roster?.B)?t.roster.B:Array(6).fill(null)
            }
          });
        });
      }

      activeTeamId=teams.find(t=>t.id===preferredTeamId)?.id||firstRow.data?.activeTeamId&&teams.find(t=>t.id===firstRow.data.activeTeamId)?.id||teams[0]?.id;

      await loadTrades();
      await ensurePlayersLoaded(collectRelevantSlugs());
      // Auto-initialize acquisition dates for any players without them
      await initializeDraftDayAcquisitions();
      renderTeamSelector();
      render();
    }catch(e){console.error(e);document.getElementById('content').innerHTML=`<div class="msg">Failed to load. <button class="btn-refresh" onclick="location.reload()">Retry</button></div>`;}
  }

   async function loadTrades(){
     try{
       const cols='id,created_at,league_code,team_name,team_id,team_name_snapshot,player_from_slug,player_to_slug,player_from_name,player_to_name,player_from_position,player_to_position,player_from_team,player_to_team,from_slot_group,from_slot_index,to_slot_group,to_slot_index,date_from_acquired,date_traded,points_accumulated_at_trade';
       const url=`${SUPABASE_URL}/rest/v1/player_trades?league_code=eq.${_leagueCode}&select=${cols}&order=date_traded.desc`;
       const res=await fetch(url,{headers:sbHeaders({'Cache-Control':'no-cache'})});
       if(!res.ok){
         const errText=await res.text();
         throw new Error(`player_trades ${res.status}: ${errText}`);
       }
       currentTrades=await res.json();
     }catch(e){currentTrades=[];console.error('[TRADES ERROR]',e);loadWarnings.push('Trade history could not be fully loaded.');}
   }

   async function waitForTradeHistory(team,fromSlug,toSlug,maxAttempts=12){
     for(let i=0;i<maxAttempts;i++){
       await loadTrades();
       const found=currentTrades.some(t=>{
         return teamTradeMatch(t,team)&&t.player_from_slug===fromSlug&&t.player_to_slug===toSlug;
       });
       if(found) return true;
       if(i < maxAttempts - 1) await new Promise(r=>setTimeout(r,500));
     }
     return false;
   }

   async function initializeDraftDayAcquisitions(){
     // Sets acquisition dates for draft day players by storing in roster metadata
     // This avoids the database constraint that prevents from_slug === to_slug
     const now=new Date().toISOString();
     let needsUpdate=false;

     for(const team of teams){
       if(!team.acquisitions) team.acquisitions={};

       const allPlayerSlugs=new Set();
       ['F','D','G','B'].forEach(group=>(team.roster[group]||[]).filter(Boolean).forEach(slug=>allPlayerSlugs.add(slug)));

       for(const slug of allPlayerSlugs){
         // Check if this player has a trade record (real trades only)
         const hasTradeRecord=currentTrades.some(t=>teamTradeMatch(t,team)&&t.player_from_slug!==t.player_to_slug&&(t.player_from_slug===slug||t.player_to_slug===slug));

         // If no trade record and no acquisition date, set it to now (draft day)
         if(!hasTradeRecord && !team.acquisitions[slug]){
           team.acquisitions[slug]=now;
           needsUpdate=true;
         }
       }
     }

     if(needsUpdate){
       try{
         await saveRostersToSupabase();
       }catch(e){
         console.warn('Failed to save acquisition dates:',e.message);
       }
     }
   }

    const activeWithTenure=[...(team.roster.F||[]),...(team.roster.D||[]),...(team.roster.G||[])]

      .filter(slug=>!!getAcquiredDateForActivePlayer(team,slug))

        </div>

         <div class="hold-player">

  }

  function openTradeModal(playerSlug){
    const team=teams.find(t=>t.id===activeTeamId);
    if(!team)return;
    const p=getPlayer(playerSlug);
    if(!p)return;

    const fromSlot=findPlayerSlot(team,playerSlug);
    if(!fromSlot||fromSlot.group==='B'){alert('Player must be in active roster to trade.');return;}
    tradeContext={fromSlug:playerSlug,fromSlot,teamId:team.id,toSlug:null};
    const acquiredAt=getAcquiredDateForActivePlayer(team,playerSlug);
    const currentCap=teamMainCap(team);

    const fromInfo=document.getElementById('trade-from-info');
    fromInfo.innerHTML=`
      <strong>${escapeHtml(formatName(p.player_name))}</strong>
      <span style="color:rgba(255,255,255,0.5);"> · ${slotLabel(fromSlot.group,fromSlot.index)} · ${formatCap(p.cap_hit||0)}</span>
      <div class="player-meta" style="margin-top:4px;">${acquiredAt?`Held since ${new Date(acquiredAt).toLocaleDateString()} · `:'Held since pre-trade roster · '}Current cap ${formatCap(currentCap)}</div>
    `;

    const benchPlayers=(team.roster.B||[]).map((slug,index)=>slug?{slug,index,player:getPlayer(slug)}:null).filter(Boolean);
    const toList=document.getElementById('trade-to-list');
    const eligible=benchPlayers.filter(item=>normalizePos(item.player.position)===fromSlot.group);
    if(eligible.length){
      const grouped={F:[],D:[],G:[]};
      eligible.forEach(item=>{
        const pos=normalizePos(item.player.position);
        grouped[pos].push(item);
      });
      const labels={F:'Forwards',D:'Defensemen',G:'Goalies'};
      toList.innerHTML=['F','D','G']
        .filter(pos=>grouped[pos].length)
        .map(pos=>`<div class="bench-pos-group"><div class="bench-pos-title">${labels[pos]}</div>${grouped[pos].map(item=>`<div class="player-option" onclick="selectTradeTarget(event,'${item.slug}')"><span class="player-option-name">${escapeHtml(formatName(item.player.player_name))}</span><span class="player-option-slot">B${item.index+1}</span><span class="player-option-meta">${formatCap(item.player.cap_hit||0)} · ${poolScore(item.player)} pts</span></div>`).join('')}</div>`)
        .join('');
    }else{
      toList.innerHTML='<div class="empty-msg">No eligible bench players for this position.</div>';
    }

    updateTradePreview();
    document.getElementById('modal-trade').classList.remove('hidden');
  }

  function selectTradeTarget(ev,slug){
    if(!tradeContext) return;
    tradeContext.toSlug=slug;
    document.querySelectorAll('#trade-to-list .player-option').forEach(el=>el.classList.remove('selected'));
    ev.currentTarget.classList.add('selected');
    updateTradePreview();
  }

  function updateTradePreview(){
    const currentEl=document.getElementById('trade-cap-current');
    const afterEl=document.getElementById('trade-cap-after');
    const remainingEl=document.getElementById('trade-cap-remaining');
    const noteEl=document.getElementById('trade-preview-note');
    const btn=document.getElementById('trade-confirm-btn');
    const team=teams.find(t=>t.id===activeTeamId);
    if(!team||!tradeContext){
      btn.disabled=true;
      currentEl.textContent=afterEl.textContent=remainingEl.textContent='—';
      noteEl.textContent='Select an eligible bench player to preview the swap.';
      noteEl.className='trade-preview-note';
      return;
    }
    const currentCap=teamMainCap(team);
    currentEl.textContent=formatCap(currentCap);
    if(!tradeContext.toSlug){
      afterEl.textContent='—';
      remainingEl.textContent='—';
      btn.disabled=true;
      noteEl.textContent='Select an eligible bench player to preview the swap.';
      noteEl.className='trade-preview-note';
      return;
    }
    const fromPlayer=getPlayer(tradeContext.fromSlug,tradeContext.fromSlot.group);
    const toPlayer=getPlayer(tradeContext.toSlug,tradeContext.fromSlot.group);
    const capAfter=currentCap-(fromPlayer.cap_hit||0)+(toPlayer.cap_hit||0);
    const capRemaining=CAP_MAX-capAfter;
    afterEl.textContent=formatCap(capAfter);
    remainingEl.textContent=formatCap(capRemaining);
    if(capAfter>CAP_MAX){
      btn.disabled=true;
      noteEl.textContent=`Over cap by ${formatCap(capAfter-CAP_MAX)}. Choose a cheaper player.`;
      noteEl.className='trade-preview-note warn';
    }else{
      btn.disabled=false;
      noteEl.textContent=`Eligible ${tradeContext.fromSlot.group}-for-${tradeContext.fromSlot.group} swap. Bench salary still stays off-cap after the move.`;
      noteEl.className='trade-preview-note good';
    }
  }

  async function executeTradeRpc(team){
    const now=new Date().toISOString();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/execute_pool_trade`,{
      method:'POST',
      headers:sbHeaders(),
      body:JSON.stringify({
        p_league_code:_leagueCode,
        p_team_id:team.id,
        p_team_name:team.name,
        p_player_from_slug:tradeContext.fromSlug,
        p_player_to_slug:tradeContext.toSlug,
        p_date_traded:now
      })
    });
    if(res.ok) return true;
    const text=await res.text();
    const missingRpc=res.status===404||/execute_pool_trade|schema cache|PGRST202|Could not find the function/i.test(text);
    if(missingRpc) return false;
    throw new Error(text||`RPC trade failed (${res.status})`);
  }

  async function createTradeRecord(team,dateFromAcquired,fromPlayer,toPlayer,fromSlot,toSlot,now){
    const rows=await postWithFallback(`${SUPABASE_URL}/rest/v1/player_trades`,[
      {
        league_code:_leagueCode,
        team_id:team.id,
        team_name:team.name,
        team_name_snapshot:team.name,
        player_from_slug:tradeContext.fromSlug,
        player_to_slug:tradeContext.toSlug,
        player_from_name:formatName(fromPlayer.player_name),
        player_to_name:formatName(toPlayer.player_name),
        player_from_position:normalizePos(fromPlayer.position),
        player_to_position:normalizePos(toPlayer.position),
        player_from_team:fromPlayer.team||null,
        player_to_team:toPlayer.team||null,
        from_slot_group:fromSlot.group,
        from_slot_index:fromSlot.index,
        to_slot_group:'B',
        to_slot_index:toSlot.index,
        date_from_acquired:dateFromAcquired,
        date_traded:now,
        points_accumulated_at_trade:0
      },
      {
        league_code:_leagueCode,
        team_id:team.id,
        team_name:team.name,
        team_name_snapshot:team.name,
        player_from_slug:tradeContext.fromSlug,
        player_to_slug:tradeContext.toSlug,
        date_from_acquired:dateFromAcquired,
        date_traded:now,
        points_accumulated_at_trade:0
      }
    ]);
    return Array.isArray(rows)?rows[0]:rows;
  }

  async function executeTradeLegacy(team){
    const now=new Date().toISOString();
    const m=slugMap();
    const fromSlot=tradeContext.fromSlot||findPlayerSlot(team,tradeContext.fromSlug);
    const toSlot=findPlayerSlot(team,tradeContext.toSlug);
    if(!fromSlot||fromSlot.group==='B') throw new Error('Invalid active player slot.');
    if(!toSlot||toSlot.group!=='B') throw new Error('Incoming player must be on your bench.');
    const fromPlayer=m[tradeContext.fromSlug]||fallbackPlayer(tradeContext.fromSlug,fromSlot.group);
    const toPlayer=m[tradeContext.toSlug]||fallbackPlayer(tradeContext.toSlug,fromSlot.group);
    const dateFromAcquired=getAcquiredDateForActivePlayer(team,tradeContext.fromSlug)||now;
    const toPos=normalizePos(toPlayer.position);
    if(toPos!==fromSlot.group) throw new Error(`Position mismatch: ${toPos} cannot replace ${fromSlot.group} slot.`);
    const capAfter=teamMainCap(team)-(fromPlayer.cap_hit||0)+(toPlayer.cap_hit||0);
    if(capAfter>CAP_MAX) throw new Error(`Trade rejected: cap would be ${formatCap(capAfter)} (max ${formatCap(CAP_MAX)}).`);

    const originalRoster=JSON.parse(JSON.stringify(team.roster));
    let tradeRecordId=null;
    team.roster[fromSlot.group][fromSlot.index]=tradeContext.toSlug;
    team.roster.B[toSlot.index]=tradeContext.fromSlug;

    try{
      await saveRostersToSupabase();

      tradeRecordId=(await createTradeRecord(team,dateFromAcquired,fromPlayer,toPlayer,fromSlot,toSlot,now))?.id||null;
    }catch(e){
      team.roster=originalRoster;
      try{await saveRostersToSupabase();}catch(_){console.warn('Roster rollback failed');}
      if(tradeRecordId){
        try{await fetch(`${SUPABASE_URL}/rest/v1/player_trades?id=eq.${tradeRecordId}`,{method:'DELETE',headers:sbHeaders()});}catch(_){console.warn('Trade rollback failed');}
      }
      throw e;
    }
  }

   async function confirmTrade(){
     if(!tradeContext?.fromSlug||!tradeContext?.toSlug){alert('Please select both players');return;}
     if(isSubmittingTrade) return;
     const team=teams.find(t=>t.id===activeTeamId);
     if(!team){alert('Team not found');return;}
     const fromSlug=tradeContext.fromSlug;
     const toSlug=tradeContext.toSlug;
     const confirmBtn=document.getElementById('trade-confirm-btn');

     isSubmittingTrade=true;
     if(confirmBtn){
       confirmBtn.disabled=true;
       confirmBtn.textContent='Executing...';
     }

       try{
         const usedRpc=await executeTradeRpc(team);
         if(!usedRpc) await executeTradeLegacy(team);

         // Wait aggressively for the trade to appear
         const tradeLogged=await waitForTradeHistory(team,fromSlug,toSlug,12);
         if(!tradeLogged){
           console.warn('Trade executed but not yet visible in history. Will refresh anyway.');
         }

         closeModal();
         await load(activeTeamId);
      }catch(e){
        const msg=e?.message||'';
        const staleOutgoing=/Outgoing player is not on the active roster/i.test(msg);
        if(staleOutgoing){
          // If the first request already swapped/logged the trade, treat the second stale attempt as success.
          console.log('[Trade] Stale outgoing error - checking if trade was already logged');
          await waitForTradeHistory(team,fromSlug,toSlug,6);
          closeModal();
          await load(activeTeamId);
          return;
        }
        alert(msg||'Error executing trade');
        console.error(e);
        await load(activeTeamId);
     }finally{
       isSubmittingTrade=false;
       if(confirmBtn){
         confirmBtn.textContent='Execute Trade';
         confirmBtn.disabled=!tradeContext?.toSlug;
       }
     }
   }

  function closeModal(){
    document.getElementById('modal-trade').classList.add('hidden');
    tradeContext=null;
    document.getElementById('trade-from-info').innerHTML='';
    document.getElementById('trade-to-list').innerHTML='';
    document.getElementById('trade-confirm-btn').disabled=true;
    updateTradePreview();
  }


    load().catch(console.error);
</script>
