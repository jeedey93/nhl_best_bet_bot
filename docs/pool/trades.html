    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: #0d1b2e; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 2rem; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-family: 'Bebas Neue', cursive; font-size: 1.4rem; letter-spacing: 3px; color: white; margin-bottom: 1.5rem; }
    .modal-title span { color: var(--gold); }

    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 2px; color: var(--silver); margin-bottom: 0.5rem; }
    .form-input, .form-select { width: 100%; font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color: white; border-radius: 6px; padding: 0.6rem 0.85rem; outline: none; transition: border-color 0.15s; }

    .modal-btn-confirm { background: rgba(255,184,28,0.12); border-color: rgba(255,184,28,0.35); color: var(--gold); }

    .modal-btn-cancel { background: none; border-color: rgba(255,255,255,0.12); color: var(--silver); }
    .modal-btn-cancel:hover { background: rgba(255,255,255,0.06); }

    .empty-msg { text-align: center; color: var(--silver); padding: 2rem 1rem; font-size: 0.95rem; letter-spacing: 1px; }

    .msg { text-align: center; color: var(--silver); font-size: 0.9rem; letter-spacing: 1px; padding: 3rem 0; }
    .btn-refresh { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: var(--silver); border-radius: 6px; padding: 4px 14px; cursor: pointer; }

      .hold-card { flex-direction: column; align-items: flex-start; }
      .hold-stats { width: 100%; }
    }

    #pw-gate { position:fixed;inset:0;z-index:9999;background:var(--rink);display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(26,58,110,0.6) 0%,transparent 70%); }
    .pw-box { background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:2.5rem 2rem;width:320px;max-width:90vw;text-align:center; }
    .pw-box h2 { font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--gold);letter-spacing:3px;margin-bottom:0.3rem; }
    .pw-box p { color:var(--silver);font-size:0.85rem;letter-spacing:1px;margin-bottom:1.5rem; }
    .pw-input { width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:0.7rem 1rem;color:white;font-size:1rem;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;outline:none;text-align:center;transition:border-color 0.2s; }
    .pw-input:focus { border-color:rgba(255,184,28,0.5); }
    .pw-input.error { border-color:rgba(200,16,46,0.7);animation:pw-shake 0.3s; }
    @keyframes pw-shake { 0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);} }
    .pw-btn { margin-top:1rem;width:100%;background:var(--red);color:white;border:none;border-radius:8px;padding:0.75rem;font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:3px;cursor:pointer;transition:background 0.2s; }
    .pw-btn:hover { background:#e0122e; }
    .pw-error { color:rgba(200,16,46,0.8);font-size:0.8rem;margin-top:0.5rem;min-height:1em;letter-spacing:1px; }
  </style>
</head>
<body>

<div id="pw-gate">
  <div class="pw-box">
    <h2>🏒 Hockey Pool</h2>
    <p>ENTER PASSWORD TO CONTINUE</p>
    <input id="pw-input" class="pw-input" type="password" placeholder="Password" autocomplete="off">
    <button class="pw-btn" onclick="checkPw()">ENTER</button>
    <div class="pw-error" id="pw-error"></div>
  </div>
</div>
<script>
  (function(){
    if(sessionStorage.getItem('pool_auth')==='1') document.getElementById('pw-gate').style.display='none';
    document.getElementById('pw-input').addEventListener('keydown',e=>{ if(e.key==='Enter') checkPw(); });
  })();
  function checkPw(){
    const i=document.getElementById('pw-input'),e=document.getElementById('pw-error');
    if(i.value==='parieur2026'){ sessionStorage.setItem('pool_auth','1'); document.getElementById('pw-gate').style.display='none'; }
    else { i.classList.add('error'); e.textContent='Incorrect password.'; setTimeout(()=>i.classList.remove('error'),400); i.value=''; i.focus(); }
  }
</script>

<script>
  const SUPABASE_URL = 'https://fifurqlitkywtmhgtzeu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';
  const CAP_MAX = 95_500_000;

  const TEAM_ABBR = {
    'anaheim-ducks':'ANA','boston-bruins':'BOS','buffalo-sabres':'BUF','calgary-flames':'CGY',
    'carolina-hurricanes':'CAR','chicago-blackhawks':'CHI','colorado-avalanche':'COL',
    'columbus-blue-jackets':'CBJ','dallas-stars':'DAL','detroit-red-wings':'DET',
    'edmonton-oilers':'EDM','florida-panthers':'FLA','los-angeles-kings':'LAK',
    'minnesota-wild':'MIN','montreal-canadiens':'MTL','nashville-predators':'NSH',
    'new-jersey-devils':'NJD','new-york-islanders':'NYI','new-york-rangers':'NYR',
    'ottawa-senators':'OTT','philadelphia-flyers':'PHI','pittsburgh-penguins':'PIT',
    'san-jose-sharks':'SJS','seattle-kraken':'SEA','st-louis-blues':'STL',
    'tampa-bay-lightning':'TBL','toronto-maple-leafs':'TOR','utah-hockey-club':'UTA',
    'vancouver-canucks':'VAN','vegas-golden-knights':'VGK','washington-capitals':'WSH','winnipeg-jets':'WPG',
  };

  const _leagueCode = new URLSearchParams(window.location.search).get('league')||null;
  if (!_leagueCode) window.location.replace('/pool');

  let allPlayers=[], teams=[], activeTeamId=null;
  let _scoring={f_points:1,d_goals:1,d_assists:1,g_wins:2,g_shutouts:3};
  let currentHolds=[], currentTrades=[];

  document.getElementById('nav-draft').href       = `/pool/join?league=${_leagueCode}`;
  document.getElementById('nav-live-draft').href  = `/pool/live-draft?league=${_leagueCode}`;
  document.getElementById('nav-standings').href   = `/pool/standings?league=${_leagueCode}`;
  document.getElementById('nav-trades').href      = `/pool/trades?league=${_leagueCode}`;
  document.getElementById('nav-settings').href    = `/pool/settings?league=${_leagueCode}`;

  function normalizePos(pos){if(!pos)return'F';const p=pos.toUpperCase();if(p.includes('G'))return'G';if(p==='D'||p.includes('LD')||p.includes('RD'))return'D';return'F';}
  function poolScore(p){const pos=normalizePos(p.position);if(pos==='G')return(p.wins??0)*_scoring.g_wins+(p.shutouts??0)*_scoring.g_shutouts;if(pos==='D')return(p.goals??0)*_scoring.d_goals+(p.assists??0)*_scoring.d_assists;return(p.points??0)*_scoring.f_points;}
  function formatName(n){if(!n)return'';if(n.includes(',')){const[l,f]=n.split(',').map(s=>s.trim());return`${f} ${l}`;}return n;}
  function slugMap(){if(!slugMap._c)slugMap._c=Object.fromEntries(allPlayers.map(p=>[p.puckpedia_slug,p]));return slugMap._c;}
  function sbHeaders(extra={}){return{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',...extra};}
  function teamMainCap(team){
    const m=slugMap();
    return [...(team.roster.F||[]),...(team.roster.D||[]),...(team.roster.G||[])]
      .filter(Boolean)
      .reduce((sum,slug)=>sum+(m[slug]?.cap_hit||0),0);
  }
  function findPlayerSlot(team,slug){
    for(const group of ['F','D','G','B']){
      const idx=(team.roster[group]||[]).findIndex(s=>s===slug);
      if(idx!==-1) return {group,index:idx};
    }
    return null;
  }
  async function saveRostersToSupabase(){
    const data={teams,activeTeamId};
    const res=await fetch(`${SUPABASE_URL}/rest/v1/pool_rosters`,{
      method:'POST',
      headers:sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify({league_code:_leagueCode,data,updated_at:new Date().toISOString()}),
    });
    if(!res.ok) throw new Error(`Failed to persist roster (${res.status})`);
  }

  async function loadScoringSettings(){
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/pool_settings?league_code=eq.${_leagueCode}&select=f_points,d_goals,d_assists,g_wins,g_shutouts`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
      if(r.ok){const rows=await r.json();if(rows.length)_scoring={..._scoring,...rows[0]};}
    }catch(e){}
  }

  async function load(){
    await loadScoringSettings();
    try{
      const cached=sessionStorage.getItem('hp_players_v2');
      if(cached){
        try{allPlayers=JSON.parse(cached);if(!Array.isArray(allPlayers)||!allPlayers.length)throw new Error('empty');}
        catch(_){sessionStorage.removeItem('hp_players_v2');allPlayers=[];}
      }
      if(!allPlayers.length){
        const res=await fetch(`${SUPABASE_URL}/rest/v1/nhl_players?select=puckpedia_slug,player_name,position,cap_hit,team,goals,assists,points,wins,shutouts,games_played&order=cap_hit.desc&limit=1000`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
        if(!res.ok)throw new Error(res.status);
        allPlayers=await res.json();
        sessionStorage.setItem('hp_players_v2',JSON.stringify(allPlayers));
      }
      slugMap._c=null;

      const rRes=await fetch(`${SUPABASE_URL}/rest/v1/pool_rosters?league_code=eq.${_leagueCode}&select=*`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
      if(!rRes.ok)throw new Error(rRes.status);
      const allRosterRows=await rRes.json();
      if(!allRosterRows.length){document.getElementById('content').innerHTML='<div class="msg">No teams saved yet. Go build your pool!</div>';return;}

      // Create teams array - using first roster row which contains all teams
      const firstRow=allRosterRows[0];
      teams=[];
      if(firstRow.data?.teams){
        firstRow.data.teams.forEach((t,idx)=>{
          teams.push({
            id:t.id||`team-${idx}`,
            name:t.name||`Team ${idx+1}`,
            roster:{
              F:Array.isArray(t.roster?.F)?t.roster.F:Array(12).fill(null),
              D:Array.isArray(t.roster?.D)?t.roster.D:Array(6).fill(null),
              G:Array.isArray(t.roster?.G)?t.roster.G:Array(2).fill(null),
              B:Array.isArray(t.roster?.B)?t.roster.B:Array(6).fill(null)
            }
          });
        });
      }

       activeTeamId=teams[0]?.id;

       await loadHolds();
       await loadTrades();
       await initializeHoldsForRoster();
       await loadHolds();
       renderTeamSelector();
       render();
    }catch(e){console.error(e);document.getElementById('content').innerHTML=`<div class="msg">Failed to load. <button class="btn-refresh" onclick="location.reload()">Retry</button></div>`;}
  }

  async function loadHolds(){
    try{
      const res=await fetch(`${SUPABASE_URL}/rest/v1/player_holds?league_code=eq.${_leagueCode}`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
      if(res.ok) currentHolds=await res.json();
    }catch(e){}
  }

  async function loadTrades(){
    try{
      const res=await fetch(`${SUPABASE_URL}/rest/v1/player_trades?league_code=eq.${_leagueCode}`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
      if(res.ok) currentTrades=await res.json();
    }catch(e){}
  }

  async function initializeHoldsForRoster(){
    // Auto-create holds for all main roster players (F, D, G) if not already held
    if(!activeTeamId) return; // Safety check
    try{
      const m=slugMap();
      const existingHoldKeys=new Set(currentHolds.map(h=>`${h.team_name}::${h.player_slug}`));

      // Only process active team to avoid duplication issues
      const team=teams.find(t=>t.id===activeTeamId);
      if(!team) return;

      const mainRosterPlayers=[
        ...(team.roster.F||[]),
        ...(team.roster.D||[]),
        ...(team.roster.G||[])
      ].filter(Boolean);

      for(const slug of mainRosterPlayers){
        // Skip if already held or player not found
        const holdKey=`${team.name}::${slug}`;
        if(existingHoldKeys.has(holdKey)||!m[slug]) continue;

        const now=new Date().toISOString();
        const hold={
          league_code:_leagueCode,
            team_name:team.name,
          player_slug:slug,
          date_acquired:now,
          points_accumulated:0
        };

        try{
          const res=await fetch(`${SUPABASE_URL}/rest/v1/player_holds`,{
            method:'POST',
            headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},
            body:JSON.stringify(hold)
          });

          if(res.ok){
            try{
              const created=await res.json();
              const holdRecord=Array.isArray(created)?created[0]:created;
              currentHolds.push(holdRecord);
              existingHoldKeys.add(holdKey);
            }catch(parseErr){
              console.warn('Error parsing response for hold creation',parseErr);
              // If response is empty, assume it worked (some APIs return empty on success)
              existingHoldKeys.add(holdKey);
            }
          }else if(res.status===409){
            // Conflict - likely unique constraint, just mark as existing
            existingHoldKeys.add(holdKey);
          }else{
            const errText=await res.text();
            console.warn(`Failed to create hold for ${slug}: ${res.status}`,errText);
          }
        }catch(holdErr){
          console.warn(`Exception creating hold for ${slug}:`,holdErr);
        }
      }
    }catch(e){
      console.error('Error initializing holds:',e);
    }
  }

  function renderTeamSelector(){
    const html=teams.map(t=>`<button class="team-btn ${t.id===activeTeamId?'active':''}" onclick="setActiveTeam('${t.id}')">${t.name}</button>`).join('');
    document.getElementById('team-selector').innerHTML=html;
  }

  async function setActiveTeam(teamId){
    activeTeamId=teamId;
    await initializeHoldsForRoster();
    await loadHolds();
    renderTeamSelector();
    render();
  }

  function buildHoldCard(hold,p){
    const daysHeld=Math.floor((new Date()-new Date(hold.date_acquired))/86400000);
    const pts=poolScore(p);
    const abbr=TEAM_ABBR[p.team]||'';
    return `
      <div class="hold-card">
        <div class="hold-player">
          ${abbr?`<img class="player-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">`:''}
          <div class="hold-info">
            <div class="hold-name">${formatName(p.player_name)}</div>
            <div class="hold-since">Acquired: ${new Date(hold.date_acquired).toLocaleDateString()}</div>
          </div>
        </div>
        <div class="hold-stats">
          <div class="hold-stat"><div class="hold-stat-label">Days Held</div><div class="hold-stat-value">${daysHeld}</div></div>
          <div class="hold-stat"><div class="hold-stat-label">Accumul. Points</div><div class="hold-stat-value">${hold.points_accumulated||0}</div></div>
          <div class="hold-stat"><div class="hold-stat-label">Current Pts</div><div class="hold-stat-value">${pts}</div></div>
        </div>
        <div class="hold-actions">
          <button class="btn-small btn-trade" onclick="openTradeModal('${hold.player_slug}')">🔄 Trade</button>
        </div>
      </div>
    `;
  }

  function buildBenchCard(p){
    const abbr=TEAM_ABBR[p.team]||'';
    const pts=poolScore(p);
    return `
      <div class="hold-card">
        <div class="hold-player">
          ${abbr?`<img class="player-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">`:''}
          <div class="hold-info">
            <div class="hold-name">${formatName(p.player_name)}</div>
            <div class="hold-since">Bench player · Not accumulating while on bench</div>
          </div>
        </div>
        <div class="hold-stats">
          <div class="hold-stat"><div class="hold-stat-label">Current Pts</div><div class="hold-stat-value">${pts}</div></div>
        </div>
      </div>
    `;
  }

  function render(){
    const team=teams.find(t=>t.id===activeTeamId);
    if(!team){document.getElementById('content').innerHTML='<div class="msg">Team not found.</div>';return;}

    const teamHolds=currentHolds.filter(h=>h.team_name===team.name);
    const teamTrades=currentTrades.filter(t=>t.team_name===team.name);
    const m=slugMap();

    let html=`
      <div class="section-title">Active <span>Roster</span></div>
      <div class="current-holds">
    `;

    if(teamHolds.length){
      const grouped={F:[],D:[],G:[]};
      teamHolds.forEach(hold=>{
        const p=m[hold.player_slug];
        if(!p) return;
        const slot=findPlayerSlot(team,hold.player_slug);
        const pos=slot&&slot.group!=='B'?slot.group:normalizePos(p.position);
        (grouped[pos]||(grouped[pos]=[])).push({hold,p});
      });
      const labels={F:'Forwards',D:'Defensemen',G:'Goalies'};
      ['F','D','G'].forEach(pos=>{
        if(!grouped[pos]||!grouped[pos].length) return;
        html+=`<div class="hold-pos-group"><div class="hold-pos-title ${pos}">${labels[pos]} (${grouped[pos].length})</div>${grouped[pos].map(item=>buildHoldCard(item.hold,item.p)).join('')}</div>`;
      });
    }else{
      html+='<div class="empty-msg">No active roster players found.</div>';
    }
    html+='</div>';

    const benchPlayers=(team.roster.B||[]).filter(Boolean).map(slug=>m[slug]).filter(Boolean);
    html+=`
      <div class="section-title">Team <span>Bench</span></div>
      <div class="current-holds">
    `;
    if(benchPlayers.length){
      const benchGrouped={F:[],D:[],G:[]};
      benchPlayers.forEach(p=>{ benchGrouped[normalizePos(p.position)].push(p); });
      const labels={F:'Forwards',D:'Defensemen',G:'Goalies'};
      ['F','D','G'].forEach(pos=>{
        if(!benchGrouped[pos].length) return;
        html+=`<div class="hold-pos-group"><div class="hold-pos-title ${pos}">${labels[pos]} (${benchGrouped[pos].length})</div>${benchGrouped[pos].map(p=>buildBenchCard(p)).join('')}</div>`;
      });
    }else{
      html+='<div class="empty-msg">No bench players.</div>';
    }
    html+='</div>';

    html+=`
      <div class="section-title">Trade <span>History</span></div>
      <div class="trades-list">
    `;

    if(teamTrades.length){
      html+=`
        <div class="trade-header-row">
          <div class="trade-header-cell">From Player</div>
          <div class="trade-header-cell">Date Traded</div>
          <div class="trade-header-cell">To Player</div>
          <div class="trade-header-cell">Pts Saved</div>
        </div>
      `;
      teamTrades.forEach(trade=>{
        const pFrom=m[trade.player_from_slug];
        const pTo=m[trade.player_to_slug];
        if(!pFrom||!pTo)return;
        const fromsaved=trade.points_accumulated_at_trade||0;
        const abbrFrom=TEAM_ABBR[pFrom.team]||'';
        const abbrTo=TEAM_ABBR[pTo.team]||'';
        html+=`
          <div class="trade-row">
            <div class="player-info">
              ${abbrFrom?`<img class="player-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbrFrom}_dark.svg" alt="${abbrFrom}">`:''}
              <div class="player-details">
                <div class="player-name">${formatName(pFrom.player_name)}</div>
                <div class="player-meta">Since ${new Date(trade.date_from_acquired).toLocaleDateString()}</div>
              </div>
            </div>
            <div class="date-box">
              <span class="date-label">Traded</span>
              <span class="date-value">${new Date(trade.date_traded).toLocaleDateString()}</span>
            </div>
            <div class="player-info">
              ${abbrTo?`<img class="player-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbrTo}_dark.svg" alt="${abbrTo}">`:''}
              <div class="player-details">
                <div class="player-name">${formatName(pTo.player_name)}</div>
                <div class="player-meta">Bench player</div>
              </div>
            </div>
            <div class="points-unit">
              <span class="points-label">Saved</span>
              <span class="points-value">${fromsaved}</span>
            </div>
          </div>
        `;
      });
    }else{
      html+='<div class="empty-msg">No trades yet.</div>';
    }
    html+='</div>';

    document.getElementById('content').innerHTML=html;
  }

  function openTradeModal(playerSlug){
    const team=teams.find(t=>t.id===activeTeamId);
    if(!team)return;
    const m=slugMap();
    const p=m[playerSlug];
    if(!p)return;

    const fromSlot=findPlayerSlot(team,playerSlug);
    if(!fromSlot||fromSlot.group==='B'){alert('Player must be in active roster to trade.');return;}
    window.tradeFromSlug=playerSlug;
    window.tradeFromDate=currentHolds.find(h=>h.player_slug===playerSlug&&h.team_name===team.name)?.date_acquired;
    window.tradeFromSlot=fromSlot;

    const fromInfo=document.getElementById('trade-from-info');
    fromInfo.innerHTML=`
      <strong>${formatName(p.player_name)}</strong>
      <span style="color:rgba(255,255,255,0.5);">· ${formatName(p.player_name)}</span>
    `;

    const benchPlayers=team.roster.B.filter(Boolean);
    const toList=document.getElementById('trade-to-list');
    if(benchPlayers.length){
      const grouped={F:[],D:[],G:[]};
      benchPlayers.forEach(slug=>{
        const bp=m[slug];
        if(!bp) return;
        const pos=normalizePos(bp.position);
        grouped[pos].push({slug,bp});
      });
      const labels={F:'Forwards',D:'Defensemen',G:'Goalies'};
      toList.innerHTML=['F','D','G']
        .filter(pos=>grouped[pos].length)
        .map(pos=>`<div class="bench-pos-group"><div class="bench-pos-title">${labels[pos]}</div>${grouped[pos].map(item=>`<div class="player-option" onclick="selectTradeTarget(event,'${item.slug}')"><span class="player-option-name">${formatName(item.bp.player_name)}</span><span class="player-option-slot">${pos}</span></div>`).join('')}</div>`)
        .join('');
    }else{
      toList.innerHTML='<div class="empty-msg">No bench players available.</div>';
    }

    document.getElementById('modal-trade').classList.remove('hidden');
  }

  function selectTradeTarget(ev,slug){
    window.tradeToSlug=slug;
    document.querySelectorAll('#trade-to-list .player-option').forEach(el=>el.classList.remove('selected'));
    ev.currentTarget.classList.add('selected');
  }

  async function confirmTrade(){
    if(!window.tradeFromSlug||!window.tradeToSlug){alert('Please select both players');return;}
    const team=teams.find(t=>t.id===activeTeamId);
    if(!team){alert('Team not found');return;}
    const hold=currentHolds.find(h=>h.player_slug===window.tradeFromSlug&&h.team_name===team.name);
    if(!hold){alert('Hold not found');return;}

    try{
      const accumulatedPts=hold.points_accumulated||0;
      const now=new Date().toISOString();
      const m=slugMap();
      const fromSlot=window.tradeFromSlot||findPlayerSlot(team,window.tradeFromSlug);
      const toSlot=findPlayerSlot(team,window.tradeToSlug);
      if(!fromSlot||fromSlot.group==='B'){alert('Invalid active player slot.');return;}
      if(!toSlot||toSlot.group!=='B'){alert('Incoming player must be on your bench.');return;}

      const toPos=normalizePos(m[window.tradeToSlug]?.position);
      if(toPos!==fromSlot.group){
        alert(`Position mismatch: ${toPos} cannot replace ${fromSlot.group} slot.`);
        return;
      }

      const currentCap=teamMainCap(team);
      const fromCap=m[window.tradeFromSlug]?.cap_hit||0;
      const toCap=m[window.tradeToSlug]?.cap_hit||0;
      const capAfter=currentCap-fromCap+toCap;
      if(capAfter>CAP_MAX){
        alert(`Trade rejected: cap would be $${(capAfter/1e6).toFixed(2)}M (max $${(CAP_MAX/1e6).toFixed(1)}M).`);
        return;
      }

      const rosterSnapshot=JSON.stringify(team.roster);
      team.roster[fromSlot.group][fromSlot.index]=window.tradeToSlug;
      team.roster.B[toSlot.index]=window.tradeFromSlug;
      await saveRostersToSupabase();

      const tradeData={
        league_code:_leagueCode,
        team_name:team.name,
        player_from_slug:window.tradeFromSlug,
        player_to_slug:window.tradeToSlug,
        date_from_acquired:hold.date_acquired,
        date_traded:now,
        points_accumulated_at_trade:accumulatedPts
      };

      const tradeRes=await fetch(`${SUPABASE_URL}/rest/v1/player_trades`,{
        method:'POST',
        headers:sbHeaders(),
        body:JSON.stringify(tradeData)
      });
      if(!tradeRes.ok) throw new Error('Failed to write trade history');

      const delRes=await fetch(`${SUPABASE_URL}/rest/v1/player_holds?id=eq.${hold.id}`,{
        method:'DELETE',
        headers:sbHeaders()
      });
      if(!delRes.ok) throw new Error('Failed to remove previous hold');

      const newHold={
        league_code:_leagueCode,
        team_name:team.name,
        player_slug:window.tradeToSlug,
        date_acquired:now,
        points_accumulated:0
      };
      const holdRes=await fetch(`${SUPABASE_URL}/rest/v1/player_holds`,{
        method:'POST',
        headers:sbHeaders(),
        body:JSON.stringify(newHold)
      });
      if(!holdRes.ok) throw new Error('Failed to create new hold');

      closeModal();
      await loadHolds();
      await loadTrades();
      render();
    }catch(e){
      alert('Error executing trade');
      console.error(e);
      // Reload latest roster state from source of truth on failure.
      await load();
    }
  }

  async function releaseHold(holdId){
    if(!confirm('Release this hold? Accumulated points will be lost.'))return;
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/player_holds?id=eq.${holdId}`,{
        method:'DELETE',
        headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
      });
      await loadHolds();
      render();
    }catch(e){alert('Error releasing hold');console.error(e);}
  }

  function closeModal(){
    document.getElementById('modal-trade').classList.add('hidden');
    document.getElementById('modal-hold').classList.add('hidden');
    window.tradeFromSlug=null;
    window.tradeToSlug=null;
  }

  load().catch(console.error);
</script>
</body>
</html>
