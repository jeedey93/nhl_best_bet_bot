<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Proposals</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --rink:   #07111f;
          --gold:   #ffb81c;
          --pink:   #ff7a8a;
          --blue:   #7db4ff;
          --green:  #22c55e;
          --amber:  #f59e0b;
          --silver: rgba(255,255,255,0.5);
          --dim:    rgba(255,255,255,0.08);
          --panel:  rgba(255,255,255,0.035);
        }

        body {
          background: var(--rink);
          background-image: radial-gradient(ellipse 80% 40% at 50% -5%, rgba(26,58,110,0.55) 0%, transparent 65%);
          min-height: 100vh;
          font-family: 'Barlow Condensed', sans-serif;
          color: #fff;
          padding: 24px 16px 48px;
        }

        .shell { max-width: 940px; margin: 0 auto; }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

        /* ═══════════════════════════════════════
           TOP BAR
        ═══════════════════════════════════════ */
        .topbar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 20px;
          gap: 12px;
          flex-wrap: wrap;
        }

        /* Team badge */
        .team-badge {
          display: flex;
          align-items: center;
          gap: 9px;
          background: rgba(255,255,255,0.04);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 9px;
          padding: 6px 12px 6px 7px;
          cursor: pointer;
          transition: background 0.15s, border-color 0.15s;
          position: relative;
        }
        .team-badge:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.18); }
        .team-avatar {
          width: 28px; height: 28px; border-radius: 7px;
          background: rgba(255,184,28,0.18); border: 1px solid rgba(255,184,28,0.3);
          display: flex; align-items: center; justify-content: center;
          font-family: 'Bebas Neue', cursive; font-size: 11px; letter-spacing: 0.5px; color: var(--gold);
        }
        .team-badge-text {}
        .team-badge-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.3); line-height: 1; margin-bottom: 2px; }
        .team-badge-name { font-family: 'Bebas Neue', cursive; font-size: 14px; letter-spacing: 1px; line-height: 1; }
        .team-badge-chevron { font-size: 9px; color: rgba(255,255,255,0.25); margin-left: 3px; transition: transform 0.15s; }
        .team-badge.open .team-badge-chevron { transform: rotate(180deg); }

        /* Team dropdown */
        .team-dropdown {
          position: absolute;
          top: calc(100% + 5px);
          left: 0;
          min-width: 200px;
          background: rgba(10,20,36,0.98);
          border: 1px solid rgba(255,255,255,0.12);
          border-radius: 10px;
          padding: 6px;
          z-index: 100;
          display: none;
          backdrop-filter: blur(16px);
        }
        .team-badge.open .team-dropdown { display: block; }
        .td-item {
          display: flex; align-items: center; gap: 8px;
          padding: 7px 10px; border-radius: 6px;
          font-family: 'Bebas Neue', cursive; font-size: 13px; letter-spacing: 1px;
          color: rgba(255,255,255,0.55); cursor: pointer; transition: all 0.12s;
        }
        .td-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .td-item.active { color: var(--gold); }
        .td-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.15); flex-shrink: 0; }
        .td-dot.active { background: rgba(255,184,28,0.6); }

        /* View tabs */
        .view-tabs {
          display: flex;
          background: rgba(255,255,255,0.04);
          border: 1px solid rgba(255,255,255,0.08);
          border-radius: 9px;
          padding: 3px;
          gap: 3px;
        }
        .vtab {
          font-family: 'Bebas Neue', cursive; font-size: 13px; letter-spacing: 1.5px;
          padding: 6px 18px; border-radius: 7px;
          cursor: pointer; border: none; background: transparent;
          color: rgba(255,255,255,0.35); transition: all 0.15s;
          position: relative;
        }
        .vtab:hover { color: rgba(255,255,255,0.7); }
        .vtab.active { background: rgba(255,255,255,0.07); color: #fff; }
        .vtab-badge {
          position: absolute; top: 3px; right: 6px;
          width: 6px; height: 6px; border-radius: 50%;
          background: var(--gold); display: none;
        }

        /* ═══════════════════════════════════════
           BUILD VIEW
        ═══════════════════════════════════════ */
        .section-label {
          font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase;
          color: rgba(255,255,255,0.28); margin-bottom: 9px;
        }

        /* Target pills */
        .target-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .tpill {
          font-family: 'Bebas Neue', cursive; font-size: 13px; letter-spacing: 1px;
          padding: 5px 15px; border-radius: 20px;
          border: 1px solid rgba(255,255,255,0.1);
          color: rgba(255,255,255,0.4); background: transparent;
          cursor: pointer; transition: all 0.15s;
        }
        .tpill:hover { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.8); }
        .tpill.sel { background: rgba(255,184,28,0.1); border-color: rgba(255,184,28,0.4); color: var(--gold); }

        /* Split panels */
        .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        @media (max-width: 560px) { .panels { grid-template-columns: 1fr; } }

        .panel {
          background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
          border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
        }

        .panel-head {
          display: flex; align-items: center; gap: 7px;
          padding: 10px 13px 9px;
          border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .panel-title { font-family: 'Bebas Neue', cursive; font-size: 14px; letter-spacing: 1.5px; }
        .panel-title.offer { color: var(--pink); }
        .panel-title.req   { color: var(--blue); }
        .panel-sel-count {
          font-size: 10px; letter-spacing: 1px;
          background: rgba(255,255,255,0.06); border-radius: 20px;
          padding: 2px 8px; color: rgba(255,255,255,0.4);
          margin-left: auto;
        }
        .panel-sel-count.has-offer { background: rgba(255,122,138,0.12); color: var(--pink); }
        .panel-sel-count.has-req   { background: rgba(125,180,255,0.12); color: var(--blue); }

        /* Toolbar: pos chips + search in one row */
        .panel-toolbar {
          display: flex; align-items: center; gap: 5px;
          padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .pchip {
          font-family: 'Bebas Neue', cursive; font-size: 10px; letter-spacing: 1px;
          padding: 3px 9px; border-radius: 4px;
          border: 1px solid rgba(255,255,255,0.08);
          color: rgba(255,255,255,0.32); background: transparent;
          cursor: pointer; transition: all 0.12s; flex-shrink: 0;
        }
        .pchip.a-all { border-color: rgba(255,255,255,0.2);  color: rgba(255,255,255,0.7);  background: rgba(255,255,255,0.05); }
        .pchip.a-F   { border-color: rgba(255,122,138,0.4);  color: var(--pink);  background: rgba(255,122,138,0.08); }
        .pchip.a-D   { border-color: rgba(125,180,255,0.4);  color: var(--blue);  background: rgba(125,180,255,0.08); }
        .pchip.a-G   { border-color: rgba(255,184,28,0.4);   color: var(--gold);  background: rgba(255,184,28,0.08); }

        .panel-search {
          flex: 1; display: flex; align-items: center;
          background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
          border-radius: 6px; padding: 0 8px; gap: 5px;
        }
        .search-ico { font-size: 11px; color: rgba(255,255,255,0.2); }
        .panel-search input {
          flex: 1; background: transparent; border: none; outline: none;
          color: #fff; font-family: 'Barlow Condensed', sans-serif;
          font-size: 12px; padding: 4px 0; letter-spacing: 0.3px;
        }
        .panel-search input::placeholder { color: rgba(255,255,255,0.2); }

        /* Player list */
        .player-list { flex: 1; overflow-y: auto; max-height: 280px; }
        .pr {
          display: grid; grid-template-columns: 17px 1fr auto 34px;
          gap: 8px; align-items: center;
          padding: 7px 13px; border-bottom: 1px solid rgba(255,255,255,0.03);
          cursor: pointer; transition: background 0.1s;
        }
        .pr:last-child { border-bottom: none; }
        .pr:hover { background: rgba(255,255,255,0.025); }
        .pr.s-offer { background: rgba(255,122,138,0.07); border-left: 2px solid rgba(255,122,138,0.5); padding-left: 11px; }
        .pr.s-req   { background: rgba(125,180,255,0.07); border-left: 2px solid rgba(125,180,255,0.5); padding-left: 11px; }
        .pr.on-block:not(.s-offer):not(.s-req) { border-left: 2px solid rgba(245,158,11,0.4); padding-left: 11px; }

        .pr-check {
          width: 16px; height: 16px; border-radius: 4px;
          border: 1px solid rgba(255,255,255,0.15);
          display: flex; align-items: center; justify-content: center;
          font-size: 8px; flex-shrink: 0; transition: all 0.12s;
        }
        .s-offer .pr-check { background: var(--pink); border-color: var(--pink); color: var(--rink); }
        .s-req   .pr-check { background: var(--blue); border-color: var(--blue); color: var(--rink); }

        .pr-info {}
        .pr-name {
          font-family: 'Bebas Neue', cursive; font-size: 14px; letter-spacing: 0.8px;
          line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pr-meta { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 1px; }

        .pos-tag {
          font-family: 'Bebas Neue', cursive; font-size: 10px; letter-spacing: 0.8px;
          padding: 2px 5px; border-radius: 3px; text-align: center;
        }
        .pos-tag.F { background: rgba(255,122,138,0.14); color: var(--pink); }
        .pos-tag.D { background: rgba(125,180,255,0.14); color: var(--blue); }
        .pos-tag.G { background: rgba(255,184,28,0.14);  color: var(--gold); }

        .block-tag {
          display: inline; font-family: 'Bebas Neue', cursive; font-size: 9px; letter-spacing: 1px;
          color: var(--amber); background: rgba(245,158,11,0.12);
          border: 1px solid rgba(245,158,11,0.22);
          border-radius: 3px; padding: 0 4px; margin-left: 5px; vertical-align: middle;
        }

        .pr-pts { font-family: 'Bebas Neue', cursive; font-size: 14px; color: var(--gold); text-align: right; }

        .panel-empty {
          padding: 2rem 1rem; text-align: center;
          font-size: 12px; color: rgba(255,255,255,0.2); letter-spacing: 0.4px; line-height: 1.6;
        }

        /* ═══════════════════════════════════════
           SUMMARY BAR
        ═══════════════════════════════════════ */
        .summary-bar {
          background: rgba(255,255,255,0.03);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 12px; padding: 13px 15px;
          transition: border-color 0.2s;
        }
        .summary-bar.has-content { border-color: rgba(255,255,255,0.14); }

        .sb-top { display: grid; grid-template-columns: 1fr 32px 1fr; gap: 8px; align-items: start; margin-bottom: 11px; }
        .sb-side-label {
          font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
          margin-bottom: 6px;
        }
        .sb-side-label.offer { color: rgba(255,122,138,0.6); }
        .sb-side-label.req   { color: rgba(125,180,255,0.6); }

        .sb-chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; }
        .sb-chip {
          display: inline-flex; align-items: center; gap: 4px;
          font-family: 'Bebas Neue', cursive; font-size: 11px; letter-spacing: 0.8px;
          padding: 3px 9px; border-radius: 20px;
          cursor: pointer; max-width: 150px; overflow: hidden; transition: all 0.12s;
        }
        .sb-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sb-chip-x { opacity: 0.5; font-size: 9px; flex-shrink: 0; }
        .sb-chip.offer { background: rgba(255,122,138,0.1); border: 1px solid rgba(255,122,138,0.25); color: var(--pink); }
        .sb-chip.offer:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); }
        .sb-chip.req   { background: rgba(125,180,255,0.1); border: 1px solid rgba(125,180,255,0.25); color: var(--blue); }
        .sb-chip.req:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color: #f87171; }
        .sb-hint { font-size: 11px; color: rgba(255,255,255,0.2); font-style: italic; padding: 3px 0; }

        .sb-arrow { display: flex; align-items: center; justify-content: center; padding-top: 20px; font-size: 17px; color: rgba(255,255,255,0.14); }

        .sb-actions { display: flex; align-items: center; gap: 8px; }
        .sb-note {
          flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
          border-radius: 7px; color: #fff; font-family: 'Barlow Condensed', sans-serif;
          font-size: 12px; padding: 7px 10px; outline: none; transition: border-color 0.15s;
        }
        .sb-note:focus { border-color: rgba(255,184,28,0.35); }
        .sb-note::placeholder { color: rgba(255,255,255,0.2); }

        .btn-clear {
          font-family: 'Bebas Neue', cursive; font-size: 12px; letter-spacing: 1.5px;
          background: transparent; color: rgba(255,255,255,0.38);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 7px; padding: 7px 13px; cursor: pointer;
          transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
        }
        .btn-clear:hover { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.75); }

        .btn-send {
          font-family: 'Bebas Neue', cursive; font-size: 12px; letter-spacing: 2px;
          background: var(--gold); color: var(--rink); border: none;
          border-radius: 7px; padding: 8px 20px; cursor: pointer;
          transition: background 0.15s; white-space: nowrap; flex-shrink: 0;
        }
        .btn-send:hover { background: #ffd04d; }
        .btn-send:disabled { background: rgba(255,184,28,0.2); color: rgba(255,255,255,0.25); cursor: not-allowed; }

        /* ═══════════════════════════════════════
           FEED VIEW
        ═══════════════════════════════════════ */
        .feed-toprow {
          display: flex; align-items: center; justify-content: space-between;
          margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
        }
        .feed-count { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.3); }

        .feed-filters { display: flex; gap: 4px; }
        .ff {
          font-family: 'Bebas Neue', cursive; font-size: 11px; letter-spacing: 1.5px;
          padding: 4px 12px; border-radius: 5px;
          border: 1px solid rgba(255,255,255,0.08); background: transparent;
          color: rgba(255,255,255,0.32); cursor: pointer; transition: all 0.12s;
        }
        .ff:hover { color: rgba(255,255,255,0.65); border-color: rgba(255,255,255,0.15); }
        .ff.act { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.16); color: rgba(255,255,255,0.85); }

        /* Proposal cards */
        .prop-card {
          background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
          border-radius: 12px; margin-bottom: 10px; overflow: hidden;
          transition: border-color 0.2s, box-shadow 0.2s;
        }
        .prop-card:hover { border-color: rgba(255,255,255,0.14); box-shadow: 0 4px 24px rgba(0,0,0,0.25); }
        .prop-card.dir-recv { border-left: 3px solid rgba(125,180,255,0.45); }
        .prop-card.dir-sent { border-left: 3px solid rgba(255,184,28,0.4); }
        .prop-card.dir-recv.accepted { border-left: 3px solid rgba(34,197,94,0.5); }

        .pc-head {
          display: flex; align-items: center; gap: 8px;
          padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.05);
          flex-wrap: wrap;
        }
        .dir-badge {
          font-family: 'Bebas Neue', cursive; font-size: 10px; letter-spacing: 2px;
          padding: 2px 8px; border-radius: 4px; flex-shrink: 0;
        }
        .dir-badge.recv { background: rgba(125,180,255,0.1); border: 1px solid rgba(125,180,255,0.2); color: var(--blue); }
        .dir-badge.sent { background: rgba(255,184,28,0.1); border: 1px solid rgba(255,184,28,0.2); color: var(--gold); }

        .pc-teams {
          display: flex; align-items: center; gap: 6px;
          font-family: 'Bebas Neue', cursive; font-size: 15px; letter-spacing: 0.8px;
        }
        .pc-teams-sep { font-size: 12px; color: rgba(255,255,255,0.2); }

        .pc-status {
          font-family: 'Bebas Neue', cursive; font-size: 10px; letter-spacing: 1.5px;
          padding: 2px 8px; border-radius: 4px; margin-left: auto; flex-shrink: 0;
        }
        .pc-status.pending   { background: rgba(255,184,28,0.12); border: 1px solid rgba(255,184,28,0.25);  color: var(--gold); }
        .pc-status.accepted  { background: rgba(34,197,94,0.1);   border: 1px solid rgba(34,197,94,0.25);   color: var(--green); }
        .pc-status.withdrawn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.35); }

        .pc-date { font-size: 11px; color: rgba(255,255,255,0.22); flex-shrink: 0; }
        .pc-del {
          background: none; border: none; color: rgba(255,255,255,0.22);
          cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1;
          transition: color 0.15s; margin-left: 2px; flex-shrink: 0;
        }
        .pc-del:hover { color: #f87171; }

        /* Compare body */
        .pc-body { display: grid; grid-template-columns: 1fr 38px 1fr; }
        @media (max-width: 500px) {
          .pc-body { grid-template-columns: 1fr; }
          .pc-arrow-col { display: none; }
        }
        .pc-side { padding: 10px 14px; }
        .pc-side + .pc-side { border-left: 1px solid rgba(255,255,255,0.04); }
        .pc-side-label {
          font-family: 'Bebas Neue', cursive; font-size: 10px; letter-spacing: 1.5px;
          margin-bottom: 7px;
        }
        .pc-side-label.offer { color: rgba(255,122,138,0.65); }
        .pc-side-label.req   { color: rgba(125,180,255,0.65); }
        .pc-arrow-col {
          display: flex; align-items: center; justify-content: center;
          font-size: 14px; color: rgba(255,255,255,0.1);
          background: rgba(255,255,255,0.015);
          border-left: 1px solid rgba(255,255,255,0.04);
          border-right: 1px solid rgba(255,255,255,0.04);
        }

        .pc-player { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
        .pc-p-name { font-family: 'Bebas Neue', cursive; font-size: 13px; letter-spacing: 0.8px; }
        .pc-p-stat { font-size: 11px; color: rgba(255,255,255,0.28); margin-left: auto; white-space: nowrap; }
        .pc-empty  { font-size: 11px; color: rgba(255,255,255,0.18); font-style: italic; padding: 3px 0; }

        .pc-note { font-size: 12px; color: rgba(255,255,255,0.3); font-style: italic; padding: 8px 14px; border-top: 1px solid rgba(255,255,255,0.04); }

        .pc-foot {
          display: flex; align-items: center; justify-content: flex-end; gap: 8px;
          padding: 9px 14px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .btn-counter {
          font-family: 'Bebas Neue', cursive; font-size: 11px; letter-spacing: 1.5px;
          padding: 5px 13px; border-radius: 6px;
          border: 1px solid rgba(125,180,255,0.3); background: transparent;
          color: var(--blue); cursor: pointer; transition: all 0.15s;
        }
        .btn-counter:hover { background: rgba(125,180,255,0.1); border-color: rgba(125,180,255,0.5); }
        .btn-exec {
          font-family: 'Bebas Neue', cursive; font-size: 11px; letter-spacing: 1.5px;
          padding: 6px 14px; border-radius: 6px; border: none;
          background: var(--green); color: var(--rink); cursor: pointer; transition: background 0.15s;
        }
        .btn-exec:hover { background: #34d371; }
        .btn-exec:disabled { background: rgba(34,197,94,0.25); color: rgba(255,255,255,0.3); cursor: not-allowed; }

        /* ─── Empty / error states ─── */
        .state-msg {
          text-align: center; padding: 3rem 1rem;
          font-size: 13px; color: rgba(255,255,255,0.2); letter-spacing: 0.5px; line-height: 1.8;
        }
    </style>
</head>
<body>
<div class="shell">

    <!-- ══════════════════════════
         TOP BAR
    ══════════════════════════ -->
    <div class="topbar">
        <!-- Team badge / dropdown -->
        <div class="team-badge" id="team-badge" onclick="toggleTeamDropdown(event)">
            <div class="team-avatar" id="team-avatar">??</div>
            <div class="team-badge-text">
                <div class="team-badge-label">Your team</div>
                <div class="team-badge-name" id="team-badge-name">Loading…</div>
            </div>
            <div class="team-badge-chevron">▾</div>
            <div class="team-dropdown" id="team-dropdown"></div>
        </div>

        <!-- View tabs -->
        <div class="view-tabs">
            <button class="vtab active" id="vtab-build" onclick="setView('build')">New Proposal</button>
            <button class="vtab" id="vtab-feed" onclick="setView('feed')">
                Feed
                <span class="vtab-badge" id="feed-badge"></span>
            </button>
        </div>
    </div>

    <!-- ══════════════════════════
         BUILD VIEW
    ══════════════════════════ -->
    <div id="view-build">

        <div class="section-label">Send proposal to</div>
        <div class="target-pills" id="target-pills"></div>

        <div class="panels">
            <!-- OFFER panel -->
            <div class="panel">
                <div class="panel-head">
                    <span class="panel-title offer">You Offer</span>
                    <span class="panel-sel-count" id="offer-count">0 selected</span>
                </div>
                <div class="panel-toolbar">
                    <button class="pchip a-all" id="offer-chip-ALL" onclick="setPosFilter('offer','ALL')">All</button>
                    <button class="pchip" id="offer-chip-F"   onclick="setPosFilter('offer','F')">F</button>
                    <button class="pchip" id="offer-chip-D"   onclick="setPosFilter('offer','D')">D</button>
                    <button class="pchip" id="offer-chip-G"   onclick="setPosFilter('offer','G')">G</button>
                    <div class="panel-search">
                        <span class="search-ico">⌕</span>
                        <input type="text" id="offer-search" placeholder="Search…" oninput="filterPanel('offer',this.value)">
                    </div>
                </div>
                <div class="player-list" id="offer-list"></div>
            </div>

            <!-- REQUEST panel -->
            <div class="panel">
                <div class="panel-head">
                    <span class="panel-title req">You Request</span>
                    <span class="panel-sel-count" id="req-count">0 selected</span>
                </div>
                <div class="panel-toolbar">
                    <button class="pchip a-all" id="req-chip-ALL" onclick="setPosFilter('req','ALL')">All</button>
                    <button class="pchip" id="req-chip-F"   onclick="setPosFilter('req','F')">F</button>
                    <button class="pchip" id="req-chip-D"   onclick="setPosFilter('req','D')">D</button>
                    <button class="pchip" id="req-chip-G"   onclick="setPosFilter('req','G')">G</button>
                    <div class="panel-search">
                        <span class="search-ico">⌕</span>
                        <input type="text" id="req-search" placeholder="Search…" oninput="filterPanel('req',this.value)">
                    </div>
                </div>
                <div class="player-list" id="req-list">
                    <div class="panel-empty">← Pick a team above to see their roster</div>
                </div>
            </div>
        </div>

        <!-- Summary bar -->
        <div class="summary-bar" id="summary-bar">
            <div class="sb-top">
                <div>
                    <div class="sb-side-label offer">Giving up</div>
                    <div class="sb-chips" id="offer-chips"><span class="sb-hint">Select players on the left</span></div>
                </div>
                <div class="sb-arrow">⇄</div>
                <div>
                    <div class="sb-side-label req">Receiving</div>
                    <div class="sb-chips" id="req-chips"><span class="sb-hint">Select players on the right</span></div>
                </div>
            </div>
            <div class="sb-actions">
                <input class="sb-note" id="proposal-note" placeholder='Optional note… "Need depth at C, open to anything"' maxlength="200">
                <button class="btn-clear" onclick="clearProposal()">Clear</button>
                <button class="btn-send" id="send-btn" disabled onclick="sendProposal()">Send</button>
            </div>
        </div>

    </div><!-- #view-build -->

    <!-- ══════════════════════════
         FEED VIEW
    ══════════════════════════ -->
    <div id="view-feed" style="display:none">
        <div class="feed-toprow">
            <span class="feed-count" id="feed-count"></span>
            <div class="feed-filters">
                <button class="ff act" onclick="setFeedFilter('all',this)">All</button>
                <button class="ff" onclick="setFeedFilter('recv',this)">Received</button>
                <button class="ff" onclick="setFeedFilter('sent',this)">Sent</button>
                <button class="ff" onclick="setFeedFilter('accepted',this)">Completed</button>
            </div>
        </div>
        <div id="feed-list"></div>
    </div>

</div><!-- .shell -->

<script>
    /* ══════════════════════════════════════════
       CONFIG
    ══════════════════════════════════════════ */
    const SUPABASE_URL = 'https://fifurqlitkywtmhgtzeu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';
    const SB_HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    };
    const _leagueCode = new URLSearchParams(window.location.search).get('league') || null;

    /* ══════════════════════════════════════════
       LIVE DATA
    ══════════════════════════════════════════ */
    let MY_TEAM = null;
    let TEAMS = [];
    let MY_ROSTER = [];
    let TEAM_ROSTERS = {};
    let proposals = {};
    let _playerMap = {};
    let _allTeams = [];
    let _tradingBlock = {};

    /* ══════════════════════════════════════════
       STATE
    ══════════════════════════════════════════ */
    let state = {
      targetTeamId: null,
      offered:   new Set(),
      requested: new Set(),
      offerPos:  'ALL',
      reqPos:    'ALL',
      offerSearch: '',
      reqSearch:   '',
      feedFilter:  'all',
    };

    /* ══════════════════════════════════════════
       UTILS
    ══════════════════════════════════════════ */
    function escH(v) {
      return String(v ?? '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
      );
    }
    function normPos(pos) {
      if (!pos) return 'F';
      const p = pos.toUpperCase();
      if (p.includes('G')) return 'G';
      if (p === 'D' || p.includes('LD') || p.includes('RD')) return 'D';
      return 'F';
    }
    function formatName(n) {
      if (!n) return '';
      if (n.includes(',')) { const [l,f] = n.split(',').map(s=>s.trim()); return `${f} ${l}`; }
      return n;
    }
    function slugToName(slug) {
      return slug?.split('/').pop()?.replace(/-/g,' ') || slug || '';
    }
    function playerFromSlug(slug) {
      return _playerMap[slug] || _playerMap[`/player/${slug}`] || null;
    }
    function initials(name) {
      return name.split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase() || '??';
    }
    function rosterToList(team, tradingBlock) {
      const slugs = [...new Set([
        ...(team.roster.F || []),
        ...(team.roster.D || []),
        ...(team.roster.G || []),
      ].filter(Boolean))];
      return slugs.map(slug => {
        const p = playerFromSlug(slug);
        const pos = p ? normPos(p.position) : 'F';
        return {
          slug,
          name:    p ? formatName(p.player_name) : slugToName(slug),
          pos,
          pts:     p ? (p.points ?? 0) : 0,
          cap:     p ? ((p.cap_hit ?? 0) / 1e6) : 0,
          onBlock: !!tradingBlock[slug],
        };
      });
    }
    function allPlayers() {
      const all = [...MY_ROSTER, ...Object.values(TEAM_ROSTERS).flat()];
      return Object.fromEntries(all.map(p => [p.slug, p]));
    }

    /* ══════════════════════════════════════════
       LOAD
    ══════════════════════════════════════════ */
    async function load() {
      if (!_leagueCode) { showError('No league code in URL. Add <code>?league=YOUR_CODE</code> to the URL.'); return; }
      try {
        const [rRes, pRes] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/pool_rosters?league_code=eq.${_leagueCode}&select=data`, { headers: SB_HEADERS }),
          fetch(`${SUPABASE_URL}/rest/v1/nhl_players?select=puckpedia_slug,player_name,position,cap_hit,team,points,goals,assists,wins,shutouts,games_played&order=cap_hit.desc&limit=1000`, { headers: SB_HEADERS }),
        ]);
        if (!rRes.ok) throw new Error(`pool_rosters ${rRes.status}`);
        const rRows = await rRes.json();
        if (!rRows.length) { showError('No data found for this league.'); return; }

        if (pRes.ok) {
          const players = await pRes.json();
          players.forEach(p => {
            _playerMap[p.puckpedia_slug] = p;
            _playerMap[`/player/${p.puckpedia_slug}`] = p;
          });
        }

        const data = rRows[0].data || {};
        const rawTeams  = data.teams || [];
        const tradingBlock = data.tradingBlock || {};
        proposals = data.proposals || {};

        const allTeams = rawTeams.map((t,i) => ({
          id:     t.id || `team-${i}`,
          name:   t.name || `Team ${i+1}`,
          roster: {
            F: Array.isArray(t.roster?.F) ? t.roster.F : [],
            D: Array.isArray(t.roster?.D) ? t.roster.D : [],
            G: Array.isArray(t.roster?.G) ? t.roster.G : [],
          },
        }));

        TEAM_ROSTERS = {};
        allTeams.forEach(t => { TEAM_ROSTERS[t.id] = rosterToList(t, tradingBlock); });

        const storageKey = `myTeam_${_leagueCode}`;
        const savedId    = localStorage.getItem(storageKey);
        const chosen     = allTeams.find(t => t.id === savedId) || allTeams.find(t => t.id === data.activeTeamId) || allTeams[0];

        setMyTeam(chosen, allTeams, tradingBlock);
        renderTeamDropdown();
        renderTargetPills();
        renderPanel('offer', MY_ROSTER);
        updateSummaryBar();
        updateFeedBadge();
      } catch(e) {
        console.error(e);
        showError('Failed to load league data. Check your connection and try again.');
      }
    }

    function showError(msg) {
      document.querySelector('.shell').innerHTML = `<div class="state-msg">${msg}</div>`;
    }

    /* ══════════════════════════════════════════
       SAVE
    ══════════════════════════════════════════ */
    async function saveProposals() {
      const rRes = await fetch(
        `${SUPABASE_URL}/rest/v1/pool_rosters?league_code=eq.${_leagueCode}&select=data`,
        { headers: SB_HEADERS }
      );
      if (!rRes.ok) throw new Error(`fetch failed ${rRes.status}`);
      const rows = await rRes.json();
      const data = rows[0]?.data || {};
      data.proposals = proposals;
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/pool_rosters?on_conflict=league_code`,
        {
          method: 'POST',
          headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify({ league_code: _leagueCode, data, updated_at: new Date().toISOString() }),
        }
      );
      if (!res.ok) throw new Error(`save failed ${res.status}`);
    }

    /* ══════════════════════════════════════════
       MY TEAM
    ══════════════════════════════════════════ */
    function setMyTeam(team, allTeams, tradingBlock) {
      MY_TEAM = team;
      MY_ROSTER = rosterToList(team, tradingBlock || _tradingBlock);
      TEAMS = (allTeams || _allTeams).filter(t => t.id !== team.id);
      _allTeams    = allTeams    || _allTeams;
      _tradingBlock = tradingBlock || _tradingBlock;
      localStorage.setItem(`myTeam_${_leagueCode}`, team.id);

      // Update badge
      document.getElementById('team-avatar').textContent    = initials(team.name);
      document.getElementById('team-badge-name').textContent = team.name;
    }

    function toggleTeamDropdown(e) {
      e.stopPropagation();
      document.getElementById('team-badge').classList.toggle('open');
    }

    document.addEventListener('click', () => {
      document.getElementById('team-badge')?.classList.remove('open');
    });

    function renderTeamDropdown() {
      const dd = document.getElementById('team-dropdown');
      dd.innerHTML = (_allTeams || []).map(t =>
        `<div class="td-item${MY_TEAM && t.id === MY_TEAM.id ? ' active' : ''}" onclick="chooseMyTeam(event,'${escH(t.id)}')">
          <div class="td-dot${MY_TEAM && t.id === MY_TEAM.id ? ' active' : ''}"></div>
          ${escH(t.name)}
        </div>`
      ).join('');
    }

    function chooseMyTeam(e, id) {
      e.stopPropagation();
      const team = _allTeams.find(t => t.id === id);
      if (!team || (MY_TEAM && team.id === MY_TEAM.id)) {
        document.getElementById('team-badge').classList.remove('open');
        return;
      }
      setMyTeam(team, null, null);
      clearProposal();
      renderTeamDropdown();
      renderTargetPills();
      renderPanel('offer', MY_ROSTER);
      updateFeedBadge();
      document.getElementById('team-badge').classList.remove('open');
    }

    /* ══════════════════════════════════════════
       VIEW SWITCHING
    ══════════════════════════════════════════ */
    function setView(v) {
      document.getElementById('view-build').style.display = v === 'build' ? '' : 'none';
      document.getElementById('view-feed').style.display  = v === 'feed'  ? '' : 'none';
      document.getElementById('vtab-build').classList.toggle('active', v === 'build');
      document.getElementById('vtab-feed').classList.toggle('active',  v === 'feed');
      if (v === 'feed') renderFeed();
    }

    /* ══════════════════════════════════════════
       TARGET TEAM
    ══════════════════════════════════════════ */
    function renderTargetPills() {
      document.getElementById('target-pills').innerHTML = TEAMS.map(t =>
        `<button class="tpill${state.targetTeamId === t.id ? ' sel' : ''}" onclick="selectTarget('${escH(t.id)}','${escH(t.name)}')">${escH(t.name)}</button>`
      ).join('');
    }

    function selectTarget(id, name) {
      state.targetTeamId = id;
      state.requested = new Set();
      renderTargetPills();
      renderPanel('req', TEAM_ROSTERS[id] || []);
      updateSummaryBar();
      updateCountBadge('req');
    }

    /* ══════════════════════════════════════════
       PANELS
    ══════════════════════════════════════════ */
    function renderPanel(side, roster) {
      const isOffer = side === 'offer';
      const source  = roster ?? (isOffer ? MY_ROSTER : (TEAM_ROSTERS[state.targetTeamId] || []));
      const posF    = isOffer ? state.offerPos : state.reqPos;
      const search  = (isOffer ? state.offerSearch : state.reqSearch).toLowerCase();
      const sel     = isOffer ? state.offered : state.requested;
      const el      = document.getElementById(`${side}-list`);

      if (!isOffer && !state.targetTeamId) {
        el.innerHTML = `<div class="panel-empty">← Pick a team above to see their roster</div>`;
        return;
      }

      let players = [...source];
      if (posF !== 'ALL') players = players.filter(p => p.pos === posF);
      if (search)         players = players.filter(p => p.name.toLowerCase().includes(search));
      players.sort((a,b) => { if (a.onBlock !== b.onBlock) return a.onBlock ? -1 : 1; return b.pts - a.pts; });

      if (!players.length) {
        el.innerHTML = `<div class="panel-empty">No players match</div>`;
        return;
      }

      const selClass = isOffer ? 's-offer' : 's-req';
      el.innerHTML = players.map(p => {
        const isSel = sel.has(p.slug);
        const rowClass = isSel ? ` ${selClass}` : (p.onBlock ? ' on-block' : '');
        const blockTag = p.onBlock ? `<span class="block-tag">BLOCK</span>` : '';
        return `<div class="pr${rowClass}" onclick="togglePlayer('${side}','${escH(p.slug)}')">
          <div class="pr-check">${isSel ? '✓' : ''}</div>
          <div class="pr-info">
            <div class="pr-name">${escH(p.name)}${blockTag}</div>
            <div class="pr-meta">$${p.cap.toFixed(2)}M · ${p.pts} pts</div>
          </div>
          <div class="pos-tag ${p.pos}">${p.pos}</div>
          <div class="pr-pts">${p.pts}</div>
        </div>`;
      }).join('');
    }

    function togglePlayer(side, slug) {
      const sel = side === 'offer' ? state.offered : state.requested;
      sel.has(slug) ? sel.delete(slug) : sel.add(slug);
      renderPanel(side);
      updateCountBadge(side);
      updateSummaryBar();
    }

    function filterPanel(side, val) {
      if (side === 'offer') state.offerSearch = val;
      else state.reqSearch = val;
      renderPanel(side);
    }

    function setPosFilter(side, pos) {
      if (side === 'offer') state.offerPos = pos;
      else state.reqPos = pos;
      ['ALL','F','D','G'].forEach(p => {
        const btn = document.getElementById(`${side}-chip-${p}`);
        if (!btn) return;
        btn.className = 'pchip' + (p === pos ? (pos === 'ALL' ? ' a-all' : ` a-${pos}`) : '');
      });
      renderPanel(side);
    }

    function updateCountBadge(side) {
      const sel   = side === 'offer' ? state.offered : state.requested;
      const badge = document.getElementById(side === 'offer' ? 'offer-count' : 'req-count');
      const cls   = side === 'offer' ? 'has-offer' : 'has-req';
      badge.textContent = sel.size ? `${sel.size} selected` : '0 selected';
      badge.classList.toggle(cls, sel.size > 0);
    }

    /* ══════════════════════════════════════════
       SUMMARY BAR
    ══════════════════════════════════════════ */
    function updateSummaryBar() {
      const map = allPlayers();
      const hasAny = state.offered.size > 0 || state.requested.size > 0;

      document.getElementById('summary-bar').classList.toggle('has-content', hasAny);

      document.getElementById('offer-chips').innerHTML = state.offered.size
        ? [...state.offered].map(s => {
            const p = map[s]; if (!p) return '';
            return `<span class="sb-chip offer" onclick="togglePlayer('offer','${escH(s)}')"><span>${escH(p.name)}</span><span class="sb-chip-x">✕</span></span>`;
          }).join('')
        : `<span class="sb-hint">Select players on the left</span>`;

      document.getElementById('req-chips').innerHTML = state.requested.size
        ? [...state.requested].map(s => {
            const p = map[s]; if (!p) return '';
            return `<span class="sb-chip req" onclick="togglePlayer('req','${escH(s)}')"><span>${escH(p.name)}</span><span class="sb-chip-x">✕</span></span>`;
          }).join('')
        : `<span class="sb-hint">Select players on the right</span>`;

      document.getElementById('send-btn').disabled = !hasAny || !state.targetTeamId;
    }

    function clearProposal() {
      state.offered   = new Set();
      state.requested = new Set();
      state.targetTeamId = null;
      state.offerSearch = ''; state.reqSearch = '';
      state.offerPos = 'ALL'; state.reqPos = 'ALL';

      document.getElementById('offer-search').value = '';
      document.getElementById('req-search').value   = '';
      document.getElementById('proposal-note').value = '';
      setPosFilter('offer','ALL'); setPosFilter('req','ALL');
      updateCountBadge('offer');   updateCountBadge('req');
      renderTargetPills();
      renderPanel('offer', MY_ROSTER);
      document.getElementById('req-list').innerHTML = `<div class="panel-empty">← Pick a team above to see their roster</div>`;
      updateSummaryBar();
    }

    async function sendProposal() {
      const targetTeam = TEAMS.find(t => t.id === state.targetTeamId);
      if (!targetTeam || (!state.offered.size && !state.requested.size)) return;

      const btn = document.getElementById('send-btn');
      btn.disabled = true; btn.textContent = 'Sending…';

      const id = `prop-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
      proposals[id] = {
        id,
        fromTeamId:     MY_TEAM.id,
        fromTeamName:   MY_TEAM.name,
        toTeamId:       targetTeam.id,
        toTeamName:     targetTeam.name,
        offeredSlugs:   [...state.offered],
        requestedSlugs: [...state.requested],
        note:           document.getElementById('proposal-note').value.trim().slice(0,200),
        status:         'pending',
        createdAt:      new Date().toISOString(),
      };

      try {
        await saveProposals();
        clearProposal();
        updateFeedBadge();
        setView('feed');
      } catch(e) {
        delete proposals[id];
        btn.disabled = false; btn.textContent = 'Send';
        alert('Failed to send proposal. Please try again.');
      }
    }

    /* ══════════════════════════════════════════
       FEED
    ══════════════════════════════════════════ */
    function updateFeedBadge() {
      const pending = Object.values(proposals).filter(p => p.status === 'pending').length;
      const badge   = document.getElementById('feed-badge');
      badge.style.display = pending ? 'inline-block' : 'none';
    }

    function setFeedFilter(f, el) {
      state.feedFilter = f;
      document.querySelectorAll('.ff').forEach(b => b.classList.remove('act'));
      el.classList.add('act');
      renderFeed();
    }

    function renderFeed() {
      let props = Object.values(proposals).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      const f = state.feedFilter;
      if (f === 'recv')     props = props.filter(p => p.toTeamId === MY_TEAM?.id);
      if (f === 'sent')     props = props.filter(p => p.fromTeamId === MY_TEAM?.id);
      if (f === 'accepted') props = props.filter(p => p.status === 'accepted');

      const count = document.getElementById('feed-count');
      if (count) count.textContent = `${props.length} proposal${props.length !== 1 ? 's' : ''}`;

      const list = document.getElementById('feed-list');
      if (!list) return;
      list.innerHTML = props.length
        ? props.map(buildCard).join('')
        : `<div class="state-msg">No proposals here yet.</div>`;
    }

    function buildCard(p) {
      const isSent = MY_TEAM && p.fromTeamId === MY_TEAM.id;
      const dateStr = new Date(p.createdAt).toLocaleDateString('en-CA', { month:'short', day:'numeric' });

      function playerRow(slug) {
        const info = playerFromSlug(slug);
        const name = info ? formatName(info.player_name) : slugToName(slug);
        const pos  = info ? normPos(info.position) : 'F';
        const pts  = info ? (info.points ?? 0) : 0;
        const cap  = info ? ((info.cap_hit ?? 0) / 1e6) : 0;
        return `<div class="pc-player">
          <span class="pos-tag ${pos}">${pos}</span>
          <span class="pc-p-name">${escH(name)}</span>
          <span class="pc-p-stat">${pts}pts · $${cap.toFixed(2)}M</span>
        </div>`;
      }

      const offered   = (p.offeredSlugs   || []);
      const requested = (p.requestedSlugs || []);
      const offerHTML = offered.length   ? offered.map(playerRow).join('')   : `<div class="pc-empty">Nothing offered</div>`;
      const reqHTML   = requested.length ? requested.map(playerRow).join('') : `<div class="pc-empty">Nothing requested</div>`;

      const footer = p.status === 'pending'
        ? `<div class="pc-foot">
            ${!isSent ? `<button class="btn-counter" onclick="counterProposal('${escH(p.id)}')">Counter</button>` : ''}
            <button class="btn-exec" id="exec-${escH(p.id)}" onclick="executeTrade('${escH(p.id)}')">⇄ Execute</button>
          </div>`
        : '';

      const dirClass  = isSent ? 'dir-sent' : 'dir-recv';
      const dirLabel  = isSent ? 'Sent' : (MY_TEAM && p.toTeamId === MY_TEAM.id ? 'Received' : '');
      const cardClass = `prop-card ${dirClass}${p.status === 'accepted' ? ' accepted' : ''}`;

      return `<div class="${cardClass}">
        <div class="pc-head">
          ${dirLabel ? `<span class="dir-badge ${isSent ? 'sent' : 'recv'}">${dirLabel}</span>` : ''}
          <div class="pc-teams">
            <span>${escH(p.fromTeamName)}</span>
            <span class="pc-teams-sep">→</span>
            <span>${escH(p.toTeamName)}</span>
          </div>
          <span class="pc-status ${escH(p.status)}">${p.status.toUpperCase()}</span>
          <span class="pc-date">${dateStr}</span>
          <button class="pc-del" onclick="deleteProposal('${escH(p.id)}')" title="Delete">✕</button>
        </div>
        <div class="pc-body">
          <div class="pc-side">
            <div class="pc-side-label offer">${escH(p.fromTeamName)}</div>
            ${offerHTML}
          </div>
          <div class="pc-arrow-col">⇄</div>
          <div class="pc-side">
            <div class="pc-side-label req">${escH(p.toTeamName)}</div>
            ${reqHTML}
          </div>
        </div>
        ${p.note ? `<div class="pc-note">"${escH(p.note)}"</div>` : ''}
        ${footer}
      </div>`;
    }

    async function deleteProposal(id) {
      if (!proposals[id]) return;
      delete proposals[id];
      try {
        await saveProposals();
        updateFeedBadge();
        renderFeed();
      } catch(e) {
        alert('Failed to delete proposal.');
        load();
      }
    }

    function counterProposal(id) {
      const p = proposals[id]; if (!p) return;
      state.targetTeamId = p.fromTeamId;
      state.offered      = new Set(p.requestedSlugs || []);
      state.requested    = new Set(p.offeredSlugs   || []);
      renderTargetPills();
      const target = TEAMS.find(t => t.id === p.fromTeamId);
      if (target) renderPanel('req', TEAM_ROSTERS[target.id] || []);
      renderPanel('offer', MY_ROSTER);
      updateCountBadge('offer');
      updateCountBadge('req');
      updateSummaryBar();
      setView('build');
    }

    /* ══════════════════════════════════════════
       EXECUTE TRADE
    ══════════════════════════════════════════ */
    function captureSnapshot(slug) {
      const p = _playerMap[slug] || _playerMap[`/player/${slug}`];
      if (!p) return { points:0, goals:0, assists:0, wins:0, shutouts:0, games_played:0 };
      return {
        points: p.points ?? 0, goals: p.goals ?? 0, assists: p.assists ?? 0,
        wins: p.wins ?? 0, shutouts: p.shutouts ?? 0, games_played: p.games_played ?? 0,
      };
    }

    function applyTradeToRoster(team, incoming, outgoing) {
      const now = new Date().toISOString();
      if (!team.acquisitions) team.acquisitions = {};
      for (const slug of outgoing) {
        for (const g of ['F','D','G','B']) {
          if (!team.roster[g]) continue;
          const i = team.roster[g].indexOf(slug);
          if (i !== -1) { team.roster[g].splice(i,1); break; }
        }
      }
      for (const slug of incoming) {
        const p = _playerMap[slug] || _playerMap[`/player/${slug}`];
        let grp = 'F';
        if (p) {
          const pos = (p.position||'').toUpperCase();
          if (pos==='D'||pos.includes('LD')||pos.includes('RD')) grp='D';
          else if (pos.includes('G')) grp='G';
        }
        if (!team.roster[grp]) team.roster[grp] = [];
        team.roster[grp].push(slug);
        if (!team.acquisitions[slug]?.stats_snapshot)
          team.acquisitions[slug] = { date: now, stats_snapshot: captureSnapshot(slug) };
      }
    }

    async function executeTrade(proposalId) {
      const p = proposals[proposalId];
      if (!p || p.status !== 'pending') return;
      const btn = document.getElementById(`exec-${proposalId}`);
      if (btn) { btn.disabled = true; btn.textContent = 'Executing…'; }

      try {
        const rRes = await fetch(
          `${SUPABASE_URL}/rest/v1/pool_rosters?league_code=eq.${_leagueCode}&select=data`,
          { headers: SB_HEADERS }
        );
        if (!rRes.ok) throw new Error(`fetch failed ${rRes.status}`);
        const rows = await rRes.json();
        const data  = rows[0]?.data || {};
        const rawTeams = data.teams || [];
        const fromTeam = rawTeams.find(t => t.id === p.fromTeamId);
        const toTeam   = rawTeams.find(t => t.id === p.toTeamId);
        if (!fromTeam || !toTeam) throw new Error('One or both teams not found.');

        applyTradeToRoster(fromTeam, p.requestedSlugs||[], p.offeredSlugs||[]);
        applyTradeToRoster(toTeam,   p.offeredSlugs||[], p.requestedSlugs||[]);

        const tradedSlugs = new Set([...(p.offeredSlugs||[]),...(p.requestedSlugs||[])]);
        const allProps = data.proposals || {};
        allProps[proposalId].status = 'accepted';
        for (const [id, prop] of Object.entries(allProps)) {
          if (id === proposalId || prop.status !== 'pending') continue;
          const involved = [...(prop.offeredSlugs||[]),...(prop.requestedSlugs||[])];
          if (involved.some(s => tradedSlugs.has(s))) prop.status = 'withdrawn';
        }

        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/pool_rosters?on_conflict=league_code`,
          {
            method: 'POST',
            headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
            body: JSON.stringify({ league_code: _leagueCode, data, updated_at: new Date().toISOString() }),
          }
        );
        if (!res.ok) throw new Error(`save failed ${res.status}`);

        proposals = allProps;
        _allTeams.forEach(t => {
          const u = rawTeams.find(r => r.id === t.id);
          if (u) { t.roster = u.roster; t.acquisitions = u.acquisitions; }
        });
        TEAM_ROSTERS = {};
        _allTeams.forEach(t => { TEAM_ROSTERS[t.id] = rosterToList(t, data.tradingBlock||{}); });
        const updatedMy = rawTeams.find(r => r.id === MY_TEAM.id);
        if (updatedMy) {
          MY_TEAM.roster = updatedMy.roster;
          MY_TEAM.acquisitions = updatedMy.acquisitions;
          MY_ROSTER = rosterToList(MY_TEAM, data.tradingBlock||{});
        }
        updateFeedBadge();
        renderFeed();
      } catch(e) {
        console.error(e);
        alert('Failed to execute trade: ' + (e.message||e));
        if (btn) { btn.disabled = false; btn.textContent = '⇄ Execute'; }
      }
    }

    /* ─── Boot ─── */
    load();
</script>
</body>
</html>
