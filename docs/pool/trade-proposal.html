<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Proposals</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --rink: #07111f;
          --red: #c8102e;
          --gold: #ffb81c;
          --silver: #a8b2be;
          --green: #22c55e;
          --blue: #7db4ff;
          --pink: #ff7a8a;
          --amber: #f59e0b;
          --line: rgba(255,255,255,0.08);
        }
        body {
          background: var(--rink);
          background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,110,0.6) 0%, transparent 70%);
          min-height: 100vh;
          font-family: 'Barlow Condensed', sans-serif;
          color: white;
          padding: 2rem 1rem;
        }
        .page-wrap { max-width: 1000px; margin: 0 auto; }

        /* ════════════════════════════════════════
           PROPOSAL MODE SWITCHER
        ════════════════════════════════════════ */
        .proposals-view-tabs {
          display: flex; gap: 4px; margin-bottom: 1rem;
          background: rgba(255,255,255,0.03); border: 1px solid var(--line);
          border-radius: 8px; padding: 3px;
        }
        .pvt { font-family: 'Bebas Neue', cursive; font-size: 0.82rem; letter-spacing: 2px;
          padding: 5px 18px; border-radius: 5px; cursor: pointer; flex: 1; text-align: center;
          color: var(--silver); transition: all 0.15s; background: transparent; border: none; }
        .pvt:hover { color: white; }
        .pvt.active { background: rgba(255,184,28,0.12); color: var(--gold); }

        /* ════════════════════════════════════════
           SPLIT-SCREEN BUILDER
        ════════════════════════════════════════ */
        .builder-container { display: flex; flex-direction: column; gap: 0.75rem; }

        /* Step indicator */
        .builder-steps {
          display: flex; align-items: center; gap: 0; margin-bottom: 0.25rem;
        }
        .step-item {
          display: flex; align-items: center; gap: 0.5rem;
          font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 2px;
          color: rgba(255,255,255,0.28);
        }
        .step-item.active { color: var(--gold); }
        .step-item.done { color: rgba(34,197,94,0.7); }
        .step-num {
          width: 20px; height: 20px; border-radius: 50%; border: 1px solid currentColor;
          display: flex; align-items: center; justify-content: center;
          font-size: 0.65rem; flex-shrink: 0;
        }
        .step-connector { flex: 1; height: 1px; background: rgba(255,255,255,0.08); margin: 0 8px; }

        /* Target team selector */
        .target-team-section { }
        .section-eyebrow {
          font-family: 'Barlow Condensed', sans-serif; font-size: 0.62rem; font-weight: 700;
          letter-spacing: 1.8px; text-transform: uppercase; color: rgba(255,255,255,0.3);
          margin-bottom: 0.5rem;
        }
        .target-team-pills { display: flex; flex-wrap: wrap; gap: 6px; }
        .ttp {
          font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 1.5px;
          padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
          color: var(--silver); background: transparent; cursor: pointer; transition: all 0.15s;
        }
        .ttp:hover { border-color: rgba(255,184,28,0.4); color: var(--gold); }
        .ttp.selected { background: rgba(255,184,28,0.12); border-color: rgba(255,184,28,0.5); color: var(--gold); }

        /* ── SPLIT PANELS ── */
        .split-panels {
          display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
          transition: opacity 0.2s;
        }
        .split-panels.locked { opacity: 0.35; pointer-events: none; }
        @media (max-width: 600px) { .split-panels { grid-template-columns: 1fr; } }

        .split-panel {
          background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.08);
          border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
          min-height: 240px;
        }
        .split-panel-header {
          display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.75rem;
          border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .split-panel-title { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; }
        .split-panel-title.offer { color: var(--pink); }
        .split-panel-title.request { color: var(--blue); }
        .split-panel-team { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; color: rgba(255,255,255,0.35); margin-left: auto; letter-spacing: 0.5px; }
        .split-panel-count { font-family: 'Bebas Neue', cursive; font-size: 0.72rem; letter-spacing: 1px;
          background: rgba(255,255,255,0.07); border-radius: 20px; padding: 1px 8px; color: var(--silver); margin-left: 4px; }

        /* Search within panel */
        .panel-search {
          display: flex; align-items: center; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .panel-search-icon { padding: 0 0.6rem; color: rgba(255,255,255,0.25); font-size: 0.8rem; }
        .panel-search input {
          flex: 1; background: transparent; border: none; color: white; font-family: 'Barlow Condensed', sans-serif;
          font-size: 0.82rem; padding: 0.38rem 0.5rem 0.38rem 0; outline: none; letter-spacing: 0.5px;
        }
        .panel-search input::placeholder { color: rgba(255,255,255,0.2); }

        /* Pos filter pills */
        .panel-pos-filter { display: flex; gap: 4px; padding: 0.35rem 0.65rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .ppf {
          font-family: 'Bebas Neue', cursive; font-size: 0.65rem; letter-spacing: 1px;
          padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);
          color: rgba(255,255,255,0.4); background: transparent; cursor: pointer; transition: all 0.12s;
        }
        .ppf:hover { color: white; }
        .ppf.ALL.active, .ppf.active-all { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: white; }
        .ppf.F.active { background: rgba(255,122,138,0.12); border-color: rgba(255,122,138,0.4); color: var(--pink); }
        .ppf.D.active { background: rgba(125,180,255,0.12); border-color: rgba(125,180,255,0.4); color: var(--blue); }
        .ppf.G.active { background: rgba(255,184,28,0.12); border-color: rgba(255,184,28,0.4); color: var(--gold); }

        /* Player list */
        .panel-player-list { flex: 1; overflow-y: auto; max-height: 280px; }
        .panel-player-row {
          display: grid; grid-template-columns: 20px 1fr auto auto; gap: 8px; align-items: center;
          padding: 0.38rem 0.65rem; border-bottom: 1px solid rgba(255,255,255,0.03);
          cursor: pointer; transition: background 0.1s; user-select: none;
        }
        .panel-player-row:hover { background: rgba(255,255,255,0.03); }
        .panel-player-row.selected-offer { background: rgba(255,122,138,0.06); border-left: 2px solid rgba(255,122,138,0.45); }
        .panel-player-row.selected-request { background: rgba(125,180,255,0.06); border-left: 2px solid rgba(125,180,255,0.45); }
        .ppr-check {
          width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.15);
          display: flex; align-items: center; justify-content: center; flex-shrink: 0;
          font-size: 0.6rem; transition: all 0.12s;
        }
        .selected-offer .ppr-check { background: var(--pink); border-color: var(--pink); color: #07111f; }
        .selected-request .ppr-check { background: var(--blue); border-color: var(--blue); color: #07111f; }
        .ppr-info { min-width: 0; }
        .ppr-name { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 0.8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
        .ppr-meta { font-size: 0.65rem; color: rgba(255,255,255,0.35); }
        .ppr-pts { font-family: 'Bebas Neue', cursive; font-size: 0.82rem; color: var(--gold); letter-spacing: 0.5px; }
        .pos-pill {
          font-family: 'Bebas Neue', cursive; font-size: 0.58rem; letter-spacing: 0.8px;
          border-radius: 3px; padding: 1px 4px; flex-shrink: 0;
        }
        .pos-pill.F { background: rgba(255,122,138,0.15); color: var(--pink); }
        .pos-pill.D { background: rgba(125,180,255,0.15); color: var(--blue); }
        .pos-pill.G { background: rgba(255,184,28,0.15); color: var(--gold); }
        .tb-badge { font-family: 'Bebas Neue', cursive; font-size: 0.55rem; letter-spacing: 1px;
          color: var(--amber); background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25);
          border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: middle; }

        /* ── FLOATING TRADE SUMMARY BAR ── */
        .trade-summary-bar {
          background: rgba(12,22,38,0.97); border: 1px solid rgba(255,255,255,0.1);
          border-radius: 12px; padding: 0.75rem 1rem; transition: all 0.25s;
          backdrop-filter: blur(12px);
        }
        .trade-summary-bar.empty { opacity: 0.45; }

        .tsb-row { display: flex; align-items: stretch; gap: 8px; }

        .tsb-side { flex: 1; min-width: 0; }
        .tsb-side-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.6rem; font-weight: 700;
          letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
        .tsb-side-label.offer { color: rgba(255,122,138,0.7); }
        .tsb-side-label.request { color: rgba(125,180,255,0.7); }
        .tsb-chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 28px; align-items: flex-start; }
        .tsb-chip {
          display: inline-flex; align-items: center; gap: 4px;
          font-family: 'Bebas Neue', cursive; font-size: 0.72rem; letter-spacing: 0.8px;
          border-radius: 20px; padding: 2px 8px; cursor: pointer;
          transition: all 0.12s; max-width: 150px; overflow: hidden;
        }
        .tsb-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tsb-chip.offer { background: rgba(255,122,138,0.1); border: 1px solid rgba(255,122,138,0.3); color: var(--pink); }
        .tsb-chip.offer:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.5); color: #f87171; }
        .tsb-chip.request { background: rgba(125,180,255,0.1); border: 1px solid rgba(125,180,255,0.3); color: var(--blue); }
        .tsb-chip.request:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color: #f87171; }
        .tsb-empty-hint { font-size: 0.72rem; color: rgba(255,255,255,0.2); font-style: italic; padding: 4px 0; }
        .tsb-arrows { font-size: 1.1rem; color: rgba(255,255,255,0.2); display: flex; align-items: center; padding: 0 4px; }
        .tsb-divider { width: 1px; background: rgba(255,255,255,0.07); align-self: stretch; margin: 0 4px; }

        /* Action row */
        .tsb-actions { display: flex; align-items: center; gap: 8px; margin-top: 0.65rem; }
        .tsb-note {
          flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
          border-radius: 6px; color: white; font-family: 'Barlow Condensed', sans-serif;
          font-size: 0.82rem; padding: 5px 10px; resize: none; height: 32px; overflow: hidden;
        }
        .tsb-note:focus { outline: none; border-color: rgba(255,184,28,0.4); }
        .tsb-note::placeholder { color: rgba(255,255,255,0.2); }
        .btn-send-proposal {
          font-family: 'Bebas Neue', cursive; font-size: 0.82rem; letter-spacing: 2px;
          background: var(--gold); color: #07111f; border: none; border-radius: 7px;
          padding: 7px 20px; cursor: pointer; transition: background 0.15s; white-space: nowrap; flex-shrink: 0;
        }
        .btn-send-proposal:hover { background: #ffd04d; }
        .btn-send-proposal:disabled { background: rgba(255,184,28,0.25); color: rgba(255,255,255,0.3); cursor: not-allowed; }
        .btn-clear-proposal {
          font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 1px;
          background: transparent; color: var(--silver); border: 1px solid rgba(255,255,255,0.1);
          border-radius: 7px; padding: 7px 12px; cursor: pointer; transition: all 0.15s; flex-shrink: 0;
        }
        .btn-clear-proposal:hover { border-color: rgba(255,255,255,0.3); color: white; }

        /* ════════════════════════════════════════
           PROPOSAL CARDS VIEW
        ════════════════════════════════════════ */
        .pf-count { font-size: 0.72rem; color: rgba(255,255,255,0.25); letter-spacing: 1px; }

        .proposal-card {
          background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
          border-radius: 12px; margin-bottom: 10px; overflow: hidden;
          transition: border-color 0.2s, box-shadow 0.2s;
        }
        .proposal-card:hover { border-color: rgba(255,255,255,0.14); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .proposal-card.received { border-left: 3px solid rgba(125,180,255,0.5); }
        .proposal-card.sent { border-left: 3px solid rgba(255,184,28,0.4); }

        .pc-header {
          display: flex; align-items: center; gap: 8px; padding: 0.65rem 0.9rem;
          border-bottom: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap;
        }
        .pc-badge-dir {
          font-family: 'Bebas Neue', cursive; font-size: 0.65rem; letter-spacing: 2px;
          border-radius: 4px; padding: 2px 7px;
        }
        .pc-badge-dir.received { background: rgba(125,180,255,0.12); color: var(--blue); border: 1px solid rgba(125,180,255,0.25); }
        .pc-badge-dir.sent { background: rgba(255,184,28,0.1); color: var(--gold); border: 1px solid rgba(255,184,28,0.25); }
        .pc-team-name { font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 1px; }
        .pc-status { font-family: 'Bebas Neue', cursive; font-size: 0.6rem; letter-spacing: 1.5px; padding: 2px 7px; border-radius: 3px; margin-left: auto; }
        .pc-status.pending { background: rgba(255,184,28,0.15); color: var(--gold); border: 1px solid rgba(255,184,28,0.3); }
        .pc-status.withdrawn { background: rgba(255,255,255,0.06); color: var(--silver); border: 1px solid rgba(255,255,255,0.1); }
        .pc-status.accepted { background: rgba(34,197,94,0.12); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .pc-date { font-size: 0.67rem; color: rgba(255,255,255,0.22); }
        .pc-delete-btn { background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 0.85rem; padding: 0 0 0 4px; line-height: 1; transition: color 0.15s; margin-left: auto; }
        .pc-delete-btn:hover { color: #f87171; }

        /* Comparative players layout */
        .pc-compare {
          display: grid; grid-template-columns: 1fr 48px 1fr; gap: 0; align-items: stretch;
        }
        .pc-compare-side { padding: 0.7rem 0.9rem; }
        .pc-compare-side + .pc-compare-side { border-left: 1px solid rgba(255,255,255,0.05); }
        .pc-compare-arrow {
          display: flex; align-items: center; justify-content: center;
          font-size: 1rem; color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.02);
          border-left: 1px solid rgba(255,255,255,0.04); border-right: 1px solid rgba(255,255,255,0.04);
        }
        .pc-side-label { font-family: 'Bebas Neue', cursive; font-size: 0.65rem; letter-spacing: 1.5px; margin-bottom: 0.4rem; }
        .pc-side-label.offer { color: var(--pink); }
        .pc-side-label.request { color: var(--blue); }
        .pc-player-row { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
        .pc-player-name { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 0.8px; color: white; }
        .pc-player-stat { font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; color: rgba(255,255,255,0.35); margin-left: auto; white-space: nowrap; }
        .pc-empty { color: rgba(255,255,255,0.18); font-size: 0.72rem; font-style: italic; padding: 3px 0; }

        .pc-note { font-size: 0.73rem; color: rgba(255,255,255,0.3); font-style: italic; padding: 0.4rem 0.9rem; border-top: 1px solid rgba(255,255,255,0.04); }

        .pc-footer {
          display: flex; align-items: center; justify-content: flex-end; gap: 8px;
          padding: 0.45rem 0.9rem; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .pc-action-btn {
          font-family: 'Bebas Neue', cursive; font-size: 0.7rem; letter-spacing: 1.5px;
          padding: 4px 12px; border-radius: 5px; cursor: pointer; transition: all 0.15s;
        }
        .pc-action-btn.counter { border: 1px solid rgba(125,180,255,0.3); background: transparent; color: var(--blue); }
        .pc-action-btn.counter:hover { background: rgba(125,180,255,0.1); border-color: rgba(125,180,255,0.5); }
        .pc-received-msg { font-size: 0.7rem; color: rgba(125,180,255,0.5); letter-spacing: 0.4px; }

        /* ── Responsive ── */
        @media (max-width: 560px) {
          .pc-compare { grid-template-columns: 1fr; }
          .pc-compare-arrow { display: none; }
          .split-panels { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="page-wrap">

    <!-- ── VIEW TABS ── -->
    <div class="proposals-view-tabs">
        <button class="pvt active" id="pvt-build" onclick="setPView('build')">New Proposal</button>
        <button class="pvt" id="pvt-feed" onclick="setPView('feed')">Proposals Feed <span id="feed-badge" style="display:inline-block;background:rgba(255,184,28,0.2);color:var(--gold);border-radius:20px;padding:0 6px;font-size:0.65rem;margin-left:4px;letter-spacing:1px;">2</span></button>
    </div>

    <!-- ══════════════════════════════════════════
         BUILD VIEW
    ══════════════════════════════════════════ -->
    <div id="pview-build">
        <div class="builder-container">

            <!-- Step bar -->
            <div class="builder-steps">
                <div class="step-item done" id="step1-indicator"><span class="step-num">✓</span>Pick Team</div>
                <div class="step-connector"></div>
                <div class="step-item active" id="step2-indicator"><span class="step-num">2</span>Select Players</div>
                <div class="step-connector"></div>
                <div class="step-item" id="step3-indicator"><span class="step-num">3</span>Send</div>
            </div>

            <!-- Target team -->
            <div class="target-team-section">
                <div class="section-eyebrow">Send proposal to</div>
                <div class="target-team-pills" id="target-pills"></div>
            </div>

            <!-- Split panels -->
            <div class="split-panels" id="split-panels">
                <!-- LEFT: Your roster (offer) -->
                <div class="split-panel">
                    <div class="split-panel-header">
                        <span class="split-panel-title offer">You Offer</span>
                        <span class="split-panel-count" id="offer-count">0</span>
                        <span class="split-panel-team">Your Team</span>
                    </div>
                    <div class="panel-search">
                        <span class="panel-search-icon">🔍</span>
                        <input type="text" placeholder="Filter players…" oninput="filterPanel('offer', this.value)" id="offer-search">
                    </div>
                    <div class="panel-pos-filter">
                        <button class="ppf ALL active-all" id="offer-filter-ALL" onclick="setPanelPos('offer','ALL')">All</button>
                        <button class="ppf F" id="offer-filter-F" onclick="setPanelPos('offer','F')">F</button>
                        <button class="ppf D" id="offer-filter-D" onclick="setPanelPos('offer','D')">D</button>
                        <button class="ppf G" id="offer-filter-G" onclick="setPanelPos('offer','G')">G</button>
                    </div>
                    <div class="panel-player-list" id="offer-list"></div>
                </div>

                <!-- RIGHT: Target team's roster (request) -->
                <div class="split-panel">
                    <div class="split-panel-header">
                        <span class="split-panel-title request">You Request</span>
                        <span class="split-panel-count" id="request-count">0</span>
                        <span class="split-panel-team" id="request-team-label">Select a team →</span>
                    </div>
                    <div class="panel-search">
                        <span class="panel-search-icon">🔍</span>
                        <input type="text" placeholder="Filter players…" oninput="filterPanel('request', this.value)" id="request-search">
                    </div>
                    <div class="panel-pos-filter">
                        <button class="ppf ALL active-all" id="request-filter-ALL" onclick="setPanelPos('request','ALL')">All</button>
                        <button class="ppf F" id="request-filter-F" onclick="setPanelPos('request','F')">F</button>
                        <button class="ppf D" id="request-filter-D" onclick="setPanelPos('request','D')">D</button>
                        <button class="ppf G" id="request-filter-G" onclick="setPanelPos('request','G')">G</button>
                    </div>
                    <div class="panel-player-list" id="request-list">
                        <div style="padding:1.5rem;text-align:center;color:rgba(255,255,255,0.2);font-size:0.78rem;letter-spacing:0.5px">
                            ← Select a team to see their roster
                        </div>
                    </div>
                </div>
            </div>

            <!-- Floating summary bar -->
            <div class="trade-summary-bar empty" id="summary-bar">
                <div class="tsb-row">
                    <div class="tsb-side">
                        <div class="tsb-side-label offer">Giving Up</div>
                        <div class="tsb-chips" id="offer-chips">
                            <span class="tsb-empty-hint">Click players on the left to add</span>
                        </div>
                    </div>
                    <div class="tsb-arrows">⇄</div>
                    <div class="tsb-side">
                        <div class="tsb-side-label request">Receiving</div>
                        <div class="tsb-chips" id="request-chips">
                            <span class="tsb-empty-hint">Click players on the right to add</span>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="tsb-actions">
                    <input class="tsb-note" id="proposal-note" placeholder='Optional note: "Open to any C, just need depth…"' maxlength="200">
                    <button class="btn-clear-proposal" onclick="clearProposal()">Clear</button>
                    <button class="btn-send-proposal" id="send-btn" disabled onclick="sendProposal()">Send Proposal</button>
                </div>
            </div>

        </div><!-- .builder-container -->
    </div><!-- #pview-build -->

    <!-- ══════════════════════════════════════════
         FEED VIEW
    ══════════════════════════════════════════ -->
    <div id="pview-feed" style="display:none">

        <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:0.6rem;">
            <span class="pf-count" id="feed-count"></span>
        </div>

        <div id="feed-list"></div>

    </div>

</div><!-- .page-wrap -->

<script>
    const SUPABASE_URL = 'https://fifurqlitkywtmhgtzeu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';
    const SB_HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

    const _leagueCode = new URLSearchParams(window.location.search).get('league') || null;

    /* ── live data ── */
    let MY_TEAM = null;
    let TEAMS = [];
    let MY_ROSTER = [];
    let TEAM_ROSTERS = {};
    let proposals = {};
    let _playerMap = {};

    /* ══════════════════════════════════════════
       STATE
    ══════════════════════════════════════════ */
    let state = {
      targetTeamId: null,
      offered: new Set(),
      requested: new Set(),
      offerPosFilter: 'ALL',
      requestPosFilter: 'ALL',
      offerSearch: '',
      requestSearch: '',
      feedFilter: 'all',
    };

    /* ══════════════════════════════════════════
       HELPERS
    ══════════════════════════════════════════ */
    function escH(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function normPos(pos) {
      if (!pos) return 'F';
      const p = pos.toUpperCase();
      if (p.includes('G')) return 'G';
      if (p === 'D' || p.includes('LD') || p.includes('RD')) return 'D';
      return 'F';
    }

    function formatName(n) {
      if (!n) return '';
      if (n.includes(',')) { const [l, f] = n.split(',').map(s => s.trim()); return `${f} ${l}`; }
      return n;
    }

    function slugToName(slug) {
      return slug?.split('/').pop()?.replace(/-/g, ' ') || slug || '';
    }

    function playerFromSlug(slug) {
      return _playerMap[slug] || _playerMap[`/player/${slug}`] || null;
    }

    function rosterToList(team, tradingBlock) {
      const slugs = [
        ...new Set([
          ...(team.roster.F || []),
          ...(team.roster.D || []),
          ...(team.roster.G || []),
        ].filter(Boolean))
      ];
      return slugs.map(slug => {
        const p = playerFromSlug(slug);
        const pos = p ? normPos(p.position) : 'F';
        const onBlock = !!tradingBlock[slug];
        return {
          slug,
          name: p ? formatName(p.player_name) : slugToName(slug),
          pos,
          pts: p ? (p.points ?? 0) : 0,
          cap: p ? ((p.cap_hit ?? 0) / 1e6) : 0,
          team: p ? (p.team ?? '') : '',
          onBlock,
        };
      });
    }

    /* ══════════════════════════════════════════
       LOAD
    ══════════════════════════════════════════ */
    async function load() {
      if (!_leagueCode) { showError('No league code found.'); return; }

      try {
        // Fetch roster data
        const rRes = await fetch(
          `${SUPABASE_URL}/rest/v1/pool_rosters?league_code=eq.${_leagueCode}&select=data`,
          { headers: SB_HEADERS }
        );
        if (!rRes.ok) throw new Error(`pool_rosters ${rRes.status}`);
        const rRows = await rRes.json();
        if (!rRows.length) { showError('No league data found.'); return; }

        const data = rRows[0].data || {};
        const rawTeams = data.teams || [];
        const tradingBlock = data.tradingBlock || {};
        proposals = data.proposals || {};

        // Determine active team (first team in list, same as roster.html default)
        const activeId = data.activeTeamId || rawTeams[0]?.id;

        // Fetch players
        const pRes = await fetch(
          `${SUPABASE_URL}/rest/v1/nhl_players?select=puckpedia_slug,player_name,position,cap_hit,team,points,goals,assists,wins,shutouts,games_played&order=cap_hit.desc&limit=1000`,
          { headers: SB_HEADERS }
        );
        if (pRes.ok) {
          const players = await pRes.json();
          players.forEach(p => {
            _playerMap[p.puckpedia_slug] = p;
            _playerMap[`/player/${p.puckpedia_slug}`] = p;
          });
        }

        // Build MY_TEAM and TEAMS
        MY_TEAM = null;
        TEAMS = [];
        TEAM_ROSTERS = {};

        rawTeams.forEach((t, idx) => {
          const team = {
            id: t.id || `team-${idx}`,
            name: t.name || `Team ${idx + 1}`,
            roster: {
              F: Array.isArray(t.roster?.F) ? t.roster.F : [],
              D: Array.isArray(t.roster?.D) ? t.roster.D : [],
              G: Array.isArray(t.roster?.G) ? t.roster.G : [],
            },
          };
          if (team.id === activeId) {
            MY_TEAM = team;
            MY_ROSTER = rosterToList(team, tradingBlock);
          } else {
            TEAMS.push(team);
            TEAM_ROSTERS[team.id] = rosterToList(team, tradingBlock);
          }
        });

        if (!MY_TEAM) {
          // Fallback: first team is mine
          const t = rawTeams[0];
          if (t) {
            MY_TEAM = { id: t.id || 'team-0', name: t.name || 'My Team', roster: { F: t.roster?.F||[], D: t.roster?.D||[], G: t.roster?.G||[] } };
            MY_ROSTER = rosterToList(MY_TEAM, tradingBlock);
          }
        }

        init();
      } catch (e) {
        console.error(e);
        showError('Failed to load league data.');
      }
    }

    function showError(msg) {
      document.querySelector('.page-wrap').innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:rgba(255,255,255,0.4);font-size:0.9rem;letter-spacing:1px">${msg}</div>`;
    }

    /* ══════════════════════════════════════════
       SAVE
    ══════════════════════════════════════════ */
    async function saveProposals() {
      // Re-fetch current data, merge proposals, then save
      const rRes = await fetch(
        `${SUPABASE_URL}/rest/v1/pool_rosters?league_code=eq.${_leagueCode}&select=data`,
        { headers: SB_HEADERS }
      );
      if (!rRes.ok) throw new Error(`fetch failed ${rRes.status}`);
      const rows = await rRes.json();
      const data = rows[0]?.data || {};
      data.proposals = proposals;

      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/pool_rosters?on_conflict=league_code`,
        {
          method: 'POST',
          headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify({ league_code: _leagueCode, data, updated_at: new Date().toISOString() }),
        }
      );
      if (!res.ok) throw new Error(`save failed ${res.status}`);
    }

    /* ══════════════════════════════════════════
       VIEW SWITCHING
    ══════════════════════════════════════════ */
    function setPView(v) {
      document.getElementById('pview-build').style.display = v === 'build' ? '' : 'none';
      document.getElementById('pview-feed').style.display = v === 'feed' ? '' : 'none';
      document.getElementById('pvt-build').classList.toggle('active', v === 'build');
      document.getElementById('pvt-feed').classList.toggle('active', v === 'feed');
      if (v === 'feed') renderFeed();
    }

    /* ══════════════════════════════════════════
       INIT
    ══════════════════════════════════════════ */
    function init() {
      renderTargetPills();
      renderPanel('offer', MY_ROSTER);
      updateSummaryBar();
      renderFeed();
    }

    /* ══════════════════════════════════════════
       TARGET TEAM
    ══════════════════════════════════════════ */
    function renderTargetPills() {
      const container = document.getElementById('target-pills');
      container.innerHTML = TEAMS.map(t =>
        `<button class="ttp${state.targetTeamId === t.id ? ' selected' : ''}" onclick="selectTarget('${escH(t.id)}','${escH(t.name)}')">${escH(t.name)}</button>`
      ).join('');
    }

    function selectTarget(id, name) {
      state.targetTeamId = id;
      state.requested = new Set();
      renderTargetPills();
      document.getElementById('request-team-label').textContent = name;
      document.getElementById('split-panels').classList.remove('locked');
      renderPanel('request', TEAM_ROSTERS[id] || []);
      updateStepIndicator();
      updateSummaryBar();
    }

    /* ══════════════════════════════════════════
       PANELS
    ══════════════════════════════════════════ */
    function renderPanel(side, roster) {
      const list = document.getElementById(`${side}-list`);
      const posF = state[side === 'offer' ? 'offerPosFilter' : 'requestPosFilter'];
      const search = state[side === 'offer' ? 'offerSearch' : 'requestSearch'].toLowerCase();
      let players = roster;
      if (posF !== 'ALL') players = players.filter(p => p.pos === posF);
      if (search) players = players.filter(p => p.name.toLowerCase().includes(search));

      if (!players.length) {
        list.innerHTML = `<div style="padding:1.2rem;text-align:center;color:rgba(255,255,255,0.2);font-size:0.75rem">No players match</div>`;
        return;
      }

      const selected = side === 'offer' ? state.offered : state.requested;
      list.innerHTML = players.map(p => {
        const isSel = selected.has(p.slug);
        const selClass = isSel ? (side === 'offer' ? ' selected-offer' : ' selected-request') : '';
        const tbBadge = p.onBlock ? `<span class="tb-badge">📤</span>` : '';
        return `<div class="panel-player-row${selClass}" onclick="togglePlayer('${side}','${escH(p.slug)}')">
          <div class="ppr-check">${isSel ? '✓' : ''}</div>
          <div class="ppr-info">
            <div class="ppr-name">${escH(p.name)}${tbBadge}</div>
            <div class="ppr-meta">${escH(p.team)} · $${p.cap.toFixed(2)}M</div>
          </div>
          <span class="pos-pill ${p.pos}">${p.pos}</span>
          <div class="ppr-pts">${p.pts}</div>
        </div>`;
      }).join('');
    }

    function togglePlayer(side, slug) {
      const set = side === 'offer' ? state.offered : state.requested;
      if (set.has(slug)) set.delete(slug);
      else set.add(slug);
      renderPanel(side, side === 'offer' ? MY_ROSTER : (TEAM_ROSTERS[state.targetTeamId] || []));
      document.getElementById(`${side}-count`).textContent = set.size;
      updateSummaryBar();
      updateStepIndicator();
    }

    function filterPanel(side, val) {
      if (side === 'offer') state.offerSearch = val;
      else state.requestSearch = val;
      renderPanel(side, side === 'offer' ? MY_ROSTER : (TEAM_ROSTERS[state.targetTeamId] || []));
    }

    function setPanelPos(side, pos) {
      if (side === 'offer') state.offerPosFilter = pos;
      else state.requestPosFilter = pos;
      ['ALL','F','D','G'].forEach(p => {
        const btn = document.getElementById(`${side}-filter-${p}`);
        if (!btn) return;
        btn.className = `ppf ${p === 'ALL' ? 'ALL' : p}`;
        if (p === pos) btn.classList.add(p === 'ALL' ? 'active-all' : 'active');
      });
      renderPanel(side, side === 'offer' ? MY_ROSTER : (TEAM_ROSTERS[state.targetTeamId] || []));
    }

    /* ══════════════════════════════════════════
       SUMMARY BAR
    ══════════════════════════════════════════ */
    function getAllPlayers() {
      const all = [...MY_ROSTER, ...Object.values(TEAM_ROSTERS).flat()];
      return Object.fromEntries(all.map(p => [p.slug, p]));
    }

    function updateSummaryBar() {
      const bar = document.getElementById('summary-bar');
      const offerChips = document.getElementById('offer-chips');
      const requestChips = document.getElementById('request-chips');
      const map = getAllPlayers();

      const hasAny = state.offered.size > 0 || state.requested.size > 0;
      bar.classList.toggle('empty', !hasAny);

      offerChips.innerHTML = !state.offered.size
        ? `<span class="tsb-empty-hint">Click players on the left</span>`
        : [...state.offered].map(slug => {
            const p = map[slug]; if (!p) return '';
            return `<span class="tsb-chip offer" onclick="togglePlayer('offer','${escH(slug)}')" title="Click to remove"><span>${escH(p.name)}</span> ✕</span>`;
          }).join('');

      requestChips.innerHTML = !state.requested.size
        ? `<span class="tsb-empty-hint">Click players on the right</span>`
        : [...state.requested].map(slug => {
            const p = map[slug]; if (!p) return '';
            return `<span class="tsb-chip request" onclick="togglePlayer('request','${escH(slug)}')" title="Click to remove"><span>${escH(p.name)}</span> ✕</span>`;
          }).join('');

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = !hasAny || !state.targetTeamId;
    }

    function updateStepIndicator() {
      const s1 = document.getElementById('step1-indicator');
      const s2 = document.getElementById('step2-indicator');
      const s3 = document.getElementById('step3-indicator');
      const hasTeam = !!state.targetTeamId;
      const hasPlayers = state.offered.size > 0 || state.requested.size > 0;

      s1.className = 'step-item ' + (hasTeam ? 'done' : 'active');
      s1.querySelector('.step-num').textContent = hasTeam ? '✓' : '1';
      s2.className = 'step-item ' + (!hasTeam ? '' : hasPlayers ? 'done' : 'active');
      s2.querySelector('.step-num').textContent = hasPlayers && hasTeam ? '✓' : '2';
      s3.className = 'step-item ' + (hasPlayers && hasTeam ? 'active' : '');
    }

    function clearProposal() {
      state.offered = new Set();
      state.requested = new Set();
      state.targetTeamId = null;
      renderTargetPills();
      renderPanel('offer', MY_ROSTER);
      document.getElementById('request-list').innerHTML = `<div style="padding:1.5rem;text-align:center;color:rgba(255,255,255,0.2);font-size:0.78rem">← Select a team to see their roster</div>`;
      document.getElementById('request-team-label').textContent = 'Select a team →';
      document.getElementById('offer-count').textContent = '0';
      document.getElementById('request-count').textContent = '0';
      document.getElementById('proposal-note').value = '';
      updateSummaryBar();
      updateStepIndicator();
    }

    async function sendProposal() {
      const targetTeam = TEAMS.find(t => t.id === state.targetTeamId);
      if (!targetTeam || (!state.offered.size && !state.requested.size)) return;

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      const id = `prop-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
      proposals[id] = {
        id,
        fromTeamId: MY_TEAM.id,
        fromTeamName: MY_TEAM.name,
        toTeamId: targetTeam.id,
        toTeamName: targetTeam.name,
        offeredSlugs: [...state.offered],
        requestedSlugs: [...state.requested],
        note: document.getElementById('proposal-note').value.trim().slice(0, 200),
        status: 'pending',
        createdAt: new Date().toISOString(),
      };

      try {
        await saveProposals();
        clearProposal();
        setPView('feed');
      } catch (e) {
        delete proposals[id];
        btn.disabled = false;
        btn.textContent = 'Send Proposal';
        alert('Failed to send proposal. Please try again.');
      }
    }

    async function deleteProposal(id) {
      if (!proposals[id]) return;
      delete proposals[id];
      try {
        await saveProposals();
        renderFeed();
      } catch (e) {
        alert('Failed to delete proposal.');
        await load();
      }
    }

    /* ══════════════════════════════════════════
       FEED
    ══════════════════════════════════════════ */
    function renderFeed() {
      if (!MY_TEAM) return;
      const props = Object.values(proposals)
        .filter(p => p.fromTeamId === MY_TEAM.id || p.toTeamId === MY_TEAM.id)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      const count = document.getElementById('feed-count');
      if (count) count.textContent = props.length + ' proposal' + (props.length !== 1 ? 's' : '');

      const feedBadge = document.getElementById('feed-badge');
      const pending = Object.values(proposals).filter(p => p.status === 'pending' && p.toTeamId === MY_TEAM.id).length;
      if (feedBadge) { feedBadge.textContent = pending || ''; feedBadge.style.display = pending ? 'inline-block' : 'none'; }

      const list = document.getElementById('feed-list');
      if (!list) return;

      list.innerHTML = props.length
        ? props.map(p => buildProposalCard(p)).join('')
        : `<div style="text-align:center;padding:2.5rem 1rem;color:rgba(255,255,255,0.2);font-size:0.85rem;letter-spacing:1px">No proposals yet.</div>`;
    }

    function buildProposalCard(p) {
      const isSent = p.fromTeamId === MY_TEAM.id;
      const counterName = isSent ? p.toTeamName : p.fromTeamName;
      const dateStr = new Date(p.createdAt).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });

      function playerRow(slug) {
        const info = playerFromSlug(slug);
        const name = info ? formatName(info.player_name) : slugToName(slug);
        const pos = info ? normPos(info.position) : 'F';
        const pts = info ? (info.points ?? 0) : 0;
        const cap = info ? ((info.cap_hit ?? 0) / 1e6) : 0;
        return `<div class="pc-player-row">
          <span class="pos-pill ${pos}">${pos}</span>
          <span class="pc-player-name">${escH(name)}</span>
          <span class="pc-player-stat">${pts}pts · $${cap.toFixed(2)}M</span>
        </div>`;
      }

      const offeredSlugs = p.offeredSlugs || [];
      const requestedSlugs = p.requestedSlugs || [];
      const offerSide = offeredSlugs.length ? offeredSlugs.map(playerRow).join('') : `<div class="pc-empty">Nothing offered</div>`;
      const reqSide = requestedSlugs.length ? requestedSlugs.map(playerRow).join('') : `<div class="pc-empty">Nothing requested</div>`;

      const footer = !isSent && p.status === 'pending'
        ? `<div class="pc-footer"><span class="pc-received-msg">Contact ${escH(p.fromTeamName)} to discuss</span><button class="pc-action-btn counter" onclick="counterProposal('${escH(p.id)}')">Counter →</button></div>`
        : '';

      return `<div class="proposal-card ${isSent ? 'sent' : 'received'}">
        <div class="pc-header">
          <span class="pc-badge-dir ${isSent ? 'sent' : 'received'}">${isSent ? 'Sent' : 'Received'}</span>
          <span class="pc-team-name">${escH(counterName)}</span>
          <span class="pc-status ${escH(p.status)}">${p.status.toUpperCase()}</span>
          <span class="pc-date">${dateStr}</span>
          <button class="pc-delete-btn" onclick="deleteProposal('${escH(p.id)}')" title="Delete">✕</button>
        </div>
        <div class="pc-compare">
          <div class="pc-compare-side">
            <div class="pc-side-label offer">${isSent ? 'You Offer' : 'They Offer'}</div>
            ${offerSide}
          </div>
          <div class="pc-compare-arrow">⇄</div>
          <div class="pc-compare-side">
            <div class="pc-side-label request">${isSent ? 'You Request' : 'They Request'}</div>
            ${reqSide}
          </div>
        </div>
        ${p.note ? `<div class="pc-note">"${escH(p.note)}"</div>` : ''}
        ${footer}
      </div>`;
    }

    function counterProposal(id) {
      const p = proposals[id];
      if (!p) return;
      state.targetTeamId = p.fromTeamId;
      state.offered = new Set(p.requestedSlugs || []);
      state.requested = new Set(p.offeredSlugs || []);
      renderTargetPills();
      const targetTeam = TEAMS.find(t => t.id === p.fromTeamId);
      if (targetTeam) {
        document.getElementById('request-team-label').textContent = targetTeam.name;
        document.getElementById('split-panels').classList.remove('locked');
        renderPanel('request', TEAM_ROSTERS[targetTeam.id] || []);
      }
      renderPanel('offer', MY_ROSTER);
      document.getElementById('offer-count').textContent = state.offered.size;
      document.getElementById('request-count').textContent = state.requested.size;
      updateSummaryBar();
      updateStepIndicator();
      setPView('build');
    }

    // Boot
    load();
</script>
</body>
</html>
