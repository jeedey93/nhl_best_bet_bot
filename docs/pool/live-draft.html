<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draft Room | Parieur Discipliné</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rink: #07111f;
      --rink2: #0b1929;
      --red: #c8102e;
      --gold: #ffb81c;
      --silver: #a8b2be;
      --ice: #e8f4fd;
      --green: #22c55e;
      --blue: #3b82f6;
      --line: rgba(255,255,255,0.08);
      --line2: rgba(255,255,255,0.05);
      --nav-h: 44px;
    }
    html, body { height: 100%; }
    body {
      background: var(--rink);
      font-family: 'Barlow Condensed', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav ── */
    .site-nav {
      position: sticky; top: 0; z-index: 200;
      background: rgba(7,17,31,0.97);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .site-nav-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: var(--nav-h); padding: 0 1rem;
      gap: 1rem;
    }
    .nav-brand { font-family: 'Bebas Neue', cursive; font-size: 1.3rem; color: var(--gold); letter-spacing: 4px; text-decoration: none; }
    .nav-league { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 3px; color: white; }
    .nav-code { color: var(--gold); margin-left: 0.5rem; font-size: 0.85rem; }

    /* ── Clock bar ── */
    .clock-bar {
      background: linear-gradient(90deg, rgba(200,16,46,0.15) 0%, rgba(7,17,31,0) 60%);
      border-bottom: 1px solid rgba(200,16,46,0.2);
      padding: 0.5rem 1rem;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
      flex-shrink: 0;
    }
    .clock-bar-left { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .on-clock-label {
      font-family: 'Bebas Neue', cursive; font-size: 0.75rem; letter-spacing: 2px;
      color: var(--silver); text-transform: uppercase;
    }
    .on-clock-name {
      font-family: 'Bebas Neue', cursive; font-size: 1.35rem; letter-spacing: 3px; color: white;
    }
    .on-clock-name.you { color: var(--gold); }
    .round-badge {
      font-family: 'Bebas Neue', cursive; font-size: 0.75rem; letter-spacing: 2px;
      background: rgba(255,255,255,0.07); border: 1px solid var(--line);
      border-radius: 4px; padding: 2px 8px; color: var(--silver);
    }
    .mode-badge {
      font-family: 'Bebas Neue', cursive; font-size: 0.75rem; letter-spacing: 2px;
      background: rgba(255,184,28,0.1); border: 1px solid rgba(255,184,28,0.25);
      border-radius: 4px; padding: 2px 8px; color: var(--gold);
    }
    /* Timer */
    .timer-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .timer-icon { font-size: 0.9rem; }
    .timer-display {
      font-family: 'Bebas Neue', cursive; font-size: 1.6rem; letter-spacing: 3px;
      color: white; min-width: 3.5ch; text-align: right;
      transition: color 0.3s;
    }
    .timer-display.urgent { color: var(--red); animation: timerPulse 0.8s ease-in-out infinite; }
    @keyframes timerPulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
    .timer-display.hidden { display: none; }

    /* ── Pending / Setup screen ── */
    #setup-screen {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem;
    }
    .setup-box {
      background: rgba(255,255,255,0.03); border: 1px solid var(--line);
      border-radius: 16px; padding: 2rem 1.75rem;
      width: 100%; max-width: 560px;
      display: flex; flex-direction: column; gap: 1.25rem;
    }
    .setup-title {
      font-family: 'Bebas Neue', cursive; font-size: 1.8rem; letter-spacing: 4px;
      color: var(--gold); text-align: center;
    }
    .setup-section-label {
      font-family: 'Bebas Neue', cursive; font-size: 0.75rem; letter-spacing: 2.5px;
      color: var(--silver); margin-bottom: 0.4rem;
    }
    .setup-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .setup-input {
      font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; font-weight: 600;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      color: white; border-radius: 7px; padding: 0.45rem 0.75rem;
      flex: 1; min-width: 140px;
    }
    .setup-input:focus { outline: none; border-color: rgba(255,184,28,0.45); }
    .setup-select {
      font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; font-weight: 600;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      color: white; border-radius: 7px; padding: 0.45rem 0.75rem; cursor: pointer;
    }
    .setup-select option { background: #0b1929; }

    /* Manager list in setup */
    .manager-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .manager-row {
      display: flex; align-items: center; gap: 0.5rem;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line2);
      border-radius: 7px; padding: 0.4rem 0.7rem;
    }
    .manager-slot { font-family: 'Bebas Neue', cursive; font-size: 0.9rem; color: var(--silver); letter-spacing: 1px; min-width: 22px; }
    .manager-name-input {
      font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; font-weight: 600;
      background: transparent; border: none; color: white; flex: 1; outline: none;
    }
    .manager-name-input::placeholder { color: rgba(255,255,255,0.2); }
    .btn-remove-manager {
      background: none; border: none; color: rgba(200,16,46,0.5); cursor: pointer;
      font-size: 0.85rem; padding: 2px 4px; transition: color 0.15s;
    }
    .btn-remove-manager:hover { color: var(--red); }

    .btn-add-manager {
      font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 1.5px;
      background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.15);
      color: var(--silver); border-radius: 7px; padding: 0.4rem 0.9rem;
      cursor: pointer; transition: background 0.15s, color 0.15s; width: 100%;
    }
    .btn-add-manager:hover { background: rgba(255,255,255,0.09); color: white; }

    .btn-randomize {
      font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 1.5px;
      background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3);
      color: var(--blue); border-radius: 7px; padding: 0.45rem 0.9rem;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-randomize:hover { background: rgba(59,130,246,0.2); }

    .btn-start-draft {
      font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 2.5px;
      background: var(--red); color: white;
      border: none; border-radius: 8px; padding: 0.75rem;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    }
    .btn-start-draft:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-start-draft:disabled { opacity: 0.35; cursor: default; transform: none; }

    /* Commish name setup */
    .commish-label {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px;
      color: var(--gold); background: rgba(255,184,28,0.1);
      border-radius: 4px; padding: 2px 7px;
    }

    /* ── Draft room ── */
    #draft-screen {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      min-height: 0;
    }

    /* Manager strip */
    .manager-strip {
      background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--line);
      padding: 0.5rem 1rem; display: flex; gap: 0.5rem; overflow-x: auto; flex-shrink: 0;
    }
    .manager-chip {
      display: flex; flex-direction: column; align-items: center;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      border-radius: 8px; padding: 0.35rem 0.75rem; min-width: 90px;
      flex-shrink: 0; transition: background 0.2s, border-color 0.2s;
    }
    .manager-chip.active {
      background: rgba(200,16,46,0.12); border-color: rgba(200,16,46,0.4);
      animation: chipPulse 1.5s ease-in-out infinite;
    }
    @keyframes chipPulse { 0%,100%{box-shadow:0 0 0 0 rgba(200,16,46,0);} 50%{box-shadow:0 0 0 6px rgba(200,16,46,0.12);} }
    .manager-chip.you-chip { border-color: rgba(255,184,28,0.3); }
    .chip-name {
      font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;
    }
    .chip-picks { font-size: 0.72rem; font-weight: 600; color: var(--silver); letter-spacing: 1px; margin-top: 1px; }
    .chip-clock { font-size: 0.6rem; font-weight: 700; color: var(--red); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }

    /* Main content area */
    .draft-main {
      flex: 1; display: flex; flex-direction: row;
      min-height: 0; overflow: hidden;
    }
    .draft-board-wrap { flex-shrink: 0; min-width: 160px; max-width: 70%; overflow: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .drag-handle {
      width: 6px; flex-shrink: 0; background: rgba(255,255,255,0.05);
      cursor: col-resize; transition: background 0.15s;
      position: relative; z-index: 10;
    }
    .drag-handle:hover, .drag-handle.dragging { background: rgba(255,184,28,0.35); }
    .drag-handle::after {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 2px; height: 32px;
      background: rgba(255,255,255,0.15); border-radius: 2px;
    }
    @media (max-width: 768px) {
      .draft-main { flex-direction: column; }
      .drag-handle { width: 100%; height: 6px; cursor: row-resize; }
      .drag-handle::after { width: 32px; height: 2px; }
      .draft-board-wrap { flex: none; width: 100% !important; max-height: 260px; max-width: unset; }
      .player-pool { min-width: unset; max-width: unset; max-height: 340px; }
    }

    /* ── Draft board ── */
    .board-round {
      display: flex; flex-direction: column; gap: 0;
    }
    .board-round-label {
      font-family: 'Bebas Neue', cursive; font-size: 0.72rem; letter-spacing: 2.5px;
      color: rgba(255,255,255,0.25); margin-bottom: 0.35rem; padding-left: 2px;
    }
    .board-picks-row {
      display: flex; flex-wrap: nowrap; gap: 0.3rem;
    }
    .pick-cell {
      background: rgba(255,255,255,0.04); border: 1px solid var(--line2);
      border-radius: 6px; padding: 0.35rem 0.55rem;
      width: 120px; flex-shrink: 0;
      position: relative; transition: background 0.2s;
    }
    .pick-cell.filled {
      background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1);
    }
    .pick-cell.current-pick {
      border-color: rgba(200,16,46,0.5);
      background: rgba(200,16,46,0.08);
      animation: cellPulse 1.5s ease-in-out infinite;
    }
    @keyframes cellPulse { 0%,100%{box-shadow:0 0 0 0 rgba(200,16,46,0);} 50%{box-shadow:0 0 0 4px rgba(200,16,46,0.1);} }
    .pick-num {
      font-family: 'Bebas Neue', cursive; font-size: 0.6rem; letter-spacing: 1.5px;
      color: rgba(255,255,255,0.2); display: block; margin-bottom: 2px;
    }
    .pick-manager {
      font-family: 'Bebas Neue', cursive; font-size: 0.75rem; letter-spacing: 1.5px;
      color: var(--silver); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pick-player {
      font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700;
      color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pick-pos {
      font-family: 'Bebas Neue', cursive; font-size: 0.65rem; letter-spacing: 1px;
      border-radius: 3px; padding: 1px 5px; display: inline-block; margin-top: 2px;
    }
    .pos-C  { background: rgba(255,184,28,0.15); color: var(--gold); }
    .pos-LW { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .pos-RW { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .pos-D  { background: rgba(34,197,94,0.15); color: #4ade80; }
    .pos-G  { background: rgba(200,16,46,0.15); color: #f87171; }
    .pos-default { background: rgba(255,255,255,0.08); color: var(--silver); }

    /* ── Player pool ── */
    .player-pool {
      flex: 1 1 0; min-width: 0;
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column; overflow: hidden; padding: 0.65rem 0.85rem 0.5rem;
    }
    @media (max-width: 768px) {
      .player-pool { border-left: none; border-top: 1px solid var(--line); max-height: 340px; }
    }
    .pool-controls { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; flex-shrink: 0; flex-wrap: wrap; }
    .pool-controls-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .pos-filter { display: flex; gap: 0; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .pos-filter button { font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 2px; padding: 0.35rem 0.9rem; background: none; border: none; color: var(--silver); cursor: pointer; transition: background 0.15s, color 0.15s; }
    .pos-filter button.active { background: rgba(255,255,255,0.09); color: white; }
    .pos-filter button:hover:not(.active) { color: rgba(255,255,255,0.7); }
    .search-input { flex: 1; min-width: 140px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem 0.8rem; color: white; font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.15s; }
    .search-input::placeholder { color: rgba(168,178,190,0.35); }
    .search-input:focus { border-color: rgba(255,255,255,0.22); }
    .eff-legend { display: flex; align-items: center; gap: 8px; background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.15); border-radius: 6px; padding: 6px 10px; margin-bottom: 0.6rem; flex-shrink: 0; }
    .eff-legend-badge { font-family: 'Bebas Neue', cursive; font-size: 0.72rem; letter-spacing: 1.5px; color: #22c55e; background: rgba(34,197,94,0.12); border-radius: 3px; padding: 1px 6px; flex-shrink: 0; }
    .eff-legend-text { font-size: 0.75rem; color: rgba(255,255,255,0.4); letter-spacing: 0.2px; }
    .eff-legend-text strong { color: rgba(255,255,255,0.65); font-weight: 600; }
    .nhl-team-strip-wrap { margin-bottom: 0.6rem; flex-shrink: 0; }
    .nhl-team-strip { display: flex; flex-wrap: wrap; gap: 4px; }
    .nhl-team-pill { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 5px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); cursor: pointer; transition: background 0.15s, border-color 0.15s; min-width: 44px; flex-shrink: 0; }
    .nhl-team-pill:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.14); }
    .nhl-team-pill.active { background: rgba(255,184,28,0.1); border-color: rgba(255,184,28,0.3); }
    .nhl-team-pill img { width: 22px; height: 22px; object-fit: contain; }
    .nhl-team-pill span { font-family: 'Bebas Neue', cursive; font-size: 0.58rem; letter-spacing: 1px; color: var(--silver); white-space: nowrap; }
    .nhl-team-pill.active span { color: var(--gold); }
    .nhl-team-pill-all { font-family: 'Bebas Neue', cursive; font-size: 0.72rem; letter-spacing: 2px; color: var(--silver); justify-content: center; min-height: 46px; }
    .nhl-team-pill-all.active { color: var(--gold); }
    .pool-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }
    .pool-list::-webkit-scrollbar { width: 3px; }
    .pool-list::-webkit-scrollbar-track { background: transparent; }
    .pool-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .loading-msg, .empty-msg { text-align: center; color: var(--silver); font-size: 0.9rem; padding: 2rem 0; letter-spacing: 1px; }
    .load-more-btn { width: 100%; margin-top: 4px; font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; background: rgba(255,184,28,0.06); border: 1px solid rgba(255,184,28,0.2); color: var(--gold); border-radius: 6px; padding: 0.5rem; cursor: pointer; transition: background 0.15s; }
    .load-more-btn:hover { background: rgba(255,184,28,0.14); }

    /* ── Player cards ── */
    .player-card {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 5px; padding: 5px 8px 5px 10px;
      cursor: default; user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .player-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.14); }
    .player-card.drafted { opacity: 0.3; pointer-events: none; }
    .pos-badge { font-family: 'Bebas Neue', cursive; font-size: 0.7rem; letter-spacing: 1px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,0.07); color: var(--silver); min-width: 26px; text-align: center; flex-shrink: 0; }
    .pos-badge.F { background: rgba(200,16,46,0.18); color: #ff7a8a; }
    .pos-badge.D { background: rgba(26,58,110,0.45); color: #7db4ff; }
    .pos-badge.G { background: rgba(255,184,28,0.14); color: var(--gold); }
    .card-team-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; opacity: 0.85; }
    .player-info { flex: 1; min-width: 0; }
    .player-name { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
    .player-salary { font-size: 0.75rem; color: var(--silver); letter-spacing: 0.3px; font-weight: 600; margin-top: 1px; }
    .stat-boxes { display: flex; gap: 5px; flex-shrink: 0; }
    .stat-box { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 5px; padding: 3px 7px; min-width: 44px; text-align: center; }
    .stat-box-pts { background: rgba(255,184,28,0.08); border: 1px solid rgba(255,184,28,0.2); }
    .stat-box-goals { background: rgba(200,16,46,0.08); border: 1px solid rgba(200,16,46,0.2); }
    .stat-box-assists { background: rgba(100,140,255,0.08); border: 1px solid rgba(100,140,255,0.2); }
    .stat-box-eff { background: rgba(34,197,94,0.07); border: 1px solid rgba(34,197,94,0.2); }
    .stat-box-gp { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); }
    .stat-box-main { font-family: 'Bebas Neue', cursive; font-size: 1.2rem; line-height: 1; letter-spacing: 1px; }
    .stat-box-pts .stat-box-main { color: var(--gold); }
    .stat-box-goals .stat-box-main { color: #ff7a8a; }
    .stat-box-assists .stat-box-main { color: #7db4ff; }
    .stat-box-eff .stat-box-main { color: #22c55e; }
    .stat-box-gp .stat-box-main { color: rgba(255,255,255,0.55); }
    .stat-box-label { font-family: 'Bebas Neue', cursive; font-size: 0.65rem; letter-spacing: 2px; margin-top: 1px; }
    .stat-box-pts .stat-box-label { color: rgba(255,184,28,0.5); }
    .stat-box-goals .stat-box-label { color: rgba(255,122,138,0.5); }
    .stat-box-assists .stat-box-label { color: rgba(125,180,255,0.5); }
    .stat-box-eff .stat-box-label { color: rgba(34,197,94,0.5); }
    .stat-box-gp .stat-box-label { color: rgba(255,255,255,0.25); }
    .btn-draft-player {
      font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 1.5px;
      background: rgba(200,16,46,0.1); border: 1px solid rgba(200,16,46,0.3); color: var(--red);
      border-radius: 5px; padding: 4px 12px; cursor: pointer; flex-shrink: 0;
      transition: background 0.15s, color 0.15s; white-space: nowrap;
    }
    .btn-draft-player:not(:disabled):hover { background: rgba(200,16,46,0.22); color: #ff4d6a; }
    .btn-draft-player:disabled { opacity: 0.25; cursor: default; }


    /* ── Done screen ── */
    #done-screen {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;
    }
    .done-box {
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem;
      max-width: 480px;
    }
    .done-icon { font-size: 3.5rem; }
    .done-title { font-family: 'Bebas Neue', cursive; font-size: 2.5rem; letter-spacing: 6px; color: var(--gold); }
    .done-sub { color: var(--silver); font-size: 0.9rem; letter-spacing: 1px; line-height: 1.6; }
    .btn-done-action {
      font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 2px;
      background: var(--gold); color: var(--rink);
      border: none; border-radius: 7px; padding: 0.65rem 2rem;

(async function init() {
  const params = new URLSearchParams(window.location.search);

// ── Prefill managers from roster teams ───────────────────────────
async function prefillManagersFromRoster() {
  try {
    const rows = await dbGet('pool_rosters', `league_code=eq.${LEAGUE_CODE}&select=data`);
    if (!rows || !rows.length) { fallbackManagerInputs(); return; }
    const data = rows[0].data;
    const teamNames = (data?.teams || []).map(t => t.name).filter(Boolean);
    if (!teamNames.length) { fallbackManagerInputs(); return; }
    document.getElementById('setup-manager-list').innerHTML = '';
    teamNames.forEach(name => addManagerInput(name));
  } catch(e) {
    fallbackManagerInputs();
  }
}

function fallbackManagerInputs() {
  if (!document.getElementById('setup-manager-list').children.length) {
    for (let i = 0; i < 4; i++) addManagerInput();
  }
}

async function loadRosterDraftedNames() {
  try {
    const rows = await dbGet('pool_rosters', `league_code=eq.${LEAGUE_CODE}&select=data`);
    if (!rows || !rows.length) return;
    const data = rows[0].data;
    const allSlugs = new Set();
    for (const t of (data?.teams || [])) {
      [...(t.roster?.F||[]), ...(t.roster?.D||[]), ...(t.roster?.G||[])].forEach(s => { if (s) allSlugs.add(s); });
    }
    // Convert slugs → player names using allPlayers
    const nameBySlug = {};
    for (const p of allPlayers) { if (p.puckpedia_slug && p.player_name) nameBySlug[p.puckpedia_slug] = p.player_name; }
    rosterDraftedNames = new Set([...allSlugs].map(s => nameBySlug[s]).filter(Boolean));
    renderPlayerPool();
  } catch(e) {}
}

async function dbGet(table, filter='') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, { headers: sbH() });
  if (!res.ok) return null;
  return res.json();
}

async function dbUpsert(table, body) {
  return fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: sbH({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify(body),
  });
}

async function dbPatch(table, filter, body) {
  return fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
    method: 'PATCH',
    headers: sbH({ 'Prefer': 'return=minimal' }),
    body: JSON.stringify(body),
  });
}

//  LOAD DRAFT FROM DB
// ══════════════════════════════════════════════════════════════════
async function loadDraftFromDB(isReturn = false) {
  try {
    const [settings, order, picks, league] = await Promise.all([
      dbGet('pool_draft_settings', `league_code=eq.${LEAGUE_CODE}&select=*`),
      dbGet('pool_draft_order', `league_code=eq.${LEAGUE_CODE}&select=*&order=slot.asc`),
      dbGet('pool_draft_picks', `league_code=eq.${LEAGUE_CODE}&select=*&order=overall_pick.asc`),
      dbGet('pool_leagues', `code=eq.${LEAGUE_CODE}&select=name`),
    ]);

    if (league && league.length) {
      const ln = league[0].name || LEAGUE_CODE;
    }

    if (settings && settings.length) {
      const s = settings[0];
      draftState.mode = s.mode || 'snake';
      draftState.rounds = s.round_count || 15;
      draftState.timerSecs = s.pick_timer_secs || 0;
      draftState.status = s.status || 'pending';
    }
    if (order && order.length) {
      draftState.managers = order.map(r => ({ name: r.manager_name, slot: r.slot }));
    }
    if (picks && picks.length) {
      draftState.picks = picks.map(r => ({
        round: r.round, pickInRound: r.pick_in_round,
        overallPick: r.overall_pick, managerName: r.manager_name,
        playerName: r.player_name,
        playerPos: normalizePos(r.player_pos),
        playerRawPos: r.player_pos,
      }));
      lastPickCount = draftState.picks.length;
    }

    if (draftState.status === 'active' || draftState.status === 'done') {
      showDraftScreen(true);
    }
    // else stay on setup screen
  } catch(e) {
    console.warn('loadDraftFromDB:', e);
  }
}

function randomizeOrder() {
  const rows = [...document.querySelectorAll('#setup-manager-list .manager-row')];
  const names = rows.map(r => r.querySelector('.manager-name-input').value);
  // Fisher-Yates
  for (let i = names.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [names[i], names[j]] = [names[j], names[i]];
  }
  rows.forEach((r, i) => { r.querySelector('.manager-name-input').value = names[i]; });

  // Flash
  rows.forEach(r => { r.style.transition='background 0.2s'; r.style.background='rgba(59,130,246,0.12)'; });

async function startDraft() {
  const errEl = document.getElementById('setup-error');
  errEl.textContent = '';

  const mode = document.getElementById('setup-mode').value;
  const rounds = 26;
  const timerSecs = parseInt(document.getElementById('setup-timer').value);

  const rows = [...document.querySelectorAll('#setup-manager-list .manager-row')];
  const managers = rows.map((r, i) => ({
    slot: i + 1,
    name: r.querySelector('.manager-name-input').value.trim() || `Manager ${i+1}`,
  }));

  if (managers.length < 2) { errEl.textContent = 'Add at least 2 managers.'; return; }

  const commishName = managers[0]?.name || 'Commissioner';

  const btn = document.getElementById('btn-start');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Starting…';

  // Save commish name
  localStorage.setItem(`hp_commish_${LEAGUE_CODE}`, commishName);
  localStorage.setItem(`hp_myname_${LEAGUE_CODE}`, commishName);

  draftState = { mode, rounds, timerSecs, managers, picks: [], status: 'active' };
  isCommish = true;
  myName = commishName;

  try {
    // Upsert settings
    await dbUpsert('pool_draft_settings', {
      league_code: LEAGUE_CODE,
      mode, round_count: rounds, pick_timer_secs: timerSecs, status: 'active',
    });
    // Clear old order + picks
    await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/pool_draft_order?league_code=eq.${LEAGUE_CODE}`, { method: 'DELETE', headers: sbH() }),
      fetch(`${SUPABASE_URL}/rest/v1/pool_draft_picks?league_code=eq.${LEAGUE_CODE}`, { method: 'DELETE', headers: sbH() }),
    ]);
    // Insert new order
    await dbUpsert('pool_draft_order', managers.map(m => ({
      league_code: LEAGUE_CODE, manager_name: m.name, slot: m.slot,
    })));
  } catch(e) { console.warn('startDraft DB error:', e); }

  showDraftScreen();
}

// ── Pick order logic ──────────────────────────────────────────────
function getPickOrder() {
  // Returns array of {round, pickInRound, overallPick, managerName}
  const n = draftState.managers.length;
  const r = draftState.rounds;
  const order = [];
  let overall = 1;
  for (let round = 1; round <= r; round++) {
    const isReverse = draftState.mode === 'snake' && round % 2 === 0;
    const managers = isReverse
      ? [...draftState.managers].reverse()
      : [...draftState.managers];
    managers.forEach((m, i) => {
      order.push({ round, pickInRound: i + 1, overallPick: overall++, managerName: m.name });
    });
  }
  return order;
}

function getCurrentPick() {
  const order = getPickOrder();
  const nextIdx = draftState.picks.length;
  return order[nextIdx] || null;
}

// ── Board ─────────────────────────────────────────────────────────
function renderModeBadge() {
  document.getElementById('mode-badge').textContent = draftState.mode === 'snake' ? '🐍 SNAKE' : '➡️ LINEAR';
}

function renderBoard() {
  const board = document.getElementById('draft-board');
  const order = getPickOrder();
  const n = draftState.managers.length;
  const pickMap = {};
  draftState.picks.forEach(p => { pickMap[p.overallPick] = p; });
  const currentOverall = draftState.picks.length + 1;

  let html = '';
  for (let round = 1; round <= draftState.rounds; round++) {
    const roundPicks = order.filter(p => p.round === round);
    html += `<div class="board-round">
      <div class="board-round-label">Round ${round}</div>
      <div class="board-picks-row">`;
    roundPicks.forEach(p => {
      const filled = pickMap[p.overallPick];
      const isCurrent = p.overallPick === currentOverall && draftState.status === 'active';
      const posClass = filled ? `pos-${filled.playerPos}` : 'pos-default';
      html += `<div class="pick-cell ${filled ? 'filled' : ''} ${isCurrent ? 'current-pick' : ''}">
        <span class="pick-num">#${p.overallPick}</span>
        <div class="pick-manager">${escHtml(p.managerName)}</div>
        ${filled
          ? `<div class="pick-player">${escHtml(filled.playerName)}</div>
             <span class="pick-pos ${posClass}">${filled.playerPos}</span>`
          : isCurrent ? `<div style="color:var(--red);font-size:0.75rem;font-weight:700;letter-spacing:1px;margin-top:2px;">ON CLOCK</div>` : ''
        }
      </div>`;
    });
    html += `</div></div>`;
  }
  board.innerHTML = html;

  // Scroll to current pick
  const currentEl = board.querySelector('.current-pick');
  if (currentEl) {
    setTimeout(() => currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
  }
}

function renderManagerStrip() {
  const strip = document.getElementById('manager-strip');
  const current = getCurrentPick();
  const pickCounts = {};
  draftState.picks.forEach(p => { pickCounts[p.managerName] = (pickCounts[p.managerName] || 0) + 1; });

  strip.innerHTML = draftState.managers.map(m => {
    const isActive = current && current.managerName === m.name;
    const isMe = m.name === myName;
    const count = pickCounts[m.name] || 0;
    return `<div class="manager-chip ${isActive ? 'active' : ''} ${isMe ? 'you-chip' : ''}">
      <div class="chip-name">${escHtml(m.name)}</div>
      <div class="chip-picks">${count} pick${count !== 1 ? 's' : ''}</div>
      ${isActive ? '<div class="chip-clock">ON CLOCK</div>' : ''}
    </div>`;
  }).join('');

  renderPosSlotsBar();
  renderPickHistory();
}

function updateClock() {
  const current = getCurrentPick();
  const el = document.getElementById('on-clock-name');
  const badge = document.getElementById('round-badge');

  if (!current || draftState.status === 'done') {
    el.textContent = 'Draft Complete!';

  }

  el.textContent = current.managerName;
  el.className = 'on-clock-name' + (current.managerName === myName ? ' you' : '');

function normalizePos(pos) {
  if (!pos) return 'F';
  const p = pos.toUpperCase();
  if (p.includes('G')) return 'G';
  if (p === 'D' || p.includes('LD') || p.includes('RD')) return 'D';
  return 'F';
}

function formatName(name) {
  if (!name) return '';
  if (name.includes(',')) { const [last, first] = name.split(',').map(s => s.trim()); return `${first} ${last}`; }
  return name;
}

function poolScore(p) {
  const pos = normalizePos(p.position);
  if (pos === 'G') return (p.wins ?? 0) * 2 + (p.shutouts ?? 0) * 3;
  if (pos === 'D') return (p.goals ?? 0) + (p.assists ?? 0);
  return (p.points ?? 0);
}

function effScore(p) {
  if (p._eff !== undefined) return p._eff;
  const capM = (p.cap_hit || 1) / 1_000_000;
  p._eff = poolScore(p) / Math.sqrt(capM);
  return p._eff;
}

function playerSortKey(p) {
  if (activeSort === 'points') return poolScore(p);
  if (activeSort === 'value')  return effScore(p);
  return p.cap_hit || 0;
}

function renderPlayerPool() { _poolPage = 0; _renderPoolPage(); }

function _renderPoolPage() {
  const query = (document.getElementById('pool-search')?.value || '').toLowerCase().trim();
  const drafted = new Set([...draftState.picks.map(p => p.playerName), ...rosterDraftedNames]);
  const current = getCurrentPick();
  const isMyTurn = !!current;

  const filtered = allPlayers.filter(p => {
    if (!p.player_name) return false;
    if (activeFilter !== 'ALL' && normalizePos(p.position) !== activeFilter) return false;
    if (activeNHLTeam !== 'ALL' && p.team !== activeNHLTeam) return false;
    if (query && !p.player_name.toLowerCase().includes(query)) return false;
    return true;
  }).slice().sort((a, b) => playerSortKey(b) - playerSortKey(a));

  const list = document.getElementById('pool-list');
  if (!filtered.length) { list.innerHTML = '<div class="empty-msg">No players found.</div>'; return; }

  const visible = filtered.slice(0, (_poolPage + 1) * PAGE_SIZE);
  list.innerHTML = '';
  visible.forEach(p => {
    const pos = normalizePos(p.position);
    const isDrafted = drafted.has(p.player_name);
    list.appendChild(makePoolCard(p, pos, isDrafted, isMyTurn));
  });

  if (filtered.length > visible.length) {
    const remaining = filtered.length - visible.length;
    const btn = document.createElement('button');
    btn.className = 'load-more-btn';
    btn.textContent = `Load more (${remaining} remaining)`;
    btn.onclick = () => { _poolPage++; _renderPoolPage(); };
    list.appendChild(btn);
  }
}

function makePoolCard(player, pos, isDrafted, isMyTurn) {
  const el = document.createElement('div');
  el.className = 'player-card' + (isDrafted ? ' drafted' : '');
  const salary = player.cap_hit ? '$' + player.cap_hit.toLocaleString() : 'No contract';
  const eff = player.cap_hit ? effScore(player).toFixed(1) : null;
  const effBox = eff ? `<div class="stat-box stat-box-eff"><div class="stat-box-main">${eff}</div><div class="stat-box-label">EFF</div></div>` : '';
  const gpBox = player.games_played != null ? `<div class="stat-box stat-box-gp"><div class="stat-box-main">${player.games_played}</div><div class="stat-box-label">GP</div></div>` : '';
  let statBoxHtml;
  if (pos === 'G') {
    statBoxHtml = player.wins != null ? `<div class="stat-boxes">${gpBox}<div class="stat-box stat-box-pts"><div class="stat-box-main">${player.wins}</div><div class="stat-box-label">WINS</div></div>${player.shutouts ? `<div class="stat-box stat-box-pts"><div class="stat-box-main">${player.shutouts}</div><div class="stat-box-label">SO</div></div>` : ''}${effBox}</div>` : '';
  } else {
    statBoxHtml = player.points != null ? `<div class="stat-boxes">${gpBox}<div class="stat-box stat-box-goals"><div class="stat-box-main">${player.goals}</div><div class="stat-box-label">G</div></div><div class="stat-box stat-box-assists"><div class="stat-box-main">${player.assists}</div><div class="stat-box-label">A</div></div><div class="stat-box stat-box-pts"><div class="stat-box-main">${player.points}</div><div class="stat-box-label">PTS</div></div>${effBox}</div>` : '';
  }
  const abbr = TEAM_ABBR[player.team];
  const logoHtml = abbr ? `<img class="card-team-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
  el.innerHTML = `<span class="pos-badge ${pos}">${pos}</span>${logoHtml}<div class="player-info"><div class="player-name">${formatName(player.player_name)}</div><div class="player-salary">${salary}</div></div>${statBoxHtml}<button class="btn-draft-player" ${!isMyTurn || isDrafted ? 'disabled' : ''}>DRAFT</button>`;
  const btn = el.querySelector('.btn-draft-player');
  if (btn && !isDrafted && isMyTurn) {
    const current = getCurrentPick();
    if (current && isPosSlotFull(current.managerName, pos)) {
      btn.disabled = true;
      btn.title = `${pos} slots full`;
      btn.textContent = 'FULL';
    } else {
      btn.addEventListener('click', () => draftPlayer(player.player_name, player.position || pos, pos));
    }
  }
  return el;
}

function autosizeBoardPanel() {

async function draftPlayer(playerName, rawPos, normalizedPos) {
  const current = getCurrentPick();
  if (!current) return;
  const drafted = new Set([...draftState.picks.map(p => p.playerName), ...rosterDraftedNames]);
  if (drafted.has(playerName)) return;

  stopTimer();

  // Store raw pos for DB: take first value only (e.g. "C,LW" → "C") to satisfy check constraint
  const dbPos = ((rawPos || '').split(',')[0].trim().toUpperCase()) || 'C';
  const grpPos = normalizedPos || normalizePos(rawPos);

  const prevPickCount = draftState.picks.length;

  const pick = {
    round: current.round,
    pickInRound: current.pickInRound,
    overallPick: current.overallPick,
    managerName: current.managerName,
    playerName,
    playerPos: grpPos,   // F/D/G used locally for grouping
    playerRawPos: dbPos, // real pos stored in DB
  };
  draftState.picks.push(pick);

  // Round-change animation
  maybeShowRoundFlash(prevPickCount, draftState.picks.length);

  // Check if done
  const totalPicks = draftState.managers.length * draftState.rounds;
  if (draftState.picks.length >= totalPicks) draftState.status = 'done';

  // Optimistic UI
  renderBoard();
  renderManagerStrip();
  updateClock();
  renderPlayerPool();
  showPickToast(current.managerName, playerName, grpPos, current.overallPick);

  if (draftState.status !== 'done') startTimer();
  else { await finalizeDraft(); return; }

  // Persist to DB
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/pool_draft_picks?on_conflict=league_code,overall_pick`,
      {
        method: 'POST',
        headers: sbH({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify({
          league_code: LEAGUE_CODE,
          round: pick.round,
          pick_in_round: pick.pickInRound,
          overall_pick: pick.overallPick,
          manager_name: pick.managerName,
          player_name: pick.playerName,
          player_pos: pick.playerRawPos,
        }),
      }
    );
    if (!res.ok) {
      const err = await res.text();
      console.error('draftPlayer DB error:', res.status, err);
      alert('Pick failed to save: ' + err);
      return;
    }
    lastPickCount = draftState.picks.length;
    syncRosterToJoinFormat().catch(() => {});
  } catch(e) { console.error('draftPlayer DB error:', e); alert('Pick failed: ' + e.message); }
}

function showPickToast(manager, player, pos, overall) {
  document.querySelectorAll('.pick-toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'pick-toast';
  el.innerHTML = `<span>#${overall}</span> <strong>${escHtml(manager)}</strong> picks <strong>${escHtml(player)}</strong> <span style="color:var(--silver);font-size:0.75rem;">(${pos})</span>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── Timer ─────────────────────────────────────────────────────────
function startTimer() {
  stopTimer();
  if (!draftState.timerSecs) return;
  timerRemaining = draftState.timerSecs;
  const el = document.getElementById('timer-display');
  el.classList.remove('hidden', 'urgent');
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerRemaining--;
    if (timerRemaining <= 0) {
      stopTimer();
      autoSkip();
    } else {
      updateTimerDisplay();
      if (timerRemaining <= 15) el.classList.add('urgent');
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  const el = document.getElementById('timer-display');
  el.classList.add('hidden');
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-display');
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  el.textContent = `${m}:${String(s).padStart(2,'0')}`;
}

async function autoSkip() {
  // Auto-pick: pick the first available player in pool
  const drafted = new Set([...draftState.picks.map(p => p.playerName), ...rosterDraftedNames]);
  const available = allPlayers.find(p => !drafted.has(p.player_name));
  if (available) await draftPlayer(available.player_name, normalizePos(available.position));
}

// ── Realtime / Polling ────────────────────────────────────────────
function subscribeRealtime() {
  // Supabase Realtime via WebSocket
  try {
    const wsUrl = SUPABASE_URL.replace('https', 'wss') + '/realtime/v1/websocket?apikey=' + SUPABASE_KEY + '&vsn=1.0.0';
    const ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      ws.send(JSON.stringify({ topic: `realtime:public:pool_draft_picks:league_code=eq.${LEAGUE_CODE}`, event: 'phx_join', payload: {}, ref: '1' }));
    };
    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.event === 'INSERT' && msg.payload?.record) {
          handleRemotePick(msg.payload.record);
        }
      } catch(e) {}
    };
    ws.onerror = () => {}; // Fallback to polling
    realtimeChannel = ws;
  } catch(e) {}
}

function handleRemotePick(record) {
  // Don't double-add picks we made ourselves
  const exists = draftState.picks.find(p => p.overallPick === record.overall_pick);
  if (exists) return;

  const prevPickCount = draftState.picks.length;

  draftState.picks.push({
    round: record.round, pickInRound: record.pick_in_round,
    overallPick: record.overall_pick, managerName: record.manager_name,
    playerName: record.player_name,
    playerPos: normalizePos(record.player_pos),
    playerRawPos: record.player_pos,
  });
  draftState.picks.sort((a,b) => a.overallPick - b.overallPick);
  lastPickCount = draftState.picks.length;

  maybeShowRoundFlash(prevPickCount, draftState.picks.length);

  stopTimer();
  renderBoard();
  renderManagerStrip();
  updateClock();
  renderPlayerPool();
  showPickToast(record.manager_name, record.player_name, record.player_pos, record.overall_pick);

  const total = draftState.managers.length * draftState.rounds;
  if (draftState.picks.length >= total) { draftState.status = 'done'; showDoneScreen(); return; }
  startTimer();
}

async function pollForNewPicks() {
  try {
    const picks = await dbGet('pool_draft_picks',
      `league_code=eq.${LEAGUE_CODE}&select=*&order=overall_pick.asc&overall_pick=gt.${lastPickCount > 0 ? draftState.picks[draftState.picks.length-1]?.overallPick || 0 : 0}`);
    if (picks && picks.length) {
      picks.forEach(r => handleRemotePick(r));
    }
  } catch(e) {}
}

async function clearRosterSlugs() {
  const rows = await dbGet('pool_rosters', `league_code=eq.${LEAGUE_CODE}&select=data`);
  if (!rows || !rows.length) return;
  const teams = (rows[0].data?.teams || []).map(t => ({
    ...t,
    roster: {
      F: Array(12).fill(null),
      D: Array(6).fill(null),
      G: Array(2).fill(null),
    },
  }));
  const data = { teams, activeTeamId: rows[0].data?.activeTeamId || teams[0]?.id || null };
  await fetch(`${SUPABASE_URL}/rest/v1/pool_rosters?on_conflict=league_code`, {
    method: 'POST',
    headers: sbH({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify({ league_code: LEAGUE_CODE, data, updated_at: new Date().toISOString() }),
  });
}

// ── Reset ─────────────────────────────────────────────────────────
function promptResetDraft() {
  if (!confirm('Reset the draft? This will delete all picks and return to the setup screen. This cannot be undone.')) return;
  doResetDraft();
}

async function doResetDraft() {
  stopTimer();
  clearInterval(pollingInterval);
  if (realtimeChannel) { try { realtimeChannel.close(); } catch(e) {} realtimeChannel = null; }

  try {
    await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/pool_draft_picks?league_code=eq.${LEAGUE_CODE}`, { method: 'DELETE', headers: sbH() }),
      fetch(`${SUPABASE_URL}/rest/v1/pool_draft_order?league_code=eq.${LEAGUE_CODE}`, { method: 'DELETE', headers: sbH() }),
      fetch(`${SUPABASE_URL}/rest/v1/pool_draft_settings?league_code=eq.${LEAGUE_CODE}`, { method: 'DELETE', headers: sbH() }),
    ]);
    // Clear roster slugs but keep team names so join.html shows empty rosters
    await clearRosterSlugs();
  } catch(e) { console.warn('doResetDraft error:', e); }

  draftState = { mode: 'snake', rounds: 15, timerSecs: 90, managers: [], picks: [], status: 'pending' };
  lastPickCount = 0;
  myName = '';
  isCommish = false;

  document.getElementById('setup-manager-list').innerHTML = '';
  await prefillManagersFromRoster();
  document.getElementById('setup-error').textContent = '';
  const btn = document.getElementById('btn-start');
  btn.disabled = false; btn.textContent = '🚨 Start Draft';

  document.getElementById('draft-screen').style.display = 'none';
  document.getElementById('draft-screen').classList.add('hidden');
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('done-screen').classList.add('hidden');
  document.getElementById('setup-screen').style.display = '';
  document.getElementById('setup-screen').classList.remove('hidden');
}

// ── Finalize ──────────────────────────────────────────────────────
async function finalizeDraft() {
  try {
    await Promise.all([
      dbPatch('pool_draft_settings', `league_code=eq.${LEAGUE_CODE}`, { status: 'done' }),
      syncRosterToJoinFormat(),
    ]);
  } catch(e) { console.warn('finalizeDraft error:', e); }
  showDoneScreen();
}

// Writes pool_rosters in the exact format join.html expects so drafted
// players appear on the draft page immediately.
async function syncRosterToJoinFormat() {
  // Build slug lookup: prefer matching by name+normalizedPos to handle duplicate names
  const slugByNamePos = {};
  for (const p of allPlayers) {
    if (p.player_name && p.puckpedia_slug) {
      const key = p.player_name + '|' + normalizePos(p.position);
      slugByNamePos[key] = p.puckpedia_slug;
      // Also store plain name as fallback
      if (!slugByNamePos[p.player_name]) slugByNamePos[p.player_name] = p.puckpedia_slug;
    }
  }

  const SLOTS = { F: 12, D: 6, G: 2 };

  // Group picks by manager
  const byManager = {};
  for (const m of draftState.managers) byManager[m.name] = { F: [], D: [], G: [] };
  for (const pick of draftState.picks) {
    const group = pick.playerPos === 'D' ? 'D' : pick.playerPos === 'G' ? 'G' : 'F';
    if (byManager[pick.managerName]) byManager[pick.managerName][group].push(pick.playerName);
  }

  // Build teams array matching join.html format
  const teams = draftState.managers.map(m => {
    const picked = byManager[m.name] || { F: [], D: [], G: [] };
    const roster = {};
    for (const [grp, max] of Object.entries(SLOTS)) {
      const slugs = picked[grp].map(name => slugByNamePos[name + '|' + grp] || slugByNamePos[name] || null);
      // Pad to max slots with nulls
      while (slugs.length < max) slugs.push(null);
      roster[grp] = slugs.slice(0, max);
    }
    return { id: m.name, name: m.name, roster };
  });

  const data = { teams, activeTeamId: teams[0]?.id || null };

  await fetch(`${SUPABASE_URL}/rest/v1/pool_rosters`, {
    method: 'POST',
    headers: sbH({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify({ league_code: LEAGUE_CODE, data, updated_at: new Date().toISOString() }),
  });
}

function showDoneScreen() {
  clearInterval(pollingInterval);
  if (realtimeChannel) try { realtimeChannel.close(); } catch(e) {}
  stopTimer();
  document.getElementById('draft-screen').style.display = 'none';
  document.getElementById('done-screen').style.display = 'flex';
  document.getElementById('done-screen').classList.remove('hidden');
  document.getElementById('done-sub').textContent =
    `${draftState.managers.length} managers • ${draftState.picks.length} total picks. Rosters are locked in.`;
  renderDoneRosterGrid();
}

function goStandings() { window.location.href = `/pool/standings?league=${LEAGUE_CODE}`; }
function viewRosters() { window.location.href = `/pool/join?league=${LEAGUE_CODE}`; }

// ══════════════════════════════════════════════════════════════════
//  DRAG RESIZE
// ══════════════════════════════════════════════════════════════════
(function initDragResize() {
  const handle = document.getElementById('drag-handle');
  const board  = document.querySelector('.draft-board-wrap');
  const main   = document.getElementById('draft-main');
  if (!handle || !board || !main) return;

  const isMobile = () => window.innerWidth <= 768;
  let dragging = false, startX, startY, startW, startH;

  handle.addEventListener('mousedown', e => {
    if (isMobile()) return;
    dragging = true;
    startX = e.clientX;
    startW = board.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  handle.addEventListener('touchstart', e => {
    if (!isMobile()) return;
    dragging = true;
    startY = e.touches[0].clientY;
    startH = board.getBoundingClientRect().height;
    handle.classList.add('dragging');
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const newW = Math.max(160, Math.min(700, startW + dx));
    board.style.width = newW + 'px';
  });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    const newH = Math.max(120, Math.min(500, startH + dy));
    board.style.height = newH + 'px';
    board.style.maxHeight = newH + 'px';
  }, { passive: false });

  function stopDrag() {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);
})();


// ══════════════════════════════════════════════════════════════════
//  POSITION SLOTS TRACKER
// ══════════════════════════════════════════════════════════════════
const POS_LIMITS = { F: 12, D: 6, G: 2 };

function getPosCountsForManager(managerName) {
  const counts = { F: 0, D: 0, G: 0 };
  for (const pick of draftState.picks) {
    if (pick.managerName !== managerName) continue;
    const pos = pick.playerPos === 'D' ? 'D' : pick.playerPos === 'G' ? 'G' : 'F';
    counts[pos]++;
  }
  return counts;
}

function renderPosSlotsBar() {
  const bar = document.getElementById('pos-slots-bar');
  if (!bar) return;
  const current = getCurrentPick();
  const manager = current ? current.managerName : (myName || (draftState.managers[0]?.name || ''));
  if (!manager) { bar.innerHTML = ''; return; }

  const counts = getPosCountsForManager(manager);
  const label = current
    ? `<span class="pos-slots-label">On clock:</span><span class="pos-slots-manager">${escHtml(manager)}</span>`
    : `<span class="pos-slots-label">My slots:</span><span class="pos-slots-manager">${escHtml(manager)}</span>`;

  const chips = Object.entries(POS_LIMITS).map(([pos, max]) => {
    const used = counts[pos] || 0;
    const remaining = max - used;
    const cls = remaining === 0 ? 'full' : remaining <= 1 ? 'near-full' : '';
    return `<div class="pos-slot-chip ${cls}"><span class="slot-pos">${pos}</span>${used}/${max}</div>`;
  }).join('');

  bar.innerHTML = label + chips;
}

function isPosSlotFull(managerName, playerPos) {
  const pos = playerPos === 'D' ? 'D' : playerPos === 'G' ? 'G' : 'F';
  const counts = getPosCountsForManager(managerName);
  return (counts[pos] || 0) >= (POS_LIMITS[pos] || 99);
}

// ══════════════════════════════════════════════════════════════════
//  ROUND-CHANGE ANIMATION
// ══════════════════════════════════════════════════════════════════
let _lastAnimatedRound = 0;

function maybeShowRoundFlash(prevPickCount, newPickCount) {
  if (newPickCount === 0) return;
  const n = draftState.managers.length;
  if (!n) return;
  // The round just completed if newPickCount is a multiple of n and > prevPickCount
  if (newPickCount % n === 0 && newPickCount > prevPickCount) {
    const completedRound = newPickCount / n;
    if (completedRound !== _lastAnimatedRound && completedRound < draftState.rounds) {
      _lastAnimatedRound = completedRound;
      const el = document.createElement('div');
      el.className = 'round-flash';
      el.textContent = `Round ${completedRound + 1}`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1700);
    }
  }
}

// ══════════════════════════════════════════════════════════════════
//  PICK HISTORY DRAWER
// ══════════════════════════════════════════════════════════════════
function renderPickHistory() {
  const drawer = document.getElementById('pick-history-drawer');
  if (!drawer) return;
  if (!draftState.picks.length) { drawer.innerHTML = '<div class="pick-history-row" style="color:rgba(255,255,255,0.3);">No picks yet.</div>'; return; }
  // Most recent first
  const rows = [...draftState.picks].reverse().map(p =>
    `<div class="pick-history-row">
      <span class="pick-history-num">#${p.overallPick}</span>
      <span class="pick-history-manager">${escHtml(p.managerName)}</span>
      <span class="pick-history-player">${escHtml(p.playerName)}</span>
      <span class="pick-history-pos ${p.playerPos}">${p.playerPos}</span>
    </div>`
  ).join('');
  drawer.innerHTML = rows;
}

function togglePickHistory() {
  const toggle = document.getElementById('pick-history-toggle');
  const drawer = document.getElementById('pick-history-drawer');
  if (!toggle || !drawer) return;
  const isOpen = toggle.classList.toggle('open');
  drawer.classList.toggle('open', isOpen);
}

// ══════════════════════════════════════════════════════════════════
//  DONE SCREEN ROSTER GRID
// ══════════════════════════════════════════════════════════════════
function renderDoneRosterGrid() {
  const grid = document.getElementById('done-roster-grid');
  if (!grid) return;

  const SECTIONS = [
    { label: 'FORWARDS', pos: 'F', slots: 12 },
    { label: 'DEFENCE',  pos: 'D', slots: 6 },
    { label: 'GOALIES',  pos: 'G', slots: 2 },
  ];

  // Group picks by manager + pos
  const byManager = {};
  for (const m of draftState.managers) byManager[m.name] = { F: [], D: [], G: [] };
  for (const pick of draftState.picks) {
    const grp = pick.playerPos === 'D' ? 'D' : pick.playerPos === 'G' ? 'G' : 'F';
    byManager[pick.managerName]?.[grp].push(pick.playerName);
  }

  grid.innerHTML = draftState.managers.map(m => {
    const picked = byManager[m.name] || { F: [], D: [], G: [] };
    const sections = SECTIONS.map(s => {
      const players = picked[s.pos] || [];
      const rows = Array.from({ length: s.slots }, (_, i) => {
        const name = players[i];
        return `<div class="done-roster-player ${name ? '' : 'empty'}">${name ? escHtml(name) : '—'}</div>`;
      }).join('');
      return `<div class="done-pos-section">
        <div class="done-pos-header">${s.label}</div>
        ${rows}
      </div>`;
    }).join('');
    return `<div class="done-team-col">
      <div class="done-team-name">${escHtml(m.name)}</div>
      ${sections}
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════════════
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
