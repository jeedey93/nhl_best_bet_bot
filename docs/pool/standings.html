<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool Standings | Parieur Discipliné</title>
  <link rel="icon" type="image/png" href="../parieur_discipline_icon_1024.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rink: #07111f;
      --red: #c8102e;
      --gold: #ffb81c;
      --silver: #a8b2be;
      --green: #22c55e;
      --blue: #7db4ff;
      --pink: #ff7a8a;
      --line: rgba(255,255,255,0.08);
      --nav-h: 44px;
      --row-f:   rgba(255, 100, 120, 0.13);
      --row-d:   rgba(80,  160, 255, 0.13);
      --row-g:   rgba(255, 184,  28, 0.13);
      --row-sum: rgba(255, 255, 255, 0.06);
    }
    body { background: var(--rink); background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,110,0.6) 0%, transparent 70%); min-height: 100vh; font-family: 'Barlow Condensed', sans-serif; color: white; padding-top: var(--nav-h); }

    .site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(7,17,31,0.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    .site-nav-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: var(--nav-h); padding: 0 1.5rem; }
    .site-nav-brand { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; color: var(--gold); letter-spacing: 4px; text-decoration: none; }
    .site-nav-links { display: flex; align-items: center; gap: 0.5rem; }
    .site-nav-links a { font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 600; color: var(--silver); text-decoration: none; padding: 0.3rem 0.8rem; border-radius: 5px; letter-spacing: 1.5px; transition: color 0.15s, background 0.15s; }
    .site-nav-links a:hover { color: white; background: rgba(255,255,255,0.07); }
    .site-nav-links a.active { color: var(--gold); background: rgba(255,184,28,0.1); }

    .page-wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

    /* Expand All Teams beyond tab width only when needed */
    @media (min-width: 901px) {
      .allteams-mode.allteams-needs-wide #view-allteams {
        width: min(1400px, calc(100vw - 1.5rem));
        margin-left: 50%;
        transform: translateX(-50%);
      }
    }



    header { text-align: center; margin-bottom: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    header h1 { font-family: 'Bebas Neue', cursive; font-size: clamp(1.8rem, 4vw, 2.8rem); letter-spacing: 5px; line-height: 1; text-shadow: 0 0 30px rgba(200,16,46,0.4), 0 2px 8px rgba(0,0,0,0.8); }
    header h1 span { color: var(--gold); }
    .league-code-badge { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem; font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; font-weight: 700; color: var(--silver); letter-spacing: 2px; text-transform: uppercase; }
    .league-code-badge span { font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 3px; color: var(--gold); background: rgba(255,184,28,0.1); border: 1px solid rgba(255,184,28,0.3); border-radius: 4px; padding: 1px 10px; }
    .header-controls { display: flex; align-items: center; gap: 0.5rem; justify-content: center; }
    .btn-sync { font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 1.5px; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: var(--green); border-radius: 6px; padding: 4px 12px; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
    .btn-sync:hover { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.5); }
    .btn-sync:disabled { opacity: 0.5; cursor: not-allowed; }
    .sync-status { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; color: rgba(34,197,94,0.7); margin-left: 0.3rem; }
    .sync-status.error { color: rgba(200,16,46,0.7); }

    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 0.75rem; margin-bottom: 2rem; }
    .podium-block { flex: 1; max-width: 220px; text-align: center; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 0.75rem 0.85rem; cursor: pointer; transition: background 0.15s, transform 0.15s; }
    .podium-block:hover { background: rgba(255,255,255,0.06); transform: translateY(-2px); }
    .podium-block.first { border-color: rgba(255,184,28,0.35); background: rgba(255,184,28,0.05); box-shadow: 0 0 40px rgba(255,184,28,0.08); }
    .podium-block.second { border-color: rgba(192,200,212,0.25); }
    .podium-block.third  { border-color: rgba(205,127,50,0.25); }
    .podium-crown { font-size: 1.4rem; margin-bottom: 0.3rem; display: block; line-height: 1; }
    .podium-rank { font-family: 'Bebas Neue', cursive; font-size: 2rem; letter-spacing: 2px; line-height: 1; }
    .podium-block.first  .podium-rank { color: var(--gold); }
    .podium-block.second .podium-rank { color: #c0c8d4; }
    .podium-block.third  .podium-rank { color: #cd7f32; }
    .podium-name { font-family: 'Bebas Neue', cursive; font-size: 1.05rem; letter-spacing: 2px; color: white; margin: 0.2rem 0 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .podium-pts { font-family: 'Bebas Neue', cursive; font-size: 1.75rem; letter-spacing: 2px; color: white; line-height: 1; }
    .podium-pts-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; font-weight: 700; color: var(--silver); letter-spacing: 2px; margin-top: 1px; display: block; }
    .podium-gap { font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.3); margin-top: 0.3rem; }
    .podium-breakdown { display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.55rem; }
    .podium-breakdown-item { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; border-radius: 3px; padding: 1px 7px; }
    .podium-breakdown-item.F { background: rgba(255,122,138,0.12); color: var(--pink); }
    .podium-breakdown-item.D { background: rgba(125,180,255,0.12); color: var(--blue); }
    .podium-breakdown-item.G { background: rgba(255,184,28,0.12); color: var(--gold); }

    .view-tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
    .view-tab { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; padding: 5px 14px; border-radius: 5px; cursor: pointer; flex: 1; text-align: center; color: var(--silver); transition: background 0.15s, color 0.15s; }
    .view-tab:hover { color: white; }
    .view-tab.active { background: rgba(255,184,28,0.12); color: var(--gold); }

    .leaderboard { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 1.75rem; }
    .lb-row { display: grid; grid-template-columns: 36px 1fr 60px 60px 70px 70px 70px; align-items: center; padding: 0.65rem 1rem; gap: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: background 0.15s; }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:hover { background: rgba(255,255,255,0.04); }
    .lb-row.active { background: rgba(255,184,28,0.07); border-left: 2px solid var(--gold); }
    .lb-row.header { background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.1); cursor: default; padding: 0.45rem 1rem; }
    .lb-row.header:hover { background: rgba(255,255,255,0.03); }
    .lb-rank { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 1px; color: var(--silver); text-align: center; }
    .lb-rank.gold { color: var(--gold); } .lb-rank.silver { color: #c0c8d4; } .lb-rank.bronze { color: #cd7f32; }
    .lb-name { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 2px; color: white; }
    .lb-row.active .lb-name { color: var(--gold); }
    .lb-stat { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--silver); text-align: right; }
    .lb-stat.pts { color: white; font-size: 1rem; } .lb-row.active .lb-stat.pts { color: var(--gold); }
    .lb-stat.gap { color: rgba(255,80,80,0.7); font-size: 0.8rem; } .lb-stat.gap.leader { color: var(--green); }
    .lb-col-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.3); text-align: right; letter-spacing: 2px; text-transform: uppercase; }
    .lb-col-label.left { text-align: left; }
    .lb-subscore { display: flex; gap: 3px; justify-content: flex-end; }
    .lb-subscore-pill { font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; font-weight: 700; border-radius: 3px; padding: 1px 5px; }
    .lb-subscore-pill.F { background: rgba(255,122,138,0.1); color: var(--pink); }
    .lb-subscore-pill.D { background: rgba(125,180,255,0.1); color: var(--blue); }
    .lb-subscore-pill.G { background: rgba(255,184,28,0.1); color: var(--gold); }
    .lb-subscore-pill.B { background: rgba(255,255,255,0.07); color: var(--silver); }

    .team-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
    .team-tab { font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 2px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: var(--silver); border-radius: 7px; padding: 5px 16px; cursor: pointer; flex-shrink: 0; transition: background 0.15s, border-color 0.15s, color 0.15s; white-space: nowrap; }
    .team-tab:hover { background: rgba(255,255,255,0.08); color: white; }
    .team-tab.active { background: rgba(255,184,28,0.1); border-color: rgba(255,184,28,0.4); color: var(--gold); }
    .team-tab-pts { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.35); margin-left: 4px; }
    .team-tab.active .team-tab-pts { color: rgba(255,184,28,0.6); }

    .team-detail { display: none; } .team-detail.visible { display: block; }
    .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .detail-header-left { display: flex; flex-direction: column; gap: 0.3rem; }
    .detail-title { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; letter-spacing: 3px; color: white; }
    .detail-rank-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--silver); letter-spacing: 1px; }
    .detail-summary { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .detail-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; padding: 2px 10px; border-radius: 4px; }
    .detail-badge.pts { background: rgba(255,184,28,0.12); color: var(--gold); border: 1px solid rgba(255,184,28,0.3); }
    .detail-badge.cap { background: rgba(255,255,255,0.06); color: var(--silver); border: 1px solid rgba(255,255,255,0.1); }
    .detail-badge.filled { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.25); }
    .detail-badge.eff { background: rgba(125,180,255,0.1); color: var(--blue); border: 1px solid rgba(125,180,255,0.25); }
    .pos-scores-bar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .pos-score-block { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 0.75rem; text-align: center; }
    .pos-score-block.F { border-color: rgba(255,122,138,0.2); } .pos-score-block.D { border-color: rgba(125,180,255,0.2); } .pos-score-block.G { border-color: rgba(255,184,28,0.2); } .pos-score-block.B { border-color: rgba(255,255,255,0.12); }
    .pos-score-val { font-family: 'Bebas Neue', cursive; font-size: 1.6rem; letter-spacing: 2px; line-height: 1; }
    .pos-score-block.F .pos-score-val { color: var(--pink); } .pos-score-block.D .pos-score-val { color: var(--blue); } .pos-score-block.G .pos-score-val { color: var(--gold); } .pos-score-block.B .pos-score-val { color: var(--silver); }
    .pos-score-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; font-weight: 700; color: var(--silver); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
    .top-scorer-callout { display: flex; align-items: center; gap: 0.6rem; background: rgba(255,184,28,0.06); border: 1px solid rgba(255,184,28,0.2); border-radius: 8px; padding: 0.6rem 0.75rem; margin-bottom: 1.25rem; }
    .top-scorer-icon { font-size: 1.1rem; flex-shrink: 0; }
    .top-scorer-text { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--silver); }
    .top-scorer-text strong { color: var(--gold); font-size: 0.95rem; }
    .pos-group { margin-bottom: 1.25rem; }
    .pos-group-label { font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 3px; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .pos-group-label.F { color: #ff7a8a; } .pos-group-label.D { color: #7db4ff; } .pos-group-label.G { color: var(--gold); }

    .player-row { display: flex; align-items: center; gap: 0.6rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 7px; padding: 0.45rem 0.75rem; margin-bottom: 4px; position: relative; overflow: hidden; }
    .player-row-perf-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .player-row-perf-bar.above { background: var(--green); } .player-row-perf-bar.below { background: var(--red); } .player-row-perf-bar.avg { background: var(--silver); opacity: 0.3; }
    .player-row-logo { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
    .player-row-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; font-weight: 700; color: white; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-row-stat { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 1px; color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.05); border-radius: 3px; padding: 1px 7px; flex-shrink: 0; }
    .player-row-eff { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--blue); background: rgba(125,180,255,0.08); border-radius: 3px; padding: 1px 5px; flex-shrink: 0; white-space: nowrap; }
    .player-row-pace { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--green); background: rgba(34,197,94,0.08); border-radius: 3px; padding: 1px 5px; flex-shrink: 0; white-space: nowrap; }
    .player-row-pts { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 1px; color: var(--gold); min-width: 40px; text-align: right; flex-shrink: 0; }
    .player-row-pts-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; font-weight: 700; color: rgba(255,184,28,0.5); margin-left: 2px; }
    .pos-badge { font-family: 'Bebas Neue', cursive; font-size: 0.7rem; letter-spacing: 1px; border-radius: 3px; padding: 1px 5px; flex-shrink: 0; min-width: 22px; text-align: center; }
    .pos-badge.F { background: rgba(255,122,138,0.15); color: #ff7a8a; } .pos-badge.D { background: rgba(125,180,255,0.15); color: #7db4ff; } .pos-badge.G { background: rgba(255,184,28,0.15); color: var(--gold); }
    .star-badge { font-size: 0.8rem; flex-shrink: 0; }

    .pool-section-title { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 3px; color: var(--silver); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .pool-section-title span { color: white; }
    .pos-leaders-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.75rem; }
    @media (max-width: 600px) { .pos-leaders-grid { grid-template-columns: 1fr; } }
    .pos-leader-col { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .pos-leader-col-header { padding: 0.5rem 0.75rem; font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 3px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
    .pos-leader-col-header.F { color: var(--pink); background: rgba(255,122,138,0.05); }
    .pos-leader-col-header.D { color: var(--blue); background: rgba(125,180,255,0.05); }
    .pos-leader-col-header.G { color: var(--gold); background: rgba(255,184,28,0.05); }
    .pos-leader-col-header small { font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; font-weight: 700; color: rgba(255,255,255,0.25); letter-spacing: 2px; }
    .pos-leader-row { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .pos-leader-row:last-child { border-bottom: none; }
    .pos-leader-rank { font-family: 'Bebas Neue', cursive; font-size: 0.9rem; color: var(--silver); min-width: 16px; text-align: center; }
    .pos-leader-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; color: white; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pos-leader-owner { font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; font-weight: 700; color: var(--gold); background: rgba(255,184,28,0.08); border-radius: 3px; padding: 1px 5px; flex-shrink: 0; white-space: nowrap; max-width: 70px; overflow: hidden; text-overflow: ellipsis; }
    .pos-leader-team { font-family: 'Bebas Neue', cursive; font-size: 0.75rem; letter-spacing: 1px; color: var(--silver); flex-shrink: 0; }
    .pos-leader-pts { font-family: 'Bebas Neue', cursive; font-size: 0.95rem; letter-spacing: 1px; color: white; min-width: 28px; text-align: right; flex-shrink: 0; }
    .top-players-list { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 1.75rem; }
    .top-player-row { display: grid; grid-template-columns: 30px 1fr 80px 80px 60px; align-items: center; padding: 0.55rem 1rem; gap: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .top-player-row:last-child { border-bottom: none; }
    .top-player-row.header { background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0.4rem 1rem; }
    .top-player-rank { font-family: 'Bebas Neue', cursive; font-size: 1rem; color: var(--silver); text-align: center; }
    .top-player-info { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .top-player-logo { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    .top-player-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; font-weight: 700; color: white; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-player-owner { font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; font-weight: 600; color: var(--gold); background: rgba(255,184,28,0.08); border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
    .top-player-stat { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--silver); text-align: right; }
    .top-player-pts { font-family: 'Bebas Neue', cursive; font-size: 1rem; color: var(--gold); text-align: right; }

    /* ════════ ALL TEAMS SPREADSHEET ════════ */
    .at-wrap { border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; margin-bottom: 1.75rem; }
    .at-scroll { overflow-x: auto; overflow-y: auto; max-height: 78vh; }
    .at-table { border-collapse: collapse; min-width: 100%; font-family: 'Barlow Condensed', sans-serif; }
    .allteams-mode .at-wrap { width: 100%; max-width: 100%; }
    .allteams-mode .at-scroll { overflow-x: hidden; }
    .allteams-mode .at-table { width: 100%; min-width: 0; table-layout: fixed; }
    .allteams-mode.allteams-needs-wide .at-scroll { overflow-x: auto; }
    .allteams-mode.allteams-needs-wide .at-table { width: max-content; min-width: 100%; table-layout: auto; }
    .allteams-mode .at-table th, .allteams-mode .at-table td { min-width: 0; }
    .allteams-mode .at-th-inner { padding: 6px 5px 5px; }
    .allteams-mode .at-th-name { font-size: 0.78rem; letter-spacing: 1px; max-width: none; }
    .allteams-mode td.pn {
      font-size: 0.72rem;
      padding: 3px 4px;
      width: 75%;
      max-width: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .allteams-mode td.ps {
      font-size: 0.68rem;
      padding: 3px 4px;
      width: 25%;
      min-width: 0;
      max-width: none;
    }
    .allteams-mode .at-table thead tr.at-subhead-row th {

      <div id="view-allteams"  style="display:${activeView==='allteams'?'block':'none'}">${buildAllTeams(teams)}</div>
      <div id="view-team"      style="display:${activeView==='team'?'block':'none'}">
        <div class="team-tabs">${sorted.map(t=>`<div class="team-tab ${t.id===activeTeamId?'active':''}" onclick="selectTeam('${t.id}')">${t.name}<span class="team-tab-pts">${teamTotalPts(t)}pts</span></div>`).join('')}</div>
        <div class="team-detail visible">${activeTeam?buildDetail(activeTeam,sorted,leaderPts,avgs):''}</div>
      </div>
      <div id="view-pool" style="display:${activeView==='pool'?'block':'none'}">${buildPoolLeaders()}</div>
    `;
    requestAnimationFrame(updateAllTeamsWidthMode);
  }

  function updateAllTeamsWidthMode(){
    const body=document.body;
    body.classList.remove('allteams-needs-wide');
    if(activeView!=='allteams') return;
    const root=document.getElementById('view-allteams');
    if(!root) return;
    const clipped=[...root.querySelectorAll('.at-th-name, td.pn')].some(el=>el.scrollWidth>el.clientWidth+1);
    if(clipped) body.classList.add('allteams-needs-wide');
  }

   window.addEventListener('resize', ()=>{ if(activeView==='allteams') updateAllTeamsWidthMode(); });
   function setView(v){activeView=v;sessionStorage.setItem('pool_view',v);render();}
   function selectTeam(id){activeTeamId=id;activeView='team';sessionStorage.setItem('pool_view','team');render();}

   async function syncPlayerStats(){
     const btn=document.getElementById('sync-btn');
     const status=document.getElementById('sync-status');
     btn.disabled=true;
     status.textContent='Syncing...';
     status.className='sync-status';
     try{
       const res=await fetch('/api/sync-pool-stats',{
         method:'POST',
         headers:{'Content-Type':'application/json'},
         body:JSON.stringify({})
       });
       const data=await res.json();
       if(res.status===200){
         // Local: Immediate success
         status.textContent='✅ Stats updated!';
         setTimeout(()=>location.reload(),1500);
       }else if(res.status===202){
         // Vercel: Workflow triggered, will run in background
         status.textContent='✅ Sync started (check back in 5 min)';
         setTimeout(()=>{ btn.disabled=false; status.textContent=''; },4000);
       }else{
         status.textContent=`❌ ${data.error||'Failed'}`;
         status.className='sync-status error';
         setTimeout(()=>{ btn.disabled=false; },3000);
       }
     }catch(e){
       status.textContent='❌ '+e.message;
       status.className='sync-status error';
       btn.disabled=false;
     }
   }

  function buildPodium(sorted,leaderPts){
    const medals=['🥇','🥈','🥉'],cls=['first','second','third'];
    const order=sorted.length>=3?[sorted[1],sorted[0],sorted[2]]:sorted;
    const oi=sorted.length>=3?[1,0,2]:sorted.map((_,i)=>i);
    return`<div class="podium">${order.map((t,i)=>{if(!t)return'';const ri=oi[i],pts=teamTotalPts(t),sub=teamSubScores(t),gap=ri===0?'':`−${leaderPts-pts} from 1st`;
      return`<div class="podium-block ${cls[ri]}" onclick="selectTeam('${t.id}');setView('team')"><span class="podium-crown">${medals[ri]}</span><div class="podium-rank">#${ri+1}</div><div class="podium-name">${t.name}</div><div class="podium-pts">${pts}<span class="podium-pts-label">POOL PTS</span></div>${gap?`<div class="podium-gap">${gap}</div>`:''}<div class="podium-breakdown"><span class="podium-breakdown-item F">F ${sub.F}</span><span class="podium-breakdown-item D">D ${sub.D}</span><span class="podium-breakdown-item G">G ${sub.G}</span><span class="podium-breakdown-item B">B ${sub.B}</span></div></div>`;
    }).join('')}</div>`;}

  function buildLeaderboard(sorted,leaderPts){
    const rc=i=>i===0?'gold':i===1?'silver':i===2?'bronze':'';
    const rows=sorted.map((t,i)=>{
      const pts=teamTotalPts(t),cap=teamCapUsed(t.roster),filled=teamFilled(t.roster),sub=teamSubScores(t);
      const gap=i===0?'Leader':`−${leaderPts-pts}`,eff=cap>0?(pts/(cap/1e6)).toFixed(1):'—';
      return`<div class="lb-row ${t.id===activeTeamId?'active':''}" onclick="selectTeam('${t.id}')"><div class="lb-rank ${rc(i)}">${i+1}</div><div><div class="lb-name">${t.name}</div><div class="lb-subscore"><span class="lb-subscore-pill F">F ${sub.F}</span><span class="lb-subscore-pill D">D ${sub.D}</span><span class="lb-subscore-pill G">G ${sub.G}</span><span class="lb-subscore-pill B">B ${sub.B}</span></div></div><div class="lb-stat">${filled}/26</div><div class="lb-stat">$${(cap/1e6).toFixed(1)}M</div><div class="lb-stat">${eff} pt/$M</div><div class="lb-stat ${i===0?'gap leader':'gap'}">${gap}</div><div class="lb-stat pts">${pts}</div></div>`;
    }).join('');
    return`<div class="leaderboard"><div class="lb-row header" style="grid-template-columns:36px 1fr 60px 60px 70px 70px 70px"><div></div><div class="lb-col-label left">Team</div><div class="lb-col-label">Players</div><div class="lb-col-label">Cap</div><div class="lb-col-label">Eff.</div><div class="lb-col-label">Gap</div><div class="lb-col-label">Pts</div></div>${rows}</div>`;}

  // ════════ ALL TEAMS SPREADSHEET ════════
  function buildAllTeams(sorted){
    if(!sorted.length) return '<div class="msg">No teams yet.</div>';

    const SECS=[{key:'F',label:'FORWARDS',slots:12},{key:'D',label:'DEFENCE',slots:6},{key:'G',label:'GOALIES',slots:2},{key:'B',label:'BENCH',slots:6}];
    const N=sorted.length;

    // Rosters sorted by pts descending within each pos
    const rosters=sorted.map(t=>{
      const r=rosterPlayers(t.roster);
      return{F:r.F.filter(Boolean).sort((a,b)=>poolScoreOwned(b,t,b._slug)-poolScoreOwned(a,t,a._slug)),D:r.D.filter(Boolean).sort((a,b)=>poolScoreOwned(b,t,b._slug)-poolScoreOwned(a,t,a._slug)),G:r.G.filter(Boolean).sort((a,b)=>poolScoreOwned(b,t,b._slug)-poolScoreOwned(a,t,a._slug)),B:r.B.filter(Boolean).sort((a,b)=>poolScoreOwned(b,t,b._slug)-poolScoreOwned(a,t,a._slug)),_team:t};
    });

    const SALARY_CAP=95500000;
    // total cols per team = 2 (name+salary), divider between teams
    const totalCols=N*2+(N-1);

    const div=(isTh)=>isTh?'<th class="at-div"></th>':'<td class="at-div"></td>';

    // ── HEAD row 1: team banners ──
    let h1='<tr class="at-head-row">';
    sorted.forEach((t,i)=>{
      h1+=`<th colspan="2"><div class="at-th-inner"><div class="at-th-name">${t.name}</div></div></th>`;
      if(i<N-1)h1+=div(true);
    });
    h1+='</tr>';

    // ── HEAD row 2: col labels ──
    let h2='<tr class="at-subhead-row">';
    sorted.forEach((t,i)=>{
      h2+='<th>Player</th><th class="r">Salary</th>';
      if(i<N-1)h2+=div(true);
    });
    h2+='</tr>';

    // ── BODY ──
    let body='';
    SECS.forEach(({key,label,slots})=>{
      body+=`<tr class="at-sec ${key}"><td colspan="${totalCols}">${label}</td></tr>`;
      for(let i=0;i<slots;i++){
        const rc2=`r${key}`;
        body+=`<tr class="${rc2}">`;
        rosters.forEach((r,ti)=>{
          const p=r[key][i]||null;
          if(p){
            const pts=poolScoreOwned(p,r._team,p._slug),sal=p.cap_hit?`$${(p.cap_hit/1e6).toFixed(3)}M`:'—';
            const full=formatName(p.player_name),nhl=TEAM_ABBR[p.team]||'';
            body+=`<td class="pn" title="${full}">${full}${nhl?` <span class="nhl">${nhl}</span>`:''}</td><td class="ps">${sal}</td>`;
          } else {
            body+=`<td class="pe">—</td><td class="ps"></td>`;
          }
          if(ti<N-1)body+=div(false);
        });
        body+='</tr>';
      }
    });

    // ── TOTALS ──
    // Row: Total Salary
    body+=`<tr class="at-tot">`;
    sorted.forEach((t,ti)=>{
      const cap=teamCapUsed(t.roster);
      body+=`<td class="lbl">Total Salary</td><td class="val">$${(cap/1e6).toFixed(2)}M</td>`;
      if(ti<N-1)body+=div(false);
    });
    body+='</tr>';

    // Row: Cap Space Remaining
    body+=`<tr class="at-tot">`;
    sorted.forEach((t,ti)=>{
      const cap=teamCapUsed(t.roster);
      const remaining=SALARY_CAP-cap;
      body+=`<td class="lbl">Cap Space Remaining</td><td class="val g">$${(remaining/1e6).toFixed(2)}M</td>`;
      if(ti<N-1)body+=div(false);
    });
    body+='</tr>';

    // Row: Avg Cap Space / Player Remaining
    body+=`<tr class="at-tot">`;
    sorted.forEach((t,ti)=>{
      const cap=teamCapUsed(t.roster),filled=teamFilled(t.roster);
      const remaining=SALARY_CAP-cap;
      const slotsLeft=26-filled;
      const avg=slotsLeft>0?`$${(remaining/1e6/slotsLeft).toFixed(2)}M`:'—';
      body+=`<td class="lbl">Avg Cap / Slot Left</td><td class="val">${avg}</td>`;
      if(ti<N-1)body+=div(false);
    });
    body+='</tr>';

    return`<div class="at-wrap"><div class="at-scroll"><table class="at-table"><thead>${h1}${h2}</thead><tbody>${body}</tbody></table></div></div>`;
  }

  function buildDetail(team,sorted,leaderPts,avgs){
    const roster=rosterPlayers(team.roster);
    const allP=[...roster.F,...roster.D,...roster.G,...(roster.B||[])].filter(Boolean);
    if(!allP.length)return`<div class="msg" style="padding:1.5rem 0;">No players drafted yet.</div>`;
    const totalPts=allP.reduce((s,p)=>s+poolScoreOwned(p,team,p._slug),0),cap=allP.reduce((s,p)=>s+(p.cap_hit||0),0),filled=allP.length;
    const eff=cap>0?(totalPts/(cap/1e6)).toFixed(1):'—',sub=teamSubScores(team);
    const rank=sorted.findIndex(t=>t.id===team.id)+1,gap=rank===1?'Leading 🏆':`${leaderPts-totalPts} pts behind 1st`;
    const scored=allP.map(p=>({p,pts:poolScoreOwned(p,team,p._slug)})).sort((a,b)=>b.pts-a.pts),topScorer=scored[0];
    const groups=[{key:'F',label:'Forwards',players:roster.F.filter(Boolean).sort((a,b)=>poolScoreOwned(b,team,b._slug)-poolScoreOwned(a,team,a._slug))},{key:'D',label:'Defence',players:roster.D.filter(Boolean).sort((a,b)=>poolScoreOwned(b,team,b._slug)-poolScoreOwned(a,team,a._slug))},{key:'G',label:'Goalies',players:roster.G.filter(Boolean).sort((a,b)=>poolScoreOwned(b,team,b._slug)-poolScoreOwned(a,team,a._slug))},{key:'B',label:'Bench',players:roster.B.filter(Boolean).sort((a,b)=>poolScoreOwned(b,team,b._slug)-poolScoreOwned(a,team,a._slug))}];
    return`
      <div class="detail-header"><div class="detail-header-left"><div class="detail-title">${team.name}</div><div class="detail-rank-label">Rank #${rank} · ${gap}</div></div>
      <div class="detail-summary"><span class="detail-badge pts">${totalPts} PTS</span><span class="detail-badge cap">$${(cap/1e6).toFixed(1)}M</span><span class="detail-badge filled">${filled}/26</span><span class="detail-badge eff">${eff} pt/$M</span></div></div>
      <div class="pos-scores-bar"><div class="pos-score-block F"><div class="pos-score-val">${sub.F}</div><div class="pos-score-label">Forwards</div></div><div class="pos-score-block D"><div class="pos-score-val">${sub.D}</div><div class="pos-score-label">Defence</div></div><div class="pos-score-block G"><div class="pos-score-val">${sub.G}</div><div class="pos-score-label">Goalies</div></div><div class="pos-score-block B"><div class="pos-score-val">${sub.B}</div><div class="pos-score-label">Bench</div></div></div>
      ${topScorer?`<div class="top-scorer-callout"><span class="top-scorer-icon">⭐</span><div class="top-scorer-text">Top contributor: <strong>${formatName(topScorer.p.player_name)}</strong> — ${topScorer.pts} pool pts &nbsp;·&nbsp; ${(topScorer.pts/totalPts*100).toFixed(0)}% of team total</div></div>`:''}
      ${groups.filter(g=>g.players.length).map(g=>`<div class="pos-group"><div class="pos-group-label ${g.key}">${g.label} (${g.players.length})</div>${g.players.map(p=>buildPlayerRow(p,g.key,avgs,topScorer?.p,team)).join('')}</div>`).join('')}
    `;}

  function buildPlayerRow(p,group,avgs,topScorerPlayer,team){
    const abbr=TEAM_ABBR[p.team],logo=abbr?`<img class="player-row-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">`:'' ;
    const pts=poolScoreOwned(p,team,p._slug),pos=normalizePos(p.position),displayPos=group==='B'?pos:group,avg=avgs[group]??0;
    const perf=pts>avg*1.15?'above':pts<avg*0.7?'below':'avg';
    const capM=(p.cap_hit||0)/1e6,eff=capM>0?`${(pts/capM).toFixed(1)} pt/$M`:'';
    const ownedDelta=ownedStatsDelta(p,team,p._slug);
    const gp=ownedDelta?.gamesPlayed??0;
    const pace=(gp>0&&pts>0)?`<span class="player-row-pace">~${Math.round((pts/gp)*(82-gp))} proj</span>`:'';
    const isStar=topScorerPlayer&&p.puckpedia_slug===topScorerPlayer.puckpedia_slug;
    const stat=ownedStatsLabel(p,team,p._slug);
    return`<div class="player-row"><div class="player-row-perf-bar ${perf}"></div><span class="pos-badge ${displayPos}">${displayPos}</span>${logo}<span class="player-row-name">${formatName(p.player_name)}</span>${isStar?'<span class="star-badge">⭐</span>':''}${stat?`<span class="player-row-stat">${stat}</span>`:''}${pace}${eff?`<span class="player-row-eff">${eff}</span>`:''}<span class="player-row-pts">${pts}<span class="player-row-pts-label">PTS</span></span></div>`;}

  function buildPoolLeaders(){
    const drafted=allDraftedPlayers(),byPos={F:[],D:[],G:[]};
    drafted.forEach(({player,owner,pos,team})=>byPos[pos].push({player,owner,team,pts:poolScoreOwned(player,team,player._slug)}));
    ['F','D','G'].forEach(pos=>byPos[pos].sort((a,b)=>b.pts-a.pts));
    const pL={F:'Forwards',D:'Defence',G:'Goalies'};
    const grid=`<div class="pool-section-title">Position <span>Leaders</span></div><div class="pos-leaders-grid">${['F','D','G'].map(pos=>`<div class="pos-leader-col"><div class="pos-leader-col-header ${pos}">${pL[pos]} <small>POOL PTS</small></div>${byPos[pos].slice(0,8).map((item,i)=>{const abbr=TEAM_ABBR[item.player.team];return`<div class="pos-leader-row"><div class="pos-leader-rank">${i+1}</div><div class="pos-leader-name">${formatName(item.player.player_name)}</div><div class="pos-leader-team">${abbr||'—'}</div><div class="pos-leader-owner">${item.owner}</div><div class="pos-leader-pts">${item.pts}</div></div>`;}).join('')}</div>`).join('')}</div>`;
    const allS=drafted.map(({player,owner,pos,team})=>({player,owner,pos,team,pts:poolScoreOwned(player,team,player._slug)})).sort((a,b)=>b.pts-a.pts).slice(0,10);
    const top=`<div class="pool-section-title">Top <span>Pool Players</span></div><div class="top-players-list"><div class="top-player-row header" style="grid-template-columns:30px 1fr 80px 80px 60px"><div></div><div class="lb-col-label left">Player</div><div class="lb-col-label">Owner</div><div class="lb-col-label">Owned Stats</div><div class="lb-col-label">Pts</div></div>${allS.map((item,i)=>{const p=item.player,abbr=TEAM_ABBR[p.team],logo=abbr?`<img class="top-player-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">`:'' ;const stat=ownedStatsLabel(p,item.team,p._slug).replace(/ · /g,' ');return`<div class="top-player-row"><div class="top-player-rank">${i+1}</div><div class="top-player-info">${logo}<div><div class="top-player-name">${formatName(p.player_name)}</div></div></div><div class="top-player-owner">${item.owner}</div><div class="top-player-stat">${stat||'—'}</div><div class="top-player-pts">${item.pts}</div></div>`;}).join('')}</div>`;
    return grid+top;
  }

  load();
</script>
