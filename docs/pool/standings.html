<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Standings | Parieur Discipliné</title>
    <link rel="icon" type="image/png" href="../parieur_discipline_icon_1024.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap"
          rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --rink: #07111f;
          --red: #c8102e;
          --gold: #ffb81c;
          --silver: #a8b2be;
          --green: #22c55e;
          --blue: #7db4ff;
          --pink: #ff7a8a;
          --line: rgba(255,255,255,0.08);
          --nav-h: 44px;
        }
        body {
          background: var(--rink);
          background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,110,0.6) 0%, transparent 70%);
          min-height: 100vh;
          font-family: 'Barlow Condensed', sans-serif;
          color: white;
          padding-top: var(--nav-h);
        }

        /* ── NAV ── */
        .site-nav {
          position: fixed; top: 0; left: 0; right: 0; z-index: 100;
          background: rgba(7,17,31,0.92); border-bottom: 1px solid var(--line);
          backdrop-filter: blur(12px);
        }
        .site-nav-inner {
          max-width: 1100px; margin: 0 auto;
          display: flex; align-items: center; justify-content: space-between;
          height: var(--nav-h); padding: 0 1.5rem;
        }
        .site-nav-brand {
          font-family: 'Bebas Neue', cursive; font-size: 1.5rem;
          color: var(--gold); letter-spacing: 4px; text-decoration: none;
          flex-shrink: 0;
        }
        .site-nav-links { display: flex; align-items: center; gap: 0.5rem; }
        .site-nav-links a {
          font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 600;
          color: var(--silver); text-decoration: none; padding: 0.3rem 0.8rem;
          border-radius: 5px; letter-spacing: 1.5px;
          transition: color 0.15s, background 0.15s;
        }
        .site-nav-links a:hover { color: white; background: rgba(255,255,255,0.07); }
        .site-nav-links a.active { color: var(--gold); background: rgba(255,184,28,0.1); }
        .nav-hamburger {
          display: none; flex-direction: column; justify-content: center; gap: 5px;
          width: 36px; height: 36px; cursor: pointer; border: none;
          background: none; padding: 6px; border-radius: 6px;
        }
        .nav-hamburger span { display: block; height: 2px; background: var(--silver); border-radius: 2px; transition: background 0.15s; }
        .nav-hamburger:hover span { background: white; }
        .nav-drawer {
          display: none; position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0;
          z-index: 99; background: rgba(7,17,31,0.97); backdrop-filter: blur(16px);
          flex-direction: column; gap: 0.25rem; padding: 1.25rem 1.5rem;
          border-top: 1px solid var(--line);
        }
        .nav-drawer.open { display: flex; }
        .nav-drawer a {
          font-family: 'Bebas Neue', cursive; font-size: 1.4rem; letter-spacing: 3px;
          color: var(--silver); text-decoration: none; padding: 0.65rem 0.75rem;
          border-radius: 8px; transition: color 0.15s, background 0.15s;
        }
        .nav-drawer a:hover { color: white; background: rgba(255,255,255,0.06); }
        .nav-drawer a.active { color: var(--gold); background: rgba(255,184,28,0.08); }
        @media (max-width: 700px) {
          .site-nav-links { display: none; }
          .nav-hamburger { display: flex; }
        }

        /* ── LAYOUT ── */
        .page-wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
        @media (min-width: 861px) { .page-wrap { padding: 2rem 1.5rem 4rem; } }

        /* ── HEADER ── */
        header { text-align: center; margin-bottom: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        header h1 {
          font-family: 'Bebas Neue', cursive;
          font-size: clamp(1.8rem, 4vw, 2.8rem); letter-spacing: 5px; line-height: 1;
          text-shadow: 0 0 30px rgba(200,16,46,0.4), 0 2px 8px rgba(0,0,0,0.8);
        }
        header h1 span { color: var(--gold); }
        @media (min-width: 861px) { header h1 { font-size: clamp(2.4rem, 4vw, 3.4rem); } }
        .league-code-badge {
          display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem;
          font-size: 0.75rem; font-weight: 700; color: var(--silver);
          letter-spacing: 2px; text-transform: uppercase;
        }
        .league-code-badge span {
          font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 3px;
          color: var(--gold); background: rgba(255,184,28,0.1);
          border: 1px solid rgba(255,184,28,0.3); border-radius: 4px; padding: 1px 10px;
        }
        .header-controls { display: flex; align-items: center; gap: 0.5rem; justify-content: center; }
        .btn-sync {
          font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 1.5px;
          background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3);
          color: var(--green); border-radius: 6px; padding: 4px 12px;
          cursor: pointer; transition: background 0.2s, border-color 0.2s;
        }
        .btn-sync:hover { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.5); }
        .btn-sync:disabled { opacity: 0.5; cursor: not-allowed; }
        .sync-status { font-size: 0.72rem; color: rgba(34,197,94,0.7); margin-left: 0.3rem; }
        .sync-status.error { color: rgba(200,16,46,0.85); font-weight: 700; }
        .last-synced-badge {
          display: inline-flex; align-items: center; gap: 4px;
          font-size: 0.7rem; font-weight: 600; color: rgba(255,255,255,0.3);
          letter-spacing: 1px; white-space: nowrap;
        }
        .last-synced-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); opacity: 0.7; flex-shrink: 0; }

        /* ── VIEW TABS ── */
        .view-tabs {
          display: flex; gap: 4px; margin-bottom: 1.25rem;
          background: rgba(255,255,255,0.03);
          border: 1px solid var(--line); border-radius: 8px; padding: 4px;
        }
        .view-tab {
          font-family: 'Bebas Neue', cursive; letter-spacing: 2px;
          padding: 5px 14px; border-radius: 5px; cursor: pointer; flex: 1;
          text-align: center; color: var(--silver);
          transition: background 0.15s, color 0.15s; font-size: 0.85rem;
        }
        .view-tab:hover { color: white; }
        .view-tab.active { background: rgba(255,184,28,0.12); color: var(--gold); }
        @media (min-width: 861px) { .view-tab { font-size: 1rem; padding: 7px 20px; } }

        /* ── SKELETON ── */
        .skeleton-row {
          height: 48px; background: rgba(255,255,255,0.04);
          border-radius: 6px; margin-bottom: 4px;
          animation: skeleton-pulse 1.4s ease-in-out infinite;
        }
        .skeleton-row:nth-child(2) { opacity: 0.8; animation-delay: 0.1s; }
        .skeleton-row:nth-child(3) { opacity: 0.65; animation-delay: 0.2s; }
        .skeleton-row:nth-child(4) { opacity: 0.5; animation-delay: 0.3s; }
        .skeleton-row:nth-child(5) { opacity: 0.35; animation-delay: 0.4s; }
        @keyframes skeleton-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }

        /* ── LEADERBOARD ── */
        .leaderboard {
          background: rgba(255,255,255,0.03); border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; margin-bottom: 1.75rem;
        }

        /* Tier row backgrounds — defined as gradients so .active can layer on top */
        .lb-row.rank-1 {
          background: linear-gradient(90deg, rgba(255,184,28,0.07) 0%, rgba(255,184,28,0.02) 60%, transparent 100%);
          border-left: 3px solid rgba(255,184,28,0.6);
        }
        .lb-row.rank-2 {
          background: linear-gradient(90deg, rgba(192,200,212,0.05) 0%, transparent 60%);
          border-left: 3px solid rgba(192,200,212,0.3);
        }
        .lb-row.rank-3 {
          background: linear-gradient(90deg, rgba(205,127,50,0.05) 0%, transparent 60%);
          border-left: 3px solid rgba(205,127,50,0.3);
        }

        /*
         * FIX 3: .active is now an additive overlay via box-shadow + pseudo-element
         * so the rank-N gradient still shows through underneath.
         * We keep border-left-color override for the active stripe.
         */
        .lb-row.active {
          box-shadow: inset 0 0 0 1px rgba(255,184,28,0.18), inset 4px 0 0 var(--gold);
          background-image: linear-gradient(90deg, rgba(255,184,28,0.06) 0%, rgba(255,184,28,0.01) 50%, transparent 100%);
        }
        /* Rank-1 + active: merge both gold gradients so neither wipes the other */
        .lb-row.rank-1.active {
          background: linear-gradient(90deg, rgba(255,184,28,0.13) 0%, rgba(255,184,28,0.05) 60%, transparent 100%);
          border-left: 3px solid var(--gold);
          box-shadow: inset 0 0 0 1px rgba(255,184,28,0.22);
        }
        .lb-row.rank-2.active {
          background: linear-gradient(90deg, rgba(192,200,212,0.05) 0%, transparent 60%);
          border-left: 3px solid var(--gold);
          box-shadow: inset 0 0 0 1px rgba(255,184,28,0.18);
        }
        .lb-row.rank-3.active {
          background: linear-gradient(90deg, rgba(205,127,50,0.05) 0%, transparent 60%);
          border-left: 3px solid var(--gold);
          box-shadow: inset 0 0 0 1px rgba(255,184,28,0.18);
        }

        /* Divider between podium and rest of field */
        .lb-tier-divider {
          height: 1px;
          background: linear-gradient(90deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
          position: relative;
        }
        .lb-tier-divider::after {
          content: 'REST OF FIELD';
          position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
          font-family: 'Barlow Condensed', sans-serif; font-size: 0.55rem;
          font-weight: 700; letter-spacing: 2px;
          color: rgba(255,255,255,0.2); background: #07111f; padding: 0 6px;
        }

        .lb-row {
          display: grid;
          grid-template-columns: 36px 1fr 44px 52px 52px 52px 60px 60px;
          align-items: center; padding: 0.65rem 1rem; gap: 0.5rem;
          border-bottom: 1px solid rgba(255,255,255,0.05);
          cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
          border-left: 3px solid transparent;
        }
        .lb-row:last-child { border-bottom: none; }
        .lb-row:hover:not(.active) { background: rgba(255,255,255,0.04); }
        .lb-row.header {
          background: rgba(255,255,255,0.03);
          border-bottom: 1px solid rgba(255,255,255,0.1);
          cursor: default; padding: 0.45rem 1rem;
          border-left: 3px solid transparent; box-shadow: none;
        }
        .lb-row.header:hover { background: rgba(255,255,255,0.03); }
        @media (min-width: 861px) { .lb-row { padding: 0.85rem 1.25rem; } }
        @media (max-width: 480px) {
          .lb-row { grid-template-columns: 30px 1fr 56px 56px; }
          .lb-col-hide { display: none; }
        }

        .lb-rank {
          display: flex; align-items: center; justify-content: center;
          font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 1px;
          color: var(--silver); text-align: center;
        }
        .lb-rank.gold   { color: var(--gold); }
        .lb-rank.silver { color: #c0c8d4; }
        .lb-rank.bronze { color: #cd7f32; }
        .lb-rank-crown { display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .lb-rank-crown-icon {
          font-size: 0.65rem; line-height: 1;
          animation: crown-glow 3s ease-in-out infinite;
        }
        @keyframes crown-glow {
          0%, 100% { filter: drop-shadow(0 0 3px rgba(255,184,28,0.6)); }
          50%       { filter: drop-shadow(0 0 8px rgba(255,184,28,1)); }
        }
        .lb-rank-num { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 1px; }

        .lb-name { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 2px; color: white; }
        .lb-row.active .lb-name { color: var(--gold); }
        @media (min-width: 861px) { .lb-rank-num { font-size: 1.3rem; } .lb-name { font-size: 1.15rem; } }
        .lb-stat { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--silver); text-align: right; }
        .lb-stat.pts { color: white; font-size: 1rem; }
        .lb-row.active .lb-stat.pts { color: var(--gold); }
        .lb-stat.gap { color: rgba(255,80,80,0.7); font-size: 0.8rem; }
        .lb-stat.gap.leader { color: var(--green); }
        .lb-stat.pos-f { color: var(--pink); }
        .lb-stat.pos-d { color: var(--blue); }
        .lb-stat.pos-g { color: var(--gold); }
        @media (min-width: 861px) { .lb-stat { font-size: 1rem; } .lb-stat.pts { font-size: 1.2rem; } }
        .lb-col-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.3); text-align: right; letter-spacing: 2px; text-transform: uppercase; }
        .lb-col-label.left { text-align: left; }
        .sort-hdr:hover { color: rgba(255,184,28,0.8); }
        .sort-hdr { transition: color 0.15s; }

        /* ── INSIGHTS ── */
        .insights {
          display: grid; grid-template-columns: repeat(2, 1fr);
          gap: 0.6rem; margin-bottom: 1.75rem;
        }
        @media (max-width: 600px) {
          .insights { grid-template-columns: 1fr; }
        }
        .insight-card {
          background: rgba(255,255,255,0.03); border: 1px solid var(--line);
          border-radius: 10px; padding: 0.7rem 0.9rem;
          display: flex; flex-direction: column; gap: 0.2rem;
          transition: border-color 0.2s, background 0.2s;
        }
        .insight-card:hover { background: rgba(255,255,255,0.05); }
        .insight-card.gold  { border-color: rgba(255,184,28,0.25);  background: rgba(255,184,28,0.04); }
        .insight-card.green { border-color: rgba(34,197,94,0.25);   background: rgba(34,197,94,0.04); }
        .insight-card.red   { border-color: rgba(200,16,46,0.25);   background: rgba(200,16,46,0.04); }
        .insight-card.blue  { border-color: rgba(125,180,255,0.25); background: rgba(125,180,255,0.04); }
        .insight-card.gold:hover  { background: rgba(255,184,28,0.07); }
        .insight-card.green:hover { background: rgba(34,197,94,0.07); }
        .insight-card.red:hover   { background: rgba(200,16,46,0.07); }
        .insight-card.blue:hover  { background: rgba(125,180,255,0.07); }
        /* First card (leader/race) gets a larger, more prominent treatment */
        .insights .insight-card:first-child {
          grid-column: 1 / -1;
          flex-direction: row; align-items: center; gap: 1rem;
          padding: 0.85rem 1.1rem;
          border-color: rgba(255,184,28,0.35);
          background: rgba(255,184,28,0.05);
          box-shadow: 0 0 24px rgba(255,184,28,0.05);
        }
        .insights .insight-card:first-child:hover { background: rgba(255,184,28,0.09); }
        .insights .insight-card:first-child .insight-icon { font-size: 1.6rem; flex-shrink: 0; }
        .insights .insight-card:first-child .insight-main { font-size: 1.25rem; }
        .insights .insight-card:first-child .insight-sub { margin-left: auto; text-align: right; flex-shrink: 0; }
        @media (max-width: 600px) {
          .insights .insight-card:first-child { flex-direction: column; }
          .insights .insight-card:first-child .insight-sub { margin-left: 0; text-align: left; }
        }
        .insight-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.35); }
        .insight-icon { font-size: 1rem; line-height: 1; margin-bottom: 0.1rem; }
        .insight-main { font-family: 'Bebas Neue', cursive; font-size: 1.05rem; letter-spacing: 1.5px; color: white; line-height: 1.2; }
        .insight-main.gold  { color: var(--gold); }
        .insight-main.green { color: var(--green); }
        .insight-main.red   { color: #ff5050; }
        .insight-main.blue  { color: var(--blue); }
        .insight-sub { font-size: 0.78rem; font-weight: 600; color: var(--silver); }

        /* ── TEAM TABS ── */
        .team-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
        .team-tab {
          font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 2px;
          background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
          color: var(--silver); border-radius: 7px; padding: 5px 16px;
          cursor: pointer; flex-shrink: 0; white-space: nowrap;
          transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .team-tab:hover { background: rgba(255,255,255,0.08); color: white; }
        .team-tab.active { background: rgba(255,184,28,0.1); border-color: rgba(255,184,28,0.4); color: var(--gold); }
        .team-tab-pts { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.35); margin-left: 4px; }
        .team-tab.active .team-tab-pts { color: rgba(255,184,28,0.6); }
        @media (min-width: 861px) { .team-tab { font-size: 1rem; padding: 7px 20px; } }

        /* ── DETAIL ── */
        .detail-header {
          display: flex; align-items: flex-start; justify-content: space-between;
          margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
        }
        .detail-header-left { display: flex; flex-direction: column; gap: 0.3rem; }
        .detail-title { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; letter-spacing: 3px; color: white; }
        @media (min-width: 861px) { .detail-title { font-size: 1.9rem; } }
        .detail-rank-label { font-size: 0.8rem; font-weight: 700; color: var(--silver); letter-spacing: 1px; }
        .detail-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
        .detail-summary { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
        .detail-badge { font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; padding: 2px 10px; border-radius: 4px; }
        .detail-badge.pts    { background: rgba(255,184,28,0.12); color: var(--gold); border: 1px solid rgba(255,184,28,0.3); }
        .detail-badge.cap    { background: rgba(255,255,255,0.06); color: var(--silver); border: 1px solid rgba(255,255,255,0.1); }
        .detail-badge.filled { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.25); }
        .detail-badge.eff    { background: rgba(125,180,255,0.1); color: var(--blue); border: 1px solid rgba(125,180,255,0.25); }

        /* FIX 4: View Roster button */
        .btn-view-roster {
          font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 1.5px;
          background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
          color: var(--silver); border-radius: 6px; padding: 4px 12px;
          text-decoration: none; transition: background 0.15s, color 0.15s, border-color 0.15s;
          white-space: nowrap;
        }
        .btn-view-roster:hover { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.25); }

        /* ── POS SCORES BAR ── */
        .pos-scores-bar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
        @media (max-width: 480px) { .pos-scores-bar { flex-wrap: wrap; } }
        .pos-score-block {
          flex: 1; background: rgba(255,255,255,0.03);
          border: 1px solid var(--line); border-radius: 8px;
          padding: 0.6rem 0.75rem; text-align: center;
          position: relative; overflow: hidden;
        }
        .pos-score-block.F { border-color: rgba(255,122,138,0.2); }
        .pos-score-block.D { border-color: rgba(125,180,255,0.2); }
        .pos-score-block.G { border-color: rgba(255,184,28,0.2); }
        .pos-score-block.B { border-color: rgba(255,255,255,0.12); }
        .pos-score-block.T {
          border-color: rgba(255,184,28,0.45);
          background: rgba(255,184,28,0.06);
          flex: 1.3;
        }
        .pos-score-block.T .pos-score-val { color: var(--gold); font-size: 2rem; }
        @media (min-width: 861px) { .pos-score-block.T .pos-score-val { font-size: 2.6rem; } }
        .pos-score-block.T .pos-rank-badge { font-size: 0.68rem; }
        .pos-score-block.rank-1st {
          box-shadow: inset 0 0 0 1px rgba(255,184,28,0.35), 0 0 12px rgba(255,184,28,0.08);
        }
        .pos-score-block.rank-1st::before {
          content: ''; position: absolute; inset: 0;
          background: linear-gradient(135deg, rgba(255,184,28,0.06) 0%, transparent 60%);
          pointer-events: none;
        }
        .pos-score-val {
          font-family: 'Bebas Neue', cursive; font-size: 1.6rem;
          letter-spacing: 2px; line-height: 1;
        }
        @media (min-width: 861px) { .pos-score-val { font-size: 2rem; } }
        .pos-score-block.F .pos-score-val { color: var(--pink); }
        .pos-score-block.D .pos-score-val { color: var(--blue); }
        .pos-score-block.G .pos-score-val { color: var(--gold); }
        .pos-score-block.B .pos-score-val { color: var(--silver); }
        .pos-score-label { font-size: 0.68rem; font-weight: 700; color: var(--silver); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
        .pos-rank-badge {
          display: inline-flex; align-items: center; gap: 2px; margin-top: 5px;
          font-family: 'Bebas Neue', cursive; font-size: 0.62rem; letter-spacing: 1px;

<script>

    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';

    // ── TOKEN AUTH ───────────────────────────────────────────────────────────────
    function getToken() {

    // ── MOBILE NAV ───────────────────────────────────────────────────────────────
    function toggleDrawer() {
      const drawer = document.getElementById('nav-drawer');

    // ── STATE ────────────────────────────────────────────────────────────────────
    const _leagueCode = new URLSearchParams(window.location.search).get('league') || null;
    if (!_leagueCode) window.location.replace('/pool');

    let allPlayers = [], teams = [], currentTrades = [], activeTeamId = null;

    let activeView = sessionStorage.getItem('pool_view') || 'standings';
    // Sort state for roster tables: { pos: 'F'|'D'|'G', field: 'pts'|'gp'|'g'|'a'|'w'|'so' }
    let _rosterSort = {}; // keyed by pos
    if (activeView === 'allteams') activeView = 'standings';

    let _cache = {};
    function clearCache() { _cache = {}; }

    function slugMap() {
      if (!_cache.slugMap) {
        _cache.slugMap = Object.fromEntries(allPlayers.map(p => [p.puckpedia_slug, p]));
      }
      return _cache.slugMap;
    }

    function teamTotalPts(team) {
      if (!_cache.teamPts) _cache.teamPts = {};
      if (_cache.teamPts[team.id] !== undefined) return _cache.teamPts[team.id];
      const s = teamSubScores(team);
      _cache.teamPts[team.id] = s.F + s.D + s.G + s.B;
      return _cache.teamPts[team.id];
    }
    function sortedTeams() {
      if (!_cache.sorted) _cache.sorted = [...teams].sort((a, b) => teamTotalPts(b) - teamTotalPts(a));
      return _cache.sorted;
    }
    function setRosterSort(pos, field) {
      _rosterSort[pos] = field;
      render();
    }
    function allDraftedPlayers() {
      if (!_cache.drafted) {
        const list = [];
        teams.forEach(t => {
          const r = rosterPlayers(t.roster);
          ['F','D','G'].forEach(pos => r[pos].filter(Boolean).forEach(p => list.push({ player:p, owner:t.name, pos, team:t })));
        });
        _cache.drafted = list;
      }
      return _cache.drafted;
    }

    // ── SCORING ──────────────────────────────────────────────────────────────────
    let _scoring = { f_points:1, d_goals:2, d_assists:1, g_wins:2, g_shutouts:3 };
    async function loadScoringSettings() {
      try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/pool_settings?league_code=eq.${_leagueCode}&select=f_points,d_goals,d_assists,g_wins,g_shutouts`,
          { headers: sbHeaders() });
        if (r.ok) { const rows = await r.json(); if (rows.length) _scoring = { ..._scoring, ...rows[0] }; }
      } catch(e) {}
    }

    function normalizePos(pos) {
      if (!pos) return 'F';
      const p = pos.toUpperCase();
      if (p.includes('G')) return 'G';
      if (p === 'D' || p.includes('LD') || p.includes('RD')) return 'D';
      return 'F';
    }

    function poolScore(p) {
      const pos = normalizePos(p.position);
      if (pos === 'G') return (p.wins ?? 0) * _scoring.g_wins + (p.shutouts ?? 0) * _scoring.g_shutouts;
      if (pos === 'D') return (p.goals ?? 0) * _scoring.d_goals + (p.assists ?? 0) * _scoring.d_assists;
      return (p.points ?? 0) * _scoring.f_points;
    }

    function toIsoDay(v) {
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return null;
      return d.toISOString().slice(0, 10);
    }
    function seasonFromDate(v) {
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return null;
      const y = d.getUTCFullYear();
      const m = d.getUTCMonth() + 1;
      const startY = m >= 7 ? y : y - 1;
      return `${startY}${startY + 1}`;
    }
    function seasonsForRange(startDate, endDate) {
      const s1 = seasonFromDate(startDate);
      const s2 = seasonFromDate(endDate);
      if (!s1 && !s2) return [];
      if (!s1) return [s2];
      if (!s2 || s1 === s2) return [s1];
      return [s1, s2];
    }
    function scoreGameForPool(game, pos) {
      if (pos === 'G') {
        const win = String(game?.decision || '').toUpperCase() === 'W' ? 1 : 0;
        const shutouts = Number(game?.shutouts ?? 0) || 0;
        return win * _scoring.g_wins + shutouts * _scoring.g_shutouts;
      }
      if (pos === 'D') {
        const g = Number(game?.goals ?? 0) || 0;
        const a = Number(game?.assists ?? 0) || 0;
        return g * _scoring.d_goals + a * _scoring.d_assists;
      }
      const pts = Number(game?.points ?? (Number(game?.goals ?? 0) || 0) + (Number(game?.assists ?? 0) || 0)) || 0;
      return pts * _scoring.f_points;
    }
    function gameDateStr(game) {
      return game?.gameDate || game?.gameDateUTC || game?.date || game?.game?.gameDate || game?.game?.date || null;
    }
    async function fetchPlayerGameLog(playerId, season) {
      const key = `${playerId}:${season}`;
      if (_gameLogCache.has(key)) return _gameLogCache.get(key);
      const url = `https://api-web.nhle.com/v1/player/${playerId}/game-log/${season}/2`;
      const p = fetch(url)
        .then(r => r.ok ? r.json() : { games: [] })
        .then(data => {
          if (Array.isArray(data?.games)) return data.games;
          if (Array.isArray(data?.gameLog)) return data.gameLog;
          return [];
        })
        .catch(() => []);
      _gameLogCache.set(key, p);
      return p;
    }
    async function computeWindowPointsForPlayer(playerId, pos, startDate, endDate) {
      const startDay = toIsoDay(startDate);
      const endDay = toIsoDay(endDate);
      if (!playerId || !startDay || !endDay) return null;
      const seasons = seasonsForRange(startDate, endDate);
      if (!seasons.length) return null;
      let total = 0;
      for (const season of seasons) {
        const games = await fetchPlayerGameLog(playerId, season);
        games.forEach(g => {
          const gDay = toIsoDay(gameDateStr(g));
          if (!gDay) return;
          if (gDay >= startDay && gDay <= endDay) total += scoreGameForPool(g, pos);
        });
      }
      return total;
    }
    function tradeWindowKey(trade, isCurrent = false) {
      const endMarker = isCurrent ? 'NOW' : (trade?.date_traded || '');
      return [trade?.team_id || '', trade?.player_to_slug || '', trade?.date_from_acquired || '', endMarker].join('|');
    }
    function teamHasPlayerSlug(team, slug) {
      if (!team || !slug) return false;
      return [...(team.roster?.F || []), ...(team.roster?.D || []), ...(team.roster?.G || []), ...(team.roster?.B || [])].includes(slug);
    }
    function latestIncomingTrade(teamId, slug) {
      if (!teamId || !slug || !Array.isArray(currentTrades)) return null;
      for (let i = currentTrades.length - 1; i >= 0; i--) {
        const t = currentTrades[i];
        if (t?.team_id === teamId && t?.player_to_slug === slug && t?.date_from_acquired) return t;
      }
      return null;
    }
    async function runWithConcurrency(items, worker, limit = 6) {
      if (!items.length) return;
      let i = 0;
      async function runner() {
        while (i < items.length) {
          const idx = i++;
          await worker(items[idx], idx);
        }
      }
      const count = Math.min(limit, items.length);
      await Promise.all(Array.from({ length: count }, () => runner()));
    }
    async function precomputeTradeWindowPoints() {
      if (!Array.isArray(currentTrades) || !currentTrades.length) return;
      const activeByTeamSlug = new Set();
      teams.forEach(t => {
        [...(t.roster.F || []), ...(t.roster.D || []), ...(t.roster.G || []), ...(t.roster.B || [])]
          .filter(Boolean)
          .forEach(slug => activeByTeamSlug.add(`${t.id}|${slug}`));
      });
      const candidates = currentTrades.filter(t => {
        if (!t?.team_id || !t?.player_to_slug || !t?.date_from_acquired) return false;
        const isCurrent = activeByTeamSlug.has(`${t.team_id}|${t.player_to_slug}`);
        if (isCurrent) return true;
        return !!t?.date_traded;
      });
      let changed = false;
      await runWithConcurrency(candidates, async (trade) => {
        const isCurrent = activeByTeamSlug.has(`${trade.team_id}|${trade.player_to_slug}`);
        const key = tradeWindowKey(trade, isCurrent);
        if (_windowPtsByTradeKey[key] !== undefined) return;
        const p = slugMap()[trade.player_to_slug];
        const playerId = p?.nhl_player_id;
        const pos = normalizePos(p?.position || trade?.player_to_position);
        if (!playerId || !pos) return;
        const endDate = isCurrent ? new Date().toISOString() : trade.date_traded;
        const pts = await computeWindowPointsForPlayer(playerId, pos, trade.date_from_acquired, endDate);
        if (typeof pts === 'number' && Number.isFinite(pts)) {
          _windowPtsByTradeKey[key] = pts;
          changed = true;
        }
      }, 6);
      if (changed) render();
    }

    /*
     * FIX 7: poolScoreOwned and ownedStatsDelta are now symmetric.
     * Both treat "no acquisition entry" (original draft pick) identically —
     * they use the full-season stats with a zero snapshot, so the delta
     * equals the full season stats. This means GP/G/A always display
     * in the hist table for draft picks, consistent with how points are counted.
     */
    function _zeroSnapshot() {
      return { points: 0, goals: 0, assists: 0, wins: 0, shutouts: 0, ot_losses: 0, games_played: 0 };
    }
    function _resolveSnapshot(team, slug) {
      const acq = team?.acquisitions?.[slug];
      if (acq === undefined) return { snapshot: _zeroSnapshot(), frozen: 0 };  // draft pick → full season
      return { snapshot: acq?.stats_snapshot || _zeroSnapshot(), frozen: acq?.frozen_points ?? 0 };
    }

    function poolScoreOwned(p, team, slug) {
      const { snapshot: s, frozen } = _resolveSnapshot(team, slug);
      const pos = normalizePos(p.position);
      let delta;
      if (pos === 'G') {
        const wins = Math.max(0, (p.wins ?? 0) - (s.wins ?? 0));
        const so   = Math.max(0, (p.shutouts ?? 0) - (s.shutouts ?? 0));
        delta = wins * _scoring.g_wins + so * _scoring.g_shutouts;
      } else if (pos === 'D') {
        const g = Math.max(0, (p.goals ?? 0) - (s.goals ?? 0));
        const a = Math.max(0, (p.assists ?? 0) - (s.assists ?? 0));
        delta = g * _scoring.d_goals + a * _scoring.d_assists;
      } else {
        delta = Math.max(0, ((p.points ?? 0) - (s.points ?? 0))) * _scoring.f_points;
      }
      return frozen + delta;
    }

    function ownedStatsDelta(p, team, slug) {
      const { snapshot: s } = _resolveSnapshot(team, slug);
      return {
        pos:         normalizePos(p.position),
        goals:       Math.max(0, (p.goals ?? 0)        - (s.goals ?? 0)),
        assists:     Math.max(0, (p.assists ?? 0)      - (s.assists ?? 0)),
        points:      Math.max(0, (p.points ?? 0)       - (s.points ?? 0)),
        wins:        Math.max(0, (p.wins ?? 0)         - (s.wins ?? 0)),
        shutouts:    Math.max(0, (p.shutouts ?? 0)     - (s.shutouts ?? 0)),
        otLosses:    Math.max(0, (p.ot_losses ?? 0)    - (s.ot_losses ?? 0)),
        gamesPlayed: Math.max(0, (p.games_played ?? 0) - (s.games_played ?? 0)),
      };
    }

    function ownedStatsLabel(p, team, slug) {
      const d = ownedStatsDelta(p, team, slug);
      if (d.pos === 'G') return `${d.gamesPlayed}GP · ${d.wins}W · ${d.shutouts}SO`;
      return `${d.gamesPlayed}GP · ${d.goals}G · ${d.assists}A`;
    }

    // ── ROSTER HELPERS ───────────────────────────────────────────────────────────
    function formatName(n) {
      if (!n) return '';
      if (n.includes(',')) {
        const parts = n.split(',').map(s => s.trim()).filter(Boolean);
        if (parts.length >= 2) return `${parts[parts.length - 1]} ${parts[0]}`;
      }
      return n;
    }
    function rosterPlayers(rs) {
      const m = slugMap();
      const resolve = s => (s && m[s]) ? { ...m[s], _slug: s } : null;
      return {
        F: (rs.F || []).map(resolve), D: (rs.D || []).map(resolve),
        G: (rs.G || []).map(resolve), B: (rs.B || []).map(resolve),
      };
    }
    function resolveActiveAcquiredDate(team, slug) {
      const acqRaw = team?.acquisitions?.[slug];
      const acqDate = (typeof acqRaw === 'object' && acqRaw?.date) ? new Date(acqRaw.date) : null;
      return (acqDate && !Number.isNaN(acqDate.getTime())) ? acqDate : ACTIVE_ACQUIRED_FALLBACK_DATE;
    }
    function teamColor(name) {
      if (!teamColor._cache) teamColor._cache = {};
      if (teamColor._cache[name]) return teamColor._cache[name];
      const PALETTE = [
        { fg: '#60a5fa', bg: 'rgba(96,165,250,0.12)' },   // blue
        { fg: '#34d399', bg: 'rgba(52,211,153,0.12)' },   // green
        { fg: '#f472b6', bg: 'rgba(244,114,182,0.12)' },  // pink
        { fg: '#fb923c', bg: 'rgba(251,146,60,0.12)' },   // orange
        { fg: '#a78bfa', bg: 'rgba(167,139,250,0.12)' },  // purple
        { fg: '#2dd4bf', bg: 'rgba(45,212,191,0.12)' },   // teal
        { fg: '#facc15', bg: 'rgba(250,204,21,0.12)' },   // yellow
        { fg: '#f87171', bg: 'rgba(248,113,113,0.12)' },  // red
        { fg: '#4ade80', bg: 'rgba(74,222,128,0.12)' },   // lime
        { fg: '#38bdf8', bg: 'rgba(56,189,248,0.12)' },   // sky
      ];
      // Assign colors in order of first appearance across all teams
      const allNames = [...new Set(teams.map(t => t.name))];
      allNames.forEach((n, i) => {
        teamColor._cache[n] = PALETTE[i % PALETTE.length];
      });
      return teamColor._cache[name] || PALETTE[0];
    }

    function ownerBadge(ownerName) {
      const { fg, bg } = teamColor(ownerName);
      return `style="color:${fg};background:${bg}"`;
    }

    function teamSubScores(team) {
      if (!_cache.subScores) _cache.subScores = {};
      if (_cache.subScores[team.id]) return _cache.subScores[team.id];
      const r = rosterPlayers(team.roster);
      const sg = players => players.filter(Boolean).reduce((s, p) => s + poolScoreOwned(p, team, p._slug), 0);
      const result = { F: sg(r.F), D: sg(r.D), G: sg(r.G), B: sg(r.B) };
      _cache.subScores[team.id] = result;
      return result;
    }
    function teamCapUsed(rs) {
      const r = rosterPlayers(rs);
      return [...r.F, ...r.D, ...r.G].filter(Boolean).reduce((s, p) => s + (p.cap_hit || 0), 0);
    }
    function teamFilled(rs) {
      return [...(rs.F||[]), ...(rs.D||[]), ...(rs.G||[]), ...(rs.B||[])].filter(Boolean).length;
    }
    function posRankForTeam(team, pos) {
      const ranked = [...teams].map(t => ({ id: t.id, score: teamSubScores(t)[pos] })).sort((a, b) => b.score - a.score);
      return ranked.findIndex(r => r.id === team.id) + 1;
    }
    function posRankLabel(rank, total) {
      const ordinal = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); };
      if (rank === 1) return { text: `👑 ${ordinal(rank)}`, cls: 'r1' };
      if (rank === 2) return { text: ordinal(rank), cls: 'r2' };
      if (rank === 3) return { text: ordinal(rank), cls: 'r3' };
      if (rank === total) return { text: `${ordinal(rank)} of ${total}`, cls: 'rlast' };
      return { text: `${ordinal(rank)} of ${total}`, cls: 'rmid' };
    }

    // ── NAV ──────────────────────────────────────────────────────────────────────
    function initNav() {
      const links = {
        'nav-draft':             `/pool/join?league=${_leagueCode}`,
        'nav-live-draft':        `/pool/live-draft?league=${_leagueCode}`,
        'nav-standings':         `/pool/standings?league=${_leagueCode}`,
        'nav-trades':            `/pool/roster?league=${_leagueCode}`,
        'nav-settings':          `/pool/settings?league=${_leagueCode}`,
        'nav-drawer-draft':      `/pool/join?league=${_leagueCode}`,
        'nav-drawer-live-draft': `/pool/live-draft?league=${_leagueCode}`,
        'nav-drawer-standings':  `/pool/standings?league=${_leagueCode}`,
        'nav-drawer-trades':     `/pool/roster?league=${_leagueCode}`,

      document.getElementById('league-badge').textContent = _leagueCode;

    }

    // ── LOAD ─────────────────────────────────────────────────────────────────────
    async function load() {
      if (!getToken()) { showInvalidGate(); return; }
      initNav();
      updateLastSyncedBadge();
      await loadScoringSettings();
      _windowPtsByTradeKey = {};
      fetch(`${SUPABASE_URL}/rest/v1/pool_leagues?code=eq.${_leagueCode}&select=name`,
        { headers: sbHeaders() })
        .then(r => { if (r.status === 401 || r.status === 403) { showInvalidGate(); throw new Error('unauthorized'); } return r.json(); })
        .then(rows => { if (!rows.length) { showInvalidGate(); return; } const n = rows[0]?.name; if (n) { _leagueName = n; document.getElementById('league-badge').textContent = `${n} · ${_leagueCode}`; } })
        .catch(() => {});
      try {
        let cacheHit = false;
        try {
          const raw = sessionStorage.getItem(CACHE_KEY);
          if (raw) { const { ts, data } = JSON.parse(raw); if (Date.now() - ts < CACHE_TTL_MS && Array.isArray(data) && data.length) { allPlayers = data; cacheHit = true; } }
        } catch(_) {}
        if (!cacheHit) {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/nhl_players?select=puckpedia_slug,player_name,position,cap_hit,team,goals,assists,points,wins,shutouts,ot_losses,games_played,save_pct,nhl_player_id&order=cap_hit.desc&limit=1000`,
            { headers: sbHeaders() });
          if (!res.ok) throw new Error(res.status);
          allPlayers = await res.json();
          try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: allPlayers })); } catch(_) {}
        }
        clearCache();
        const rRes = await fetch(`${SUPABASE_URL}/rest/v1/pool_rosters?league_code=eq.${_leagueCode}&select=data`,
          { headers: sbHeaders() });
        if (!rRes.ok) throw new Error(rRes.status);
        const rows = await rRes.json();
        if (!rows.length || !rows[0].data?.teams?.length) {
          document.getElementById('content').innerHTML = '<div class="msg">No teams saved yet. Go build your pool!</div>'; return;
        }
        teams = rows[0].data.teams.map(t => ({
          id: t.id, name: t.name || 'Team', acquisitions: t.acquisitions || {},
          roster: {
            F: Array.isArray(t.roster?.F) ? t.roster.F : Array(12).fill(null),
            D: Array.isArray(t.roster?.D) ? t.roster.D : Array(6).fill(null),
            G: Array.isArray(t.roster?.G) ? t.roster.G : Array(2).fill(null),
            B: Array.isArray(t.roster?.B) ? t.roster.B : Array(6).fill(null),
          }
        }));
        currentTrades = [];
        const tRes = await fetch(`${SUPABASE_URL}/rest/v1/player_trades?league_code=eq.${_leagueCode}&select=team_id,player_to_slug,player_to_name,player_to_position,date_from_acquired,date_traded,points_accumulated_at_trade&order=date_from_acquired.asc`,
          { headers: sbHeaders() });
        if (tRes.ok) currentTrades = await tRes.json();
        activeTeamId = sortedTeams()[0]?.id || teams[0]?.id;
        render();
        // precomputeTradeWindowPoints disabled — NHL API blocks CORS from production; snapshot system handles all point calculations.
      } catch(e) {
        document.getElementById('content').innerHTML = `<div class="msg">Failed to load data. <button class="btn-refresh" onclick="load()">Retry</button></div>`;
      }
    }

    // ── RENDER ────────────────────────────────────────────────────────────────────
    function render() {
      const scrollY = window.scrollY;
      const sorted = sortedTeams();
      const leaderPts = sorted.length ? teamTotalPts(sorted[0]) : 0;
      const activeTeam = teams.find(t => t.id === activeTeamId);
      document.getElementById('content').innerHTML = `
        <div class="view-tabs">
          <div class="view-tab ${activeView==='standings'?'active':''}" onclick="setView('standings')">Standings</div>
          <div class="view-tab ${activeView==='team'?'active':''}"      onclick="setView('team')">Team Detail</div>
          <div class="view-tab ${activeView==='pool'?'active':''}"      onclick="setView('pool')">Pool Leaders</div>
          <div class="view-tab ${activeView==='history'?'active':''}"   onclick="setView('history')">History</div>
        </div>
        <div id="view-standings" style="display:${activeView==='standings'?'block':'none'}">

          </div>

        </div>

        <div id="view-history" style="display:${activeView==='history'?'block':'none'}"><div class="bump-empty" id="bump-loading">Loading history…</div></div>
      `;

      if (activeView === 'history') loadHistory();
    }

    function setView(v) {
      activeView = v;
      sessionStorage.setItem('pool_view', v);
      render();
      if (v === 'history') loadHistory();
    }
    function selectTeam(id) { activeTeamId = id; activeView = 'team'; sessionStorage.setItem('pool_view', 'team'); render(); }

    // ── SYNC ─────────────────────────────────────────────────────────────────────
    function updateLastSyncedBadge() {
      const ts = sessionStorage.getItem('hp_last_synced');
      if (!ts) return;
      const d = new Date(Number(ts));
      if (isNaN(d.getTime())) return;
      const text = `Synced ${d.toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' })}`;
      const badge = document.getElementById('last-synced-badge');
      const textEl = document.getElementById('last-synced-text');
      if (badge && textEl) { textEl.textContent = text; badge.style.display = 'inline-flex'; }
    }
    async function syncPlayerStats() {
      const btn = document.getElementById('sync-btn'), status = document.getElementById('sync-status');
      btn.disabled = true; status.textContent = 'Syncing…'; status.className = 'sync-status';
      try { sessionStorage.removeItem(CACHE_KEY); } catch(_) {}
      try {
        const res = await fetch('/api/sync-pool-stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
        const data = await res.json();
        if (res.status === 200) {
          sessionStorage.setItem('hp_last_synced', Date.now());
          status.textContent = '✅ Stats updated!';
          setTimeout(() => location.reload(), 1500);
        }
        else if (res.status === 202) {
          sessionStorage.setItem('hp_last_synced', Date.now());
          status.textContent = '✅ Sync started (check back in 5 min)';
          updateLastSyncedBadge();
          setTimeout(() => { btn.disabled = false; status.textContent = ''; }, 4000);
        }
        else { status.textContent = `❌ ${data.error || 'Failed'}`; status.className = 'sync-status error'; setTimeout(() => { btn.disabled = false; status.textContent = ''; }, 4000); }
      } catch(e) { status.textContent = '❌ ' + e.message; status.className = 'sync-status error'; btn.disabled = false; }
    }

    // ── INSIGHTS ─────────────────────────────────────────────────────────────────
    const SNAPSHOT_KEY = 'hp_pts_snapshot';

    function savePtsSnapshot() {
      const today = new Date().toISOString().slice(0, 10);
      const snap = { date: today, pts: {} };
      teams.forEach(t => { snap.pts[t.id] = teamTotalPts(t); });
      try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snap)); } catch(_) {}
    }

    function loadPtsSnapshot() {
      try {
        const raw = localStorage.getItem(SNAPSHOT_KEY);
        if (!raw) return null;
        const snap = JSON.parse(raw);
        const today = new Date().toISOString().slice(0, 10);
        if (snap.date === today) return null; // same day — no delta yet
        return snap;
      } catch(_) { return null; }
    }

    function buildInsights(sorted, leaderPts) {
      const card = (color, icon, label, main, sub) =>
        `<div class="insight-card ${color}"><div class="insight-icon">${icon}</div><div class="insight-label">${label}</div><div class="insight-main ${color}">${main}</div><div class="insight-sub">${sub}</div></div>`;
      const cards = computeInsightData(sorted, leaderPts).map(d => card(d.color, d.icon, d.label, d.main, d.sub));
      return cards.length ? `<div class="insights">${cards.join('')}</div>` : '';
    }

    function computeInsightData(sorted, leaderPts) {
      const data = [];

      // 1. Leading / Closest Race
      if (sorted.length >= 2) {
        const gap = leaderPts - teamTotalPts(sorted[1]);
        if (gap <= 15) data.push({ color:'gold', icon:'🏆', label:'Closest Race', main:`${sorted[0].name} vs ${sorted[1].name}`, sub:`Only ${gap} pts separate 1st and 2nd` });
        else data.push({ color:'gold', icon:'👑', label:'Leading', main:sorted[0].name, sub:`${gap} pts ahead of ${sorted[1].name}` });
      }

      // 2. Best Efficiency
      const effTeams = sorted.map(t => { const cap = teamCapUsed(t.roster), pts = teamTotalPts(t); return { t, eff: cap > 0 ? pts / (cap / 1e6) : 0 }; }).filter(x => x.eff > 0).sort((a, b) => b.eff - a.eff);
      if (effTeams.length) { const best = effTeams[0]; data.push({ color:'green', icon:'⚡', label:'Best Efficiency', main:best.t.name, sub:`${best.eff.toFixed(2)} pts per $M — best in pool` }); }

      // 3. Best Steal
      const allP = [];
      teams.forEach(t => { const rp = rosterPlayers(t.roster); [...rp.F, ...rp.D, ...rp.G].filter(Boolean).forEach(p => { const pts = poolScoreOwned(p, t, p._slug), capM = (p.cap_hit || 0) / 1e6; if (pts > 0 && capM > 0) allP.push({ p, t, pts, capM, ratio: pts / capM }); }); });
      allP.sort((a, b) => b.ratio - a.ratio);
      if (allP.length) { const steal = allP[0]; data.push({ color:'blue', icon:'🚀', label:'Best Steal', main:formatName(steal.p.player_name), sub:`${steal.pts} pts · $${steal.capM.toFixed(1)}M · owned by ${steal.t.name}` }); }

      // 4. Worst Contract
      const expensive = allP.filter(x => x.capM >= 2 && x.pts >= 1).sort((a, b) => a.ratio - b.ratio);
      if (expensive.length) { const bust = expensive[0]; data.push({ color:'red', icon:'💸', label:'Worst Contract', main:formatName(bust.p.player_name), sub:`${bust.pts} pts · $${bust.capM.toFixed(1)}M · owned by ${bust.t.name}` }); }

      // 5. Biggest Mover (yesterday → today delta via localStorage snapshot)
      const snap = loadPtsSnapshot();
      if (snap) {
        const movers = sorted.map(t => {
          const prev = snap.pts?.[t.id];
          if (prev === undefined) return null;
          return { t, delta: teamTotalPts(t) - prev };
        }).filter(x => x && x.delta > 0).sort((a, b) => b.delta - a.delta);
        if (movers.length) {
          const top = movers[0];
          data.push({ color:'green', icon:'📈', label:'Biggest Mover', main:top.t.name, sub:`+${top.delta} pts since yesterday` });
        }
      }
      savePtsSnapshot();

      // 6. Biggest Carry
      const carryData = [];
      teams.forEach(t => {
        const total = teamTotalPts(t);
        if (total <= 0) return;
        const rp = rosterPlayers(t.roster);
        [...rp.F, ...rp.D, ...rp.G].filter(Boolean).forEach(p => {
          const pts = poolScoreOwned(p, t, p._slug);
          if (pts > 0) carryData.push({ p, t, pts, pct: pts / total });
        });
      });
      carryData.sort((a, b) => b.pct - a.pct);
      if (carryData.length) {
        const top = carryData[0];
        data.push({ color:'blue', icon:'🏋️', label:'Biggest Carry', main:formatName(top.p.player_name), sub:`${top.pts} pts — ${Math.round(top.pct * 100)}% of ${top.t.name}'s total` });
      }

      // 7. Coldest Team — position group ranked last in the pool
      const coldCandidates = [];
      ['F','D','G'].forEach(pos => {
        const ranked = [...teams].map(t => ({ t, score: teamSubScores(t)[pos] })).sort((a, b) => a.score - b.score);
        const last = ranked[0];
        const second = ranked[1];
        if (last && second && second.score - last.score >= 5) {
          coldCandidates.push({ t: last.t, pos, score: last.score, gap: second.score - last.score });
        }
      });
      coldCandidates.sort((a, b) => b.gap - a.gap);
      if (coldCandidates.length) {
        const cold = coldCandidates[0];
        const posLabel = { F: 'Forwards', D: 'Defence', G: 'Goalies' }[cold.pos];
        data.push({ color:'red', icon:'🥶', label:'Coldest Team', main:cold.t.name, sub:`${posLabel} last in pool with ${cold.score} pts` });
      }

      return data;
    }

    function buildLeaderboard(sorted, leaderPts) {
      const n = sorted.length;
      const rowsHtml = sorted.map((t, i) => {
        const pts = teamTotalPts(t);
        const sub = teamSubScores(t);
        const gap = i === 0 ? 'Leader' : `−${leaderPts - pts}`;
        const rp = rosterPlayers(t.roster);
        const ownedGP = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).reduce((s, p) => {
          return s + (ownedStatsDelta(p, t, p._slug)?.gamesPlayed ?? 0);
        }, 0);

        const rankNum = i + 1;
        const rankCls = rankNum === 1 ? 'gold' : rankNum === 2 ? 'silver' : rankNum === 3 ? 'bronze' : '';
        const rankInner = rankNum === 1
          ? `<div class="lb-rank-crown"><span class="lb-rank-crown-icon">👑</span><span class="lb-rank-num">${rankNum}</span></div>`
          : `<span class="lb-rank-num">${rankNum}</span>`;
        const tierCls = rankNum <= 3 ? ` rank-${rankNum}` : '';
        const isActive = t.id === activeTeamId;

        const row = `<div class="lb-row${tierCls}${isActive ? ' active' : ''}" onclick="selectTeam('${t.id}')">
          <div class="lb-rank ${rankCls}">${rankInner}</div>
          <div class="lb-name">${t.name}</div>
          <div class="lb-stat lb-col-hide">${ownedGP}</div>
          <div class="lb-stat lb-col-hide pos-f">${sub.F}</div>
          <div class="lb-stat lb-col-hide pos-d">${sub.D}</div>
          <div class="lb-stat lb-col-hide pos-g">${sub.G}</div>
          <div class="lb-stat pts">${pts}</div>
          <div class="lb-stat ${i===0?'gap leader':'gap'}">${gap}</div>
        </div>`;

        return rankNum === 3 && n > 3 ? row + `<div class="lb-tier-divider"></div>` : row;
      }).join('');

      return `<div class="leaderboard">
        <div class="lb-row header">
          <div></div>
          <div class="lb-col-label left">Team</div>
          <div class="lb-col-label lb-col-hide">GP</div>
          <div class="lb-col-label lb-col-hide" style="color:var(--pink)">F</div>
          <div class="lb-col-label lb-col-hide" style="color:var(--blue)">D</div>
          <div class="lb-col-label lb-col-hide" style="color:var(--gold)">G</div>
          <div class="lb-col-label">Total</div>
          <div class="lb-col-label">Gap</div>
        </div>
        ${rowsHtml}
      </div>`;
    }

    // ── TEAM DETAIL ───────────────────────────────────────────────────────────────
    function buildDetail(team, sorted, leaderPts) {
      const roster = rosterPlayers(team.roster);
      const allPlrs = [...roster.F, ...roster.D, ...roster.G, ...(roster.B||[])].filter(Boolean);
      if (!allPlrs.length) return `<div class="msg" style="padding:1.5rem 0;">No players drafted yet.</div>`;

      const sub = teamSubScores(team);
      const totalPts = sub.F + sub.D + sub.G + sub.B;
      const cap = teamCapUsed(team.roster);
      const filled = teamFilled(team.roster);
      const eff = cap > 0 ? (totalPts / (cap / 1e6)).toFixed(1) : '—';
      const rank = sorted.findIndex(t => t.id === team.id) + 1;
      const gap = rank === 1 ? 'Leading 🏆' : `${leaderPts - totalPts} pts behind 1st`;
      const n = teams.length;
      const hasF = roster.F.some(Boolean), hasD = roster.D.some(Boolean), hasG = roster.G.some(Boolean);

      function posBlock(pos, label, val) {
        const r = posRankForTeam(team, pos);
        const { text: rankText, cls: rankCls } = posRankLabel(r, n);
        return `<div class="pos-score-block ${pos}${r === 1 ? ' rank-1st' : ''}">
          <div class="pos-score-val">${val}</div>
          <div class="pos-score-label">${label}</div>
          <div class="pos-rank-badge ${rankCls}">${rankText}</div>
        </div>`;
      }

      const { text: totalRankText, cls: totalRankCls } = posRankLabel(rank, n);
      const totalBlock = `<div class="pos-score-block T${rank === 1 ? ' rank-1st' : ''}">
        <div class="pos-score-val">${totalPts}</div>
        <div class="pos-score-label">Total</div>
        <div class="pos-rank-badge ${totalRankCls}">${totalRankText}</div>
      </div>`;

      /* FIX 4: View Roster link in detail header */
      const rosterUrl = `/pool/roster?league=${_leagueCode}`;

      return `
        <div class="detail-header">
          <div class="detail-header-left">
            <div class="detail-title">${team.name}</div>
          </div>
          <div class="detail-header-right">
            <a class="btn-view-roster" href="${rosterUrl}" title="Open roster page">📋 View Roster →</a>
            <div class="detail-summary">
              <span class="detail-badge cap">$${(cap / 1e6).toFixed(1)}M</span>
              <span class="detail-badge filled">${filled}/26</span>
              <span class="detail-badge eff">${eff} pt/$M</span>
            </div>
          </div>
        </div>
        <div class="pos-scores-bar">
          ${totalBlock}
          ${posBlock('F', 'Forwards', sub.F)}
          ${posBlock('D', 'Defence',  sub.D)}
          ${posBlock('G', 'Goalies',  sub.G)}
        </div>
        ${hasF ? buildHistTable(team, 'F', 'Forwards') : '<div class="msg" style="padding:0.5rem 0;font-size:0.8rem;text-align:left;color:rgba(255,255,255,0.25)">No forwards drafted yet.</div>'}
        ${hasD ? buildHistTable(team, 'D', 'Defence')  : '<div class="msg" style="padding:0.5rem 0;font-size:0.8rem;text-align:left;color:rgba(255,255,255,0.25)">No defencemen drafted yet.</div>'}
        ${hasG ? buildHistTable(team, 'G', 'Goalies')  : '<div class="msg" style="padding:0.5rem 0;font-size:0.8rem;text-align:left;color:rgba(255,255,255,0.25)">No goalies drafted yet.</div>'}
      `;
    }

    // ── HIST TABLE ────────────────────────────────────────────────────────────────
    function buildHistTable(team, pos, label) {
      const currentSlugs = new Set([...team.roster.F, ...team.roster.D, ...team.roster.G, ...(team.roster.B||[])].filter(Boolean));
      const activeSlugSet = new Set((team.roster[pos] || []).filter(Boolean));
      const m = slugMap();
      const fmt = d => new Date(d).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });

      const trades = currentTrades.filter(t => {
        if (t.team_id !== team.id || !t.player_to_slug) return false;
        const livePos = m[t.player_to_slug] ? normalizePos(m[t.player_to_slug].position) : null;
        const storedPos = t.player_to_position ? normalizePos(t.player_to_position) : null;
        return (livePos || storedPos) === pos;
      });
      const seenSlugs = new Set(trades.map(t => t.player_to_slug));
      const currentNoDraft = (team.roster[pos] || []).filter(s => s && currentSlugs.has(s) && !seenSlugs.has(s)).map(s => m[s] ? { ...m[s], _slug: s } : null).filter(Boolean);
      if (!trades.length && !currentNoDraft.length) return '';

      /*
       * Column header — sortable. Default sort: pts desc.
       * F/D cols: GP · G · A · Pts
       * G   cols: W  · SO · GP · Pts
       */
      const sortField = _rosterSort[pos] || 'pts';
      const arrow = f => f === sortField ? ' ▾' : '';
      const sortHdr = (f, label) =>
        `<div class="lb-col-label sort-hdr" style="cursor:pointer;user-select:none" onclick="setRosterSort('${pos}','${f}')">${label}${arrow(f)}</div>`;

      const colHeader = `
        <div class="hist-header-row">
          <div></div>
          <div class="lb-col-label left">Player</div>
          ${pos==='G'
            ? `${sortHdr('gp','GP')}${sortHdr('w','W')}<div class="lb-col-label hist-col-hide-g">${sortHdr('so','SO')}</div>`
            : `${sortHdr('gp','GP')}${sortHdr('g','G')}<div class="lb-col-label hist-col-hide">${sortHdr('a','A')}</div>`}
          ${sortHdr('pts','Pts')}
        </div>`;

      // Build data objects for all rows so we can sort before rendering
      const rowData = [];

      trades.forEach(t => {
        const isCurrent = activeSlugSet.has(t.player_to_slug);
        const tradeKey = tradeWindowKey(t, isCurrent);
        const p = m[t.player_to_slug] ? { ...m[t.player_to_slug], _slug: t.player_to_slug } : null;
        const abbr = p ? TEAM_ABBR[p.team] : null;
        const logo = abbr ? `<img src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
        const acqDate = t.date_from_acquired ? new Date(t.date_from_acquired) : ACTIVE_ACQUIRED_FALLBACK_DATE;
        const tenureTooltip = isCurrent
          ? `${fmt(acqDate)} → Now`
          : t.date_traded ? `${fmt(acqDate)} → ${fmt(t.date_traded)}` : `${fmt(acqDate)} → Now`;
        let col1='—', col2='—', col3='—', pts, gp=0, g=0, a=0, w=0, so=0;
        if (isCurrent && p) {
          const d = ownedStatsDelta(p, team, p._slug);
          gp=d.gamesPlayed; g=d.goals; a=d.assists; w=d.wins; so=d.shutouts;
          if (pos === 'G') { col1 = gp; col2 = w; col3 = so; }
          else             { col1 = gp; col2 = g; col3 = a; }
          pts = poolScoreOwned(p, team, p._slug);
        } else {
          pts = _windowPtsByTradeKey[tradeKey] ?? t.points_accumulated_at_trade ?? '—';
        }
        rowData.push({ isCurrent, cls: isCurrent?'current':'past', name: t.player_to_name||t.player_to_slug, logo, tenure: tenureTooltip, col1, col2, col3, pts, gp, g, a, w, so });
      });

      currentNoDraft.forEach(p => {
        const abbr = TEAM_ABBR[p.team];
        const logo = abbr ? `<img src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
        const d = ownedStatsDelta(p, team, p._slug);
        const gp=d.gamesPlayed, g=d.goals, a=d.assists, w=d.wins, so=d.shutouts;
        let col1='—', col2='—', col3='—';
        if (pos === 'G') { col1 = gp; col2 = w; col3 = so; }
        else             { col1 = gp; col2 = g; col3 = a; }
        const pts = poolScoreOwned(p, team, p._slug);
        const acqDate = resolveActiveAcquiredDate(team, p._slug);
        const tenure = `${fmt(acqDate)} → Now`;
        rowData.push({ isCurrent: true, cls: 'current', name: formatName(p.player_name), logo, tenure, col1, col2, col3, pts, gp, g, a, w, so });
      });

      // Sort: current players first, then by selected field desc, past players always last
      const sortKey = { pts:'pts', gp:'gp', g:'g', a:'a', w:'w', so:'so' }[sortField] || 'pts';
      rowData.sort((a, b) => {
        if (a.isCurrent !== b.isCurrent) return a.isCurrent ? -1 : 1;
        const av = typeof a[sortKey] === 'number' ? a[sortKey] : -1;
        const bv = typeof b[sortKey] === 'number' ? b[sortKey] : -1;
        return bv - av;
      });

      const renderedRows = rowData.map(r => `<div class="hist-row ${r.cls}">
          <span class="hist-pos ${pos}">${pos}</span>
          <span class="hist-name${r.isCurrent?'':' past'}" title="${r.tenure}">${r.logo}${r.name}</span>
          <span class="hist-stat">${r.col1}</span>
          <span class="hist-stat">${r.col2}</span>
          <span class="hist-stat${pos==='G'?' hist-col-hide-g':' hist-col-hide'}">${r.col3}</span>
          <span class="hist-pts">${r.pts}</span>
        </div>`);

      const allPts = rowData.map(r => typeof r.pts === 'number' ? r.pts : 0);
      const total = allPts.reduce((s, v) => s + v, 0);

      return `<div class="hist-table">
        <div class="hist-section-label ${pos}">${label}</div>
        ${colHeader}
        ${renderedRows.join('')}
        <div class="hist-row total">
          <div></div>
          <div class="lb-col-label left" style="font-size:0.75rem">TOTAL</div>
          <div></div><div></div>
          <div class="${pos==='G'?'hist-col-hide-g':'hist-col-hide'}"></div>
          <div class="hist-pts total">${total}</div>
        </div>
      </div>`;
    }

    // ── POOL LEADERS ──────────────────────────────────────────────────────────────
    function buildPoolLeaders() {
      const drafted = allDraftedPlayers();
      const byPos = { F: [], D: [], G: [] };
      drafted.forEach(({ player, owner, pos, team }) => {
        byPos[pos].push({ player, owner, team, pts: poolScoreOwned(player, team, player._slug) });
      });
      ['F','D','G'].forEach(pos => byPos[pos].sort((a, b) => b.pts - a.pts));
      const posLabels = { F: 'Forwards', D: 'Defence', G: 'Goalies' };

      let grandTotal = 0;

      /* FIX 2: position column total row + FIX 6: pos pill next to player name */
      const grid = `
        <div class="pool-section-title">Position <span>Leaders</span></div>
        <div class="pos-leaders-grid">
          ${['F','D','G'].map(pos => {
            const slice = byPos[pos].slice(0, 10);
            const colTotal = slice.reduce((s, item) => s + item.pts, 0);
            grandTotal += colTotal;
            return `<div class="pos-leader-col">
              <div class="pos-leader-col-header ${pos}">${posLabels[pos]} <small>POOL PTS</small></div>
              ${slice.map((item, i) => {
                const abbr = TEAM_ABBR[item.player.team];
                return `<div class="pos-leader-row">
                  <div class="pos-leader-rank">${i+1}</div>
                  <div class="pos-leader-name">${formatName(item.player.player_name)}</div>
                  <div class="pos-leader-team">${abbr||'—'}</div>
                  <div class="pos-leader-owner" ${ownerBadge(item.owner)}>${item.owner}</div>
                  <div class="pos-leader-pts">${item.pts}</div>
                </div>`;
              }).join('')}
              <div class="pos-leader-total">
                <span class="pos-leader-total-label">Top 10 total</span>
                <span class="pos-leader-total-pts">${colTotal} pts</span>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="pos-leaders-grand-total">
          Combined top-10 pool pts across all positions <strong>${grandTotal}</strong>
        </div>`;

      const allS = drafted.map(({ player, owner, pos, team }) => ({ player, owner, pos, team, pts: poolScoreOwned(player, team, player._slug) })).sort((a, b) => b.pts - a.pts).slice(0, 10);

      const top = `
        <div class="pool-section-title">Top <span>Pool Players</span></div>
        <div class="top-players-list">
          <div class="top-player-row header">
            <div></div>
            <div class="lb-col-label left">Player</div>
            <div class="lb-col-label">Owner</div>
            <div class="lb-col-label top-col-hide">GP</div>
            <div class="lb-col-label top-col-hide">G</div>
            <div class="lb-col-label top-col-hide">A</div>
            <div class="lb-col-label">Pts</div>
          </div>
          ${allS.map((item, i) => {
            const p = item.player;
            const abbr = TEAM_ABBR[p.team];
            const logo = abbr ? `<img class="top-player-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
            const d = ownedStatsDelta(p, item.team, p._slug);
            const s1 = d.pos === 'G' ? d.wins   : d.goals;
            const s2 = d.pos === 'G' ? d.shutouts : d.assists;
            return `<div class="top-player-row">
              <div class="top-player-rank">${i+1}</div>
              <div class="top-player-info">${logo}
                <div>
                  <div class="top-player-name">${formatName(p.player_name)}</div>
                </div>
                <span class="pos-pill ${item.pos}">${item.pos}</span>
              </div>
              <div class="top-player-owner" ${ownerBadge(item.owner)}>${item.owner}</div>
              <div class="top-player-stat top-col-hide">${d.gamesPlayed}</div>
              <div class="top-player-stat top-col-hide">${s1}</div>
              <div class="top-player-stat top-col-hide">${s2}</div>
              <div class="top-player-pts">${item.pts}</div>
            </div>`;
          }).join('')}
        </div>`;

      return grid + top;
    }

    // ── HISTORY / BUMP CHART ─────────────────────────────────────────────────────
    const TEAM_COLORS = [
      '#ffb81c','#7db4ff','#ff7a8a','#22c55e','#c084fc','#fb923c','#38bdf8','#f472b6',
      '#a3e635','#facc15','#f87171','#34d399',
    ];

    let _historyCache = null;

    async function loadHistory() {
      const el = document.getElementById('view-history');
      if (!el) return;

      if (_historyCache) { renderBumpChart(_historyCache, el); return; }

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/pool_standings_snapshots?league_code=eq.${_leagueCode}&order=snapshot_date.asc&select=snapshot_date,standings`,
          { headers: sbHeaders() }
        );
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length === 0) {
          el.innerHTML = '<div class="bump-empty">No history yet — check back tomorrow after the daily sync runs.</div>';
          return;
        }
        _historyCache = rows;
        renderBumpChart(rows, el);
      } catch(e) {
        el.innerHTML = '<div class="bump-empty">Could not load history.</div>';
      }
    }

    function renderBumpChart(rows, container) {
      // Collect all team IDs and assign stable colors
      const teamMeta = {};  // id → { name, color }
      rows.forEach(row => {
        (row.standings || []).forEach(t => {
          if (!teamMeta[t.team_id]) {
            const idx = Object.keys(teamMeta).length % TEAM_COLORS.length;
            teamMeta[t.team_id] = { name: t.name, color: TEAM_COLORS[idx] };
          }
        });
      });

      const teamIds = Object.keys(teamMeta);
      const n = teamIds.length;
      if (n === 0) { container.innerHTML = '<div class="bump-empty">No data.</div>'; return; }

      const dates = rows.map(r => r.snapshot_date);
      const cols = dates.length;

      // SVG dimensions
      const W = Math.max(320, cols * 80 + 120);
      const H = Math.max(200, n * 54 + 60);
      const PAD_LEFT = 20;
      const PAD_RIGHT = 80;
      const PAD_TOP = 28;
      const PAD_BOT = 28;
      const chartW = W - PAD_LEFT - PAD_RIGHT;
      const chartH = H - PAD_TOP - PAD_BOT;

      const xScale = i => PAD_LEFT + (cols <= 1 ? chartW / 2 : (i / (cols - 1)) * chartW);
      const yScale = rank => PAD_TOP + ((rank - 1) / Math.max(n - 1, 1)) * chartH;

      // Build paths per team
      const paths = teamIds.map(id => {
        const pts = rows.map(row => {
          const entry = (row.standings || []).find(t => t.team_id === id);
          return entry ? entry.rank : null;
        });

        let d = '';
        let prev = null;
        pts.forEach((rank, i) => {
          if (rank === null) { prev = null; return; }
          const x = xScale(i), y = yScale(rank);
          if (prev === null) {
            d += `M${x},${y}`;
          } else {
            // Smooth cubic bezier
            const mx = (prev.x + x) / 2;
            d += ` C${mx},${prev.y} ${mx},${y} ${x},${y}`;
          }
          prev = { x, y };
        });

        // Last known rank label (rightmost)
        const lastEntry = [...rows].reverse().map(row => (row.standings || []).find(t => t.team_id === id)).find(Boolean);
        const lastRank = lastEntry?.rank;
        const lastPts  = lastEntry?.pts;

        return { id, color: teamMeta[id].color, name: teamMeta[id].name, d, pts, lastRank, lastPts };
      });

      // Date labels
      const dateLabels = dates.map((d, i) => {
        const dt = new Date(d + 'T12:00:00');
        const label = dt.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
        return `<text x="${xScale(i)}" y="${PAD_TOP - 10}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.35)" font-family="Barlow Condensed,sans-serif">${label}</text>`;
      }).join('');

      // Horizontal rank guide lines
      const guides = Array.from({ length: n }, (_, i) => {
        const y = yScale(i + 1);
        return `<line x1="${PAD_LEFT}" y1="${y}" x2="${PAD_LEFT + chartW}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
      }).join('');

      // Rank labels on left
      const rankLabels = Array.from({ length: n }, (_, i) => {
        const y = yScale(i + 1);
        return `<text x="${PAD_LEFT - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.2)" font-family="Barlow Condensed,sans-serif">${i + 1}</text>`;
      }).join('');

      // Lines + dots + end labels
      const lines = paths.map(({ color, d, pts, name, lastRank, lastPts }) => {
        const dots = pts.map((rank, i) => {
          if (rank === null) return '';
          return `<circle cx="${xScale(i)}" cy="${yScale(rank)}" r="5" fill="${color}" stroke="#07111f" stroke-width="2"/>`;
        }).join('');

        const endX = xScale(cols - 1) + 14;
        const endY = lastRank ? yScale(lastRank) + 4 : 0;
        const endLabel = lastRank
          ? `<text x="${endX}" y="${endY}" font-size="11" font-weight="700" fill="${color}" font-family="Barlow Condensed,sans-serif">${name.split(' ')[0]} · ${lastPts}pts</text>`
          : '';

        return `<g>
          <path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
          ${dots}
          ${endLabel}
        </g>`;
      }).join('');

      // Legend
      const legend = paths.map(({ color, name }) =>
        `<div class="bump-legend-item"><div class="bump-legend-dot" style="background:${color}"></div>${name}</div>`
      ).join('');

      container.innerHTML = `
        <div class="pool-section-title" style="margin-bottom:1rem">📈 <span>RANK OVER TIME</span></div>
        <div class="bump-wrap">
          <svg class="bump-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
            ${guides}
            ${rankLabels}
            ${dateLabels}
            ${lines}
          </svg>
        </div>
        <div class="bump-legend">${legend}</div>
      `;
    }

    load();

    // ── SHARE STANDINGS ───────────────────────────────────────────────────────────
    async function shareStandings() {
      const btn = document.getElementById('share-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Generating…';

      // Load html2canvas on demand
      if (!window.html2canvas) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
      }

      const sorted = sortedTeams();
      const leaderPts = sorted.length ? teamTotalPts(sorted[0]) : 0;

      // Top 3 insights
      const insightColors = { gold: '#ffb81c', green: '#22c55e', blue: '#7db4ff', red: '#ff5050' };
      const insightBgs    = { gold: 'rgba(255,184,28,0.08)', green: 'rgba(34,197,94,0.07)', blue: 'rgba(125,180,255,0.07)', red: 'rgba(255,80,80,0.07)' };
      const insights = computeInsightData(sorted, leaderPts).slice(0, 3);
      const insightHtml = insights.map(d => `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:${insightBgs[d.color]};border:1px solid ${insightColors[d.color]}22;margin-bottom:6px">
          <div style="font-size:1.3rem;line-height:1;flex-shrink:0">${d.icon}</div>
          <div>
            <div style="font-size:0.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:1px">${d.label}</div>
            <div style="font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:1.5px;color:${insightColors[d.color]};line-height:1.2">${d.main}</div>
            <div style="font-size:0.75rem;font-weight:600;color:rgba(168,178,190,0.9);margin-top:1px">${d.sub}</div>
          </div>
        </div>`).join('');

      // Build an off-screen card to capture
      const card = document.createElement('div');
      card.style.cssText = `
        position:fixed; left:-9999px; top:0;
        width:480px; background:#07111f;
        background-image:radial-gradient(ellipse 100% 60% at 50% -10%, rgba(26,58,110,0.7) 0%, transparent 70%);
        font-family:'Barlow Condensed',sans-serif; color:white;
        padding:28px 24px 20px; border-radius:16px;
        box-shadow:0 0 0 1px rgba(255,255,255,0.1);
      `;

      const today = new Date().toLocaleDateString('en-CA', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'America/Toronto' });

      const rows = sorted.map((t, i) => {
        const pts = teamTotalPts(t);
        const sub = teamSubScores(t);
        const gap = i === 0 ? '—' : `−${teamTotalPts(sorted[0]) - pts}`;
        const medals = ['🥇','🥈','🥉'];
        const icon = medals[i] || `${i+1}`;
        const rowBg = i === 0 ? 'rgba(255,184,28,0.08)' : i === 1 ? 'rgba(168,178,190,0.05)' : i === 2 ? 'rgba(205,127,50,0.05)' : 'transparent';
        return `<div style="display:grid;grid-template-columns:32px 1fr 36px 36px 36px 52px 44px;gap:4px;align-items:center;padding:8px 10px;border-radius:7px;background:${rowBg};margin-bottom:3px;font-size:0.95rem;font-weight:600;letter-spacing:0.5px;">
          <div style="font-size:1.1rem;text-align:center">${icon}</div>
          <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name}</div>
          <div style="text-align:center;color:#ff7a8a;font-size:0.8rem">${sub.F}</div>
          <div style="text-align:center;color:#7db4ff;font-size:0.8rem">${sub.D}</div>
          <div style="text-align:center;color:#ffb81c;font-size:0.8rem">${sub.G}</div>
          <div style="text-align:center;color:#ffb81c;font-weight:800;font-size:1.05rem">${pts}</div>
          <div style="text-align:center;color:rgba(255,255,255,0.4);font-size:0.8rem">${gap}</div>
        </div>`;
      }).join('');

      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
          <div>
            <div style="font-family:'Bebas Neue',cursive;font-size:1.6rem;letter-spacing:3px;color:#ffb81c;line-height:1">POOL STANDINGS</div>
            <div style="font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase;margin-top:2px">${_leagueName ? `${_leagueName} · ` : ''}${_leagueCode} · ${today}</div>
          </div>
          <div style="font-size:0.7rem;color:rgba(255,255,255,0.25);letter-spacing:1px">parieurdiscipline.com</div>
        </div>
        ${insightHtml ? `<div style="margin-bottom:14px">${insightHtml}</div>` : ''}
        <div style="display:grid;grid-template-columns:32px 1fr 36px 36px 36px 52px 44px;gap:4px;align-items:center;padding:4px 10px 8px;font-size:0.68rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);">
          <div></div><div>Team</div>
          <div style="text-align:center;color:#ff7a8a">F</div>
          <div style="text-align:center;color:#7db4ff">D</div>
          <div style="text-align:center;color:#ffb81c">G</div>
          <div style="text-align:center">PTS</div>
          <div style="text-align:center">GAP</div>
        </div>
        <div style="border-top:1px solid rgba(255,255,255,0.07);padding-top:8px">${rows}</div>
      `;

      document.body.appendChild(card);

      try {
        const canvas = await html2canvas(card, {
          backgroundColor: null, scale: 2, useCORS: true, logging: false
        });

        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        const file = new File([blob], 'pool-standings.png', { type: 'image/png' });

        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Pool Standings', text: `Pool standings as of ${today} — parieurdiscipline.com` });
        } else {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          btn.textContent = '✅ Copied!';
          setTimeout(() => { btn.textContent = '📸 Share'; }, 2000);
        }
      } catch(e) {
        if (e.name !== 'AbortError') alert('Could not generate image. Try again.');
      } finally {
        document.body.removeChild(card);
        btn.disabled = false;
        if (btn.textContent !== '✅ Copied!') btn.textContent = '📸 Share';
      }
    }
</script>
</body>
</html>
