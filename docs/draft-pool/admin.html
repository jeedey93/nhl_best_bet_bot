    #lock-screen p { color: var(--silver); font-size: 0.85rem; letter-spacing: 1px; }

    .lock-input:focus { outline: none; border-color: rgba(255,184,28,0.5); }

    .page-header h1 { font-family: 'Bebas Neue', cursive; font-size: 2rem; letter-spacing: 5px; }
    .page-header h1 span { color: var(--gold); }

    /* ── Sections ── */
    .section { margin-bottom: 2rem; }
    .section-title { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 3px; color: var(--silver); margin-bottom: 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: space-between; }

    /* ── Participants ── */
    .participants { display: flex; flex-direction: column; gap: 0.4rem; }
    .participant-row { display: grid; grid-template-columns: 1fr auto auto; gap: 0.75rem; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 0.75rem 1rem; }

    .actual-pill-name { font-family: 'Bebas Neue', cursive; font-size: 0.95rem; letter-spacing: 1px; color: #22c55e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actual-pill-edit { font-size: 0.65rem; color: rgba(34,197,94,0.5); flex-shrink: 0; }
    .actual-unset { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 600; color: rgba(255,255,255,0.2); letter-spacing: 0.5px; font-style: italic; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }

    /* ── Confirm modal ── */
    .modal-backdrop { position: fixed; inset: 0; z-index: 600; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-backdrop.show { opacity: 1; pointer-events: all; }
    .modal { position: fixed; left: 50%; top: 50%; z-index: 700; transform: translate(-50%, -52%) scale(0.95); opacity: 0; pointer-events: none; transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s; background: #0e1e35; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.75rem 1.5rem 1.25rem; width: calc(100% - 2.5rem); max-width: 360px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.6); }

    .modal-actions { display: flex; gap: 0.6rem; }
    .modal-cancel { flex: 1; font-family: 'Bebas Neue', cursive; font-size: 0.95rem; letter-spacing: 2px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: var(--silver); border-radius: 8px; padding: 0.6rem; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .modal-cancel:hover { background: rgba(255,255,255,0.1); color: white; }
    .modal-confirm { flex: 2; font-family: 'Bebas Neue', cursive; font-size: 0.95rem; letter-spacing: 2px; background: linear-gradient(135deg, #c8102e, #8b0000); color: white; border: none; border-radius: 8px; padding: 0.6rem; cursor: pointer; transition: opacity 0.15s; }
    .modal-confirm:hover { opacity: 0.85; }

  let _actualPicks = {};

  function unlock() {
    const val = document.getElementById('lock-input').value;
    if (val === ADMIN_PASSWORD) {
      document.getElementById('lock-screen').style.display = 'none';
      loadAll();
    } else {
      const el = document.getElementById('lock-input');
      el.classList.add('shake'); el.value = '';
      setTimeout(() => el.classList.remove('shake'), 400);

  async function loadAll() {
    await Promise.all([loadParticipants(), loadActualPicks()]);
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'America/Toronto' });
  }

  async function loadParticipants() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/draft_pool_entries?pool_code=eq.${POOL_CODE}&order=submitted_at.asc&select=id,participant_name,email,pick_count,submitted_at,updated_at`, { headers: sbHeaders() });
      if (!res.ok) throw new Error(res.status);
      renderParticipants(await res.json());
    } catch(e) {
      document.getElementById('participants-list').innerHTML = `<div class="empty-state">Failed to load (${e.message})</div>`;
    }
  }

  function renderParticipants(data) {
    const count = data.length;
    document.getElementById('participant-count').textContent = `${count} participant${count !== 1 ? 's' : ''}`;
    if (count === 0) {
      document.getElementById('participants-list').innerHTML = `<div class="empty-state">No participants yet.</div>`;
      return;
    }
    document.getElementById('participants-list').innerHTML = data.map(p => `
      <div class="participant-row" id="row-${p.id}">
        <div>
          <div class="p-name">${escHtml(p.participant_name)}</div>
          <div class="p-date">${p.email ? escHtml(p.email) + ' · ' : ''}Submitted ${formatDate(p.submitted_at)}${p.updated_at !== p.submitted_at ? ' · Updated ' + formatDate(p.updated_at) : ''}</div>
        </div>
        <div class="p-picks ${p.pick_count >= 32 ? 'complete' : ''}">${p.pick_count}/32</div>
        <button class="btn-delete" onclick="deleteParticipant(${p.id}, '${escHtml(p.participant_name).replace(/'/g,"\\'")}')">Delete</button>
      </div>`).join('');
  }

  let _modalResolve = null;
  function showConfirmModal(body) {
    return new Promise(resolve => {
      _modalResolve = resolve;
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal-backdrop').classList.add('show');
      document.getElementById('modal').classList.add('show');
    });
  }
  function closeModal(result) {
    document.getElementById('modal-backdrop').classList.remove('show');
    document.getElementById('modal').classList.remove('show');
    if (_modalResolve) { _modalResolve(result); _modalResolve = null; }
  }
  document.getElementById('modal-cancel').onclick = () => closeModal(false);
  document.getElementById('modal-confirm').onclick = () => closeModal(true);
  document.getElementById('modal-backdrop').onclick = () => closeModal(false);

  async function deleteParticipant(id, name) {
    const confirmed = await showConfirmModal(`Delete <strong>${escHtml(name)}</strong>?<br>This cannot be undone.`);
    if (!confirmed) return;
    const btn = document.querySelector(`#row-${id} .btn-delete`);
    btn.disabled = true; btn.textContent = '…';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/draft_pool_entries?id=eq.${id}&pool_code=eq.${POOL_CODE}`, { method: 'DELETE', headers: sbHeaders() });
      if (!res.ok) throw new Error(res.status);
      document.getElementById(`row-${id}`).remove();
      const remaining = document.querySelectorAll('.participant-row').length;
      document.getElementById('participant-count').textContent = `${remaining} participant${remaining !== 1 ? 's' : ''}`;
      if (remaining === 0) document.getElementById('participants-list').innerHTML = `<div class="empty-state">No participants yet.</div>`;
      showToast(`${name} deleted.`);
    } catch(e) {
      showToast(`Failed to delete (${e.message})`, true);
      btn.disabled = false; btn.textContent = 'Delete';
    }
  }

  async function loadActualPicks() {

      const res = await fetch(`${SUPABASE_URL}/rest/v1/draft_pools?code=eq.${POOL_CODE}&select=actual_picks`, { headers: sbHeaders() });

      const rows = await res.json();
      _actualPicks = rows[0]?.actual_picks || {};
      renderActualPicks();
    } catch(e) {
      document.getElementById('actual-results-list').innerHTML = `<div class="empty-state">Failed to load (${e.message})</div>`;

  const prospectByRank = Object.fromEntries(PROSPECTS.map(p => [p.rank, p]));

  function getAssignedRanks(excludePick) {
    const used = new Set();
    for (const d of DRAFT_ORDER) {
      if (d.pick === excludePick) continue;
      if (_actualPicks[d.pick]) used.add(String(_actualPicks[d.pick]));
    }
    return used;
  }

  function setActualPick(pick, rank) {
    if (rank) _actualPicks[pick] = parseInt(rank);
    else delete _actualPicks[pick];
    renderActualRow(DRAFT_ORDER.find(d => d.pick === pick));
  }

  function editActualPick(pick) {
    delete _actualPicks[pick];
    renderActualRow(DRAFT_ORDER.find(d => d.pick === pick), true);
    setTimeout(() => document.getElementById(`act-${pick}`)?.focus(), 0);
  }

  function renderActualRow(d, forceEdit = false) {
    const rank = _actualPicks[d.pick];
    const prospect = rank ? prospectByRank[rank] : null;
    const used = getAssignedRanks(d.pick);
    const optionsHtml = PROSPECTS.map(p =>
      `<option value="${p.rank}"${used.has(String(p.rank)) ? ' disabled' : ''}>#${p.rank} ${escHtml(p.name)}</option>`
    ).join('');

    const rightHtml = prospect && !forceEdit
      ? `<div class="actual-pill" onclick="editActualPick(${d.pick})">
           <span class="actual-pill-name">${escHtml(prospect.name)}</span>
           <span class="actual-pill-edit">✎</span>
         </div>`
      : `<select class="actual-select" id="act-${d.pick}" onchange="setActualPick(${d.pick}, this.value)">
           <option value="">— Not set —</option>
           ${optionsHtml}
         </select>`;

    document.getElementById(`actual-row-${d.pick}`).querySelector('.actual-right').innerHTML = rightHtml;
  }

  function renderActualPicks() {
    const rows = DRAFT_ORDER.map(d => `
      <div class="actual-row" id="actual-row-${d.pick}">
        <div class="actual-num">${d.pick}</div>
        <img class="actual-logo" src="https://assets.nhle.com/logos/nhl/svg/${d.abbr}_light.svg" alt="${d.abbr}" title="${escHtml(d.team)}${d.via ? ' via ' + d.via : ''}" onerror="this.style.visibility='hidden'">
        <div class="actual-right"></div>
      </div>`).join('');

    document.getElementById('actual-results-list').innerHTML = `
      ${rows}
      <button class="btn-save-actual" onclick="saveActual()">Save Results</button>`;

    for (const d of DRAFT_ORDER) renderActualRow(d);
  }

  async function saveActual() {
    const btn = document.querySelector('.btn-save-actual');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/draft_pools?code=eq.${POOL_CODE}`, {
        method: 'PATCH',
        headers: { ...sbHeaders(), 'Prefer': 'return=minimal' },
        body: JSON.stringify({ actual_picks: _actualPicks })
      });
      if (!res.ok) throw new Error(res.status);
      showToast('✅ Results saved!');
      btn.disabled = false; btn.textContent = 'Save Results';
    } catch(e) {
      showToast('Failed to save results.', true);
      btn.disabled = false; btn.textContent = 'Save Results';
    }
  }

  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    el.style.borderColor = isError ? 'rgba(200,16,46,0.4)' : 'rgba(255,255,255,0.12)';
    setTimeout(() => el.style.display = 'none', 3000);
  }
</script>
</body>
</html>
