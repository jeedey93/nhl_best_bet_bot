    { rank: 42, name: 'Gleb Pugachyov',      pos: 'RW',    club: 'Chaika NN' },

    { rank: 44, name: 'Tomas Chrenko',       pos: 'C',     club: 'HK Nitra' },
    { rank: 45, name: 'Ben Macbeath',        pos: 'LD',    club: 'Calgary' },
    { rank: 46, name: 'Tobias Trejbal',      pos: 'G',     club: 'Youngstown' },
    { rank: 47, name: 'Alessandro Di Iorio', pos: 'C',     club: 'Sarnia' },
    { rank: 48, name: 'Samu Alalauri',       pos: 'RD',    club: 'Pelicans' },
    { rank: 49, name: 'Adam Valentini',      pos: 'F',     club: 'Michigan' },
    { rank: 50, name: 'Thomas Vandenberg',   pos: 'C',     club: 'Ottawa' },
  ];

  const prospectMap = Object.fromEntries(PROSPECTS.map(p => [p.rank, p]));

  let _picks = {};
  let _activePick = null;

  // ── Build pick slots
  function buildPicks() {
    document.getElementById('picks-list').innerHTML = DRAFT_ORDER.map(d => `
      <div class="pick-slot" id="slot-${d.pick}" onclick="openSheet(${d.pick})">
        <div class="slot-num">${d.pick}</div>
        <img class="slot-logo" src="https://assets.nhle.com/logos/nhl/svg/${d.abbr}_light.svg" alt="${d.abbr}" onerror="this.style.visibility='hidden'">
        <div class="slot-body">
          <div class="slot-team-name">${escHtml(d.team)}</div>
          <div class="slot-team-sub">${d.via ? `via ${d.via} · ` : ''}${d.conf}</div>
        </div>
        <div class="slot-right" id="slot-right-${d.pick}">
          <span class="slot-empty-label">tap to pick</span>
        </div>
      </div>`).join('');
  }

  // ── Sheet
  function openSheet(pick) {
    _activePick = pick;
    const d = DRAFT_ORDER.find(x => x.pick === pick);
    document.getElementById('sheet-title').textContent = `PICK ${pick} — ${d.team.toUpperCase()}`;
    document.getElementById('sheet-search').value = '';
    renderSheetList('');
    document.getElementById('sheet').classList.add('show');
    document.getElementById('backdrop').classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(() => document.getElementById('sheet-search').focus(), 350);
    // highlight active slot
    document.querySelectorAll('.pick-slot').forEach(el => el.classList.remove('active'));
    document.getElementById(`slot-${pick}`).classList.add('active');
  }

  function closeSheet() {
    document.getElementById('sheet').classList.remove('show');
    document.getElementById('backdrop').classList.remove('show');
    document.body.style.overflow = '';
    document.querySelectorAll('.pick-slot').forEach(el => el.classList.remove('active'));
    _activePick = null;
  }

  function filterProspects(val) { renderSheetList(val); }

  function renderSheetList(filter) {
    const q = filter.toLowerCase();
    const list = q ? PROSPECTS.filter(p => p.name.toLowerCase().includes(q)) : PROSPECTS;
    const currentRank = _activePick ? _picks[_activePick] : null;

    // Clear pick option at top if slot is assigned
    let clearHtml = '';
    if (currentRank) {
      clearHtml = `<div class="prospect-item" style="border-bottom:1px solid rgba(255,255,255,0.06)" onclick="clearPick()">
        <div class="prospect-rank" style="color:var(--red);font-size:1rem;">✕</div>
        <div class="prospect-info"><div class="prospect-name" style="color:rgba(255,255,255,0.5)">Clear this pick</div></div>
      </div>`;
    }

    document.getElementById('sheet-list').innerHTML = clearHtml + list.map(p => {
      const used = Object.values(_picks).includes(p.rank) && _picks[_activePick] !== p.rank;
      const selected = currentRank === p.rank;
      return `<div class="prospect-item${used ? ' used' : ''}${selected ? ' selected' : ''}" onclick="${used ? '' : `assignProspect(${p.rank})`}">
        <div class="prospect-rank">${p.rank}</div>
        <div class="prospect-info">
          <div class="prospect-name">${escHtml(p.name)}</div>
          <div class="prospect-meta">${escHtml(p.club)}</div>
        </div>
        <div class="prospect-pos">${p.pos}</div>
      </div>`;
    }).join('');
  }

  function assignProspect(rank) {
    if (!_activePick) return;
    // If used elsewhere, free that slot
    for (const [pick, r] of Object.entries(_picks)) {
      if (r === rank && parseInt(pick) !== _activePick) {
        delete _picks[pick];
        updateSlotDisplay(parseInt(pick));
      }
    }
    _picks[_activePick] = rank;
    updateSlotDisplay(_activePick);
    updateProgress();
    closeSheet();
  }

  function clearPick() {
    if (!_activePick) return;
    delete _picks[_activePick];
    updateSlotDisplay(_activePick);
    updateProgress();
    closeSheet();
  }

  function updateSlotDisplay(pick) {
    const el = document.getElementById(`slot-right-${pick}`);
    const row = document.getElementById(`slot-${pick}`);
    const rank = _picks[pick];
    if (rank) {
      const p = prospectMap[rank];
      el.innerHTML = `<span class="slot-prospect-name">${escHtml(p.name)}</span><span class="slot-prospect-meta">#${p.rank} · ${p.pos}</span>`;
      row.classList.add('assigned');
    } else {
      el.innerHTML = `<span class="slot-empty-label">tap to pick</span>`;
      row.classList.remove('assigned');
    }
  }

  function updateProgress() {
    const count = Object.keys(_picks).length;
    document.getElementById('progress-text').textContent = `${count} / 32`;
    document.getElementById('progress-fill').style.width = `${(count / 32) * 100}%`;
    document.getElementById('submit-count').innerHTML = `<strong>${count}</strong>/32`;
    document.getElementById('btn-submit').disabled = count < 32;
    document.getElementById('btn-autofill').style.display = (count < 32) ? 'inline-block' : 'none';
  }

  let _modalResolve = null;

  function showModal(bodyHtml, icon = '⚡', title = 'Auto-Fill Picks', confirmLabel = 'Auto-Fill') {
    return new Promise(resolve => {
      _modalResolve = resolve;
      document.getElementById('modal-icon').textContent = icon;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-confirm').textContent = confirmLabel;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-backdrop').classList.add('show');
      document.getElementById('modal').classList.add('show');
    });
  }

  function modalConfirm() {
    document.getElementById('modal-backdrop').classList.remove('show');
    document.getElementById('modal').classList.remove('show');
    if (_modalResolve) { _modalResolve(true); _modalResolve = null; }
  }

  function modalCancel() {
    document.getElementById('modal-backdrop').classList.remove('show');
    document.getElementById('modal').classList.remove('show');
    if (_modalResolve) { _modalResolve(false); _modalResolve = null; }
  }

  async function autoFill() {
    const emptySlots = DRAFT_ORDER.filter(d => !_picks[d.pick]);
    const confirmed = await showModal(
      `Fill the remaining <strong>${emptySlots.length} empty slot${emptySlots.length !== 1 ? 's' : ''}</strong> with the best available prospects by rank?`
    );
    if (!confirmed) return;
    const usedRanks = new Set(Object.values(_picks));
    const available = PROSPECTS.filter(p => !usedRanks.has(p.rank));
    for (let i = 0; i < emptySlots.length && i < available.length; i++) {
      _picks[emptySlots[i].pick] = available[i].rank;
      updateSlotDisplay(emptySlots[i].pick);
    }
    updateProgress();
  }

  // close sheet on swipe down
  let _touchY = 0;
  document.getElementById('sheet').addEventListener('touchstart', e => { _touchY = e.touches[0].clientY; }, { passive: true });
  document.getElementById('sheet').addEventListener('touchmove', e => {
    if (e.target.closest('.sheet-list')) return;
    if (e.touches[0].clientY - _touchY > 60) closeSheet();
  }, { passive: true });

  // ── Submit
  async function submitPicks() {
    const nameEl = document.getElementById('name-input');
    const emailEl = document.getElementById('email-input');
    const name = nameEl.value.trim();
    const email = emailEl.value.trim().toLowerCase();

    if (!name) {
      nameEl.classList.add('shake'); nameEl.focus();
      setTimeout(() => nameEl.classList.remove('shake'), 400);
      showToast('Enter your name to submit.', true); return;
    }
    if (!email || !email.includes('@')) {
      emailEl.classList.add('shake'); emailEl.focus();
      setTimeout(() => emailEl.classList.remove('shake'), 400);
      showToast('Enter a valid email to submit.', true); return;
    }
    const count = Object.keys(_picks).length;
    if (count === 0) { showToast('Assign at least one prospect first.', true); return; }

    // Check if name already exists
    const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/draft_pool_entries?pool_code=eq.${POOL_CODE}&participant_name=eq.${encodeURIComponent(name)}&select=id,email`, {
      headers: sbHeaders()
    });
    const existing = checkRes.ok ? await checkRes.json() : [];
    if (existing.length > 0) {
      const existingEmail = existing[0].email?.toLowerCase();
      if (existingEmail && existingEmail !== email) {
        showToast('Wrong email for this name. Use the same email as your original submission.', true);
        emailEl.classList.add('shake');
        setTimeout(() => emailEl.classList.remove('shake'), 400);
        return;
      }
      const confirmed = await showModal(
        `Picks already submitted under <strong>${escHtml(name)}</strong>.<br><br>Re-submitting will overwrite your previous entry.`,
        '⚠️', 'Already Submitted', 'Update Picks'
      );
      if (!confirmed) return;
    }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/draft_pool_entries`, {
        method: 'POST',
        headers: { ...sbHeaders(), 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ pool_code: POOL_CODE, participant_name: name, email, picks: _picks, pick_count: count }),
      });
      if (!res.ok) {
        const body = await res.text();
        console.error('Submit failed:', res.status, body);
        throw new Error(res.status);
      }
      document.getElementById('success-count').textContent = `${count} of 32 picks submitted`;
      document.getElementById('success-overlay').classList.add('show');
    } catch(e) {
      showToast(`Failed to save (${e.message}). Try again.`, true);
      btn.disabled = false; btn.textContent = 'Submit';
    }
  }

  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    el.style.borderColor = isError ? 'rgba(200,16,46,0.4)' : 'rgba(255,255,255,0.12)';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  buildPicks();
</script>
