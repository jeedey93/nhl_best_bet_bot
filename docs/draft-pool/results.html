  const POOL_CODE = 'DRAFT2026';

  function sbHeaders() { return { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }; }
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  const DRAFT_ORDER = [
    { pick: 1,  team: 'Toronto Maple Leafs',    abbr: 'TOR', via: '' },
    { pick: 2,  team: 'San Jose Sharks',         abbr: 'SJS', via: '' },
    { pick: 3,  team: 'Vancouver Canucks',       abbr: 'VAN', via: '' },
    { pick: 4,  team: 'Chicago Blackhawks',      abbr: 'CHI', via: '' },
    { pick: 5,  team: 'New York Rangers',        abbr: 'NYR', via: '' },
    { pick: 6,  team: 'Calgary Flames',          abbr: 'CGY', via: '' },
    { pick: 7,  team: 'Seattle Kraken',          abbr: 'SEA', via: '' },
    { pick: 8,  team: 'Winnipeg Jets',           abbr: 'WPG', via: '' },
    { pick: 9,  team: 'Florida Panthers',        abbr: 'FLA', via: '' },
    { pick: 10, team: 'Nashville Predators',     abbr: 'NSH', via: '' },
    { pick: 11, team: 'St. Louis Blues',         abbr: 'STL', via: '' },
    { pick: 12, team: 'New Jersey Devils',       abbr: 'NJD', via: '' },
    { pick: 13, team: 'New York Islanders',      abbr: 'NYI', via: '' },
    { pick: 14, team: 'Columbus Blue Jackets',   abbr: 'CBJ', via: '' },
    { pick: 15, team: 'St. Louis Blues',         abbr: 'STL', via: 'DET' },
    { pick: 16, team: 'Washington Capitals',     abbr: 'WSH', via: '' },
    { pick: 17, team: 'Los Angeles Kings',       abbr: 'LAK', via: '' },
    { pick: 18, team: 'Washington Capitals',     abbr: 'WSH', via: 'ANA' },
    { pick: 19, team: 'Utah Hockey Club',        abbr: 'UTA', via: '' },
    { pick: 20, team: 'San Jose Sharks',         abbr: 'SJS', via: 'EDM' },
    { pick: 21, team: 'Philadelphia Flyers',     abbr: 'PHI', via: '' },
    { pick: 22, team: 'Pittsburgh Penguins',     abbr: 'PIT', via: '' },
    { pick: 23, team: 'Boston Bruins',           abbr: 'BOS', via: '' },
    { pick: 24, team: 'Vancouver Canucks',       abbr: 'VAN', via: 'MIN' },
    { pick: 25, team: 'Seattle Kraken',          abbr: 'SEA', via: 'TB' },
    { pick: 26, team: 'New York Rangers',        abbr: 'NYR', via: 'DAL' },
    { pick: 27, team: 'Buffalo Sabres',          abbr: 'BUF', via: '' },
    { pick: 28, team: 'Montreal Canadiens',      abbr: 'MTL', via: '' },
    { pick: 29, team: 'St. Louis Blues',         abbr: 'STL', via: 'COL' },
    { pick: 30, team: 'Calgary Flames',          abbr: 'CGY', via: 'VGK' },
    { pick: 31, team: 'Carolina Hurricanes',     abbr: 'CAR', via: '' },
    { pick: 32, team: 'Ottawa Senators',         abbr: 'OTT', via: '' },
  ];

  const PROSPECTS = [
    { rank: 1, name: 'Gavin McKenna' }, { rank: 2, name: 'Ivar Stenberg' },
    { rank: 3, name: 'Chase Reid' }, { rank: 4, name: 'Caleb Malhotra' },
    { rank: 5, name: 'Keaton Verhoeff' }, { rank: 6, name: 'Carson Carels' },
    { rank: 7, name: 'Alberts Smits' }, { rank: 8, name: 'Tynan Lawrence' },
    { rank: 9, name: 'Viggo Björck' }, { rank: 10, name: 'Daxon Rudolph' },
    { rank: 11, name: 'Ethan Belchetz' }, { rank: 12, name: 'Malte Gustafsson' },
    { rank: 13, name: 'Ryan Lin' }, { rank: 14, name: 'Oscar Hemming' },
    { rank: 15, name: 'Wyatt Cullen' }, { rank: 16, name: 'Adam Novotný' },
    { rank: 17, name: 'Xavier Villeneuve' }, { rank: 18, name: 'Oliver Suvanto' },
    { rank: 19, name: 'Elton Hermansson' }, { rank: 20, name: 'Nikita Klepov' },
    { rank: 21, name: 'Alexander Command' }, { rank: 22, name: 'Ilya Morozov' },
    { rank: 23, name: 'JP Hurlbert' }, { rank: 24, name: 'Maddox Dagenais' },
    { rank: 25, name: 'Mathis Preston' }, { rank: 26, name: 'Juho Piiparinen' },
    { rank: 27, name: 'William Hakansson' }, { rank: 28, name: 'Marcus Nordmark' },
    { rank: 29, name: 'Liam Ruck' }, { rank: 30, name: 'Jack Hextall' },
    { rank: 31, name: 'Ryan Roobroeck' }, { rank: 32, name: 'Markus Ruck' },
    { rank: 33, name: 'Yegor Shilov' }, { rank: 34, name: 'Brooks Rogowski' },
    { rank: 35, name: 'Niklas Aaram-Olsen' }, { rank: 36, name: 'Simas Ignatavicius' },
    { rank: 37, name: 'Adam Goljer' }, { rank: 38, name: 'Tommy Bleyl' },
    { rank: 39, name: 'Nikita Shcherbakov' }, { rank: 40, name: 'Ryder Cali' },
    { rank: 41, name: 'Casey Mutryn' }, { rank: 42, name: 'Gleb Pugachyov' },
    { rank: 43, name: 'Jaxon Cover' }, { rank: 44, name: 'Tomas Chrenko' },
    { rank: 45, name: 'Ben Macbeath' }, { rank: 46, name: 'Tobias Trejbal' },
    { rank: 47, name: 'Alessandro Di Iorio' }, { rank: 48, name: 'Samu Alalauri' },
    { rank: 49, name: 'Adam Valentini' }, { rank: 50, name: 'Thomas Vandenberg' },
  ];

  const prospectByRank = Object.fromEntries(PROSPECTS.map(p => [p.rank, p]));

  let _entries = [];
  let _actualPicks = {};
  let _activeTab = 'leaderboard';
  let _personalEntry = null;
  let _lastUpdated = null;
  let _refreshTimer = null;

  function updateTimestamp() {
    if (!_lastUpdated) return;
    const el = document.getElementById('last-updated');
    const txt = document.getElementById('last-updated-text');
    const dot = document.getElementById('refresh-dot');
    el.style.display = 'flex';
    const secs = Math.round((Date.now() - _lastUpdated) / 1000);
    const label = secs < 10 ? 'just now'
      : secs < 60 ? `${secs}s ago`
      : secs < 3600 ? `${Math.floor(secs / 60)}m ago`
      : `${Math.floor(secs / 3600)}h ago`;
    const hasScores = Object.keys(_actualPicks).length > 0;
    txt.textContent = `Updated ${label}`;
    dot.className = 'refresh-dot' + (hasScores ? ' live' : '');
  }

  async function refresh() {
    try {
      const [poolRes, entRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/draft_pools?code=eq.${POOL_CODE}&select=code,name,actual_picks`, { headers: sbHeaders() }),
        fetch(`${SUPABASE_URL}/rest/v1/draft_pool_entries?pool_code=eq.${POOL_CODE}&select=id,participant_name,picks,pick_count&order=pick_count.desc`, { headers: sbHeaders() })
      ]);
      if (!poolRes.ok || !entRes.ok) return;
      const rows = await poolRes.json();
      if (!rows.length) return;
      _actualPicks = rows[0].actual_picks || {};
      _entries = await entRes.json();
      _lastUpdated = Date.now();
      updateTimestamp();
      renderTab();
    } catch(e) {}
  }

  async function init() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/draft_pools?code=eq.${POOL_CODE}&select=code,name,actual_picks`, { headers: sbHeaders() });
      if (!res.ok) throw new Error(res.status);
      const rows = await res.json();
      if (!rows.length) { document.getElementById('content-wrap').innerHTML = '<div class="no-data">Pool not found.</div>'; return; }
      const pool = rows[0];
      document.getElementById('pool-badge').innerHTML = `<span>2026 NHL Draft Pool</span>`;
      _actualPicks = pool.actual_picks || {};

      const entRes = await fetch(
        `${SUPABASE_URL}/rest/v1/draft_pool_entries?pool_code=eq.${POOL_CODE}&select=id,participant_name,picks,pick_count&order=pick_count.desc`,
        { headers: sbHeaders() }
      );
      if (!entRes.ok) throw new Error(entRes.status);
      _entries = await entRes.json();
      _lastUpdated = Date.now();
      updateTimestamp();
      renderTab();

      // Auto-refresh every 30s, update timestamp display every 10s
      _refreshTimer = setInterval(refresh, 30000);
      setInterval(updateTimestamp, 10000);
    } catch(e) {
      document.getElementById('content-wrap').innerHTML = `<div class="no-data">Unable to load results. Check your connection and <a href="" onclick="location.reload();return false;" style="color:var(--gold)">try again</a>.</div>`;
    }
  }

  function isDesktop() { return window.innerWidth >= 900; }

  function setTab(tab, btn) {
    _activeTab = tab;
    _personalEntry = null;
    document.getElementById('tab-btn-back').style.display = 'none';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTab();
  }

  function renderTab() {
    if (_personalEntry) renderPersonal(_personalEntry);
    else if (isDesktop()) renderDesktop();
    else if (_activeTab === 'leaderboard') renderLeaderboard();
    else renderBoard();
  }

  function openPersonal(id) {
    const entry = _entries.find(e => e.id === id);
    if (!entry) return;
    _personalEntry = entry;
    document.getElementById('tab-btn-back').style.display = 'inline-block';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    renderPersonal(entry);
  }

  function backToLeaderboard() {
    _personalEntry = null;
    document.getElementById('tab-btn-back').style.display = 'none';
    document.getElementById('tab-leaderboard').classList.add('active');
    _activeTab = 'leaderboard';
    renderLeaderboard();
  }

  function renderPersonal(entry) {
    const wrap = document.getElementById('content-wrap');
    const scrollY = window.scrollY;
    const hasActual = Object.keys(_actualPicks).length > 0;
    const r = computeScore(entry.picks || {});

    let scoreStrip = '';
    if (hasActual && r) {
      const chips = [
        r.exact  > 0 ? `<span class="personal-bd-chip c4">${r.exact}× exact</span>` : '',
        r.close1 > 0 ? `<span class="personal-bd-chip c2">${r.close1}× close</span>` : '',
        r.close2 > 0 ? `<span class="personal-bd-chip c1">${r.close2}× near</span>` : '',
      ].filter(Boolean).join('');
      scoreStrip = `
        <div class="personal-score-strip">
          <div>
            <div class="personal-score-big">${r.score} <span class="personal-score-sub">PTS</span></div>
          </div>
          <div class="personal-bd">${chips}</div>
        </div>`;
    }

    let rows = '';
    for (const d of DRAFT_ORDER) {
      const actualRank = _actualPicks[d.pick];
      const yourRank = entry.picks?.[d.pick];
      const actualP = actualRank ? prospectByRank[parseInt(actualRank)] : null;
      const yourP = yourRank ? prospectByRank[parseInt(yourRank)] : null;
      const pts = (hasActual && actualRank && yourRank) ? pickPoints(yourRank, actualRank) : null;
      const ptsCls = pts === 4 ? 'pts4' : pts === 2 ? 'pts2' : pts === 1 ? 'pts1' : '';

      let actualTd, yourTd;
      if (pts === 4) {
        actualTd = `<td colspan="2"><div class="pt-cell exact-merged"><div class="pt-prospect-name">${escHtml(actualP.name)}</div><span class="exact-tag">✓ exact match</span></div></td>`;
        yourTd = '';
      } else {
        const actualCell = actualP
          ? `<div class="pt-cell actual"><div class="pt-prospect-name">${escHtml(actualP.name)}</div></div>`
          : `<div class="pt-cell actual-empty"></div>`;
        const yourCell = yourP
          ? `<div class="pt-cell yours ${ptsCls}"><div class="pt-prospect-name">${escHtml(yourP.name)}</div></div>`
          : `<div class="pt-cell yours" style="opacity:0.3"><div class="pt-prospect-meta" style="font-style:italic">no pick</div></div>`;
        actualTd = `<td>${actualCell}</td>`;
        yourTd = `<td>${yourCell}</td>`;
      }

      const badgeCls = pts === 4 ? 'v4' : pts === 2 ? 'v2' : pts === 1 ? 'v1' : 'v0';
      const badgeLabel = pts !== null && pts > 0 ? String(pts) : '—';
      const ptsCell = hasActual && pts !== null
        ? `<div class="pt-pts-badge ${badgeCls}">${badgeLabel}</div>`
        : `<div class="pt-pts-badge v0">—</div>`;

      rows += `<tr class="pt-row">
        <td class="pt-num">${d.pick}</td>
        <td class="pt-logo"><img src="https://assets.nhle.com/logos/nhl/svg/${d.abbr}_light.svg" alt="${d.abbr}" title="${escHtml(d.team)}" onerror="this.style.visibility='hidden'"></td>
        ${actualTd}${yourTd}
        <td style="text-align:center">${ptsCell}</td>
      </tr>`;
    }

    wrap.innerHTML = `
      <div class="personal-header">
        <div class="personal-name">${escHtml(entry.participant_name)}</div>
        ${scoreStrip}
      </div>
      <table class="personal-table">
        <thead><tr>
          <th class="pt-pick">#</th>
          <th class="pt-team"></th>
          <th class="pt-actual">${hasActual ? 'ACTUAL' : 'ACTUAL (TBD)'}</th>
          <th class="pt-yours">YOUR PICK</th>
          <th class="pt-pts center">PTS</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    window.scrollTo(0, scrollY);
  }

  function pickPoints(predicted, actual) {
    if (!predicted || !actual) return 0;
    const diff = Math.abs(parseInt(predicted) - parseInt(actual));
    if (diff === 0) return 4;
    if (diff === 1) return 2;
    if (diff === 2) return 1;
    return 0;
  }

  function computeScore(picks) {
    if (!Object.keys(_actualPicks).length) return null;
    let score = 0, exact = 0, close1 = 0, close2 = 0;
    for (const [pick, actualRank] of Object.entries(_actualPicks)) {
      const pts = pickPoints(picks[pick], actualRank);
      score += pts;
      if (pts === 4) exact++;
      else if (pts === 2) close1++;
      else if (pts === 1) close2++;
    }
    return { score, exact, close1, close2 };
  }

  function renderDesktop() {
    const wrap = document.getElementById('content-wrap');
    const lbHtml = buildLeaderboard();
    const boardHtml = buildBoard();
    wrap.innerHTML = `
      <div class="desktop-layout">
        <div>
          <div class="desktop-col-title">Leaderboard</div>
          ${lbHtml}
        </div>
        <div>
          <div class="desktop-col-title">Board View</div>
          ${boardHtml}
        </div>
      </div>`;
  }

  function renderLeaderboard() {
    document.getElementById('content-wrap').innerHTML = buildLeaderboard();
  }

  function renderBoard() {
    document.getElementById('content-wrap').innerHTML = buildBoard();
  }

  function buildLeaderboard() {
    if (!_entries.length) return `<div class="no-data">No picks submitted yet.</div>`;
    const hasScores = Object.keys(_actualPicks).length > 0;
    const sorted = [..._entries].map(e => ({ ...e, result: computeScore(e.picks || {}) }));
    if (hasScores) sorted.sort((a, b) => ((b.result?.score) || 0) - ((a.result?.score) || 0));

    const MEDALS = ['🥇', '🥈', '🥉'];
    const headerStats = hasScores
      ? `<th class="th-lb-exact">Exact (4)</th><th class="th-lb-close">±1 (2)</th><th class="th-lb-almost">±2 (1)</th><th>PTS</th>`
      : `<th>PTS</th>`;

    const rows = sorted.map((e, i) => {
      const rankClass = i < 3 ? ` rank-${i+1}` : '';
      const medal = hasScores && i < 3 ? `${MEDALS[i]} ` : '';
      const r = e.result;
      let statCells;
      if (hasScores && r !== null) {
        statCells = `
          <td class="td-lb-stat s4${r.exact  > 0 ? ' has-val' : ''}">${r.exact  > 0 ? r.exact  : '—'}</td>
          <td class="td-lb-stat s2${r.close1 > 0 ? ' has-val' : ''}">${r.close1 > 0 ? r.close1 : '—'}</td>
          <td class="td-lb-stat s1${r.close2 > 0 ? ' has-val' : ''}">${r.close2 > 0 ? r.close2 : '—'}</td>
          <td class="td-lb-pts">${r.score}</td>`;
      } else {
        statCells = `<td class="td-lb-pts">0</td>`;
      }
      return `<tr class="${rankClass.trim()}" onclick="openPersonal(${e.id})" title="View ${escHtml(e.participant_name)}'s picks">
        <td class="td-lb-rank">${i + 1}</td>
        <td class="td-lb-name">${medal}${escHtml(e.participant_name)}</td>
        ${statCells}
      </tr>`;
    }).join('');

    return `
      <div class="leaderboard">
        <table class="lb-table">
          <thead class="lb-thead"><tr>
            <th></th>
            <th class="th-lb-name">Name</th>
            ${headerStats}
          </tr></thead>
          <tbody class="lb-tbody">${rows}</tbody>
        </table>
      </div>`;
  }

  function buildBoard() {
    if (!_entries.length) return `<div class="no-data">No picks submitted yet.</div>`;

    const hasActual = Object.keys(_actualPicks).length > 0;
    let html = '';

    if (hasActual) {
      html += `<div class="board-legend">
        <div class="legend-item"><div class="legend-dot l4"></div>4 pts — exact</div>
        <div class="legend-item"><div class="legend-dot l2"></div>2 pts — off by 1</div>
        <div class="legend-item"><div class="legend-dot l1"></div>1 pt — off by 2</div>
        <div class="legend-item"><div class="legend-dot l0"></div>0 pts — miss</div>
      </div>`;
    }

    html += `<div class="board-scroll"><table class="board-table"><thead><tr>
      <th class="th-num">PICK</th>
      <th class="th-team">TEAM</th>
      ${hasActual ? `<th class="th-actual">ACTUAL</th>` : ''}
      ${_entries.map(e => `<th class="th-name">${escHtml(e.participant_name.split(' ')[0])}</th>`).join('')}
    </tr></thead><tbody>`;

    for (const d of DRAFT_ORDER) {
      const actualRank = _actualPicks[d.pick];
      const actualProspect = actualRank ? prospectByRank[parseInt(actualRank)] : null;
      html += `<tr>
        <td class="col-num td-num">${d.pick}</td>
        <td class="col-team td-team">
          <img src="https://assets.nhle.com/logos/nhl/svg/${d.abbr}_light.svg" alt="${d.abbr}" title="${escHtml(d.team)}" onerror="this.style.visibility='hidden'">
          ${d.via ? `<div class="td-via">${d.via}</div>` : ''}
        </td>
        ${hasActual ? `<td class="td-cell">${actualProspect
          ? `<div class="actual-pick-cell"><div class="actual-pick-rank">#${actualRank}</div><div class="actual-pick-name">${escHtml(actualProspect.name.split(' ').pop())}</div></div>`
          : `<div class="actual-pick-empty"></div>`
        }</td>` : ''}
        ${_entries.map(e => {
          const rank = e.picks?.[d.pick];
          if (!rank) return `<td class="td-cell"><div class="comp-cell empty"></div></td>`;
          const p = prospectByRank[parseInt(rank)];
          const pts = _actualPicks[d.pick] ? pickPoints(rank, _actualPicks[d.pick]) : 0;
          const cls = pts === 4 ? ' pts4' : pts === 2 ? ' pts2' : pts === 1 ? ' pts1' : '';
          const ptsLabel = pts > 0 ? `+${pts}` : '';
          return `<td class="td-cell"><div class="comp-cell${cls}" title="${p ? escHtml(p.name) : ''}${ptsLabel ? ` · ${ptsLabel}pts` : ''}">
            <div class="comp-prospect-rank">#${rank}</div>
            <div class="comp-prospect-name">${p ? escHtml(p.name.split(' ').pop()) : '?'}</div>
          </div></td>`;
        }).join('')}
      </tr>`;
    }

    html += `</tbody></table></div>`;
    return html;
  }

  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    el.style.borderColor = isError ? 'rgba(200,16,46,0.4)' : 'rgba(255,255,255,0.12)';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  init();

  // Re-render on resize crossing the desktop breakpoint
  let _wasDesktop = isDesktop();
  window.addEventListener('resize', () => {
    const now = isDesktop();
    if (now !== _wasDesktop) { _wasDesktop = now; renderTab(); }
  });
</script>
