<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHL Playoff Picks – Commissioner Leaderboard</title>
<link rel="icon" type="image/png" href="parieur_discipline_icon_1024.png">
<link rel="apple-touch-icon" href="parieur_discipline_icon_1024.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--rink:#07111f;--red:#c8102e;--gold:#ffb81c;--silver:#a8b2be;--ice:#e8f4fd;--green:#22c55e;}
  body{background:var(--rink);min-height:100vh;font-family:'Barlow Condensed',sans-serif;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(26,58,110,0.6) 0%,transparent 70%);
    padding:1.5rem 1rem 4rem;}
  header{text-align:center;margin-bottom:1.5rem;}
  .header-inner{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:0.3rem;}
  .brand-icon{width:52px;height:52px;border-radius:10px;object-fit:cover;box-shadow:0 4px 16px rgba(0,0,0,0.5);}
  header h1{font-family:'Bebas Neue',cursive;font-size:clamp(2rem,5vw,3.5rem);color:white;letter-spacing:4px;
    text-shadow:0 0 40px rgba(200,16,46,0.5);}
  header h1 span{color:var(--gold);}
  header p{color:var(--silver);font-size:1rem;letter-spacing:2px;text-transform:uppercase;margin-top:0.3rem;}
  .last-saved{font-size:0.75rem;color:rgba(168,178,190,0.45);letter-spacing:1px;margin-top:0.2rem;}

  .main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:1.5rem;}

  .top-row{display:grid;grid-template-columns:1fr 280px;gap:1.5rem;align-items:start;}
  @media(max-width:800px){.top-row{grid-template-columns:1fr;}}

  .panel{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:1.4rem;}
  .panel h2{font-family:'Bebas Neue',cursive;font-size:1.4rem;color:var(--gold);letter-spacing:2px;
    margin-bottom:1rem;border-bottom:1px solid rgba(255,184,28,0.2);padding-bottom:0.5rem;}

  /* ── Participants ── */
  .participant-chip{display:flex;align-items:center;gap:0.5rem;
    background:rgba(255,255,255,0.05);border-radius:5px;padding:0.4rem 0.7rem;margin-bottom:5px;}
  .participant-chip span{color:white;font-size:1rem;font-weight:600;flex:1;}
  .load-status{font-size:0.75rem;color:var(--silver);letter-spacing:1px;}
  .load-status.ok{color:var(--green);}
  .load-status.err{color:var(--red);}

  /* ── Series grid ── */
  .series-rounds{display:flex;flex-direction:column;gap:1.5rem;}
  .series-round-label{font-family:'Bebas Neue',cursive;font-size:0.85rem;color:rgba(255,184,28,0.6);
    letter-spacing:3px;margin-bottom:0.6rem;border-bottom:1px solid rgba(255,184,28,0.12);padding-bottom:0.3rem;}
  .series-list{display:flex;flex-wrap:wrap;gap:10px;}

  /* Series matchup card */
  .series-card{
    display:flex;flex-direction:column;align-items:stretch;gap:0;
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);
    border-radius:10px;overflow:hidden;width:170px;flex-shrink:0;
    transition:border-color 0.2s,box-shadow 0.2s;}
  .series-card.won{border-color:rgba(255,184,28,0.45);background:rgba(255,184,28,0.04);
    box-shadow:0 0 12px rgba(255,184,28,0.1);}
  .series-card.tbd{opacity:0.3;pointer-events:none;}

  /* Each team row inside the card */
  .series-side{display:flex;align-items:center;gap:7px;padding:8px 10px;}
  .series-side+.series-side{border-top:1px solid rgba(255,255,255,0.06);}
  .s-logo{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;}
  .s-logo img{width:20px;height:20px;object-fit:contain;}
  .s-name{font-size:0.8rem;font-weight:700;color:rgba(255,255,255,0.75);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .s-name.winner{color:var(--green);}
  .s-name.eliminated{color:rgba(255,255,255,0.2);}

  /* Win counter */
  .series-counter{display:flex;align-items:center;gap:3px;flex-shrink:0;margin-left:auto;}
  .s-btn{width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.06);color:white;font-size:0.9rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:background 0.15s,border-color 0.15s;user-select:none;}
  .s-btn:hover{background:rgba(255,184,28,0.2);border-color:rgba(255,184,28,0.5);}
  .s-btn:active{transform:scale(0.9);}
  .s-wins{font-family:'Bebas Neue',cursive;font-size:1.1rem;color:white;min-width:14px;
    text-align:center;line-height:1;}
  .s-wins.max{color:var(--green);}
  .s-sep{display:none;}

  .lb-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:0.9rem;}
  thead tr th{background:rgba(200,16,46,0.7);color:white;font-family:'Bebas Neue',cursive;
    font-size:0.95rem;letter-spacing:1.5px;padding:8px 10px;text-align:center;border-bottom:2px solid var(--red);}
  thead tr th:first-child{text-align:left;}
  tbody tr{transition:background 0.15s;}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.025);}
  tbody tr:hover{background:rgba(255,184,28,0.06);}
  tbody td{padding:7px 10px;color:white;border-bottom:1px solid rgba(255,255,255,0.05);
    text-align:center;vertical-align:middle;}
  tbody td:first-child{text-align:left;}
  .rank-cell{font-family:'Bebas Neue',cursive;font-size:1.2rem;}
  .rank-1{color:#FFD700;}.rank-2{color:#C0C0C0;}.rank-3{color:#CD7F32;}
  .name-cell{font-weight:700;font-size:1rem;}
  .score-cell{font-family:'Bebas Neue',cursive;font-size:1.3rem;color:var(--gold);}
  .round-score{font-size:0.85rem;color:var(--silver);}
  .empty-state{text-align:center;padding:2rem 1rem;color:var(--silver);}
  .empty-state p{font-size:1rem;margin-top:0.5rem;}

  .snapshot-btn{display:inline-flex;align-items:center;gap:0.5rem;margin-top:0.6rem;
    background:rgba(255,184,28,0.1);border:1px solid rgba(255,184,28,0.3);border-radius:8px;
    padding:0.5rem 1.2rem;color:var(--gold);font-family:'Bebas Neue',cursive;font-size:1rem;
    letter-spacing:2px;cursor:pointer;transition:background 0.2s,border-color 0.2s;}
  .snapshot-btn:hover{background:rgba(255,184,28,0.2);border-color:rgba(255,184,28,0.5);}
  .snapshot-btn:active{transform:scale(0.97);}
  .snapshot-status{font-size:0.75rem;color:var(--green);letter-spacing:1px;margin-left:0.5rem;opacity:0;transition:opacity 0.3s;}
  .snapshot-status.show{opacity:1;}
  #pw-gate{position:fixed;inset:0;z-index:9999;background:var(--rink);
    display:flex;align-items:center;justify-content:center;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(26,58,110,0.6) 0%,transparent 70%);}
  .pw-box{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    border-radius:14px;padding:2.5rem 2rem;width:320px;max-width:90vw;text-align:center;}
  .pw-box h2{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--gold);
    letter-spacing:3px;margin-bottom:0.3rem;}
  .pw-box p{color:var(--silver);font-size:0.85rem;letter-spacing:1px;margin-bottom:1.5rem;}
  .pw-input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;padding:0.7rem 1rem;color:white;font-size:1rem;font-family:'Barlow Condensed',sans-serif;
    letter-spacing:2px;outline:none;text-align:center;transition:border-color 0.2s;}
  .pw-input:focus{border-color:rgba(255,184,28,0.5);}
  .pw-input.error{border-color:rgba(200,16,46,0.7);animation:shake 0.3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}};
  .pw-btn{margin-top:1rem;width:100%;background:var(--red);color:white;border:none;border-radius:8px;
    padding:0.75rem;font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:3px;
    cursor:pointer;transition:background 0.2s;}
  .pw-btn:hover{background:#e0122e;}
  .pw-error{color:rgba(200,16,46,0.8);font-size:0.8rem;margin-top:0.5rem;min-height:1em;letter-spacing:1px;}
</style>
</head>
<body>
<div id="pw-gate">
  <div class="pw-box">
    <h2>🏒 Commissioner</h2>
    <p>ENTER PASSWORD TO CONTINUE</p>
    <input id="pw-input" class="pw-input" type="password" placeholder="Password" autocomplete="off">
    <button class="pw-btn" onclick="checkPw()">ENTER</button>
    <div class="pw-error" id="pw-error"></div>
  </div>
</div>
<script>
(function(){
  if(sessionStorage.getItem('commissioner_auth')==='1'){
    document.getElementById('pw-gate').style.display='none';
  }
  document.getElementById('pw-input').addEventListener('keydown',function(e){
    if(e.key==='Enter')checkPw();
  });
})();
function checkPw(){
  const input=document.getElementById('pw-input');
  const err=document.getElementById('pw-error');
  if(input.value==='parieur2026'){
    sessionStorage.setItem('commissioner_auth','1');
    document.getElementById('pw-gate').style.display='none';
    err.textContent='';
  }else{
    input.classList.add('error');
    err.textContent='Incorrect password.';
    setTimeout(()=>input.classList.remove('error'),400);
    input.value='';
    input.focus();
  }
}
</script>
<header>
  <div class="header-inner">
    <img src="parieur_discipline_icon_1024.png" alt="Parieur Discipline" class="brand-icon">
    <div>
      <h1>NHL <span>2026 Playoff</span> Commissioner</h1>
      <p>Click wins · Watch the leaderboard update</p>
      <p class="last-saved" id="last-saved"></p>
      <div style="margin-top:0.4rem;">
        <button class="snapshot-btn" onclick="snapshotYesterday()">📸 Save</button>
        <span class="snapshot-status" id="snapshot-status">✓ Saved</span>
      </div>
    </div>
  </div>
</header>

<div class="main">
  <!-- TOP ROW: Game Results (main) + Participants (sidebar) -->
  <div class="top-row">
    <!-- LEFT: Game Results (primary) -->
    <div class="panel">
      <h2>🏒 Series Results</h2>
      <div class="series-rounds" id="series-rounds"><p style="color:var(--silver);font-size:0.9rem;">Loading bracket…</p></div>
    </div>

    <!-- RIGHT: Participants (sidebar) -->
    <div class="panel">
      <h2>👥 Participants</h2>
      <div id="participant-list"><p style="color:var(--silver);font-size:0.9rem;">Loading…</p></div>
    </div>
  </div>

  <!-- BOTTOM: Leaderboard (secondary reference) -->
  <div class="panel">
    <h2>🏆 Leaderboard</h2>
    <div class="lb-wrap">
      <table id="lb-table">
        <thead>
          <tr>
            <th>#</th><th>NAME</th>
            <th>R1</th><th>R2</th><th>CF</th><th>SC</th>
            <th>TOTAL</th>
          </tr>
        </thead>
        <tbody id="lb-body">
          <tr><td colspan="7" class="empty-state">
            <div style="font-size:2rem">🏒</div>
            <p>Loading participants…</p>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const DISPLAY_NAME={'Utah Hockey Club':'Mammoth'};
function shortTeamName(name){
  if(!name||name==='TBD')return name||'TBD';
  if(DISPLAY_NAME[name])return DISPLAY_NAME[name];
  return name.split(' ').pop();
}

const TEAMS_DATA=[
  {name:"Buffalo Sabres",        abbr:"BUF"},
  {name:"Boston Bruins",         abbr:"BOS"},
  {name:"Montreal Canadiens",    abbr:"MTL"},
  {name:"Tampa Bay Lightning",   abbr:"TBL"},
  {name:"Carolina Hurricanes",   abbr:"CAR"},
  {name:"Ottawa Senators",       abbr:"OTT"},
  {name:"Pittsburgh Penguins",   abbr:"PIT"},
  {name:"Philadelphia Flyers",   abbr:"PHI"},
  {name:"Colorado Avalanche",    abbr:"COL"},
  {name:"Los Angeles Kings",     abbr:"LAK"},
  {name:"Dallas Stars",          abbr:"DAL"},
  {name:"Minnesota Wild",        abbr:"MIN"},
  {name:"Edmonton Oilers",       abbr:"EDM"},
  {name:"Utah Hockey Club",      abbr:"UTA"},
  {name:"Vegas Golden Knights",  abbr:"VGK"},
  {name:"Anaheim Ducks",         abbr:"ANA"},
];
const TEAMS=TEAMS_DATA.map(t=>t.name);
function logoUrl(abbr){return`https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg`;}
const ROUND_MULT=[1,2,3,4];
const ROUND_LABELS=["Round 1","Round 2","Conf. Final","Stanley Cup Final"];

let participants=[];
let results={};
TEAMS.forEach(t=>{results[t]=[0,0,0,0];});

const STORAGE_KEY='nhl_playoff_results_2026';
const API_URL='/api/playoff-results';

// ── Persist results ───────────────────────────────────────────────────────────
function applyResults(saved){
  TEAMS.forEach(t=>{if(saved[t])results[t]=saved[t];});
}

// Save to localStorage immediately, then sync to API in background
function saveResults(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(results));}catch(e){}
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({results})
  }).then(r=>{
    if(r.ok){
      const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const el=document.getElementById('last-saved');
      if(el)el.textContent='Last saved: '+t;
    }
  }).catch(()=>{});
}

// Snapshot current results as "yesterday" baseline, then save new results
function snapshotYesterday(){
  const btn=document.querySelector('.snapshot-btn');
  const status=document.getElementById('snapshot-status');
  if(btn)btn.disabled=true;
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({results})
  }).then(r=>{
    if(r.ok){
      const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const el=document.getElementById('last-saved');
      if(el)el.textContent='Last saved: '+t;
      if(status){status.classList.add('show');setTimeout(()=>status.classList.remove('show'),2500);}
    }
  }).catch(()=>{}).finally(()=>{if(btn)btn.disabled=false;});
}

// On load: restore from localStorage first (instant), then fetch from API (authoritative)
function loadResultsLocal(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved)applyResults(JSON.parse(saved));
  }catch(e){}
}

async function loadResultsRemote(){
  try{
    const resp=await fetch(API_URL+'?_='+Date.now());
    if(!resp.ok)return;
    const data=await resp.json();
    if(data.success&&data.results&&Object.keys(data.results).length>0){
      // Remote is authoritative — overwrite local
      TEAMS.forEach(t=>{results[t]=[0,0,0,0];});
      applyResults(data.results);
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(results));}catch(e){}
      buildSeriesGrid();
      recalc();
    }
  }catch(e){}
}

// ── Load participants from docs/playoff/ ──────────────────────────────────────
async function loadParticipants(){
  const list=document.getElementById('participant-list');
  list.innerHTML='';
  participants=[];

  let files=[];
  try{
    const resp=await fetch(`playoff/index.json?_=${Date.now()}`);
    if(!resp.ok)throw new Error('index not found');
    files=(await resp.json()).filter(f=>f!=='bracket.json');
  }catch(e){
    list.innerHTML=`<p style="color:var(--red);font-size:0.9rem;">Could not load playoff/index.json</p>`;
    return;
  }

  await Promise.all(files.map(async filename=>{
    const nameRaw=filename.replace(/\.json$/i,'');
    const nameFallback=nameRaw.split('_')[0];
    const chip=document.createElement('div');chip.className='participant-chip';
    const status=document.createElement('span');status.className='load-status';

    try{
      const resp=await fetch(`playoff/${filename}?_=${Date.now()}`);
      if(!resp.ok)throw new Error(resp.status);
      const data=await resp.json();
      const name=data.name||nameFallback;
      chip.innerHTML=`<span>${name}</span>`;chip.appendChild(status);
      list.appendChild(chip);
      const pickMap={};
      data.picks.forEach(p=>{pickMap[p.team]=p.points;});
      participants.push({name,picks:pickMap});
      status.textContent='✓';status.className='load-status ok';
    }catch(e){
      chip.innerHTML=`<span>${nameFallback}</span>`;chip.appendChild(status);
      list.appendChild(chip);
      status.textContent='✗ not found';status.className='load-status err';
    }
  }));

  recalc();
}

// ── Bracket-based series grid ─────────────────────────────────────────────────
let bracketData=null;

async function loadBracket(){
  try{
    const r=await fetch('playoff/bracket.json?_='+Date.now());
    if(!r.ok)return;
    bracketData=await r.json();
    buildSeriesGrid();
  }catch(e){}
}

function abbr(name){
  const t=TEAMS_DATA.find(x=>x.name===name);
  return t?t.abbr:null;
}

function makeWinCounter(team,roundIdx,onUpdate){
  const wrap=document.createElement('div');wrap.className='series-counter';
  const minus=document.createElement('button');minus.className='s-btn';minus.textContent='−';
  const winsEl=document.createElement('span');winsEl.className='s-wins';
  const sep=document.createElement('span');sep.className='s-sep';sep.textContent='W';
  const plus=document.createElement('button');plus.className='s-btn';plus.textContent='+';

  function refresh(){
    const w=results[team]?.[roundIdx]||0;
    winsEl.textContent=w;
    winsEl.className='s-wins'+(w===4?' max':'');
  }
  refresh();

  minus.addEventListener('click',e=>{
    e.stopPropagation();
    const w=results[team]?.[roundIdx]||0;
    if(w===0)return;
    results[team][roundIdx]=w-1;
    refresh();recalc();onUpdate();
  });
  plus.addEventListener('click',e=>{
    e.stopPropagation();
    const w=results[team]?.[roundIdx]||0;
    if(w===4)return;
    results[team][roundIdx]=w+1;
    refresh();recalc();onUpdate();
  });

  wrap.appendChild(minus);wrap.appendChild(winsEl);wrap.appendChild(sep);wrap.appendChild(plus);
  wrap._refresh=refresh;
  return wrap;
}

function buildSeriesCard(top,bottom,roundIdx){
  const isTbd=!top||top==='TBD'||!bottom||bottom==='TBD';
  const card=document.createElement('div');
  card.className='series-card'+(isTbd?' tbd':'');

  function refreshCard(){
    const tw=results[top]?.[roundIdx]||0;
    const bw=results[bottom]?.[roundIdx]||0;
    const won=tw===4||bw===4;
    card.classList.toggle('won',won);
    const topNameEl=card.querySelector('.top-name');
    const botNameEl=card.querySelector('.bot-name');
    if(topNameEl){
      topNameEl.className='s-name top-name'+(tw===4?' winner':bw===4?' eliminated':'');
    }
    if(botNameEl){
      botNameEl.className='s-name bot-name'+(bw===4?' winner':tw===4?' eliminated':'');
    }
  }

  if(isTbd){
    card.innerHTML=`<div class="series-side"><span class="s-name" style="color:rgba(255,255,255,0.3)">TBD</span></div>
      <div class="series-side"><span class="s-name" style="color:rgba(255,255,255,0.3)">TBD</span></div>`;
    return card;
  }

  const topAbbr=abbr(top);
  const botAbbr=abbr(bottom);
  const topShort=shortTeamName(top);
  const botShort=shortTeamName(bottom);

  // Top team row
  const topSide=document.createElement('div');topSide.className='series-side';
  const topLogoEl=document.createElement('div');topLogoEl.className='s-logo';
  topLogoEl.innerHTML=`<img src="${logoUrl(topAbbr)}" alt="${topAbbr}" onerror="this.style.display='none'">`;
  const topNameEl=document.createElement('span');
  topNameEl.className='s-name top-name';topNameEl.title=top;topNameEl.textContent=topShort;
  const topCounter=makeWinCounter(top,roundIdx,refreshCard);
  topSide.appendChild(topLogoEl);
  topSide.appendChild(topNameEl);
  topSide.appendChild(topCounter);

  // Bottom team row
  const botSide=document.createElement('div');botSide.className='series-side';
  const botLogoEl=document.createElement('div');botLogoEl.className='s-logo';
  botLogoEl.innerHTML=`<img src="${logoUrl(botAbbr)}" alt="${botAbbr}" onerror="this.style.display='none'">`;
  const botNameEl=document.createElement('span');
  botNameEl.className='s-name bot-name';botNameEl.title=bottom;botNameEl.textContent=botShort;
  const botCounter=makeWinCounter(bottom,roundIdx,refreshCard);
  botSide.appendChild(botLogoEl);
  botSide.appendChild(botNameEl);
  botSide.appendChild(botCounter);

  card.appendChild(topSide);card.appendChild(botSide);
  refreshCard();
  return card;
}

function buildSeriesGrid(){
  const container=document.getElementById('series-rounds');
  if(!container||!bracketData)return;
  container.innerHTML='';
  const roundLabels=['Round 1','Round 2','Conf. Final','Stanley Cup Final'];

  bracketData.rounds.forEach((round,ri)=>{
    const section=document.createElement('div');
    const lbl=document.createElement('div');lbl.className='series-round-label';
    lbl.textContent=roundLabels[ri];
    const list=document.createElement('div');list.className='series-list';

    // East series
    (round.east||[]).forEach(([t,b])=>list.appendChild(buildSeriesCard(t,b,ri)));
    // Final (SCF)
    if(round.final){
      const[f1,f2]=round.final;
      list.appendChild(buildSeriesCard(f1,f2,ri));
    }
    // West series
    (round.west||[]).forEach(([t,b])=>list.appendChild(buildSeriesCard(t,b,ri)));

    section.appendChild(lbl);section.appendChild(list);
    container.appendChild(section);
  });
}

// ── Score calculation ─────────────────────────────────────────────────────────
function calcScore(participant){
  const roundScores=[0,0,0,0];
  TEAMS.forEach(team=>{
    const pts=participant.picks[team]||0;
    ROUND_MULT.forEach((_,ri)=>{
      roundScores[ri]+=pts*(results[team]?.[ri]||0);
    });
  });
  return roundScores;
}

function recalc(){
  const lb=document.getElementById('lb-body');
  if(participants.length===0){
    lb.innerHTML=`<tr><td colspan="7" class="empty-state"><div style="font-size:2rem">🏒</div><p>No participants loaded yet</p></td></tr>`;
    return;
  }
  const rows=participants.map(p=>{
    const roundScores=calcScore(p);
    const total=roundScores.reduce((a,b)=>a+b,0);
    return{name:p.name,roundScores,total};
  });
  rows.sort((a,b)=>b.total-a.total);
  lb.innerHTML='';
  rows.forEach((row,i)=>{
    const rank=i+1;
    const rankClass=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'';
    const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td class="rank-cell ${rankClass}">${medal||rank}</td>
      <td class="name-cell">${row.name}</td>
      ${row.roundScores.map(s=>`<td class="round-score">${s}</td>`).join('')}
      <td class="score-cell">${row.total}</td>
    `;
    lb.appendChild(tr);
  });
}

loadResultsLocal();   // instant restore from cache
loadBracket();        // load bracket.json and build series grid
loadParticipants();   // fetch participant picks
loadResultsRemote();  // fetch authoritative results from API, re-render if different
</script>
