<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Today's Games - Parieur Discipliné</title>
<link rel='icon' type='image/png' href='parieur_discipline_icon_1024.png'>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  background-attachment: fixed;
  color: #1a1a1a;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
.header {
  text-align: center;
  margin-bottom: 50px;
  background: white;
  border-radius: 20px;
  padding: 40px 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.header h1 {
  font-size: 3em;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 15px;
  font-weight: 800;
}
.header p {
  color: #6b7280;
  font-size: 1.2em;
  font-weight: 500;
}
.sport-section { margin-bottom: 60px; }
.sport-title {
  font-size: 2.2em;
  color: white;
  margin-bottom: 25px;
  padding: 20px 30px;
  background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 100%);
  backdrop-filter: blur(10px);
  border-radius: 15px;
  display: flex;
  align-items: center;
  gap: 15px;
  font-weight: 700;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  border: 1px solid rgba(255,255,255,0.2);
}
.game-card {
  background: white;
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
  border: 1px solid rgba(255,255,255,0.5);
  position: relative;
  overflow: hidden;
}
.game-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
}
.game-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 50px rgba(0,0,0,0.25);
}
.game-time {
  color: #9ca3af;
  font-size: 0.95em;
  margin-bottom: 15px;
  font-weight: 600;
  display: inline-block;
  background: #f3f4f6;
  padding: 6px 14px;
  border-radius: 20px;
}
.matchup {
  font-size: 1.6em;
  font-weight: 800;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 25px;
  line-height: 1.3;
}
.odds-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}
.odds-card {
  background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  border-radius: 12px;
  padding: 20px;
  border: 2px solid #e5e7eb;
  transition: all 0.2s ease;
}
.odds-card:hover {
  border-color: #667eea;
  transform: scale(1.02);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
}
.odds-label {
  font-size: 0.8em;
  color: #6b7280;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 12px;
  letter-spacing: 1px;
}
.odds-value {
  font-size: 1.3em;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.odds-value:last-child {
  margin-bottom: 0;
}
.no-games {
  text-align: center;
  padding: 60px 20px;
  background: white;
  border-radius: 20px;
  color: #6b7280;
  font-size: 1.2em;
  font-weight: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
@media (max-width: 768px) {
  .header h1 { font-size: 2em; }
  .sport-title { font-size: 1.6em; padding: 15px 20px; }
  .matchup { font-size: 1.3em; }
  .game-card { padding: 20px; }
  .odds-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

{{NAV_HTML}}

<div class='container'>
<div class='header'>
<h1>📅 Today's Games</h1>
<p>{{DATE}}</p>
</div>

<!-- NHL Games Section -->
<div class='sport-section'>
<div class='sport-title'>🏒 NHL Games</div>
{{NHL_GAMES}}
</div>

<!-- NBA Games Section -->
<div class='sport-section'>
<div class='sport-title'>🏀 NBA Games</div>
{{NBA_GAMES}}
</div>

</div>

</body>
</html>
