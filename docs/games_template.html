<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Today's Games - Parieur Discipliné</title>
<link rel='icon' type='image/png' href='parieur_discipline_icon_1024.png'>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f7fa;
  color: #1a1a1a;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
.header {
  text-align: center;
  margin-bottom: 50px;
  background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
  border-radius: 20px;
  padding: 40px 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}
.header h1 {
  font-size: 3em;
  color: white;
  margin-bottom: 15px;
  font-weight: 800;
}
.header p {
  color: rgba(255,255,255,0.9);
  font-size: 1.2em;
  font-weight: 500;
}
.sport-section { margin-bottom: 60px; }
.sport-title {
  font-size: 2.2em;
  background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 25px;
  padding: 20px 30px;
  display: flex;
  align-items: center;
  gap: 15px;
  font-weight: 700;
  border-bottom: 3px solid #4a90e2;
}
.game-card {
  background: white;
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  transition: all 0.3s ease;
  border: 2px solid #e5e7eb;
  position: relative;
  overflow: hidden;
}
.game-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #4a90e2 0%, #357abd 100%);
}
.game-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 50px rgba(0,0,0,0.15);
  border-color: #4a90e2;
}
.game-time {
  color: #9ca3af;
  font-size: 0.95em;
  margin-bottom: 15px;
  font-weight: 600;
  display: inline-block;
  background: #f3f4f6;
  padding: 6px 14px;
  border-radius: 20px;
}
.matchup {
  font-size: 1.6em;
  font-weight: 800;
  background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 25px;
  line-height: 1.3;
}
.key-insights {
  background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  border: 2px solid #e5e7eb;
}
.insights-title {
  font-size: 1.2em;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 20px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.insights-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.team-insights {
  background: white;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  border: 2px solid #e5e7eb;
  transition: all 0.2s ease;
}
.team-insights:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(74, 144, 226, 0.15);
  border-color: #4a90e2;
}
.away-team {
  border-left: 4px solid #f59e0b;
}
.home-team {
  border-left: 4px solid #10b981;
}
.team-name {
  font-size: 1.2em;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 10px;
}
.team-record {
  font-size: 1.4em;
  font-weight: 800;
  background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.team-label {
  font-size: 0.75em;
  color: #6b7280;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 1px;
}
.odds-section {
  margin-top: 20px;
}
.odds-toggle {
  text-align: center;
  padding: 10px;
  background: #f3f4f6;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9em;
  color: #6b7280;
  font-weight: 600;
  transition: all 0.2s;
  user-select: none;
}
.odds-toggle:hover {
  background: #e5e7eb;
  color: #4a90e2;
}
.odds-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.odds-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  margin-top: 15px;
}
.odds-card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  border: 1px solid #e5e7eb;
}
.odds-label {
  font-size: 0.75em;
  color: #9ca3af;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}
.odds-value {
  font-size: 1em;
  font-weight: 600;
  color: #374151;
  margin-bottom: 5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.odds-value:last-child {
  margin-bottom: 0;
}
.odds-value span:last-child {
  color: #4a90e2;
  font-weight: 700;
}
.no-games {
  text-align: center;
  padding: 60px 20px;
  background: white;
  border-radius: 20px;
  color: #6b7280;
  font-size: 1.2em;
  font-weight: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border: 2px solid #e5e7eb;
}
@media (max-width: 768px) {
  .header h1 { font-size: 2em; }
  .sport-title { font-size: 1.6em; padding: 15px 20px; }
  .matchup { font-size: 1.3em; }
  .game-card { padding: 20px; }
  .insights-grid { grid-template-columns: 1fr; }
  .odds-grid { grid-template-columns: 1fr; }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.odds-toggle').forEach(toggle => {
    toggle.addEventListener('click', function() {
      const content = this.nextElementSibling;
      if (content.style.maxHeight) {
        content.style.maxHeight = null;
        this.innerHTML = 'View Odds ▼';
      } else {
        content.style.maxHeight = content.scrollHeight + 'px';
        this.innerHTML = 'Hide Odds ▲';
      }
    });
  });
});
</script>
</head>
<body>

{{NAV_HTML}}

<div class='container'>
<div class='header'>
<h1>📅 Today's Games</h1>
<p>{{DATE}}</p>
</div>

<!-- NHL Games Section -->
<div class='sport-section'>
<div class='sport-title'>🏒 NHL Games</div>
{{NHL_GAMES}}
</div>

<!-- NBA Games Section -->
<div class='sport-section'>
<div class='sport-title'>🏀 NBA Games</div>
{{NBA_GAMES}}
</div>

</div>

</body>
</html>
