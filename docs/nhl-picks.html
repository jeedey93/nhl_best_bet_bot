<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHL Playoff Picks Ranker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --rink:#07111f;--red:#c8102e;--gold:#ffb81c;--silver:#a8b2be;--ice:#e8f4fd;--line:rgba(255,255,255,0.08); }
  body { background:var(--rink);min-height:100vh;font-family:'Barlow Condensed',sans-serif;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(26,58,110,0.6) 0%,transparent 70%);
    padding:2rem 1rem 5rem; }
  header { text-align:center;margin-bottom:2rem; }
  header h1 { font-family:'Bebas Neue',cursive;font-size:clamp(2.5rem,6vw,4.5rem);color:white;letter-spacing:4px;
    text-shadow:0 0 40px rgba(200,16,46,0.5),0 4px 12px rgba(0,0,0,0.8); }
  header h1 span { color:var(--gold); }
  header p { color:var(--silver);font-size:1.1rem;letter-spacing:2px;text-transform:uppercase;margin-top:0.4rem; }
  .name-bar { display:flex;justify-content:center;gap:0.75rem;margin-bottom:1.5rem;align-items:center;flex-wrap:wrap; }
  .name-bar label { color:var(--gold);font-size:1.1rem;font-weight:700;letter-spacing:2px;text-transform:uppercase; }
  .name-bar input { background:rgba(255,255,255,0.07);border:1px solid rgba(255,184,28,0.4);border-radius:4px;
    color:white;font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:600;
    padding:0.5rem 1rem;outline:none;width:220px;transition:border-color 0.2s; }
  .name-bar input:focus { border-color:var(--gold); }
  .name-bar input::placeholder { color:rgba(255,255,255,0.25); }
  .container { max-width:660px;margin:0 auto; }
  .rank-list { list-style:none;display:flex;flex-direction:column;gap:6px; }
  .rank-item { display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.045);
    border:1px solid var(--line);border-left:3px solid rgba(255,255,255,0.1);border-radius:6px;
    padding:7px 12px 7px 10px;cursor:grab;user-select:none;touch-action:none;transition:background 0.15s,border-left-color 0.2s; }
  .rank-item:active { cursor:grabbing; }
  .rank-item.dragging { opacity:0.35; }
  .rank-item.drag-over { background:rgba(255,184,28,0.1);border-left-color:var(--gold); }
  .rank-item[data-pos="1"] { border-left-color:var(--gold); }
  .rank-item[data-pos="2"] { border-left-color:#c0c0c0; }
  .rank-item[data-pos="3"] { border-left-color:#cd7f32; }
  .drag-handle { color:rgba(255,255,255,0.2);font-size:1.2rem;flex-shrink:0; }
  .pos-badge { font-family:'Bebas Neue',cursive;font-size:1.5rem;color:rgba(255,255,255,0.3);width:26px;text-align:center;flex-shrink:0; }
  .rank-item[data-pos="1"] .pos-badge { color:var(--gold); }
  .rank-item[data-pos="2"] .pos-badge { color:#c0c0c0; }
  .rank-item[data-pos="3"] .pos-badge { color:#cd7f32; }
  .logo-wrap { width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.06);border-radius:6px;overflow:hidden; }
  .logo-wrap img { width:38px;height:38px;object-fit:contain; }
  .logo-fallback { width:38px;height:38px;border-radius:50%;display:none;align-items:center;justify-content:center;
    font-family:'Bebas Neue',cursive;font-size:0.72rem;font-weight:900; }
  .team-info { flex:1;min-width:0; }
  .team-name { font-size:1.1rem;font-weight:700;color:white;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .team-conf { font-size:0.72rem;font-weight:600;color:var(--silver);letter-spacing:1px; }
  .pts-badge { font-family:'Bebas Neue',cursive;font-size:1.4rem;color:var(--ice);background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);border-radius:4px;width:50px;text-align:center;flex-shrink:0;padding:2px 0;line-height:1.2; }
  .pts-badge small { font-size:0.65rem;opacity:0.6; }
  .btn-row { display:flex;gap:0.75rem;justify-content:center;margin-top:2rem;flex-wrap:wrap; }
  .btn { font-family:'Bebas Neue',cursive;font-size:1.3rem;letter-spacing:3px;padding:0.7rem 2.2rem;
    cursor:pointer;border:none;border-radius:6px;transition:transform 0.15s,box-shadow 0.15s; }
  .btn:hover { transform:translateY(-2px); }
  .btn:disabled { opacity:0.6;cursor:not-allowed;transform:none; }
  .btn-share { background:linear-gradient(135deg,var(--red) 0%,#8b0a1e 100%);color:white;box-shadow:0 4px 20px rgba(200,16,46,0.4); }
  .btn-export { background:linear-gradient(135deg,var(--gold) 0%,#cc8f00 100%);color:#07111f;box-shadow:0 4px 20px rgba(255,184,28,0.3); }
  #modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;
    flex-direction:column;align-items:center;justify-content:center;padding:1rem; }
  #modal-overlay.open { display:flex; }
  #modal-overlay .modal-box { background:#0d1f36;border:1px solid rgba(255,184,28,0.3);border-radius:10px;
    padding:1.2rem;max-width:420px;width:100%;text-align:center; }
  #modal-overlay .modal-box p { color:var(--silver);font-size:1rem;letter-spacing:1px;margin-bottom:1rem;line-height:1.5; }
  #modal-overlay .modal-box p strong { color:var(--gold); }
  #modal-overlay img#preview-img { width:100%;border-radius:6px;border:1px solid rgba(255,255,255,0.1);margin-bottom:1rem;display:block; }
  #modal-overlay .modal-btns { display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap; }
  #modal-overlay .modal-btns a, #modal-overlay .modal-btns button { font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:2px;
    padding:0.55rem 1.5rem;border-radius:5px;cursor:pointer;border:none;text-decoration:none;display:inline-block; }
  #btn-open-img { background:var(--gold);color:var(--rink); }
  #btn-close-modal { background:rgba(255,255,255,0.1);color:white; }
  .toast { position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gold);
    color:var(--rink);font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:2px;
    padding:0.6rem 2rem;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,0.4);
    transition:transform 0.3s ease;pointer-events:none;z-index:9999; }
  .toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>NHL <span>Playoff</span> Picks</h1>
  <p>Drag to rank · Points auto-assigned</p>
</header>
<div class="container">
  <div class="name-bar">
    <label for="picker-name">Your Name</label>
    <input type="text" id="picker-name" placeholder="Enter your name…" maxlength="24">
  </div>
  <ul class="rank-list" id="rank-list"></ul>
  <div class="btn-row">
    <button class="btn btn-share" id="btn-share">📸 Share Image</button>
    <button class="btn btn-export" id="btn-export">📤 Export Picks File</button>
  </div>
</div>
<div id="modal-overlay">
  <div class="modal-box">
    <p><strong>Your picks are ready!</strong><br>On mobile: tap below to open the image, then <strong>long-press → Save Image</strong>.</p>
    <img id="preview-img" src="" alt="Your NHL Picks">
    <div class="modal-btns">
      <a id="btn-open-img" href="#" target="_blank">Open Full Image</a>
      <button id="btn-close-modal">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const TEAMS=[
  {name:"Boston Bruins",       abbr:"BOS",conf:"East",c1:"#FFB81C",c2:"#000000"},
  {name:"Carolina Hurricanes", abbr:"CAR",conf:"East",c1:"#CC0000",c2:"#FFFFFF"},
  {name:"Florida Panthers",    abbr:"FLA",conf:"East",c1:"#041E42",c2:"#C8102E"},
  {name:"Toronto Maple Leafs", abbr:"TOR",conf:"East",c1:"#003E7E",c2:"#FFFFFF"},
  {name:"Tampa Bay Lightning", abbr:"TBL",conf:"East",c1:"#002868",c2:"#FFFFFF"},
  {name:"Washington Capitals", abbr:"WSH",conf:"East",c1:"#C8102E",c2:"#041E42"},
  {name:"New York Rangers",    abbr:"NYR",conf:"East",c1:"#0038A8",c2:"#FFFFFF"},
  {name:"New Jersey Devils",   abbr:"NJD",conf:"East",c1:"#CE1126",c2:"#000000"},
  {name:"Vegas Golden Knights",abbr:"VGK",conf:"West",c1:"#B4975A",c2:"#333F42"},
  {name:"Colorado Avalanche",  abbr:"COL",conf:"West",c1:"#6F263D",c2:"#FFFFFF"},
  {name:"Dallas Stars",        abbr:"DAL",conf:"West",c1:"#006847",c2:"#FFFFFF"},
  {name:"Winnipeg Jets",       abbr:"WPG",conf:"West",c1:"#041E42",c2:"#FFFFFF"},
  {name:"Edmonton Oilers",     abbr:"EDM",conf:"West",c1:"#FF4C00",c2:"#041E42"},
  {name:"Los Angeles Kings",   abbr:"LAK",conf:"West",c1:"#111111",c2:"#A2AAAD"},
  {name:"Minnesota Wild",      abbr:"MIN",conf:"West",c1:"#154734",c2:"#DDAF57"},
  {name:"Vancouver Canucks",   abbr:"VAN",conf:"West",c1:"#00205B",c2:"#00843D"},
];
function logoUrl(a){return`https://assets.nhle.com/logos/nhl/svg/${a}_light.svg`;}
let teams=[...TEAMS],dragSrcIdx=null;
const logoCache={};
function pts(pos){return 17-pos;}
function isMobile(){return/android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent)||window.innerWidth<600;}
function preloadLogos(){TEAMS.forEach(t=>{if(logoCache[t.abbr]!==undefined)return;fetch(logoUrl(t.abbr),{mode:'cors'}).then(r=>r.ok?r.blob():Promise.reject()).then(b=>blobToDataURL(b)).then(d=>{logoCache[t.abbr]=d;}).catch(()=>{logoCache[t.abbr]=null;});});}
function blobToDataURL(b){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.onerror=j;fr.readAsDataURL(b);});}
function loadImageFromDataURL(d){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=d;});}
function render(){
  const list=document.getElementById('rank-list');list.innerHTML='';
  teams.forEach((team,i)=>{
    const pos=i+1,li=document.createElement('li');
    li.className='rank-item';li.draggable=true;li.dataset.pos=pos;li.dataset.idx=i;
    li.innerHTML=`<span class="drag-handle">⠿</span><span class="pos-badge">${pos}</span>
      <div class="logo-wrap"><img src="${logoUrl(team.abbr)}" alt="${team.abbr}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="logo-fallback" style="background:${team.c1};color:${team.c2}">${team.abbr}</div></div>
      <div class="team-info"><div class="team-name">${team.name}</div><div class="team-conf">${team.conf}ern Conference</div></div>
      <div class="pts-badge">${pts(pos)}<br><small>pts</small></div>`;
    li.addEventListener('dragstart',e=>{dragSrcIdx=i;e.dataTransfer.effectAllowed='move';setTimeout(()=>li.classList.add('dragging'),0);});
    li.addEventListener('dragend',()=>{li.classList.remove('dragging');clearHL();});
    li.addEventListener('dragover',e=>{e.preventDefault();clearHL();li.classList.add('drag-over');});
    li.addEventListener('dragleave',()=>li.classList.remove('drag-over'));
    li.addEventListener('drop',e=>{e.preventDefault();li.classList.remove('drag-over');if(dragSrcIdx!==null&&dragSrcIdx!==i){const m=teams.splice(dragSrcIdx,1)[0];teams.splice(i,0,m);render();}});
    setupTouch(li,i);list.appendChild(li);
  });
}
function clearHL(){document.querySelectorAll('.rank-item').forEach(l=>l.classList.remove('drag-over'));}
function setupTouch(el,idx){
  let clone=null,startY=0;
  el.addEventListener('touchstart',e=>{dragSrcIdx=idx;startY=e.touches[0].clientY;const rect=el.getBoundingClientRect();clone=el.cloneNode(true);Object.assign(clone.style,{position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',opacity:'0.85',zIndex:'9999',pointerEvents:'none',transition:'none',margin:'0'});document.body.appendChild(clone);el.classList.add('dragging');},{passive:true});
  el.addEventListener('touchmove',e=>{e.preventDefault();if(clone)clone.style.top=(el.getBoundingClientRect().top+e.touches[0].clientY-startY)+'px';clearHL();const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY)?.closest('.rank-item');if(t&&t!==el)t.classList.add('drag-over');},{passive:false});
  el.addEventListener('touchend',e=>{if(clone){clone.remove();clone=null;}el.classList.remove('dragging');const t=document.elementFromPoint(e.changedTouches[0].clientX,e.changedTouches[0].clientY)?.closest('.rank-item');clearHL();if(t){const toIdx=parseInt(t.dataset.idx);if(toIdx!==dragSrcIdx){const m=teams.splice(dragSrcIdx,1)[0];teams.splice(toIdx,0,m);render();}}});
}

// ── Export picks as JSON ──────────────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click',()=>{
  const name=document.getElementById('picker-name').value.trim();
  if(!name){showToast('Enter your name first!');return;}
  const picks=teams.map((team,i)=>({team:team.name,abbr:team.abbr,rank:i+1,points:pts(i+1)}));
  const data=JSON.stringify({name,date:new Date().toISOString().slice(0,10),picks},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name.replace(/\s+/g,'_')+'_NHL_Picks.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('Picks file exported! 📤');
});

// ── Build canvas & share image ────────────────────────────────────────────────
async function buildCanvas(name){
  const logoImgs=await Promise.all(teams.map(async team=>{
    for(let i=0;i<30;i++){if(logoCache[team.abbr]!==undefined)break;await new Promise(r=>setTimeout(r,100));}
    const d=logoCache[team.abbr];if(!d)return null;
    try{return await loadImageFromDataURL(d);}catch{return null;}
  }));
  const DPR=2,W=560,PAD=22,ROW=40,GAP=4,HEADER_H=90,FOOTER_H=30;
  const H=HEADER_H+teams.length*(ROW+GAP)-GAP+PAD/2+FOOTER_H;
  const canvas=document.createElement('canvas');canvas.width=W*DPR;canvas.height=H*DPR;
  const ctx=canvas.getContext('2d');ctx.scale(DPR,DPR);
  ctx.fillStyle='#07111f';ctx.fillRect(0,0,W,H);
  const grad=ctx.createRadialGradient(W/2,0,0,W/2,0,H*0.6);grad.addColorStop(0,'rgba(26,58,110,0.5)');grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.025)';ctx.lineWidth=1;
  for(let y2=0;y2<H;y2+=44){ctx.beginPath();ctx.moveTo(0,y2);ctx.lineTo(W,y2);ctx.stroke();}
  ctx.fillStyle='#c8102e';ctx.fillRect(0,0,W,4);
  ctx.textBaseline='alphabetic';ctx.font=`900 28px Arial, sans-serif`;
  ctx.fillStyle='#ffffff';ctx.fillText('NHL ',PAD,42);const w1=ctx.measureText('NHL ').width;
  ctx.fillStyle='#ffb81c';ctx.fillText('PLAYOFF ',PAD+w1,42);const w2=ctx.measureText('PLAYOFF ').width;
  ctx.fillStyle='#ffffff';ctx.fillText('PICKS',PAD+w1+w2,42);
  ctx.font=`600 12px Arial, sans-serif`;ctx.fillStyle='rgba(168,178,190,0.8)';ctx.fillText('PICKS BY ',PAD,62);
  const byw=ctx.measureText('PICKS BY ').width;ctx.fillStyle='#ffb81c';ctx.font=`bold 13px Arial, sans-serif`;
  ctx.fillText(name.toUpperCase(),PAD+byw,62);
  ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(PAD,74,W-PAD*2,1);
  teams.forEach((team,i)=>{
    const pos=i+1,p=pts(pos),y=HEADER_H+i*(ROW+GAP),rowW=W-PAD*2;
    ctx.fillStyle=i%2===0?'rgba(255,255,255,0.042)':'rgba(0,0,0,0.12)';rr(ctx,PAD,y,rowW,ROW,5);
    let accent='rgba(255,255,255,0.12)';if(pos===1)accent='#ffb81c';else if(pos===2)accent='#c0c0c0';else if(pos===3)accent='#cd7f32';
    ctx.fillStyle=accent;rr(ctx,PAD,y,3,ROW,2);
    ctx.font=`900 15px Arial, sans-serif`;ctx.fillStyle=pos<=3?accent:'rgba(255,255,255,0.28)';ctx.textAlign='center';ctx.fillText(pos,PAD+17,y+ROW*0.65);
    const lbX=PAD+32,lbY=y+3,lbS=ROW-6;ctx.fillStyle='rgba(255,255,255,0.06)';rr(ctx,lbX,lbY,lbS,lbS,4);
    const logoImg=logoImgs[i];
    if(logoImg){const pad2=3;ctx.drawImage(logoImg,lbX+pad2,lbY+pad2,lbS-pad2*2,lbS-pad2*2);}
    else{const cx=lbX+lbS/2,cy=lbY+lbS/2,cr=lbS/2-1;ctx.beginPath();ctx.arc(cx,cy,cr,0,Math.PI*2);ctx.fillStyle=team.c1;ctx.fill();ctx.font=`bold 8px Arial, sans-serif`;ctx.fillStyle=team.c2;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(team.abbr,cx,cy);ctx.textBaseline='alphabetic';}
    ctx.font=`bold 13px Arial, sans-serif`;ctx.fillStyle='#ffffff';ctx.textAlign='left';ctx.fillText(team.name.toUpperCase(),PAD+32+lbS+10,y+ROW*0.46);
    ctx.font=`600 10px Arial, sans-serif`;ctx.fillStyle='#a8b2be';ctx.fillText(team.conf.toUpperCase()+'ERN',PAD+32+lbS+10,y+ROW*0.76);
    const pillW=50,pillH=ROW-10,px2=W-PAD-pillW,py2=y+5;ctx.fillStyle='rgba(232,244,253,0.1)';rr(ctx,px2,py2,pillW,pillH,4);
    ctx.font=`900 14px Arial, sans-serif`;ctx.fillStyle='#e8f4fd';ctx.textAlign='center';ctx.fillText(p+' pts',px2+pillW/2,py2+pillH*0.68);
  });
  const fy=HEADER_H+teams.length*(ROW+GAP)+10;ctx.font=`11px Arial, sans-serif`;ctx.fillStyle='rgba(255,255,255,0.15)';ctx.textAlign='right';ctx.fillText('NHL Playoff Picks Ranker',W-PAD,fy+14);
  return canvas;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();}

document.getElementById('btn-share').addEventListener('click',async()=>{
  const name=document.getElementById('picker-name').value.trim()||'Anonymous';
  const btn=document.getElementById('btn-share');btn.disabled=true;btn.textContent='Generating…';
  try{
    const canvas=await buildCanvas(name);const dataUrl=canvas.toDataURL('image/png');
    if(isMobile()){document.getElementById('preview-img').src=dataUrl;document.getElementById('btn-open-img').href=dataUrl;document.getElementById('modal-overlay').classList.add('open');}
    else{const a=document.createElement('a');a.href=dataUrl;a.download=name.replace(/\s+/g,'_')+'_NHL_Picks.png';a.click();showToast('Image downloaded! 🏒');}
  }catch(err){console.error(err);showToast('Error: '+err.message);}
  btn.disabled=false;btn.textContent='📸 Share Image';
});
document.getElementById('btn-close-modal').addEventListener('click',()=>document.getElementById('modal-overlay').classList.remove('open'));
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))document.getElementById('modal-overlay').classList.remove('open');});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
render();preloadLogos();
</script>
</body>
</html>
